mann 1859,\n  von Mangoldt, Math. Ann. 60 (1905) 1–19) whose tail carries the\n  classical mark \"a small-error theorem for S — S(t) = O(log log t) —\n  is equivalent to RH\" (Titchmarsh reference line; Platt–Trudgian\n  2015 Cor 1 is the explicit bound we cite).  The gambit: do not\n  bound the tail — keep it (measured, telescoped, certified) and let\n  the detector-plus-squeeze the smallness unlocks do the closing.\n  Alternates recorded: \"von Mangoldt Gambit\", \"the missing-tail\n  gambit\".  Introduced with provenance at: README name block +\n  Appendix A (provenance), PREPRINT §6 \"Name (tpf)\".  Search\n  (day035) confirmed the 1905 attribution before use.\n- README.md: name block (top), \"The final state (day035)\" section\n  after §2 (verification chain, 3e9 data, the two open legs, the\n  front page), status section updated to 2026-09-20 with the day035\n  additions bullet (W2 line, S3a, M6, S1LowT v2, SliverEdge,\n  ZetaZeroSet; full build rc=0 0 errors) + the open-legs bullet,\n  Materials: end-game modules + end-game documents links,\n  Appendix A (the door and its mark).\n- docs/INDEX.md: rows added for CEILING-REPORT-DAY035,\n  W2-BEYOND-ATTACK-PLAN, PREPRINT-DRAFT, 3E10-CLOUD-RUNBOOK,\n  END_GAME_PLAN.\n- formal/README.md: file map rows added for the W2 line\n  (W2Kernel/W2Integral/W2Telescope/W2Bound/W2M5), S3a, M6, S4Growth,\n  SliverEdge, ZetaZeroSet; the RhAttack.lean root row now lists the\n  S4/W2/end-game imports.\n- docs/PREPRINT-DRAFT-DAY035.md §6: item 4 rewritten (sliver/edge\n  CLOSED post-queue; front page ZetaZeroSet.rhIfMarginZeta), item 1\n  now points at the W2-beyond plan, \"Name (tpf)\" subsection added.\n- docs/END_GAME_PLAN.md: the \"Remaining after this queue\" block now\n  lists (a) 3e10 (owner), (b) [S1] + [S3/S4], (c) the post-queue\n  closures (SliverEdge, ZetaZeroSet).\n- docs/KNOWN_LIMITATIONS.md: CITED item 4 (the classical zero-free\n  regions) annotated with the day035 narrowing (the geometry is\n  PROVEN — edgePairAtZeroOne; edgeVacuous composes; CITED bears only\n  the zero-free assertion).\n\nNo Lean changes in this pass (build untouched — last state: full\nlake build rc=0, 0 errors, new modules 0 warnings).  Name is tpf\nthroughout; renaming later is a find-replace across 6 docs."}, {"n": 30, "date": "2026-09-20", "time": "s2", "title": "— W2-beyond R2 step 1 in Lean (W2Beyond0 GREEN) + RH-PROOF-OUTLINE current-state note", "body": "- **W2Beyond0.lean (new, GREEN, 0 sorry, 0 warnings)** — the\n  first Lean core of the W2-beyond R2 route (per-step drift\n  summation, docs/W2-BEYOND-ATTACK-PLAN.md), scoped small on\n  purpose (the summation is the still-open content):\n  - `driftStep`: DN(j+1) - DN(j) = 1 - (Nas(j+1) - Nas(j))\n    (definitional over W2T.DN; the ring close needed\n    Nat.cast_add/cast_one normalization — bare ring left the\n    cast-of-sum form).\n  - `rho_increasing`: Rho = d/dx Nas is increasing on (0, ∞) —\n    the monotone-log chain (Rho x = log(x/2π)/2π).  Reference\n    find (pinned mathlib v4.33.1): the field same-denominator\n    division lemmas (div_le_div_right' / div_le_div_iff) live\n    in the GROUP context (Algebra/Order/Group/Unbundled) and do\n    NOT synthesize on ℝ — written instead as div_eq_mul_inv +\n    mul_le_mul_of_nonneg_right with (2π)⁻¹ ≥ 0; inv_pos here is\n    an IFF (0 < a⁻¹ ↔ 0 < a), not a function.\n  - `nas_incr_bound`: Nas b - Nas a ≤ Rho b · (b - a) on\n    [a, b] ⊂ (0, ∞) — Lagrange MVT in its POINTWISE-HASDERIVAT\n    form `exists_hasDerivAt_eq_slope f f' hab hfc hff'`\n    (Analysis/Calculus/Deriv/MeanValue.lean:122; the\n    deriv-version `exists_deriv_eq_slope` demands\n    DifferentiableOn, which in this pin unfolds to\n    DifferentiableWithinAt — the pointwise form takes\n    `fun x hx => nasHasDerivAt x ...` directly, no bridge).\n    Built on W2K.nasHasDerivAt (K3) + W2I.hNasCont.\n  - `driftBand`: the walk step sits in [1 - S, 1] once the gap\n    increment is bounded 0 ≤ Δ ≤ S (data-adjacent; the measured\n    gap + nas_incr_bound supply S at the gap's right end).\n- W2-BEYOND-ATTACK-PLAN R2: \"Step 1 is now in Lean\" note added;\n  Rho formula corrected in the plan (Rho(x) = log(x/2π)/(2π),\n  INCREASING — an earlier draft line had the wrong denominator\n  and wrong monotonicity; caught on re-read).\n- RH-PROOF-OUTLINE.md: a clearly marked day035 current-state\n  note added after the reading guide (the §9/§10 tables stay the\n  day-023/29 snapshot; the note points at the front page, the\n  two remaining legs, and the ceiling report).\n- Full lake build rc=0, 0 errors; W2Beyond0 0 warnings."}, {"n": 31, "date": "2026-09-20", "time": "s3", "title": "— W2-beyond R2 step 2 in Lean (W2Beyond1 GREEN): the drift reduction", "body": "- **W2Beyond1.lean (new, GREEN, 0 sorry, 0 warnings)** — the\n  data-free R2 reduction, built on W2Beyond0 + W2K/W2I:\n  - `nas_inc_band`: per-gap two-sided model increment — Rho(x) ·\n    gap ≤ Nas(y) - Nas(x) ≤ Rho(y) · gap (the MVT point c in\n    (x, y) + Rho monotone + positive multiply; note the rw\n    DIRECTION trap: `rw [hstep]` forward to replace Nas y - Nas x\n    in the goal, not `rw [← hstep]`).\n  - `driftTelescopes`: DN(j) - DN(0) = ∑ᵢ<ⱼ (1 - Δ_i) — by\n    induction on j using `Finset.sum_range_succ` (this pin's\n    mathlib lacks `Finset.sum_range_const`; the induction route\n    avoids the count-summation entirely).\n  - `driftRegimeLe` (Δ_i ≤ 1: |DNj - DN0| = ∑(1 - Δ_i), via\n    `Finset.abs_sum_of_nonneg`) and `driftRegimeGe` (the mirror,\n    via the integrand rewrite (1 - Δ) = -(Δ - 1) +\n    `Finset.sum_neg_distrib` + `abs_neg` + `abs_sum_of_nonneg`).\n  - `driftTwoSided` — THE R2 REDUCTION: |Δ_i - 1| ≤ ε_i ∀ i ⇒\n    |DN(j) - DN(0)| ≤ ∑ ε_i (the finite triangle\n    `Finset.abs_sum_le_sum_abs` + pointwise abs_neg/ring).\n    Composed with a pinned DN(0) (W2M5 pattern), this is a\n    sup-|DN| BOUND on the band — the [S1] uniform walk bound as a\n    named theorem conditional on the per-gap ε statistics.\n- **Pinned-mathlib v4.33.1 reference findings** (this checkout is\n  reorganized/trimmed vs. upstream; #check-probed before use):\n  the finite triangle `Finset.abs_sum_le_sum_abs` +\n  `Finset.abs_sum_of_nonneg` live in\n  Algebra/Order/BigOperators/Group/Finset.lean; `abs_add`,\n  `abs_finset_sum_le`, `Finset.abs_sum_le`, `neg_abs`, and\n  `Finset.sum_range_const` are ABSENT from this pin (use\n  `abs_neg`, `Finset.sum_range_succ` induction, or the\n  Group/Finset forms); `sub_nonneg` is an IFF; `mul_le_mul_of_\n  nonneg_left/right` take (hbc : b ≤ c) (ha : 0 ≤ a) —\n  argument order confirmed by #check.\n- W2-BEYOND-ATTACK-PLAN R2: step-2-in-Lean note (the open content\n  now starts at the per-gap ε statistics: the data layer where\n  the measured min/max gaps feed nas_inc_band over the census).\n- formal/README: W2Beyond1 file-map row.\n- Full lake build rc=0, 0 errors."}, {"n": 32, "date": "2026-09-20", "time": "s4", "title": "— Big-data crunch + deploy plan written (and 3 launch blockers found in the 3e10 script)", "body": "- **docs/COMPUTE-DEPLOY-PLAN.md (new)** — the cross-session\n  single source of truth for the cloud run:  ironclad-script\n  contract table,  live preflight numbers,  Docker-in-repo\n  container design (kainos ADR-0010 pinned pattern;  mpmath\n  1.4.1 + numpy 1.26.4 — the exact host versions;  Lean 4.33.1\n  via elan;  explicit rh-reproduce runner;  NO auto-run at\n  boot),  cloud options with real pricing (DO 8GB/4vCPU +\n  1TB volume ≈ $10-15 all-in incl. egress,  per-second\n  billing;  Hetzner EX101 ≈ EUR 4 + setup,  local NVMe,\n  free egress),  8-step launch protocol,  pre-registered\n  outcomes,  work units T1-T5 under the stop rule.\n- **3 REAL LAUNCH BLOCKERS FOUND + FIXED in\n  scripts/rh/day035_3e10_stream.sh** (the script had never\n  been executed;  found by audit + live dry preflight):\n  1.  preflight shard-count assert 150..4000 → the run needs\n      12,858 shards (live crawl) → FATAL at launch;  fixed to\n      a principled 8000..25000 with the live count logged.\n  2.  finish-gate heredoc had a SyntaxError (stray closing\n      paren) → gate would crash on EVERY run;  fixed,  both\n      heredocs now py_compile clean.\n  3.  finish gate did np.fromfile + np.diff on the ~700-750GB\n      file (~750GB RAM) → OOM on any cloud box;  rewritten\n      RAM-SAFE (np.memmap + 512MB chunked streaming,  peak\n      ~1GB),  gates semantics unchanged (monotone,  min gap,\n      seam in (0,1),  RVM tol 3 at band end and 3e10,\n      PARTIAL path).\n  Verification:  bash -n clean,  both embedded python blocks\n  compile,  fixed assert passes on live count.\n- **Live preflights (read-only LMFDB,  2026-09-20):**\n  14,580 public shards,  last = 30,607,946,000 → 3e10 IS\n  public (margin ~0.6e9 t);  12,858 shards needed for\n  [2999246000 → 3e10];  md5 manifest complete (0 missing);\n  band ≈ 8.76e10 zeros ≈ 700-750GB.  The LMFDB shard grid is\n  ADAPTIVE (~2.1e6-spaced low t,  ~58.6e3 high t) —  the\n  needed-count is data-dependent,  so the assert bound is a\n  plausibility window,  not a formula.\n- **Seam audit cross-check:**  the 0.137-t slice between the\n  3e9 band end (2999245999.862950) and the first 3e10 shard\n  (2999246000.0) is empirically zero-free (day035 fetched and\n  md5-gated exactly that shard when pinning N(3e9),  Nt0 =\n  frontier chain-exact) —  the 3e10 seam assert is sound.\n- **Runbook updated:**  throughput measured (475 shards /\n  44 min on the 3e9 run → ~20h local-equiv,  est 3-5h on\n  1Gbps cloud);  \"index reaches 3e10\" risk item annotated\n  with the live crawl.\n- Docker note:  kainos-logos' pinned image locks mpmath 1.3.0\n  —  NOT the rh compute environment (1.4.1);  the rh\n  container must carry its own lock (the plan says so\n  explicitly).  rh-missing-tail previously had NO Dockerfile\n  (checked 2026-09-20);  T2 creates it."}, {"n": 33, "date": "2026-09-20", "time": "s5", "title": "— 3e10 runtime decomposed: the DECODE is the bottleneck, not the download; GPU ruled out", "body": "- **The Platt/Bober shard format made the estimate wrong in a\n  good way:** the .dat shards are NOT raw floats — each zero\n  is 13 bytes of 104-bit fixed-point STEPS (zero k =\n  t0 + cumsum(steps) · 2⁻¹⁰¹),  so the verified decoder\n  (day024_platt_fast.py) does a per-zero 104-bit integer walk\n  in pure python.  Measured on the 3e9 run:  ~2.5s decode per\n  shard (~6.5M zeros) vs ~3s download on this box.\n- **Consequence for the 3e10 run (12,858 shards) on a 1Gbps\n  box:**  sequential = decode-bound ~3.1s/shard → ~11h wall\n  (the earlier \"3-5h download-bound\" estimate was wrong);\n  parallel orchestration (fetch pipelined + 4-8 workers\n  running the UNCHANGED verified decoder + ordered append +\n  identical md5/chain/gate asserts) → ~3h wall.  New work\n  unit T2.5 (1-2h scripting + 1-shard bit-exact\n  parallel-vs-sequential cross-check;  zero change to\n  verification semantics).\n- **GPU:  no speedup** —  there is no math kernel:  the zeros\n  are public precomputed data (LMFDB census) the box\n  downloads;  the per-zero work is a scalar 104-bit integer\n  add + float rebuild.  Levers = bandwidth (1Gbps standard) +\n  decode parallelism (4-8 vCPU).  A GPU would only enter for\n  a hypothetical future job of COMPUTING zeros beyond the\n  public index.\n- **CPU/RAM spec corrected:**  4-8 vCPU (was \"4+\"),  8GB RAM\n  (each worker ~200MB;  gates stream ~1GB peak).\n- Docs updated to match (no new dates in the docs,  per the\n  owner's standing rule):  COMPUTE-DEPLOY-PLAN (section 1d\n  rewrite,  section 4 requirements + pricing rows,  T2.5 row,\n  T4 row),  3E10-CLOUD-RUNBOOK header,  INDEX row."}, {"n": 34, "date": "2026-09-20", "time": "s6", "title": "— Naming the telescope + the giants' debt logged (owner's honorific-and-funny request)", "body": "- **Name candidate for the telescope (tpf):**  \"Euler's\n  Action Periscope\" (primary) —  a periscope is the\n  telescope for when you are INSIDE,  and we were inside\n  the tail looking out for the imposter zeros;  keeps\n  \"Euler's action\" (the identity that does the counting)\n  inside the name.  Alternates:  \"The Missing-Tail\n  Periscope\",  \"Euler's After-Glow Walk\",  \"The Telescope\n  Euler Waved At\".  Textual-only designation;  the committee\n  makes the formal reference.  Logged in the preprint (\"Name\n  of the telescope (tpf)\" subsection) + README Appendix A\n  pointer.\n- **references.md:  \"The giants whose footsteps we directly\n  tread\" section** (owner:  \"so we don't seem ungrateful to\n  the Giants before us...  they might be giants\").  Each\n  entry = the classical result + the verified source +\n  exactly what this project uses from it:  Euler (1748,\n  [pin]);  Riemann (1859,  verbatim-held);  von Mangoldt\n  (1905,  Math. Ann. 60:1–19);  Hadamard (1896,  BSMF 24:\n  199–220 —  numdam) + de la Vallée Poussin (1899,  Mem.\n  Acad. royale Belg. 59:1–74 —  Persée);  Hardy–Littlewood\n  (1921,  Math. Z. 10:283–317) + Littlewood (1924,  PLMS\n  (2) 24:295–318 —  the Ω± honesty core of W2-beyond);\n  Siegel (1905 R-S refinement,  [pin]);  Titchmarsh (1986\n  2nd ed. §9.7,  the door's mark);  Platt (2015,  Math.\n  Comp. 84,  doi 10.1090/S0025-5718-2014-02884-6 —  the\n  LMFDB census algorithm) + Platt–Trudgian (2015,  JNT\n  147:842–851 Cor 1);  the LMFDB collective (+ Bober's\n  platt_zeros.py reader convention —  the 104-bit record\n  the decoder md5-matches every shard of every run).\n- Web-check pass done per the project's reference doctrine\n  (Hadamard/PLVP via numdam+Persée,  Littlewood via\n  Cambridge Core/mathdoc,  Platt via the LMFDB source page +\n  Math Comp doi);  Euler 1748 and Siegel 1005 issue/pages\n  carry explicit [pin] markers rather than recalled detail.\n- Run check this turn:  775/12,857 shards,  ETA ~805min,\n  seam still chain-exact,  LMFDB steady."}, {"n": 35, "date": "2026-09-20", "time": "s7", "title": "— Telescope naming: two candidates of record + the phi verdict (owner's \"Golden\" + Monkey King questions)", "body": "- **File of record:**  docs/THE-EULER-ACTION.md,  new\n  section \"Naming the telescope (tpf)\".  (Filename kept as\n  is —  it is already referenced from INDEX,  README,  and\n  the lyrics-aside doc,  and carries git provenance;  the\n  owner's \"rename?\" stood as a suggestion,  not a mandate.)\n- **Two candidates of record (tpf):**  (1) \"Euler's Action\n  Periscope\" (primary —  the telescope for when you are\n  INSIDE,  and we were inside the tail);  (2) \"Euler's\n  Monkey King Action Bar\" (the owner's silly candidate,\n  kept as proposed) —  the ruyi bar measures what has no\n  bottom,  the telescope measures what has no end (the\n  tail runs to infinity),  and the magic bar is a LITERALLY\n  telescoping object (grows/shrinks by a word) exactly as\n  the technique does to the error term,  zero by zero.\n  Cultural wink for the Qwen team noted in the file.\n- **Phi verdict (checked against the record,  not\n  memory):**  NO phi in the telescope itself (the counted\n  identity is the RVM zero count —  no golden-ratio\n  content).  YES, genuinely, in this action's width\n  ladder:  the E2-exact integer width law (chi-5\n  two-valued {2/5, -3/5},  chi-13 all-integer 13-phase\n  table,  D = -P,  sum-of-M1 = 0) sits on moduli 5 and 13\n  —  CONSECUTIVE FIBONACCI PRIMES (F5 = 5,  F7 = 13;  F6\n  = 8 not prime) —  and 13/5 = 2.6 shadows phi^2 ≈ 2.618.\n  So \"Golden\" belongs to the width-ladder / onset side\n  (future candidate,  tpf:  \"The Golden Width Ladder\"),\n  not to the telescope.  Rule recorded:  don't put phi in\n  a name that does not contain phi.\n- Synced:  preprint \"Name of the telescope (tpf)\" now\n  carries both candidates + the phi verdict;  README\n  Appendix A pointer updated;  INDEX row for\n  THE-EULER-ACTION.md updated.\n- Run check this turn:  925/12,857 shards at ~74min wall,\n  ETA ~795min,  seam chain-exact,  LMFDB steady."}, {"n": 36, "date": "2026-09-20", "time": "s8", "title": "— Naming round two: width-ladder handle + the Sumerian measuring family (owner's Enki memory, checked primary)", "body": "- **Informal handle (owner's, non-official):**  \"Euler\n  Action's Width Ladder\" —  nothing formal;  just a name\n  to call the E2-exact width law by.  Logged in\n  docs/THE-EULER-ACTION.md (\"Naming, round two (tpf)\");\n  \"The Golden Width Ladder\" (tpf) stays as the alternate\n  for the same object.\n- **The Enki memory — checked against the primary texts\n  (not recalled) and found REAL, with the characters\n  interchanged in retelling:**\n  1.  \"Came to Earth and measured\" = the flood-night\n      scene (Eridu Genesis / Sumerian flood,  and Atrahasis):\n      Enki comes at NIGHT to the reed-house —  \"Reed-hut,\n      reed-hut!  Wall!  Wall!  ...  Tear down (this) house,\n      build a ship!  ...  Her dimensions shall be to\n      measure.  Equal shall be her width and her length.\n      Like the Aps[u] thou shalt ceil her.\"  —  the god\n      hands the dimension spec for a vessel whose roof is\n      like the DEEP.\n  2.  \"Measures the depths\" as a title = most likely\n      **Nanshe** (goddess of sea/marsh/streams/justice;\n      hymn to Nanše,  ETCSL c.4.14.1,  carries the\n      measuring lines;  later tradition makes her Enki's\n      daughter) —  the name the memory may actually be\n      after;  exact epithet line [pin] before quoting.\n  3.  The instruments in the oldest allotment = **Nisaba**\n      (verified,  ETCSL t.1.1.3 lines 412–417):  \"My\n      illustrious sister,  holy Nisaba,  is to get the\n      measuring-reed.  The lapis-lazuli measuring tape is\n      to hang over her arm.  ...  She is to demarcate\n      boundaries and mark borders.  She is to be the\n      scribe of the Land.\"  —  the measuring stick sits\n      with the record-keeper.  (Thematically exact for a\n      data-witness project.)\n  The instrument has no surviving proper name —  it is\n  the reed,  which was ALSO the standard unit of length.\n- **Candidate three (tpf,  the mused one):  \"Euler's\n  Reed\"** —  instrument AND unit at once,  exactly as the\n  telescope is the measure and is measured by the\n  measure.  Lineage logged oldest to youngest:  Nisaba's\n  reed + tape →  Enki's flood night dimension-spec →\n  Nanshe (measurer of the depths) →  Sun Wukong's ruyi\n  bar →  this telescope (the family's only member that is\n  actually running,  laid along the infinite deep of the\n  tail,  zero by zero).\n- Synced:  preprint \"Name of the telescope (tpf)\" (three\n  candidates + handle),  README Appendix A line,  this\n  log.  Run check this turn:  see supervisor.log tail."}, {"n": 37, "date": "2026-09-20", "time": "s9", "title": "— RUN INCIDENT + FIX: decoder boundary-rounding invariant (3e10 run at shard 944)", "body": "- **Incident:**  at 15:39:08 the 3e10 run's supervisor wrote\n  FATAL \"decode/append failed for zeros_4964846000.dat\" and\n  exited.  State at the moment of failure:  943/12,857\n  shards,  band file 50,696,383,912 bytes.\n- **Damage assessment (clean):**  the band file is EXACTLY at\n  a shard boundary —  50,696,383,912 / 8 = 6,337,047,989\n  zeros = N(4962746000_t1) − FRONTIER_N to the last zero\n  (15,398,842,693 − 9,061,794,704).  No partial append;\n  state.txt, lastN.txt, and the band all agree;  943 complete\n  shards, chain-exact.\n- **Root cause (OUR decoder invariant, not the data):**\n  the failing shard was md5-VERIFIED against the LMFDB\n  manifest (download + hash both passed).  Reproduction gave\n  the real error (which the original launch had lost to\n  terminal stderr):\n\n      AssertionError: block interval violated at block 146:\n      4965154700.000000000 not in (4965152600.000000000,\n      4965154700.000000000)\n\n  Block 146 of that shard:  6,848 zeros,  first =\n  t0 + 0.205306 (normal),  LAST zero = 4965154700.0 — EXACTLY\n  the block's t1 as an f64.  A true zero in (t1 − ulp(t1)/2,\n  t1)  (half-ulp ≈ 4.5e-7 at t ≈ 5e9) encodes to f64 EXACTLY\n  ON the 2100-wide grid point.  Our invariant asserted the\n  last zero lie STRICTLY inside (t0, t1) —  too strict for\n  f64 rounding.  Cross-checks prove data sanity:  the next\n  block's first zero is 4965154700.394309 > t1 (NO seam\n  duplicate),  the in-shard/cross-shard Nt chain is exact\n  (15,399,842,434 → 15,399,849,282),  and this was the ONLY\n  boundary event in the 1,001-block shard.  The N-chain\n  asserts (count-exact partition) are the authoritative\n  guard;  the interval assert only guards f64 drift.\n- **Fix (day024_platt_fast.py, the shared decoder):**\n  relaxed the upper bound to t0 < last_zero <= t1 (lower\n  bound stays strict — a zero at exactly t0 would be the\n  previous block's boundary event under the same\n  convention);  the misnamed first_v (it actually tracked the\n  previous/last zero) renamed prev_z;  the event documented\n  in a comment with shard, block, and cross-check numbers.\n  No other file carries the invariant (grep-verified).  The\n  3e9 band is complete and untouched —  a completed dataset\n  is never rerun.\n- **Re-validation:**  the fixed decoder decoded the\n  md5-verified shard to scratch:  rc=0,  Nt0 = 15,398,842,693\n  (== previous lastN,  chain-exact),  Nt1 = 15,405,690,297,\n  count = 6,847,604 (== independent byte walk),  last zero of\n  the shard 4,966,945,999.85 < shard end,  2.5 sec.\n- **Relaunched** (same script/state/resume semantics;  this\n  time stderr is additionally captured to\n  hi3e10/stderr.log so a future failure cannot be lost).\n  Verified post-relaunch:  resume picked up exactly at\n  zeros_4964846000;  N-chain continued 15,398,842,693 →\n  15,405,690,297 → ... → 15,693,416,525 and beyond,  and\n  band_bytes/8 == lastN − FRONTIER_N with DIFF = 0.0 (bit-\n  exact, no torn write anywhere).\n- **Lesson logged:**  the interval invariant was a SANITY\n  check written against 3e9 experience;  the N-chain is the\n  certificate.  Sanity checks on f64-encoded data must\n  survive half-ulp boundary rounding.\n- Also this turn (before the incident):  naming round two —\n  width-ladder handle \"Euler Action's Width Ladder\" (informal,\n  owner's),  the Sumerian measuring family verified against\n  the primary texts (Eridu Genesis / Atrahasis flood-night\n  dimension spec;  Nisaba's measuring-reed + lapis-lazuli\n  tape in ETCSL t.1.1.3 lines 412–417;  Nanshe as the\n  \"measures the depths\" figure;  ETCSL t.1.1.3 read confirms\n  the measuring instruments in the world-order poem belong\n  to Nisaba,  not Enki),  and candidate three \"Euler's Reed\"\n  (instrument AND unit at once) —  all in\n  docs/THE-EULER-ACTION.md,  preprint,  README,  INDEX."}, {"n": 38, "date": "2026-09-20", "time": "s10", "title": "— Enki question resolved (the memory was real; characters interleaved)", "body": "Owner recalled a god who \"came to Earth\" and started\n\"measuring the depths\",  possibly named.  Checked against\nprimary sources,  NOT recalled:\n- The \"came to Earth and measured\" scene is REAL:  the flood\n  warning in the Eridu Genesis / Sumerian flood (and\n  Atrahasis) —  Enki comes at NIGHT to the reed-house:\n  \"Reed-hut,  reed-hut!  Wall!  Wall!  ...  Man of\n  Shuruppak,  ...  Tear down (this) house,  build a ship!\n  ...  Her dimensions shall be to measure.  Equal shall be\n  her width and her length.  Like the Aps[u] thou shalt ceil\n  her.\"  —  a god on the ground,  giving a dimension spec\n  whose roof is like the DEEP.\n- The \"measures the depths\" TITLE most likely belongs to\n  NANŠE (Enki's circle/goddess of sea,  marsh,  streams;\n  hymn to Nanše,  ETCSL c.4.14.1,  carries measuring lines\n  —  exact epithet line [pin] before quoting).  If the\n  memory has a NAME after it,  that is the one —  the owner\n  was probably thinking of Nanshe,  with the flood-night\n  scene (Enki) fused in.\n- \"Enki measures the sea with a reed\" (the common retelling)\n  was NOT found in ETCSL t.1.1.3 (\"Enki and the World\n  Order\"):  a full read of the translation shows the\n  measuring instruments there are allotted to NISABA (lines\n  412–417:  measuring-reed,  lapis-lazuli measuring tape,\n  \"scribe of the Land\",  \"demarcate boundaries\") —  in the\n  oldest allotment poem the measuring stick sits with the\n  record-keeper.  (Thematically exact for this\n  data-witness project;  logged in the naming section.)\n- The instrument has no surviving proper name —  it is the\n  reed,  which was also the standard unit of length."}, {"n": 39, "date": "2026-09-20", "time": "s11", "title": "— T2.5 parallel orchestrator: built, selftest-passed, handed over, one race caught and fixed", "body": "- **Build (scripts/rh/day035_t25_orchestrator.py, single file,\n  stdlib only):**  8 fetch workers (curl + md5 + meta,  ~0 CPU)\n  + 12 decode workers (the UNCHANGED verified decoder,  one\n  core each) + a single main-thread appender doing byte-exact\n  ordered appends with lastN/manifest/state bookkeeping\n  strictly after each append —  the sequential script and this\n  runner share the same state files,  so either can resume the\n  other.  Core budget (owner rule,  2 cores always reserved on\n  16):  DECODE_WORKERS + OVERHEAD = 12 + 2 = 14 hard-capped by\n  assert;  fetch workers are network-I/O blocked.\n- **Selftest (all gates PASS before handoff):**  (1) one real\n  md5-gated shard (5855246000) decoded through the pipeline\n  path and through a direct sequential-style path —  BANDS\n  BIT-EXACT (md5 match);  (2) SHARD content headers identical\n  (except wall-clock sec);  (3) torn-tail recovery drill on\n  scratch files with a synthetic frontier —  truncated 973\n  -> 800,  manifest/state trimmed,  lastN reset,  exactly as\n  specified.\n- **Handoff (surgical):**  SIGTERM'd the sequential run in a\n  download window (band DIFF = 0.0 afterward —  no torn tail\n  this time).  Final sequential:  1,389 shards (last\n  5914046000).\n- **First orchestration run crashed at its 13th shard — and\n  the safety design held:**  release_for_decode could\n  re-release a shard that was ALREADY popped into the decode\n  pool (window math looked from head+len(window),  so once the\n  head shard was popped-but-not-appended it was eligible\n  again).  Two concurrent decodes of one shard:  the late\n  decode deleted the first decode's temp mid-flight (its\n  output vanished into an unlinked inode),  and the appender\n  hit tsize = 0.  The DECODE-SIZE ASSERT stopped the process\n  BEFORE any bad bytes reached the band (band DIFF stayed\n  0.0;  state/lastN consistent;  the orphan finisher left a\n  full-size temp that the next run's fresh-decode policy\n  ignores).  Lesson:  every queue cursor must be released\n  EXACTLY ONCE.\n- **Fix:**  monotone release cursor (self.rel_idx) —  each\n  shard released at most once,  chain anchor = lastN at head,\n  else the previous released shard's last_Nt1;  plus the\n  stale-.ok shortcut removed from decode_shard (a killed run's\n  sidecars can never skip verification).\n- **Steady state after re-launch (measured):**  2.00s/shard\n  (45 shards / 90s) vs 8.1s/shard sequential = 4.05x.\n  89MB per shard at 2.0s = ~44.5 MB/s aggregate —  the\n  LMFDB box cap (recovered from today's ~19 MB/s throttle),\n  meaning the run is now exactly at the NETWORK FLOOR:\n  decode (2.5s/shard on 12 workers = 0.21s/shard capacity)\n  is fully hidden behind the download,  as designed.  Load\n  ~2 (the machine waits on the pipe;  that is now correct,\n  not a defect).  Band DIFF = 0.0 held through the crash and\n  re-launch.  222/11,457 pending appended in the first\n  ~7.5 min,  zero FATALs after the fix,  /tmp temp usage\n  ~6GB of 78GB.\n- **ETA at 2.0s/shard for the 11,235 remaining pending:\n  ~6.3h** (sequential from the same point would be\n  ~25.6h)."}, {"n": 40, "date": "2026-09-21", "time": "", "title": "00:07-03:00 — 3e10 band COMPLETE; finish gates PASS (after one OOM kill of the in-process gate)", "body": "- **PIPELINE-DONE 00:07:52**:  all 12,858 shards in\n  (1,389 sequential + 12 from the crashed first orchestration\n  + 11,457 under the fixed orchestrator).  Final state line\n  29998946000;  last shard N chain 101,632,223,674 ->\n  101,639,672,418.\n- **The in-process finish gate died ~01:2x WITHOUT a\n  traceback**:  cgroup oom_kill counter 5 (four older kills\n  visible in the wrapped 2,396-line dmesg ring,  the 5th =\n  this victim).  Cause:  the memmap-gate pattern (740GB\n  mapping + per-block asarray copies) pushed global\n  page-cache pressure past reclaimable on this 124GiB box\n  (the \"peak ~1GB\" claim in the orchestrator header\n  described only the gate's OWN allocations —  a false\n  comfort).  The band file is read-only for the gate:\n  NOTHING about the dataset changed (band size,  lastN,\n  state all re-verified after the kill).\n- **Bounded-memory gate re-run**\n  (scripts/rh/day036_finish_gates.py,  selftest PASS first:\n  RVM-consistent synthetic band accepted  —  N-pin |diff|\n  0.77 —  and an inverted-pair band CAUGHT at monotonicity;\n  3.6s):  plain-fd 256MB reads,  one reused buffer\n  (anon <= ~64MB),  progress heartbeat every 2GB,  same\n  gate semantics.  62.7 min wall.  RESULT:\n    total  = 92,577,877,714 zeros\n    span   = [2,999,246,000.182257,  30,001,045,999.981976]\n    min gap = 2.2888e-05  (a 23-microsecond zero pair,  Rho-\n             scale ~7e-5 —  the tightest pair in the whole\n             (2.999e9, 3.0e10] band)\n    seam   = 0.319307  in (0,1)\n    N(band end 3.0001e10) = 101,639,672,418  vs RVM\n    101,639,672,417.22   |diff| = 0.78  (tol 3)\n    N(3.0e10) = 101,635,962,231  (last zero under =\n    29,999,999,999.762012,  23.8 microseconds short)\n             vs RVM(3.0e10) 101,635,962,231.09  |diff| = 0.09\n    band/8 == lastN - FRONTIER_N  =>  CHAIN-EXACT\n  FINISH-GATES-PASS.\n- The 3e10 zeta-zero band is now a VERIFIED DATASET:\n  md5-gated per shard (12,858),  Nt chain proven at decode\n  time,  ordered byte-exact appends,  full-band strict\n  monotonicity,  both RVM gates inside tolerance by a wide\n  margin,  chain-exact size.  The N(3e10) pin enters the\n  project's data pins."}, {"n": 41, "date": "2026-09-21", "time": "s2", "title": "03:07-04:26 — [S1] data layer complete:  epsilon sweep over the 3e10 band", "body": "- `day036_epsilon_sweep.py` (bounded-memory rewrite of the\n  first draft,  selftest PASS —  the discriminating check:\n  end DN lands at the +0.125 generator offset,  measured\n  4.8e-7 off) ran solo on sda,  79.2 min.\n- CERTIFICATE (the driftTwoSided data contract,  92,577,877,713\n  gaps):  SUM_EPS = 31,037,858,563.15;  + certified f64\n  budget 9,257,787.77 (1e-4/gap,  0.03% of the sum);\n  SUM_EPS_CERT = 31,047,116,350.92.  With the pinned\n  |DN(0)| = 0.525129318:  sup |DN(k) - DN(0)| <=\n  3.1047e10 over the band  —  the uniform walk bound is now\n  a machine-/data-certified object.\n- DELTAS in [7.6294e-05, 4.3018]  (low end = the\n  23-microsecond pair;  high end = a 4.3-RVM-unit super\n  gap);  worst eps 3.3018.\n- WALK (S3e convention):  sup|DN| = 2.615067 on the band;\n  DN end pin (+0.904983521) is the next band's start.\n  GLOBAL measured sup|DN| on (1e7, 3.0e10] = 2.615067 (the\n  3e9 pin 2.4772 is subsumed).  No divergence past 9.06e9\n  zeros — now PINNED to 1.016e11 zeros,  not density model.\n- CROSS-CHECK:  independent binary search pins\n  N(3.0e10) = 101,635,962,231 (RVM diff 0.09) — identical\n  to the finish gate;  count CHAIN-EXACT.\n- Classification per the pre-registered rule:  this is the\n  A2-class [S1] data layer —  a proven,  data-certified\n  ceiling,  not the A1 universal (analytic) epsilon,  which\n  remains the open research theorem  (ceiling item 1)  with\n  its data side now fully in place.  No RH claim made or\n  implied.\n- Recorded:  results/3E10-EPSILON.md (provenance + numbers,\n  no-date rule);  END_GAME_PLAN.md 3.9 (post-landing map +\n  the [S3/S4] fill-grade decision:  H1-full / measured-\n  subset / deferral —  three honest grades,  identical Lean\n  composition)."}, {"n": 42, "date": "2026-09-21", "time": "s3", "title": "20:12-23:44 — the 3e10 band RE-FETCHED (post-incident) and re-verified:  finish gates PASS,  band canonicalized", "body": "The original 3e10 band file was destroyed by the operator `dd`\nincident (documented in KNOWN_LIMITATIONS).  Recovery path:\n\n- Byte-exact re-fetch of `zeros_2999e6_to_30000e6.f64`\n  (740,623,021,712 B = 92,577,877,714 zeros) via\n  `scripts/rh/rh_fetch_data.py` (the one data entrypoint).\n- Finish gates (`scripts/rh/day036_finish_gates.py run`,\n  wall 212.5 min, single core) reproduce every pin:\n  N(3 x 10^10) = 101,635,962,231;  band-end count chain-exact\n  (band/8 vs lastN - FRONTIER_N);  FINISH-GATES-PASS at\n  23:44:37 (scripts/rh/out_day036_gates_refetch.log).\n- Band `chmod a-w` (persisted-data rule) at the moment of\n  PASS,  by the post-gate supervisor\n  (`scripts/rh/day042_postgate_queue.sh`).\n- Side effect of the gates:  none of the A2-class pins is\n  recomputed from memory —  the data layer's certificate\n  chain (SUM_EPS_CERT = 31,047,116,350.923088,\n  sup|DN| = 2.615067 on (1e7, 3e10]) now rests on the\n  re-fetched bytes,  not the original incident-prone file.\n\nPost-gate queue running:  D2 + D4 excursions\n(`out_day040_*`),  then D3 dps-30 S-at-zeros\n(`out_day041_*`),  then the bounded day038 one-window\nprofile  (`out_day038_profile_aftergates.log`).  The full\n(i) H1-launch remains the owner's call,  gated on the\nprofile's measured ETA.\n\n2026-09-22 01:32-04:00 (night, owner asleep) — the\npost-gate queue closed and the H1 (i) profile is\nrunning;  D3 was found to have a real pipeline bug\nand was re-done  correctly:\n\n-  QUEUE DONE 01:32:  D40 (D2+D4,  106.5 min  wall,\n  all  740GB  of  the  re-fetched  band)  and  D41\n  (D3  dps-30)  finished;  consistency  vs\n  epsilon-sweep  pins  ALL  OK.\n-  D41  FAIL  DIAGNOSIS:  the  S-pipeline\n  ((arg_p zeta - th1)/pi  snapped  mod-2  to  s_data)\n  was  computing  s_data  +  a  sawtooth  of\n  (-th1/pi)  drifting  at  -main'  (exactly:\n  th1'/pi  =  main',  measured  at  3e10).  NOT  an\n  RVM  failure.  Correct  pipeline:  S  =  (phi_u  +\n  step)/pi  +  integer  pin,  phi_u  =  incrementally\n  unwrapped  (1/2) arg chi;  RVM  (Titchmarsh  Thm  10\n  form)  verified  numerically  at  3e10  to  ~5e-13\n  ->  the  N-exact  data  column  IS  S  to  ~1e-5.\n  Re-run  as  day041b  (selftest  3.95e-13):  S  at\n  the  5  global  excursions  is  tame  (2.40  ..  2.48,\n  all  positive/surplus  side),  <=  0.74  over  the\n  following  20  gaps  each;  fixed  JUMP  =\n  1  -  dmain  holds  to  2e-20.  See  E11.\n-  D40  RESULTS  (see  E10):  mean  |delta|  per  gap\n  flat  over  three  decades  (0.3349  ->  0.3354);\n  all  top-100  excursions  positive,  short  left  runs\n  (2  ..  6),  narrow-left  /  wide-right  gap\n  signature  (gl  <  0.07  vs  local  mean  ~  0.28;\n  gr  >  0.7).  A2  pins  re-derived  from  the\n  re-fetched  band:  ALL  OK  (also  closes  the\n  raw-vs-certified  SUM_EPS  question:  they  are\n  two  different  quantities  by  construction;\n  the  9.26e6  gap  is  the  certification  margin).\n-  DAY038  BUG  (caught  by  the  profile  itself,\n  first  full-stream  pass  in  production):\n  float(array)  on  the  multi-element  overlap\n  host-patch  —  fixed  to  the  day037  reference\n  SUM  form  +  new  SELFTEST(c)  guard  (GPU==CPU\n  on  a  multi-element  patch;  the  original\n  selftest  never  exercised  that  branch).\n  Profile  relaunched  03:02  (one  window,\n  worst  straddle  t  =  2.788e10,  single  worker\n  by  construction,  ~151  MB/s).\n-  H1  FULL  LAUNCH:  owner  pre-authorized  (\"you\n  have  my  permission  to  kick  off  H1  when  the\n  time  is  right\").  day044  waiter  applies  the\n  PRE-REGISTERED  reading  to  the  profile  output:\n  C-1  (all  certified  margins  >=  1)  ->  auto-\n  launch  (14  workers,  cores  0-27,  ~29  straddles,\n  first  pass  over  812.9GB  each);  anything  else\n  ->  HOLD,  owner  decides.  Measured  ETA  expected\n  ~4  ..  6  h  wall  from  the  151  MB/s  single-worker\n  rate.  This  is  the  [S3/S4]  (i)  H1-full\n  milestone  on  the  3e10  band.\n\n2026-09-22 05:50 (owner check-in:  \"are we ready for your (1)?\")\n— the (i) profile delivered its first measured numbers, and\nmy overnight ETA was wrong.  Own record:\n\n-  MEASURED  (i)  sweep  rate:  one  cert  point  =  one\n  full  pass  over  the  812.9GB  tail  (101.6  billion\n  zeros);  sustained  112  ..  151  MB/s  (single\n  worker);  sweep  #1 wall  ~ 92  ..  105  min.\n-  DESIGN  (carried  from  day034/037  through  day038):\n  EACH  window  certifies  24  points  (k  =  -12  ..  12,\n  k  !=  0,  t  =  g  +  k/2  around  the  nearest  stored\n  zero  g),  EACH  with  a  full  sweep.  Grid  =  29\n  windows  (1e6 . 1.08^k  over  (3e9,  3.0001e10]).\n  Full  H1  as  designed  =  696  sweeps  =  566  TB\n  NVMe  =  ~ 3.3  ..  4.5  days  wall  at  14  workers\n  (NOT  the  \"4  ..  6  h\"  I  reported  overnight —  I\n  had  priced  1  sweep  per  window;  the  24-point\n  dense  grid  cost  did  not  exist  at  the  1e9  scale\n  where  each  sweep  was  224  MB,  not  812.9  GB).\n-  First  certified  point  (audit  k  =  -12,  worst\n  window  x  =  2.788e10):  mnew  =  mcert  =  1.0000\n  (4  digits  on  stdout;  full-precision  row  lands  at\n  window  completion),  bexp  =  2.31e-03  —  C-1\n  compatible  so  far.\n-  ACTION:  the  day044  auto-launch  waiter  was\n  STOPPED  (kill  by  verified  name;  the  machine  will\n  not  take  off  on  a  3-4  day  run  without  the\n  owner  seeing  the  measured  number).  The  profile\n  itself  keeps  running  (1  worker,  ~  130  MB/s,\n  currently  sweep  #2  of  24):  it  completes  the\n  full  24-point  pre-registered  margin  ledger  at  the\n  worst  window  ~  09:00  ..  12:00  tomorrow,  at  zero\n  contention  cost.  Full-run  decision  (full  density\n  ~  3.3  ..  4.5  d  vs  re-scoped  4-8  points/window\n  ~  0.55  ..  1.1  d  vs  wait-then-choose)  is  the\n  owner's,  presented  with  the  measured  numbers."}, {"n": 43, "date": "2026-09-22", "time": "", "title": "07:55-10:45 — H1 full run: incident, root-cause, two latent bugs caught in verification, run relaunched; A1 assembly (W2Beyond3) built green", "body": "The day's events, in order:\n\n1. INCIDENT (morning):  the first full-run trial (13 workers +\n   the profile, ~6Gi  steady each)  pushed  the  124Gi  box  into\n   GLOBAL  OOM  plus  a  ~5-minute  lockup.  dmesg  smoking  gun:\n   \"No more SDMA queue to allocate (8 total queues)\" / \"DQM\n   create queue failed. ret -12\" —  the APU's  8  SDMA  queues\n   are  shared  system-wide  across  GPU  clients,  and\n   13  +  Xorg  exhausted  them;  amdgpu  svm  restore  then  hogged\n   CPU.  All  my  processes  were  killed  by  the  OOM  reaper;\n   the  owner  restarted  the  box.  Zero  checkpoints  existed\n   at  the  kill  (nothing  computed,  nothing  lost  —  the\n   checkpoint  layer  did  exactly  what  it  was  built  for).\n   Owner  audit  found  the  residual  ~70Gi  was  a  llama.cpp\n   Docker  service  (restart-at-boot),  not  orphans  of  mine.\n   Lesson  (recorded  in  the  wiki):  derive  worker  count  from\n   live  RAM  plus  the  SDMA  ceiling,  never  from  core\n   count  alone.\n\n2. REMEDIATION  (this  session,  all  committed  below):\n   -  PID  FILES:  the  instance  writes\n      ckpt_h1_3e10/run.pids  (parent  +  verified  worker\n      pids)  AFTER  the  pool  submits  (pool  workers  exist\n      only  after  first  submit  —  the  first  version  wrote\n      an  empty  file,  caught  and  fixed);  the  supervisor\n      writes  supervisor.pid.  day045b_h1_stop.sh  stops  by\n      pid-file  with  per-pid  cmdline  verification  (no\n      pattern  kills)  plus  a  live  descendant  scan  (a\n      stale  file  can  no  longer  leave  orphaned  workers;\n      an  early  version  of  the  scan  had  a  shell\n      quoting  bug  that  orphaned  10  workers  during  one\n      restart  —  they  were  killed  by  verified  explicit\n      PID,  no  data  at  risk,  0  checkpoints  then\n      existed).\n   -  MEMORY  GUARD,  two  layers,  RAM-derived:  the\n      supervisor  refuses  to  launch  an  instance  while\n      MemAvailable  <  100Gi  (the  owner's  program  budget;\n      28Gi  stays  clear  for  OS  +  display);  the  instance\n      sizes  itself  to  min(11,  (avail  -  28)  /  6)\n      workers  —  11  =  the  SDMA-queue  ceiling  for\n      concurrent  GPU  clients  (measured  evidence  above),\n      not  a  RAM  number.\n   -  OWNER  BUDGET  (directive):  programs  get  100Gi,\n      28Gi  (25  OS  +  3  display)  is  untouchable.\n      Applied  to  both  layers.\n\n3. BUG  1  (caught  by  the  verification  the  owner  demanded):\n   the  REBOOT  WIPED  /tmp/zeta-dl/shards/  —  the  11  L-band\n   LMFDB  shards  (t  in  (1e7,  31946000])  were  /tmp-only.\n   Every  pool  worker  died  at  init  (FileNotFoundError);\n   the  supervisor  correctly  loop-logged  rc=4  and  never\n   produced  junk.  Fix,  durable:  all  11  shards  re-fetched\n   from  the  official  static  source  beta.lmfdb.org/data/\n   riemann-zeta-zeros/  (human  cookie  gate),  md5-verified\n   each  against  lshards/md5.txt  (the  14,580-line  official\n   pin  list,  committed  as  provenance),  stored  in-repo  at\n   scripts/rh/lshards/;  day023_taildiscrete  now  honors\n   ZETA_SHARDS_DIR  (default  /tmp  for  old  callers);\n   the  supervisor  md5-checks  the  11  shards  at  every\n   launch  and  restores  /tmp  copies  for  legacy  paths.\n   Certification  after  the  swap:  the  day023_tail_arbiter\n   reproduced  the  pre-registered  pin  EXACTLY  (exact\n   discrete  sum  over  (1e7,  3e7]  =  6.251993491674e-07),\n   and  the  full  Tail3E10  init  re-derived  all  band\n   counts  (L  52,290,633  +  A  2,792,198,664  +  B'\n   3,053,546,936  +  C  3,142,622,346  +  D  92,577,877,714\n   =  101,618,536,293  zeros,  G_LAST  =\n   30,001,045,999.981976).\n\n4. BUG  2  (caught  by  the  same  verification,  would  have\n   been  silent  in  production):  nearest_zero  searched  a\n   SHIFTED  subarray  of  the  D  file  (it  added  D's  offset\n   d0  ~  9.04e9  within  the  stitched  tail  to  file-relative\n   indices),  so  window  anchors  x  <  ~5.6e9  (windows\n   0  ..  7  of  the  29-window  grid,  192  of  696  points)\n   fell  outside  the  search  space  and  came  back  anchored\n   at  the  WRONG  zero  (2.56e9  off  for  window  0).  The\n   profile  never  touched  it  (top  window  only).  Fixed  to\n   search  D  directly;  SELFTEST(e)  added  (anchors  at\n   windows  0/1/7/8/14/28  all  within  0.16  of  the  true\n   nearest  zero).  Full  selftest  suite  (a,  a-gpu,  c,\n   d,  e,  streaming)  green  after  the  fix.\n\n5. VERIFICATION  STATUS  (the  owner's  a/b/c  gate):\n   (a)  works  —  six  selftests  green  +  arbiter  pin\n   exact  +  stitch  cross-check  12.6M/12.6M  byte-equal;\n   first  real  point  in-flight.  (b)  fails  gracefully\n   —  live-demonstrated  (corrupt  checkpoint  ->  HOLD  rc=3,\n   supervisor  stops  and  reports,  twice;  killed  instance\n   ->  supervisor  relaunches  with  resume  scan).\n   (c)  resumes  gracefully  —  resume  scan  proven  (29\n   windows  ->  696  jobs  recomputed,  on-disk  points\n   skipped);  the  live  crash  +  auto-resume  demo  is  run\n   after  the  first  checkpoint  lands  (~2h  into  the  run),\n   so  the  skip  is  on  real  data.\n\n6. RUN  RELANCHED  09:24:  supervisor  +  11  workers\n   (memguard  math  at  launch:  MemAvailable  118.1Gi,\n   reserve  28Gi,  ~6Gi/worker  ->  11  at  the  queue\n   cap);  run.pids  lists  parent  +  11  workers  correctly;\n   zero  new  SDMA  queue  errors  at  11  clients.  Pace\n   check  (~70  min  in):  first  window  (t  =  3.23e9,\n   lowest  anchor  =  worst-case  read  pattern  and  cold\n   cache  for  all  11  streams  at  once)  at  ~90MB/s per\n   stream  on  the  812.9GB  full-set  sweep  —  consistent\n   with  the  pre-approved  3.3  ..  4.5  day  estimate\n   for  the  696-point  fill  (566TB  total  read);  each\n   point  re-streams  the  full  zero  set  by  construction\n   (the  tail  defect  sums  over  all  zeros).\n\n7. A1  ASSEMBLY  BUILT  GREEN  (the  other  half  of  the\n   owner's  go-ahead):  formal/RhAttack/W2Beyond3.lean\n   (new)  +  eullK_far_segment  (W2Beyond2,  new  public\n   atom):  the  kernel  half  of  the  universal  [S1]  is  now\n   a  lemma  —  farKernelTV  (discrete  TV  of  the  kernel\n   over  ANY  far-side  partition  <=  (5/2)  t^2/g1^2,\n   uniform  in  the  frontier),  a1_far_side_cost  (the  three\n   wire  factors  <=  (17/2)  t^2/g1^2),  a1_far_side_o1\n   (g1  >=  2t  =>  <=  17/8:  constant  kernel  cost  to  any\n   frontier),  a1_universal_wire  +  a1_universal_o1\n   (the  conditional  universal  statement,  wired  to\n   W2B.e4_wBound:  |S1  -  R|  <=  K  *  17/8  under  the  hA1\n   hypotheses  |DN  j|  <=  K  at  every  grid  point)  +\n   the  band  record  (K_measured_3e10  =  2.615067,\n   K_certified_3e10  =  31,047,116,350.923088,  norm_num\n   pinned).  Full  lake  build  green  (17,442  jobs).\n   The  hA1  clause  —  \"S  -  main  bounded  at  the\n   zeros\"  with  a  data-free  O(1)  K  —  remains  THE  open\n   theorem  (E13  records  the  assembly;  E12  corrections\n   appended:  main'(3e10)  =  3.5470  not  2.88;  the\n   day041b  JUMPs  are  0.893  ..  0.981;  typical  gap\n   ~0.29  not  0.62  —  drift  per  gap  ~1.0  with  the\n   jumps,  sharpening  the  E12  reading)."}, {"n": 44, "date": "2026-09-28", "time": "", "title": "~01:15-01:50 EDT — W2M6 GREEN + the day048 margin decider landed (day047 in flight)", "body": "1. W2M6 (the [S1] A1 pin-and-refutation unit) BUILT GREEN and pushed:\n   K_mil(3e10) in [612/100, 615/100) with c = 1/8, pG1 t >= 1151/100 on\n   [3.2e9, 3e10], K_mil * |pG1| >= 70, feed 1 - 13/t < channel; m6_floor\n   wire at K := K_mil(3e10). Full lake build green (17444 jobs).\n   Commits 7c01e4f (code) + a1675ca (E17 doc). The linarith atom-shape\n   failure on `2 * log (32 * 10 ^ 8)` and the silent ℕ-typed\n   `have h : 0 <= (1/2)/(...)` are recorded in E17.3.\n\n2. The day048 margin reissue (worst-10 negative-k points, dps-90/120,\n   f64-pairwise vs 80-bit-exact) COMPLETED (179.6 min) and landed:\n   mnew = 0.50227 .. 0.50363 at all 10 points (ALL POSITIVE); dps-90 ==\n   dps-120 bit-identical everywhere; f64-vs-ld agreement <= 1.7e-6; the\n   80-bit stream replica at the two k = -12 straddle points is\n   BIT-EXACT against the engine. KEY FINDING: the margin is a function\n   of x ALONE (at fixed x the four k values agree to < 2e-6) — the\n   f64 ledger's k-structure at these points was rounding noise. MIN\n   WORST-WINDOW MARGIN = 0.50227 at x = 3232170976.199116. Also\n   identified: the V0 ledger \"mnew\" column is the dev quantity\n   (~0.9999999963, per-point identical in the reissue files), not the\n   margin proper. The summarize() filename- indexing crash was fixed\n   (absolute-path glob; digits at basename[2:4]); SUMMARY.txt written.\n\n3. day047 (the D-band signed-defect measurement, 5 heights,\n   G1 = 2999246000.18 ... G2 = 3e10) is 4 of 5 done: |D| = 1.628 at\n   the worst straddle, 2.691 at 1e10, 1.015 at 1.5e10, 5.171 at 2.5e10;\n   sum-side precision PASS (fsum == mpmath-dps-30 bit-exact). D(2.99e10)\n   (the wire-nearest height) still running (~1.5 h ETA).\n\n4. (02:43 EDT) day047 COMPLETED (total 7.53 h, 5 of 5\n   heights). D(2.99e10) = 4.9789 - 0.7885i, |D| =\n   5.041 (92,219,492,047 zeros streamed, 4609 s,\n   quad error 0.00). Full table: |D| = 1.628\n   (3.23e9 straddle), 2.691 (1e10), 1.015 (1.5e10),\n   5.171 (2.5e10), 5.041 (2.99e10). PRE-REGISTERED\n   O(1) READING FIRES: the signed-defect data story\n   completes to 3e10; the refutation branch\n   (|D| >> O(1)) never fired. Structure: ~1..2.7 on\n   the lower half of the band, ~5.0..5.2 on the\n   upper half (window effect: the D-band window is\n   ~10x the day029 splice window); no growth toward\n   the frontier (wire-nearest 5.041 is below the\n   2.5e10 value 5.171). E18 closed accordingly:\n   every number the [S1] wire consumes on the data\n   side is now measured; what remains for [S1] is\n   the data-free O(1) signed-defect theorem itself\n   (E15's target; E7: unclaimed in the literature)."}, {"n": 45, "date": "2026-09-29", "time": "", "title": "~15:55-16:15 EDT — H1 fleet delivery landed on the 10TB; verified 696/696 COMPLETE; committed to git", "body": "The fleet's final results arrived on the 10TB drive as\n`rh-final-data/` (three boxes: the 8x-RTX-4090 box, the v100 box, and\nthe local 5900X engine), plus an `evidence/` folder (destroy verdict\nwith the band md5 chains, the data-layout doc, the fleet AGENTS rules).\nConsolidated into `scripts/rh/h1_final_fleet/` (the delivery's\noverlapping files were verified byte-identical to the earlier delivery\nalready there; the 5900x log and window-7 checkpoint were superseded by\ntheir newer snapshot versions) and verified end-to-end\n(`scripts/rh/h1_final_fleet/VERIFICATION.md` is the audit trail;\n`MD5SUMS.txt` covers every file):\n\n1. **696 / 696 certified.** Dedup of every certified engine log line\n   (4090: 693 lines, v100: 386, 5900x: 180) by (t, k) gives exactly the\n   full universe: 29 windows x 24 k-offsets. Every line carries\n   mcert=1.0000; zero non-finite or NaN values anywhere, including all\n   full-precision `.pts` checkpoint files.\n\n2. **466 points cross-certified by two or more machines, bit-identical\n   in t, mnew, and bexp for all 466** (independent hardware: 8x RTX\n   4090, v100, 5900X+3090Ti). Zero disagreements. This is the\n   independent-replication layer the 4090 box's destruction had put at\n   risk: the same certified values now stand on at least two machines\n   for most of the band and on the full-precision checkpoint files for\n   the rest.\n\n3. **The three documented 4090 cert-gate exceptions are closed by the\n   v100 box.** 4090 logged exactly 693 of 696 (missing window 1 / k=-11\n   and window 18 / k=-5, k=-4, per its own per-slice headers and the\n   fleet README). v100's dedicated w18/w19/w20 re-issue runs certified\n   exactly those three, mcert=1.0000. The window-1 point's\n   full-precision checkpoint row is present in the 5900x delivery\n   (t = 3490744648.8185544014) and is consistent with the v100\n   certified line.\n\n4. **Supervisor logs clean.** v100: 878/878 flagged lines are benign\n   lock-contention exits, zero data errors. 5900x: three\n   band-size/perm HOLDs, all from the pre-run FUSE permission saga,\n   resolved before any data was produced.\n\n5. **Delivery provenance is md5-chained.** v100-box checked against the\n   box's own `manifest.md5` (28/28 OK); the whole tree against\n   `MD5SUMS.txt` (55 files); drive->repo copy compared bit-identical.\n   Bands (814 GB) are not in the delivery by design; the evidence\n   folder carries the band md5 identity chains (md5-identical across\n   5900X, the destroyed PRO-6000 node, and the 4090 volume; L-shards\n   11/11 vs official LMFDB pins).\n\nConsequence for the proof: the measured side of the H1 layer is now\n**complete to the wire with a double-checked cross-machine record** —\nno pending points, no re-issues, no fleet dependency left. The only\nopen item for [S1] A1 is the data-free O(1) signed-defect theorem\nitself (E7: unclaimed in the literature)."}, {"n": 46, "date": "2026-09-29", "time": "s2", "title": "~04:10-05:40 EDT — E19: the A1 literature verdict (online-verified) + the growth-form wire GREEN (A1Growth)", "body": "Goal window (owner asleep; objective: don't stop unless the A1 theorem\nis proven for real; work style: online-first research order, one error\ncategory per rebuild, lateral thinking, be like water).\n\n1. Literature pass on the hA1 clause (absolute O(1) |S(gamma)| at all\n   zeros, data-free). web_search provider was down all window; online-\n   first was honored through fetch_content on arXiv (API + ar5iv full\n   text) per the standing directive. Pinned: (a) NO absolute bound on\n   S(t) anywhere in the literature — strongest upper bounds grow\n   (unconditional S = O(log t), Backlund/Titchmarsh 9.4; RH\n   |S| <= (1/4+o(1)) log t/loglog t, CCM arXiv:1309.1526 Thm 2, proof\n   read in full, incl. Lemma 4's decomposition S(t) = (1/pi) sum_gamma\n   f(t-gamma) + O(1) with f(x) = arctan(1/x) - x/(1+x^2)); (b) omegas:\n   Omega((log t/loglog t)^{1/3}) unconditional (Tsang), Omega(sqrt(log t\n   logloglog t/loglog t)) under RH (Bondarenko-Seip),\n   both per the Dobner survey arXiv:2101.01747; (c) distribution\n   theory normalizes S by sqrt(loglog t) everywhere from Selberg's 1946\n   CLT through 2024-26 follow-ups (2407.14867, 2505.23573, 2511.18275,\n   2507.04150, 2510.14309) — all carrying the SAME growing\n   normalization.\n\n2. Lateral pass (red hat): a zero-specific refutation of absolute\n   O(1) via Bondarenko-Seip + gap-transfer was ATTEMPTED and FAILED\n   cleanly: the CCM increment bound |S(t+h)-S(t)| <=\n   (1/2+o(1)) log t/loglog t (h <= sqrt(t)) swallows the Omega value\n   (ratio -> infinity) — the transfer is too crude. Door closed\n   rudely; retrace taken. Consequence: absolute O(1) at the zeros is\n   NOT refuted pointwise by known theorems, but sits under strong\n   pressure (no theorem supports it; the field's own scales are\n   growing). VERDICT (E19): the clause as stated is not a live\n   theorem; the provable A1 is the growth form.\n\n3. The red-hat quantified: at t = 3e10 the fetched asymptotic scales\n   evaluate to sqrt(loglog t) = 1.78, the Bondarenko-Seip Omega scale\n   = 2.96, the CCM RH main term = 1.90 — the measured flat |D| <= 2.615\n   sits mid-scale; the data cannot distinguish \"O(1)\" from \"slowly\n   growing\" at this frontier (the growth is there, below the ruler).\n\n4. Formal: formal/RhAttack/A1Growth.lean GREEN (no sorry) — the\n   growth-form A1 wire: from a pointwise classical input |DN j| <=\n   G(x j) + 1/(x j) (G non-decreasing; +1/(x j) the CITED RVM\n   residual, < 1 for x >= 2 via the LEAN-PROVEN log_div_x_le_one) the\n   wire proves |S1 - R| <= (G(xM) + 1) . (17/2) . t^2/g1^2 on the far\n   side by thin collapse to a global K and the ALREADY-PROVEN\n   W2B3.a1_universal_wire. Instantiations: unconditional (G = C log,\n   CITED Backlund) and RH CCM form (G = (1/4) log/loglog + C1\n   correction, CITED CCM Thm 2; monotonicity/positivity on [16, oo)\n   carried as explicit CITED premises hG0/hGrow). Grid lemmas\n   grid_le_frontier / grid_ge_origin (forward-walk induction). Explicit\n   pins: wire cost 17/2 . 1/4 = 17/8 < 3; RVM residual 1/3e10 < 1e-10;\n   measured 2.615 < C . 24.2 + 1 (the tension pin, C >= 1, with\n   log(3e10) < 24.2 cited).\n\n5. Gates: lake build green (17450 jobs); lake exe rhattack 14/14 PASS;\n   A1Growth 0 sorry; A1Growth now imported into the root RhAttack.lean\n   (first-class, like W2M6); CITED inputs A1G-1..4 recorded in\n   formal/RH-LEAN-PROVENANCE.md; E19 appended to\n   docs/S1-A1-EXPLORATION.md.\n\n6. Process note (Iron Rule v2 in force): research order held — every\n   API/theorem question went online first (arXiv full texts; the\n   mathlib4 doc-site path had moved, noted in the quickref), pinned-\n   source grep only as corroboration, one error category per rebuild\n   (~5 cycles: parse of a fact-list `show`-term; induction\n   generalization shape; context-directed by-block elaboration;\n   mul_nonneg-vs-mul_le_mul_of_nonneg_left; an introduced-but-unbound\n   binder). The CCM section of the first draft was pulled before build\n   (a sorry + ill-typed axioms caught in self-review — the 90%-loop\n   hazard class, defused pre-flight)."}, {"n": 47, "date": "2026-09-29", "time": "s3", "title": "~06:10-12:40 EDT — Valiant forensics: the 696-point ledger's worst-straddle margins are an instrument artifact (true margins 0.502); the D1 + V4 discriminators are running", "body": "1. The forensics pass (owner: \"make a   per-point JSONL\nresume,  fleet 21-column row view,  selftest green at launch.\nA 24-point smoke (the worst-24 points against their deep\nday049f references:  pt00/pt01 vs the bit-exact engine-replica\nmargins,  the other 22 vs dps-90 f64 and dps-120 ld-exact,\ngates ~10x looser than the observed spread,  ~10^4 tighter\nthan the clamp bug's signature) is running on cores 0-13;\na supervisor auto-launches the full 505 on 14 of 16 cores the\nmoment the smoke prints SMOKE PASS.  Honest ETA:  ~3-5 days\n(the cost model corrected once the pace data landed:  the\nper-point cost is not the band read --  the drive does 5.9 GB/s\n--  it is slab_budget:  ~12-16 GB of array traffic per 2^25\nslab,  memory-bandwidth-bound at ~1-2 GB/s per core under\n14-way,  ~3 s/slab,  ~= 240 min/point at 14-way as the first\nwave measured).  The engine's slab_budget was pass-minimized\n(2026-09-30,  A/B-verified BIT-EQUAL sub_re/sub_im and\nbit-exact B terms on 12 slab/t probes;  containment selftests\n(a)/(b)/(d) all green) and the run moved to a SIMD-dispatch\nnumpy (AVX-512 SKX) venv --  log was 30x slower on the AVX-only\ndistro wheel.  The 191 never-in-hand points stay a separate\noptional follow-up (new data,  different claim);  the dps-120\nuniform layer for the points beyond the worst-24 is the\nband-free day053c pass (~2 h) afterwards."}, {"n": 48, "date": "2026-09-30", "time": "", "title": "-- SMOKE PASS, full 505 in flight, precision layer 14/14", "body": "The day052c smoke (24 worst-24 points against their day049f\nreferences) PASSED at 10:37 EDT:  all 24 clean (0 flags,\nmnew 0.502-0.505, every margin under the certificate line,\npt00/pt01 within 1e-5 of the bit-exact engine-replica\nreferences).  The file-watching supervisor then auto-launched\nthe FULL in-hand 505-point re-issue on 14 of 16 cores (resume\nskips the 24 done).  In parallel the band-free day055\nprecision layer ran its first 14 records (one core, 29.5 min):\nSTABLE 14/14,  with d30 = 0.00e00 on every point -- the stored\nstream extras (re, im, nlt, pb, la, ar) reproduce the recorded\nmargins EXACTLY, so the JSONL checkpoint carries full\nprovenance for every margin;  dps-90 == dps-120 to the digit\nand the dps-30 arm sits at the known ~2.8e-9 noise level.\nRemaining:  the 481-point compute (first new-engine points\nexpected ~15:00-15:30 this afternoon;  ETA 3-5 days),  then\nday054 final interpretation,  day055 over all 505,  and the\nforensics/preprint/verification closeout."}, {"n": 49, "date": "2026-09-30", "time": "s2", "title": "-- full run wave 1: pacing fixed, k-sign parity", "body": "Wave 1 of the full re-issue (14 points,  anchor x = 3.23e9,\nk = +/-1..+/-7) landed at 211-219 min/point  on the\npass-minimized engine:  all flag=0,  mnew 0.5022753..\n0.5022786,  mcert 0.50215..0.50217.  Two facts:  (1)  the\npacing is stable at ~216 min/point at 14-way,  so the ETA is\n467 remaining points / 14 x ~216 min ~= 120 h,  i.e.  the\nfull ledger lands  ~2026-10-05 (+/- 1 day);  (2)  the\npositive-k margins at this anchor are indistinguishable from\nthe negative-k ones (k = 7 at 0.5022756  vs  k = -7 at\n0.5022767):  the margin is a function of anchor position,  not\nk-sign --  the worst-24 shape extends across the whole k-band\nas expected.  38 of 505 points on disk."}, {"n": 50, "date": "2026-10-13", "time": "", "title": "505-point in-hand re-issue COMPLETE + final census", "body": "- day052c full run finished: 481 full-wave points in 123.3 h on 14\n  cores (avg 15.4 min/point -- page cache on NVMe made the slab\n  streams far faster than the cold wave-1 estimate of 216 min/point),\n  plus the 24 smoke points = 505/505 on disk.  Zero flags.  The run\n  was untouched the whole way (no mid-run engine changes).\n- Final census (scripts/rh/out_day052c_696/interpret.md):\n  505/505 mcert < 1;  worst 0.502275 at x = 3.2322e9 (band head,\n  exactly the day049f worst-24 prediction);  best 0.825703 at\n  x = 2.7884e10;  margins rise smoothly and monotonically in x\n  (22 anchors; ),  with\n  the r-gap constant improved to sqrt(2/r);  resonance\n  method),  Wang 2407.14867 + Yu 2505.23573 (unconditional\n  family-direction S-CLTs at sqrt(loglog)),  Jerby\n  2511.18275 (under RH,  a proof of pair correlation for the\n  Z-zeros via a real-hall SDE / Dyson Brownian motion\n  mechanism,  invoking Selberg's probabilistic theory of\n  S(t)).  Verdict:  the flat-at-all-zeros clause is under\n  pressure from three independent directions;  the live move\n  is a zero-restricted t-direction S-CLT with effective T0\n  (it would refute the flat clause by counting,  no gap\n  transfer);  that theorem does not exist in the literature\n  yet,  and P5 (Jerby) is the closest mechanism,  RH-\n  conditional.\n  (3) The Lean D4 scope was re-scouted (online first):  the\n  pinned mathlib v4.33.1 ships Mathlib/Analysis/Meromorphic\n  {Basic,Order,Divisor} with MeromorphicOn.divisor +\n  meromorphicOrderAt (verified against the local lake\n  package) -- the counting-data half of the argument\n  principle is now library-ready at the pin,  and the\n  argument principle itself exists upstream in Tau Ceti\n  (Lean-FRO-incubated,  github TauCetiProject/TauCeti)  as\n  TauCeti.Contour.argumentPrinciple.  The Zeta23 borrow\n  source moved to anthropics/formal-math (zeta23/ subdir;\n  the old RvM/Backlund path is gone from main,  re-inventory\n  needed).  Build order ap1 -\\u003e ap2 -\\u003e ap3 recorded in the\n  forensics D4 section."}, {"n": 52, "date": "2026-10-13", "time": "s3", "title": "ap1 stage 1: argument principle PORTED IN-HOUSE (no borrow)", "body": "Owner standing directive applied: advance D3/D4 or document the\nnamed dead end. Worked the cheapest live D4 advance (the ap1\nprobe) to completion.\n\n  * Ported the zeta23 argument-principle base from\n    anthropics/formal-math (former zeta-23-lean) commit\n    e1a4e6508154, Apache-2.0, attribution headers preserved:\n      RhAttack/Ap1Tactic.lean            (additive_combination\n                                          tactic, extending\n                                          Mathlib.Tactic.\n                                          LinearCombinationPrime)\n      RhAttack/Ap1Rectangle.lean         (rectangle/border\n                                          calculus, nhds\n                                          characterizations)\n      RhAttack/Ap1Residue.lean           (H/V integrals,\n                                          ResidueTheoremIn\n                                          Rectangle +\n                                          punctured-rectangle\n                                          residue statement)\n      RhAttack/Ap1ArgumentPrinciple.lean (residueTheorem_finset,\n                                          finite_zeros_rectangle,\n                                          rectangleIntegral'_\n                                          mul_logDeriv_of_poles,\n                                          rectangleIntegral'_\n                                          mul_logDeriv [the\n                                          weighted argument\n                                          principle],\n                                          rectangleIntegral'_\n                                          mul_logDeriv')\n\n  * Decided NOT to add TauCeti or zeta23 as package\n    dependencies (different mathlib pins; D4 needs house-\n    proven, not cited). Port instead, per the iron rule's\n    borrow-with-citation clause (source commit + file paths\n    cited in the file headers and in\n    formal/RH-LEAN-PROVENANCE.md [A1G-6], updated here).\n\n  * All mathlib prerequisites verified present at the pinned\n    v4.33.1 (one authorized local grep, per the iron rule):\n    the Rectangle definition itself\n    (Mathlib.Data.Complex.Basic:845),\n    rectangle_eq_convexHull (Analysis.Complex.Convex),\n    differentiableOn_update_limUnder_of_bddAbove,\n    integral_boundary_rect_eq_zero_of_differentiableOn,\n    analyticOrderAt_* + analyticOrderAt_id, log                                  zeroMult =\n                                         analyticOrderAt,\n                                         zerosIn,  Ncount,\n                                         N0/N0star/N0s/Ns/\n                                         Nd,  ZetaSeam,  RH\n                                         sanity anchors)\n      RhAttack/Ap2Seam.lean            (one_le_mult via the\n                                         identity theorem;\n                                         finite_window via\n                                         local finiteness of\n                                         the zero set +\n                                         compactness)\n      RhAttack/Ap2Reflect.lean         (Schwarz reflection\n                                         zeta(conj s) =\n                                         conj zeta(s);  order\n                                         invariance under\n                                         conj and under the\n                                         functional equation)\n      RhAttack/Ap2CountByIntegral.lean (zetaSeam,  NO paper\n                                         inputs;  + the main\n                                         theorem)\n\n  * MAIN RESULT,  now LEAN-PROVEN in this repo:\n    rectangleIntegral'_logDeriv_completedZeta_eq_Ncount:\n    for 0 < T1 <= T2 with no zero of ordinate exactly T1 or\n    T2,\n        (1/2 pi i) * int (Lambda'/Lambda) ds  =  N(T1, T2)\n    around the rectangle  (-1 + iT1) -> (2 + iT1) ->\n    (2 + iT2) -> (-1 + iT2),  Lambda = completed zeta,\n    N = multiplicity sum of the nontrivial zeros  (order =\n    analyticOrderAt in Mathlib).  This is the classical\n    RvM counting wire the whole  S-identity argument\n    (N(T) = main + 7/8 + S(T)/pi + ...)  hangs from,  and\n    it was previously CITED  (A1G-6).\n\n  * Self-test (working form):  ap2_selftest_RH_counts_on_line\n    -- under Mathlib's RiemannHypothesis the same contour\n    integral equals the Ap3Growth             -- the  explicit  half-plane\n                             bound  ||zeta||  <=  1/2 +\n                             1/|1-s| + |s|/sigma  [Tit\n                             (2.1.4)  with  N=1],  linear\n                             growth  (5/2 + delta^-1)|t|\n                             for  sigma  >=  delta,\n                             &&zeta - 1&&  <=  zeta(2) - 1\n                             for  Re  >=  2.\n  * Ap3Halving            -- reflection  halving\n                             N(T1,T2)  <=  2 x  (right-\n                             half  window  count).\n  * Ap3BacklundDefs       -- reZeroSet(T)  (the  zeros  of\n                             Re  zeta(sigma + iT)  on\n                             [1/2, 2]).\n  * Ap3LocalCount         -- the  Jensen/Landau  local\n                             zero  count  on  a  disc\n                             (via the ported disk\n                             ZerosBound).\n  * Ap3ReZeroCount        --  reZeroSet_card_le:  the\n                             Jensen bound  counting  the\n                             horizontal  Re-zeros.\n  * Ap3Backlund           --  backlund_horizontal:  |Im\n                             int_{1/2}^{2}  zeta'/zeta\n                             dsigma|  <=  explicit  O(log\n                             T)  (the  raw  ~310 log T\n                             integral  constant  form,\n                             pre-Rosser-McCurley)  and\n                             vertical_two:  the  sigma  =\n                             2  vertical  side  is  bounded\n                             by  pi.\n\n  * This is the 17/2 base-cost input  A1Growth.lean  used\n    to carry as CITED  (A1G-6):  the counting  side  of\n    the S-identity wire  (window count  =  contour  of\n    Lambda'/Lambda  +  the  two  side-bound  inputs)  is\n    now LEAN-PROVEN end-to-end through  the  in-house\n    weighted  argument  principle.\n\n  * GATES:  lake build  green;  all four  runtime  gates\n    PASS;  zero sorry  in  Ap1*/Ap2*/Ap3*.\n\n  * Next on the D4 line (bounded,  inventoried):  the\n    main-term  assembly  --  RvM/MainTerm  (486)  +\n    RvM/Fold  (203)  +  RvM/GammaSide  (202)  +  the\n    23-line  RvM/Statement  assembler  =  the  full  RvM\n    formula  N(T1,T2)  =  int  mu  +  (1/pi)  Im\n    int_{1/2+iT1}^{2+iT1->2+iT2->1/2+iT2}  zeta'/zeta  +\n    bounds,  with explicit error terms."}, {"n": 55, "date": "2026-10-13", "time": "s6", "title": "ap4 COMPLETE: the D4 line is done -- full RvM, no extra hypotheses", "body": "The final layer of the argument-principle line (same source\ncommit,  Apache-2.0,  cited):\n\n  * Ap3Hypotheses   --  the  GammaFacts  and  PaperInputs\n                         structures  (the  paper  inputs  as\n                         explicit  hypotheses  by  design).\n  * Ap3RvMDefs      --  GoodHeight,  halfContour  (the\n                         right  half  contour  1/2+iT1 ->\n                         2+iT1 -> 2+iT2 -> 1/2+iT2  as  three\n                         interval  integrals),  the\n                         RiemannVonMangoldt  packaging.\n  * Ap3XiLogDeriv   --  logDeriv  Lambda  =  logDeriv  zeta\n                         +  logDeriv  Gamma  (Re  s  >  0),\n                         Lambda(1-s)  =  Lambda(s),\n                         conj  symmetry.\n  * Ap3ZetaConj     --  the  41-line  PNT+  zeta\n                         conjugation  helper.\n  * Ap3NcountWindow --  window  count  lemmas.\n  * Ap3Fold         --  the  fold:  for  zero-free\n                         ordinates,  N(T1,T2)  =  (1/pi)\n                         Im  halfContour(Lambda'/Lambda),\n                         via  Lambda(1-s')  =  Lambda(s).\n  * Ap3GammaSide    --  (1/pi)(halfContour  logDeriv\n                         Gamma).im  =  int  mu  (the\n                         gamma  side  becomes  the  mu\n                         density).\n  * Ap3MainTerm     --  rvM_main_param  (the  parametric\n                         assembly  of  the  main  term  with\n                         the  ported  Backlund  +  vertical\n                         +  local-count  +  mu  inputs)\n                         and  its  corollaries  rvM_main /\n                         rvM_main_aux.\n  * Ap3RvMStatement --  the  assembler  (23-line  source).\n  * THE GAMMAFACTS DISCHARGE (about 2.4k lines,  all\n                         mathlib-PROVED):\n      Ap3GammaSeries         (digamma  series)\n      Ap3GammaStirling       (Stirling  for  Gamma\n                               off  the  ported  series)\n      Ap3GammaMu             (mu(tau)  =  (1/2pi)\n                               log(|tau|/2pi)  +  O(tau^-2))\n      Ap3GammaIntMu          (the  mu  integral  identity\n                               against  the  main  term)\n      Ap3GammaStirlingVert   (the  vertical  Stirling\n                               estimate)\n      Ap3GammaComplete       (gammaFacts :\n                               GammaFacts,  the  single\n                               discharge  theorem)\n\n  * TOP-LEVEL RESULT,  hypothesis-free  in  this  repo:\n      ap4_selftest_rvM_main_no_extra_hypotheses :\n        EX  C T0,  forall  T >=  T0,\n          |N(T,2T)  -  (T/2pi)  ell1(T)|  <=  C log T\n      ap4_selftest_riemannVonMangoldt_no_extra_hypotheses :\n        RiemannVonMangoldt  zetaZeroConfig\n    i.e.  the  full  Riemann-Von  Mangoldt  formula,  N =\n    main  +  O(log T),  proven  inside  this  package\n    from  mathlib  +  the  ported  Apache-2.0  sources,\n    no  paper  inputs,  no  extra  hypotheses.\n\n  * D4 VERDICT:  the  classical  S-identity  wire  is\n    COMPLETE  in-house  --  ap1  (argument  principle)  +\n    ap2  (window  identity)  +  ap3  (side  bounds)  +\n    ap4  (main  term,  RvM,  GammaFacts)  =  34  files,\n    about  7.5k  lines,  all  LEAN-PROVEN.  What  used  to\n    be  CITED  (the  whole  classical  counting  side)  is\n    now  PROVEN.  The  one  remaining  CITED  input  in\n    A1Growth.lean  is  the  Trudgian  II  explicit\n    S-bound  itself  (A1G-5)  --  a  genuinely\n    frontier-level  citation  (the  bound  the  wire\n    consumes),  not  part  of  the  counting  wire.\n\n  * GATES:  lake  build  green  (34  new  files,  0\n    errors,  zero  sorry  across  Ap1*/Ap2*/Ap3*);  all\n    four  lake-exe-rhattack  runtime  gates  PASS.\n\n  * WHAT THIS MEANS FOR THE RH PROGRAM:  every  classical\n    input  of  the  S-identity  leg  is  now  machine-\n    checked  in  this  repository.  The  formal  side  of\n    the  margin  certificate  (the  data-free  clause  +\n    the  wire  cost)  has  its  entire  classical \n    substrate  PROVEN.  What  remains  genuinely  open  on\n    the  formal  side  is  the  growth  form  of  the  S\n    bound  at  the  zeros  (A1G-5,  frontier)  --  i.e.\n    exactly  the  D3  frontier  (zero-scale  transfer),\n    now  that  D4  (the  machinery  under  it)  has  been\n    removed  from  the  trust  pile."}, {"n": 56, "date": "2026-10-13", "time": "s7", "title": "D3: P2 read in full; zero-scale oscillation vs measured zero-scale flatness", "body": "* P2 (Inoue-Kobayashi-Toma, arXiv:2510.14309) 8-page PDF\n    read in full:  Theorem 1 (RH,  effective,  h in [C/log\n    T,  c/loglog T]):  sup +/-(S(t+h)-S(t)) >= (1-E)\n    sqrt(h log T / pi)  with explicit E;  AT THE EXACT ZERO\n    SCALE h = c'/log T every E-term tends to zero,  so the\n    zero-scale S-increment is  (1-o(1)) sqrt(c'/pi)  (about\n    0.56 at c' = 1).  Theorem 3:  the M-O/resonance\n    barrier (large gaps <= ~3.022,  small >= ~0.508).  The\n    zero-scale oscillation lower bound is the refutation\n    mechanism for any \"S flat at zero scale\" clause\n    (counting-only,  RH-conditional).  See forensics\n    section 3.10.\n\n  * MEASURED (505-point ledger,  read-only):  the k-layers\n    are sliding t-windows of width 5.0 stepped by 0.5  (~109\n    zeros per window).  Over all 483 adjacent-in-t pairs:\n    max |dmnew| = 3.19e-4,  median = -8e-8.  The data-free\n    margin is FLAT to 3e-4 between windows shifted by 11\n    zero-spacings,  while P2 (RH) predicts S-increments of\n    ~0.2-0.6 per spacing and O(1)+ over 0.5 shifts.\n    Compatibility requires the margin to be\n    window-averaged / O(1)-bounded off / wire-cancelled in\n    its S-dependence (the D4 Lean line just proved is the\n    cancellation mechanism).  The ledger therefore does not\n    adjudicate the flat clause:  it cannot see zero-scale S\n    structure at window resolution.\n\n  * NAMED NEXT EXPERIMENT (single-zero sweep):  evaluate the\n    margin / S1-R residual at t-resolution 0.02-0.05 (one\n    zero per step) at ~3.23e9 and ~1e10,  200 steps per\n    anchor (engine at dps-30,  or mpmath S-walk for the\n    S-side alone);  compare single-step deltas with the P2\n    prediction.  Roughness of predicted size  =>  P2\n    becomes the in-data refutation of the flat clause;\n    continued smoothness  =>  the margin is provably\n    S-insensitive at zero scale and the flat-clause\n    question moves to the main-term (G = C log) side."}, {"n": 57, "date": "2026-10-13", "time": "s8", "title": "S-side single-zero sweep: zero-scale S IS rough; margin flat; tension quantified", "body": "* Sweep (scripts/rh/s0_singlezero_swalk.py,  dps-25,\n    cross-checked at dps-45 to 6 digits,  20 s runtime):\n    S(t) = (1/pi) arg zeta(1/2+it)  continuous branch,\n    0.025 t-steps  (quarter zero-spacing)  over 5 t-units\n    at the band head (t0 ~ 3.23217e9)  and at 1e10.\n      per-step S-increment:  ~0.08 median,  ~0.14 mean\n      (S units);  crossing steps (zero jumps):  ~0.92;\n      crossings in 5 units:  15-16  vs RVM prediction\n      ~15.9  (MATCH);  every crossing on the critical line\n      (weak local RH-consistency signal).\n  * Against P2 Thm 1:  the sqrt(h log T / pi)  scale at\n    h = 0.025 is ~0.42  (S units,  SUP over the dyadic):\n    the typical smooth increment  (0.08-0.14)  and the\n    crossing events  (~0.92)  bracket it as expected --\n    QUALITATIVELY CONSISTENT at true zero resolution.\n  * TENSION LOCKED:  S is rough at zero scale;  the\n    505-point margin is flat to 3e-4 at 0.5 t-shifts\n    (~2 zero-spacings).  The margin's flatness,  if real,\n    is an S-INSENSITIVITY property of the certificate\n    (window-averaged / O(1)-bounded off / wire-cancelled;\n    the cancellation mechanism is the RVM identity we\n    just proved in Lean).  The flat-at-zeros clause\n    remains OPEN,  and the adjudicating experiment (the\n    ENGINE-SIDE single-zero margin sweep:  re-evaluate\n    the margin / S1-R residual at t-step 0.02-0.05 and\n    compare its deltas with the S-side deltas just\n    measured)  is  named precisely  in  forensics 3.10.\n    Rough margin deltas of S-side size  =>  P2's\n    oscillation bound is the in-data refutation;  flat\n    margin deltas  =>  the clause question moves to the\n    main-term  (G = C log)  side."}, {"n": 58, "date": "2026-10-13", "time": "s9", "title": "ap5 (in-house): point-scale RvM with O(log T) error is house-PROVEN; A1G-6 rebase formalized", "body": "* New file  formal/RhAttack/S1Point.lean  (namespace S1B,\n    ~450 lines,  NO external source --  in-house theorem,\n    built only from the ported ap1-ap4 machinery + mathlib):\n      S1B.point_rvM (hΓ : GammaFacts) (hC9 : C9NoZerosLow) :\n        ∃ C T0, ∀ T ≥ T0, GoodHeight T →\n          |(Ncount 4 T : ℝ) - f_pt T| ≤ C · log T\n    where  f_pt T = T/(2π)·(log(T/2π) − 1)  and  Ncount 4 T\n    counts ALL nontrivial zeros 0 < Im ≤ T  (by C9 none lie\n    on (0,4]).  This is the classical point-scale\n    Riemann-von Mangoldt with O(log T) error  (the S-defect\n    bound;  Backlund 1918 / Titchmarsh Thm 9.4  point form)\n    --  the last CITED classical input of the wire line is\n    now an in-repo theorem.\n  * One named input remains:  S1B.C9NoZerosLow  (no\n    nontrivial zero on 0 < Im ≤ 4;  first zero 14.134725...\n    --  numerically trivial,  certified in the data layer,\n    not decidable in Lean).  Everything else is proved:\n    winding identity  (ported ap2),  half-contour split\n    (ap3),  gamma side = int mu  (ap3),  Stirling form of mu\n    (ap3, discharged),  Backlund explicit horizontal bound +\n    vertical_two  (ap3).\n  * Components:  int_log_point  (FTC anchor  ∫_4^T\n    (1/2π)log(τ/2π) = f_pt T − f_pt 4),  int_mu_point_form\n    (direct integration of the Stirling field:  ∫_4^T μ =\n    f_pt T − f_pt 4 + O(1),  NO dyadic telescoping --  the\n    O(1/U) per-window errors are immaterial at the point\n    scale because the log terms integrate exactly),\n    hc_zeta_im_bound  (the ζ part of the half-contour [4,T]\n    is O(log T):  both horizontals by backlund_horizontal_at\n    at the explicit Jensen constant CJ ≈ 48.3,  the σ=2 side\n    by vertical_two ≤ π),  f_pt_4_abs_le  (|f_pt 4| ≤ 2,\n    explicit),  point_rvM  (assembly),  rebase_a1g6_dn_form,\n    s1_selftest_point_rvM_discharged.\n  * REBASE A1G-6:  S1B.rebase_a1g6_dn_form proves the wire's\n    hSbound premise form  |DN| ≤ C·log t + 1/t  in the\n    classical smooth-count instantiation  (Nas = f_pt)  at\n    every good height  t ≥ T0.  The only remaining CITED\n    input in A1Growth.lean is the Trudgian II explicit\n    S-bound  (A1G-5)  --  the unconditional frontier,  by\n    design not a rebase target.\n  * Gates:  lake build green  (0 errors),  all four\n    rhattack runtime gates PASS,  zero sorry in S1Point.lean.\n  * day056  (the adjudicating experiment,  forensics 3.10)\n    launched:  single-zero margin sweep at 0.025 t-steps at\n    three ledger anchors  (band head 3.23217e9,  mid 1e10,\n    top 2.788e10),  the dps-30 chain of cert_point  (no\n    engine change),  self-validated against the certified\n    dps-30 ledger mnew values at 6 ledger t's per anchor\n    (expect agreement < 1e-9;  the cross-check rows verify\n    the fast chain before the grid rows are trusted)."}, {"n": 59, "date": "2026-10-13", "time": "s10", "title": "SQUEEZE IDENTITY DECODED: Kfull = -c(x) * zeta exac
