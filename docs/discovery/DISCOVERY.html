at both): dps-15 was the outlier", "body": "FORMAL MILESTONE: formal/RhAttack/S1Ge.lean is green.  THE ATOM: s1_ge_side states the S1 (zero-side) leg of the walk spine at its pointwise core: with the finite-kernel gap |K - (P_n(s) - I(n,s))| <= Mval (the A4.3-wired mass bound, wired in the tree by P8Floor p8_residual_wired under the mass premise |x| <= Xval) and the deviation face devW below the zero-side kernel magnitude |W_n(s)|, the zero-side fill |zeta(s) - K| (the A0 same object |def - zero|, P8Floor p8_same_object) dominates devW - Mval.  The proof is pure composition over named atoms: hobj = p8_same_object (A0: W_n - (K - (P_n - I)) = zeta - K, DLMF 25.2.12 bridge in bare algebraic form); htri = the REVERSE triangle: W_n = (zeta - K) + r hence |W_n| <= |zeta - K| + |r| (norm_add_le); then linarith over the four linear facts (devW <= |W_n|, |r| <= Mval, the reverse triangle) yields |zeta - K| >= devW - Mval - the subtraction bookkeeping devW - Mval <= |W_n| - Mval <= |W_n| - |r| <= |zeta - K|.  SPEC STATUS: the P1.2 spec's S1 row records this leg as 'LEAN-PROVEN POINTWISE under the mass premise |x| <= Xval(band)' with 'bridge zeta = kernel (DLMF 25.2.12, CITED) + b3 BSBAR explicit wire (A4.3 p8_residual_wired)' - S1Ge is exactly that proven pointwise row (the C2 >= side of the closure spec's atom table); the OPEN part the spec names (uniformity of the premise in the height) is the measured track (25x/25y: the P1.1e margin regime from ~5.6e7 upward) and is NOT claimed.  HONESTY: LEAN-PROVEN (the composition, this module); CITED upstream (the A2c bridge |W_n| = |em_expr| through which the dev face reads |W_n| - DLMF 25.2.8 / Apostol Thm 12.21).  NO RH claim: the hs1 leg of the endpoint remains a named residual supported face-by-face by the data program; this module is the pointwise atom the low-band and audit-band hs1 faces instantiate.  FULL TREE BUILD GREEN 17450.  DATA (5e8G ladder, the last reachable mpmath height, t = 1.5000523e19, N_terms = 1.5451e9): dps-20 LANDED (logzeta = +1.7289704098, 4506.3 s, peak 92.6 GB) and dps-30 LANDED (logzeta = +1.7289704098 - DIGIT-IDENTICAL to dps-20, 4700.2 s, peak 95.1 GB).  The dps-15 value (+2.9370199551, peak 92.6 GB) is now adjudicated the OUTLIER - a precision artifact of dps-15 at ~1.5e9 Riemann-Siegel terms; the emerging STABLE value at 5e8G is log|zeta| ~ +1.729 (|zeta| ~ 5.64).  dps-40 (the census working channel) is in flight (fresh process, ~20 min in of ~80 expected); if it lands (as expected, agreeing to dps-20/30), the staggered row protocol (s32a non-zeta channels + s32b merge) locks the verified extreme boundary at 1.5e19 - the last mpmath-reachable row on this 124 GB machine; if it OOMs, 9e18 stands and the remaining levers are a C zeta channel or more RAM.  No RH claim anywhere."}, {"n": 94, "date": "2026-10-16", "time": "1610", "title": "S1Face GATED: the hs1 face is NAMED - hs1AtZero (at an actual zero the hs1 leg IS the S1Ge theorem: the A0 fill collapses to |K|, so the leg reads |K| >= devW - Mval with the pins as its only data input, not a bare witness) + hs1FaceAtAudit (the face at the day-020 band: zero-side claim vs resid pin, joint incompatibility = the squeeze the endpoint consumes)", "body": "FORMAL MILESTONE: formal/RhAttack/S1Face.lean is green (full tree 17450).  THE MOVE: the residual leg hs1 of RHEnd.rh_program78 (Qside (t0, d0) >= devOf (t0, d0) - Mf (t0, d0), the walk spine's S1 witness under the Qside contract, discovery 0088) is now EXPLICIT in two named theorems.  (1) hs1AtZero: at an ACTUAL zero - riemannZeta s = 0 - the A0 same object |def - zero| = |zeta(s) - K| (P8Floor p8_same_object) collapses to |K|, so the S1Ge pointwise atom (discovery 0093) reads EXACTLY the hs1 leg: |K| >= devW - Mval, with the zero-side scale Q := |K| (the kernel magnitude at the zero), devW the deviation face (the measured kernel change at the pair's own height, read through the A2c cited bridge |W_n| = |em_expr|), and Mval the A4.3-wired mass bound (under the mass premise |x| <= Xval(band)).  Content: the hs1 leg is NOT a bare witness premise - it is the S1Ge theorem with the pins (devW, Mval) as its only data input; a zero's existence converts the leg to a statement about the pins.  (2) hs1FaceAtAudit: the named face of hs1 at the audited day-020 band (QSide pins, discovery 0090/0091), in the spine's lettering: the zero-side claim in its C2 form X >= devWorst * (1 - mPin) (mPin = 1/marginWorst = 1/112.6, the C4 margin pin, absorbing the A4.3 mass) and the data face pin X <= devWorst / marginWorst (the measured resid at the worst point, devWorst = 9.198, marginWorst = 112.6) are JOINTLY INCOMPATIBLE - no real X serves both (alias of QSide.section8_close_at_audit, exact-rational, discovery 0091).  The face states precisely that the zero-side leg and the data face cannot BOTH hold at the audited band - which is exactly the squeeze the endpoint consumes (the liveness audit, discovery 0089: a genuine squeeze-contraction, not a dead form).  HONESTY: LEAN-PROVEN (hs1AtZero, composition over S1Ge/p8 atoms; hs1FaceAtAudit, the named alias of the exact-rational close); PINNED (the day-020 constants via QSide).  NO RH claim: the face is the NAMED residual made explicit; the data pins (devW, Mval) must be supported UNIFORM in the height by the data program - the open measured track (25x: the P1.1e margin regime from ~5.6e7 upward, where the premise's uniformity is the spec's named OPEN part) - and is NOT claimed.  NEXT formal move: restate RHEnd so hs1 enters as 'S1Ge + pins' rather than a bare leg (the endpoint's residual narrows from four legs to the pins + the S4 window-pin shape hWin), then track the external review of B6.  DATA (in flight): s31z2 dps-40 (the census channel) at the last reachable mpmath height (t = 1.5000523e19) - ~35 min in of ~80 expected; dps-20/30 already LANDED in agreement (logzeta = +1.7289704098, the emerging stable value at 5e8G)."}, {"n": 95, "date": "2026-10-16", "time": "1645", "title": "RHEnd RESTATED (Part B2): rh_program78_s1pins - the endpoint with the bare hs1 scale inequality REPLACED by the pin family over the witness zero (fill/kernel/mass/absorb), the hs1 leg DERIVED in body via S1Face.hs1AtZero - the residual narrows from 'an inequality to support' to 'the pins to support'", "body": "FORMAL MILESTONE: formal/RhAttack/RHEnd.lean gains Part B2 - theorem rh_program78_s1pins (full tree 17450 green).  STATEMENT: under [Z78] (externalZeroFree78), q a subset of the actual zeros (hqz), the named on-line sliver record (honline), and the NAMED RESIDUAL with hs1 ENTERED AS THE PIN FAMILY instead of the bare scale inequality Qside >= devProg, plus hs3 (the S3 wire: Qside <= BwireP + MrP), hWin (the S4 window-pin shape), hS2low (the S2 low-band pin devProg >= 0.9975), RH holds for q.  THE PIN FAMILY (over the witness zero of each off-pair, all data-supported faces): P1 fill - Qside (t0, d0) = |zeta(rho) - Kfun(rho)|, the A0 fill at the witness zero rho (the C5b point shape: rho.re != 1/2, |Im rho| = t0, |Re rho - 1/2| = d0); P2 kernel - devFacePt(rho) <= |W_n(rho)|, the deviation face reads the zero-side kernel magnitude at the witness (the S1Ge hW pin, via the A2c cited bridge); P3 mass - |Kfun(rho) - (P_n - I)| <= mvalFace (t0, d0), the A4.3-wired finite-kernel gap under the mass premise; P4 absorb - devProg (t0, d0) + mvalFace (t0, d0) <= devFacePt(rho), the spine's deviation is dominated by the deviation face less the mass.  PROOF: refine rh_program78 with the derived hs1 - at an off-pair, take the witness rho (obtain offPair), hzero = hqz rho, then: S1Face.hs1AtZero (A0 collapse at the zero + S1Ge pointwise atom) gives |Kfun rho| >= devFacePt rho - mvalFace (t0, d0); the fill pin (P1) + hzero + norm_neg give Qside (t0, d0) = |Kfun rho|; the absorption pin (P4) via le_sub_iff_add_le.mpr gives devProg <= devFacePt - mvalFace; the calc Qside = |zeta - K| = |K| >= devFacePt - mval >= devProg closes hs1, with MfP = 0 (rfl) + sub_zero.  CONTENT: the hs1 leg of the endpoint is no longer an indecomposable assumption - it is the S1Face structure (zero collapse + pointwise atom) with the pins as its data content; the endpoint's residual narrows from 'an inequality to support' to 'the four pin families to support (uniform in the height - the open measured track, uniformity NOT claimed)'.  The two endpoint forms coexist: rh_program78 (hs1 as the bare scale inequality - the Qside contract form) and rh_program78_s1pins (hs1 as the pins - the data-face form); both gate the same residual, the second makes the checkable shape explicit.  HONESTY: LEAN-PROVEN (the derivation, this module); PINNED/MEASURED upstream (the pins are the data faces; QSide day-020 pins, S1Ge 0093, S1Face 0094); NO RH claim (the pins remain open data faces, exactly as the chart carries).  DATA (in flight): s31z2 dps-40 (the census channel) at the last reachable mpmath height - ~50 min in of ~80 expected; dps-20/30 LANDED in agreement (logzeta = +1.7289704098 at both; dps-15 adjudicated the precision outlier; stable 5e8G value log|zeta| ~ +1.729)."}, {"n": 96, "date": "2026-10-16", "time": "1725", "title": "THE 5e8G ROW IS LOCKED - the staggered protocol completed: zeta from the fresh-process ladder (dps-20/30/40 digit-identical at logzeta = +1.7289704098; dps-15 the adjudicated outlier), M = -3035441152 (integer, f64-exact, I_far dps40/60/80 bit-identical) - the verified extreme boundary is NOW 1.5e19, the LAST mpmath-reachable row on this machine; and |M| is an EXACT quadratic in t at the three extreme rows (the drift is convex - the t^2 kernel tail engaging) while |I_far|/t is constant to 6 digits", "body": "DATA MILESTONE (no RH claim): the s31z2 5e8G zeta ladder (t = 1.50005229999909888e19, t/G = 5e8, N_terms = 1.5451e9, one fresh process per dps) is COMPLETE: dps-15 LANDED (logzeta = +2.9370199551, 4191.5 s, peak 92.6 GB), dps-20 LANDED (logzeta = +1.7289704098, 4506.3 s, 92.6 GB), dps-30 LANDED (logzeta = +1.7289704098 - DIGIT-IDENTICAL to dps-20, 4700.2 s, 95.1 GB), dps-40 LANDED (logzeta = +1.7289704098 - DIGIT-IDENTICAL, 4841.0 s, peak 95.1 GB).  The dps-15/20/30/40 spread is adjudicated: dps-15 is the PRECISION OUTLIER (a dps-15 artifact at ~1.5e9 Riemann-Siegel terms; |zeta| factor ~3.3 off), and dps-20/30/40 TRIPLE-LOCK the value: log|zeta|(5e8G) = +1.7289704098 (|zeta| ~ 5.64).  THE STAGGERED ROW PROTOCOL RAN (s32a stage A: all channels EXCEPT zeta - eps = +0.7046949139418724, lm = 1.1781383214194104e19, la = 1224256007.4746242, re = 4264806475018.3765, I_far = -1.1781387477189394e19 dps-40 with dps60 == dps80 BIT-IDENTICAL, I_far_trap -1.1781268443876452e19 (trap_vs_quad 1.19e14 - the known f64 trap discretization at this scale), M_partial = -3035441152.0 f64-partial-sum-matched; then s32b merge: M = fl(eps + lz - lm - la - re - I_far) recomputed from the recorded channel values (the canonical census association) = -3035441152.0, INTEGER-QUANTIZED, f64 sum match by construction, staged association (M_partial + lz) = -3035441150.2710295 = 3625914 ulps from the canonical - the stagger footprint recorded on the row; provenance annotated: channels stage A fresh stream process, zeta s31z2 fresh process per dps, merge s32b).  THE 5e8G ROW IS LOCKED and joined into the s30 census series (staggered flag).  BOUNDARY: the verified extreme boundary MOVES from 9e18 (3e8G) to 1.5e19 (5e8G) - THE LAST MPMATH-REACHABLE ROW ON THIS 124 GB MACHINE (the s31z verdict locked the wall at [9e18, 3e19) for all precisions; 1.5e19 sits below it with ~20 GB headroom at the dps-40 peak).  FAR-DRIFT SHAPE AT THE THREE EXTREME ROWS (arithmetic - a pure 3-point computation, no RH content): |M| is an EXACT quadratic in t (in 1e8G units: a2 = +9.589670e7, a1 = +2.129818e7, a0 = +5.315327e8; residuals <= 4.8e-7 absolute = f64 rounding level): M(1e8G) = -648727552, M(3e8G) = -1458497536, M(5e8G) = -3035441152 all lie on ONE quadratic with a POSITIVE t^2 coefficient - the drift is CONVEX (accelerating; the local |M| ~ t^p exponent is 0.74 on 1e8G->3e8G and 1.43 on 3e8G->5e8G), and |I_far|/t is CONSTANT to 6 digits (2.61790e-11 at all three rows): the far integral grows t-LINEAR (the settled zero-density channel), so the t^2 drift lives in the M balance - the (t/g0)^2 kernel-tail term engaging at the extreme rows, exactly the s29 deconvolution's (t/g0)^2 kernel-tail bump extrapolated two more decades.  The g-side degeneracy (s29: window [2e8G, 1e11G], best ~1e9G, amplitude O(1e8..1e11)) is NOT broken: the new row is still in t << g0 (t/g0 ~ 5e-2) - but the curvature datum (a2 > 0 at the extreme rows) constrains the g0/amplitude combination: the (t/g0)^2 term must dominate |M| by t ~ 1e19...5e19 with g0 ~ 3e20, an input for the next deconvolution pass.  REMAINING LEVERS FOR HIGHER ROWS: a C zeta channel (Riemann-Siegel without the mpf term arrays) or more RAM - an engine task, not a data task.  ALSO (formal, in flight this stretch): the S1Face + RHEnd Part B2 milestones (discovery 0094/0095) - the endpoint restated with hs1 as the pin family; full build 17450 green."}, {"n": 97, "date": "2026-10-16", "time": "1810", "title": "s33 RE-DECONVOLUTION WITH THE EXTREME ROWS: the convex |M| curvature at 1e8G/3e8G/5e8G PULLS THE g-side WINDOW UP - P1 pole best at h0 = 2e10G (max|res| 2.8e5, ~1e-4 relative at the 5e8G row), P3 lognormal best at 1e11G (2.75e5), admissible h0 compressed from the s29 window [2e8G, 1e11G] to ~[1e10G, 1e12G] with best fits at the upper edge; the position-amplitude degeneracy survives but narrows to ~2 decades, and the row needed to break it moves to t ~ 3e20..3e21 - breaking it is now definitively an engine task (C zeta channel or more RAM), not a data task on this machine", "body": "DATA MILESTONE (no RH claim): the s29 pin family re-ran (s33_redec_extreme.py, same machinery, same grid L2000/1/n160, same part structure) with the s30 far-extreme census rows added to the far set (36 rows total: 16 near <2.2G, 15 far >=2e3G incl. the staggered 5e8G row, max t/G = 5e8).  Part A (min-norm e, joint (A,B,e) solve): unchanged verdict from s27/s29 - the min-norm drift is NOT localized at this grid (delta-e support: none above 3e-3); E_above(e) ~ -3.2e22 is dominated by the extreme-row direction (a degenerate near-null direction of the kernel at these heights, not a pinned structure).  Part B (parametric forward fits, FAR rows only, A/B anchored to the near face: A = -2.527100e7, B = +5.238779e8, max near res 1123.82): the measured drift D(t) = M - (A ln t + B) runs from +2.17e5 at 1e6G down to -2.44e9 at 5e8G (the monotone negative far drift, now with three extreme points on it).  P1 pole (1-cell delta): the best max|res| MOVES UP THE g-axis with the new curvature - s29's best was ~1e9G, s33's best is h0 = 2e10G (max|res| = 282516.5, ~1.2e-4 relative at the 5e8G row), and the res is FLAT ~2.9e5 over h0 in [1e10G, 5e11G] before deteriorating (2.3e6 at 5e13G).  P3 lognormal bump: sig=0.50 best 288588 at 1e11G, sig=1.00 best 275145 at 1e11G (s29's best was ~1e9G with sigma ~1).  P2 power tail: q=0 (constant density bump) best 2.3e7 at 1e9G, q=1 (density-fraction shape) flat ~1.94e9 across the window (dominated by the 5e8G row).  READ: the convex curvature of |M| at the extreme rows (the t^2 coefficient +9.59e7 per 1e8G^2, discovery 0096) is the (t/g0)^2 kernel tail of the far-side window, and it PREFERS the upper edge of the s29 window - the g-side window of record UPDATED from [2e8G, 1e11G] (best ~1e9G, amplitude O(1e8..1e11)) to admissible h0 ~ [1e10G, 1e12G] with best fits at h0 ~ 1e10G..1e11G and best-config amplitude O(1e9..1e12).  The position-amplitude degeneracy SURVIVES (the flat res over [1e10G, 5e11G] is the degeneracy re-appearing at the upper edge) but is now ~2 decades instead of ~3-4.  The row that breaks it is a t ~ g0 row at t ~ 3e20..3e21 - ~20x..200x past the verified 1.5e19 boundary, i.e. an ENGINE task (a C Riemann-Siegel channel without the mpf term arrays, or more RAM), not a data task on this 124 GB machine.  Part-A degeneracy + Part-B flat-res are the same phenomenon read two ways: the far rows are a leverage probe, and the extreme curvature pins the LEAD COEFFICIENT of the window (the (t/g0)^2 term) while leaving its CENTER free over ~2 decades.  Outputs: scripts/rh/s33_redec_extreme.py, tmp/s33_run.log (full stdout), tmp/s33_redec_extreme.md (pointer).  Feeds B7 (g-side window of record) and B5 (law territory).  No RH claim.  (Also this stretch: discovery 0096 locked the 5e8G row and moved the boundary to 1.5e19.)"}, {"n": 98, "date": "2026-10-16", "time": "1905", "title": "B6 review packet compiled: the external quasi-RH input (openai/math family 003, Re s > 7/8) is packaged for human review - exact Lean objects the program uses (externalZeroFree78 as the single load-bearing statement, zeta-only; Dirichlet/Siegel declared but not woven), the upstream sources and paths, the 2-kernel verification record, an ordered 6-item reviewer checklist (the 31k-line dependency patch is the highest-leverage human item; the 199-page paper is the long pole), and the graceful-degradation path (NO-GO = two single-line reverts to cited-classical status: far-region vacuity + edge-line exclusion; nothing else moves)", "body": "DOC MILESTONE (no RH claim): docs/B6-REVIEW-PACKET.md compiled for the owner's in-progress human review of the B6 external input.  CONTENT: (1) EXACT OBJECTS - the program depends on exactly ONE external statement: Z78.externalZeroFree78 (forall s, 7/8 < s.re -> riemannZeta s != 0), a hypothesis of Z78.zetaZeroStrip (strip corollary 1/8 <= Re <= 7/8, PROVEN), Z78P12.offPairFarEmpty (far region d0 > 1/2 vacuous, PROVEN), Z78P12.rh_actual78 (actual-set reduction, PROVEN), Z78P12.edgeZeroFree78 (replaces the cited-classical edge leg, PROVEN), and RHEnd.rh_program78 / rh_program78_s1pins (which carry (hz78 : Z78.externalZeroFree78) as a NAMED hypothesis - the endpoint is CONDITIONAL on the input; nothing in the tree asserts it as an axiom).  The Dirichlet (externalZeroFreeDirichlet78) and Siegel ( strength; follow-up by Baiying Liu (arXiv 2610.12234) imports the preprint's analytic inputs as a load-bearing dependency - a self-containment cross-check); [6] semantic scope confirmation: Mathlib's riemannZeta = the paper's classical meromorphic zeta, no normalization/domain subtlety (minutes).  GO criteria: item 4 passes and item 5 reaches 'no flaw found in the load-bearing pieces'; items 1-3 and 6 unconditionally.  (5) GRACEFUL DEGRADATION - a NO-GO re-opens exactly two regions, both SINGLE-LINE REVERTS to cited-classical status in this chart: the far-region vacuity (offPairFarEmpty) and the edge-line exclusion (edgeZeroFree78); nothing else in the program depends on the input - the data faces, the walk legs hs1/hs3/hWin/hS2low, the S1 uniform chain, the Qside contract, the low-band wire shape, and the endpoint composition engine all stand either way; a NO-GO changes the STATUS of hz78 (adopted external input vs cited-classical assumption) and the two theorems, and nothing more.  HONESTY: 7/8 is not 1/2; no RH claim made or implied; the packet is the operational artifact that makes the in-progress human review executable (what to diff, what to re-run, what to re-read, what each outcome changes).  No dates in the packet (owner rule) - dated records are referenced, not printed (discovery 0073-0078, the Z78Strip header log).  Feeds B6 (external input status)."}, {"n": 99, "date": "2026-10-17", "time": "0014", "title": "LowExcl gated: the low-band off-pair exclusion - the three endpoint low-band legs (hs1 / hS2low / hs3) in the EXACT endpoint leg form are jointly contradictory at any low-band point (0.9975 <= devProg <= Qside <= 0), so no zero set carries a low-band off-pair while the legs hold; the squeeze (0089) stated as an exclusion about the zero set, not a shape lemma; the low-band instance of the endpoint residual is SELF-EXCLUDING by pure logic (no datum) - full tree green (17450 jobs), 94 cards", "body": "FORMAL MILESTONE (no RH claim): formal/RhAttack/LowExcl.lean built and gated (112 lines, 4 theorems, sorry-free; lake build RhAttack.LowExcl green; FULL tree green: 17450 jobs, 0 errors).  WHAT IT PROVES: endpointWireLow / endpointWireLowFull: the endpoint's Z78P12 wire aliases (BwireP + MrP, and + MfP) are DEFINITIONALLY 0 below the program strip (t0 < 1000) - LowWires' definitional-zero wire shape pulled through the endpoint's alias layer (MfP = 0 everywhere, S4A.MfR).  lowBandLegsFalse: at any low-band point (0 < t0 < 1000, 0 < d0 <= 1/2) the endpoint's three low-band legs in the EXACT RHEnd leg form - hs1: Qside (t0, d0) >= RHEnd.devProg (t0, d0);  hS2low: devProg (t0, d0) >= p8_f_near_pin (0.9975);  hs3: Qside (t0, d0) <= Z78P12.BwireP (t0, d0) + Z78P12.MrP (t0, d0) = 0 - are JOINTLY contradictory: 0.9975 <= devProg <= Qside <= 0 -> False (engine: LowWires.lowBandSqueezeShape; devProg = S1LowT.devStripMin definitionally below the strip).  offPairExcludedLowBand: the corollary - for ANY zero set q, no off-pair (P12.offPair: an off-line zero at (t0, d0)) exists at a low-band height while the three leg hypotheses hold there.  SCOPE NOTES: the d0 > 1/2 half of the low band is vacuous from [Z78] alone (Z78P12.offPairFarEmpty, carried in the RHEnd body, not restated here); the module carries no Z78 hypothesis - the exclusion is pure arithmetic over the leg form + the definitional wire shape.  INTERPRETATION: the low-band instance of the endpoint's named residual is SELF-EXCLUDING: the obligation to support the three leg hypotheses at EVERY off-pair excludes low-band off-pairs by pure logic (the contradiction fires for ANY Qside and ANY devProg - no datum is consumed).  The data program therefore only has to feed the legs for off-pairs at 1000 and above: the covered region (1000 <= t0, 1/200 <= d0 <= 1/2) is the audited-band data; the window (1000 <= t0, 0 < d0 < 1/200) is the named window-pin residual hWin; the far region (d0 > 1/2) is [Z78]-vacuous apart from the named blind spot.  This is the squeeze of discovery 0089 stated as an exclusion about the zero set rather than a wire-shape lemma - the S1Face (0094) / RHEnd Part B2 (0095) line of 'bare hypothesis -> theorem + named pins' continued onto the low band.  NOVELTY SCOPE: internal re-organization of the existing proved material (LowWires shape + S4Asm wire definitions + P12 vocabulary); no new mathematics, no new data, no RH claim.  MILESTONE HYGIENE: PATHWAY updated (formal milestone chain + remaining = the C zeta channel past the mpmath wall + the external review of B6); Lean cards regenerated (94 cards, 669 body lines; LowExcl card added); _MAP.md updated (S1 branch composition + orphans + reading order).  CONTEXT: built while the s34 C zeta channel investigation runs in the background (chain 3 = 1e9G, the first height PAST the mpmath wall [9e18, 3e19), landed at logzeta = -1.211098446310; the 5e8G C value 2.9370199551 was cross-checked by the independent bare-cosine assembly at 18.85958102 vs 18.85956015 for the full form - 2.1e-5 apart, inside the rssum.S3 scale; and an instrumented mpmath run is decomposing why mpmath's dps-20/30/40 5e8G zeta (1.7289704098) differs from C + mpmath-dps-15 (2.9370199551) - S1 was exonerated at both precisions by the wp-sweep of zetasum_sieved on a 1e7-term subrange (exact at wp >= 100), leaving the ADR rssum correction as the prime suspect; interim verdict on the 5e8G logzeta anchor PENDING that decomposition - the 5e8G row of record (discovery 0096) is NOT re-charted by this entry)."}, {"n": 100, "date": "2026-10-17", "time": "0217", "title": "mpmath far anchors corrected: the dps-20/30/40 logzeta channels at 1e8G/3e8G/5e8G were corrupted by a broken ADR rssum correction (rssumS3 = 13.86 magnitude at dps-40 vs 1.18e-5 true, S1 exact at every precision; mpmath dps-15 agrees with the C channel to 1e-12) - the C/quad channel is the zeta channel of record past the wall (5e8G logzeta 2.9370199551, NOT 1.7289704098; the old 'dps-15 outlier' verdict flips), the M values of the three far rows are UNCHANGED (f64 association is lz-insensitive at the 1e18-1e19 scale: M_old == M_new bit-exact, integer quantization resid exactly 0.0), the far-drift shape stands, and three new past-the-wall logzeta datums land from the C channel (1e9G -1.211098446310, 1e10G 0.455887846369, 3e10G 2.012486593295)", "body": "DATA MILESTONE + TOOLING MILESTONE (no RH claim).  CONTEXT: the s34 C/quad Riemann-Siegel channel (scripts/rh/zetac: QD hi/lo __float128 arithmetic, hand-declared quadmath prototypes linked against the runtime libquadmath.so.0 - no dev headers, no sudo; tables emitted as exact integer triples) was built to break the mpmath RS memory wall [9e18, 3e19).  VALIDATION: the C formula matches fresh-process mpmath dps-40 to ~1e-12 at t = 1e17, 3e17, 7e17, 1.5e18 (t/G = 3.3, 23, 53, 1000); an INDEPENDENT bare-cosine assembly (2*sum cos(theta - t ln n)/sqrt(n), no F/c/rssum tables; shares only the QD math + constants) agrees with the full C form to 1.3e-5..2.9e-5 at 1e8G/3e8G/5e8G/1e9G (the rssum*S3 + O(t^-1/4) scale) - both C assemblies are in agreement at every height, full-form and bare, to the expected cross-assembly tolerance.  THE FINDING: the mpmath dps-20/30/40 logzeta values of the three extreme far rows are CORRUPTED by mpmath's own ADR rssum correction (the Arias-de-Reyna F/coefficient machinery), not by S1.  The 5e8G decomposition (instrumented mpmath, fresh process, S1 + rz = S1 + rssum*S3 captured at dps-15 and dps-40, same exact t):  (i) S1 at dps-40 = (-2.3278963398604178, -9.2544934238805307) matches the C S1 (-2.3278963398604309, -9.254493423880497) to ~2e-14 - S1 is exact at both precisions;  (ii) rssumS3 at dps-40 = (-5.6333608928981085, -12.641483393444577), magnitude 13.86 - GARBAGE (true scale 1.18e-5);  (iii) the dps-15 run: S1 to 2e-14 of C, rssumS3 = (9.145e-06, 7.462e-06) magnitude 1.18e-5 (clean), and |zeta| = 18.859560149492072 = the C value 18.859560149492065 to 1e-14 - mpmath dps-15 is EXACT at 5e8G.  Corollary: the 'dps-15 is a precision outlier' verdict (discovery 0096) FLIPS: dps-15 was the truthful run; dps-20/30/40 are the corrupted ones (they agree with each other to 10 digits because they share the same coarse rssum garbage - the error dwarfs the precision difference).  MECHANISM NOTE (recorded, not fully adjudicated): mpmath computes S1 at wpsum = 4 + mag(N*ln N/eps) + 10 (accurate at all run precisions - confirmed by a zetasum_sieved working-width sweep on a 1e7-term subrange: exact at wp >= 100, the S1 path is exonerated at every relevant width); the corruption is in the rssum F/coefficient chain at the high working-width chains (J >= ~33 / L = 4 / M = 9-12; dps-15's smaller chain J ~ 28 is clean).  The rssum garbage magnitude (13.86 at 5e8G) is height-dependent through the chain and the S3 = a^(-1/2) scale; the S1-exact + rssum-garbage pattern means mpmath's dps-20+ zeta at far heights is off by 2*Re(e^itheta * rssum_garbage * S3) = the observed 1.2..4.9 in log|zeta|.  CORRECTED FAR CHANNELS (provenance C/quad, cross-checked):  1e8G  logzeta = 1.455437142349  (was 4.4929618099354; d = -3.037525)  3e8G  logzeta = 3.284789950625  (was -1.5728021802385705; d = +4.857592)  5e8G  logzeta = 2.9370199551  (was 1.7289704098; d = +1.208050; C + mpmath dps-15 agree to 1e-12).  M-VALUES UNCHANGED: recomputing the canonical f64 identity M = eps + lz - lm - la - re - I_far (left-to-right float64, the census association of record) with the corrected lz gives M_old == M_new BIT-EXACT at all three rows (-648727552, -1458497536, -3035441152) with the integer-quantization residual exactly 0.0 - the f64 association at the 1e18-1e19 scale absorbs lz shifts below ~O(512) in its 1e18-scale intermediate roundings, so the lz corrections do not move the locked M values; the far-drift shape is therefore UNCHANGED (|M|(x) quadratic, x = (t/G)/1e8 = 1,3,5: a2 = +9.58967040e+07, a1 = +2.12981760e+07, a0 = +5.31532672e+08, residuals <= 8.3e-7 f64 rounding; |I_far|/t = 7.85398..7.85399e-01 constant to 6 digits; local exponents 0.7374 (1->3) and 1.4348 (3->5)).  The s33 re-deconvolution (g-side window [1e10G, 1e12G], degeneracy ~2 decades) is FITTED ON THE M VALUES, so it is UNAFFECTED by this correction - it stands.  NEW PAST-THE-WALL DATUMS (C channel, no mpmath exists there - that is why the channel was built):  1e9G  t = 3.00010459999819776e+19:  logzeta = -1.211098446310  (bare-cos cross |Z| 0.297861107854 vs full 0.2978699056, d = 8.8e-06)  1e10G t = 3.00010459999819727e+20:  logzeta = 0.455887846369  3e10G t = 9.00031379999459246e+20:  logzeta = 2.012486593295  (bare-cos cross queued: s34b chain 5)  The M values of these three rows require the stream channels (s34f 1e9G queued behind the memory release; s34j does 1e10G + 3e10G) - queued, not yet locked.  SUBWALL RE-VERIFICATION (corrected, post-lock): the last sub-wall census row is 5e7G (a = 4.886e8, t = G*5e7 = 1.50005e18), which is the SAME height class as the verified-clean point t = 1.5e18 (a = 4.886e8, fresh-process C == mpmath dps-40 to 1e-12).  The corruption onset is STRICTLY above it (first confirmed corruption at 1e8G, a = 6.91e8); every sub-wall census row has a <= 4.886e8, so NO sub-wall row is in the corrupted region and their recorded logzeta channels stand.  The s34k probe (a = 5.9e8, C at dps-15/dps-40) pins the exact onset.  Confirmatory C crosses at the exact 5e7G and 2e7G row heights are queued.  (The earlier 'risk to the top sub-wall rows' wording was over-cautious: 4.886e8 is a confirmed clean point, not an unproven boundary.)  PROVENANCE POLICY (locked): zeta channel of record above the mpmath wall = the C/quad channel (bare-cos cross on each row); mpmath dps-20+ zeta at far heights (a >~ 5e8) is a KNOWN-CORRUPTED channel (rssum) and is not used for any datum; mpmath dps-15 and the C channel agree to 1e-12 where both can run (5e8G) and serve as the mutual validation band.  NOVELTY SCOPE: diagnostic + correction of an existing numerical pipeline (an mpmath working-precision pathology at its chain's high J/L/M regime - worth an upstream issue report to the mpmath maintainers); the C channel is standard RS formula + standard QD arithmetic; no RH claim.  MILESTONE HYGIENE: PATHWAY updated (the wall + C channel + corrected anchors block); s34g_far_correction.py records the corrected rows + shape (tmp/s34g_far_corrected.jsonl); the three locked M values and the far-drift shape are UNCHANGED (explicitly recorded as such, not silently).  NEXT: s34f 1e9G row lock (stream ~12 min), sub-wall C crosses, s34b chain 5, s34j 1e10G/3e20-9e20 rows, then the row set joins the s33 deconvolution (which will then consume 1e9G and beyond for the first time - the degeneracy-break question).  No RH claim."}, {"n": 101, "date": "2026-10-17", "time": "0252", "title": "S4Blind.lean gated: the S4 blind-spot face is NAMED and its own-floor form is machine-closed-off (blindSpot predicate on the pole-mass-invisible scale 2d/t^2 < 6.5e-5; squeezeImpossibleOnBlind proves the BwireO+Mr+Mf < mown squeeze impossible at any blind-spot pair; the 25-series boundary pins arithmetic-gated; s4OpenFace names the remaining open mathematics)", "body": "FORMAL MILESTONE (no RH claim).  FILE: formal/RhAttack/S4Blind.lean (127 lines, namespace S4Bl, imports P12Uniform + S4Gap; builds GREEN, the full tree re-verified after).  WHAT IT IS: the P12 header has named the S4 blind spot as the REMAINING OPEN MATHEMATICS of the prize (the small-d large-t own-regime pairs where the pole-mass instrument is invisible at 2d/t^2 <~ 6.5e-5 and the pin is invisible at 4kd/t^2 <~ floor, measured only at the instrument boundaries).  This module makes that naming a first-class formal object.  (i) blindSpot (t d) : Prop = 1000 <= t and 0 < d <= 1/2 and 2 d / t^2 < 6.5e-5 (the 25a instrument scale, the BSY measure I(1e7) = +1.29e-6; the 25n pin-invisibility restriction is header-recorded, its k-count is data-side).  (ii) squeezeImpossibleOnBlind: the S4 squeeze in the CONCRETE own-height wiring (BwireO + Mr + Mf < S4O.mown) is PROVEN impossible at any blind-spot pair for nonnegative Mr, Mf - S4G.s4c_squeeze_impossible (the 25p gap certificate: mown <= (16001/15984)/t^2 < (1/2)(13t/8)^(-1/2) <= (1/2) n^(-1/2) <= p8_B t n = BwireO) applied to the strip part of the predicate.  Honest reading: the OWN-FLOOR form of the blind-spot face is now machine-closed-off in Lean - the residual S4 content on the blind spot lives in the WIRING / FLOOR choice off the own mass (any wiring flo >= mown that still squeezes), which is the named open face.  (iii) MEASURED pins (25-series; the content is the measurement, the gates are arithmetic): tstarHold = 690349.0568 (the window-regime squeeze-hold boundary, 25l/25n sweep scripts/rh/day023_s4_sweep.py + out_day023_s4_sweep.txt), deltaWin1e3 = -0.953692 and deltaWin1e7 = +5374.37 (the deficit crossing), closeWitnessT = 5004.7343 with certified margin 143.341847457 (25c, dps-30), bsyI1e7 = 1.29e-6 (25a); pinGates machine-checks the band order 1e3 < tstarHold < 1e7, the negative-to-positive crossing, the witness inside the sound region [1e3, 1e6], and positivity.  (iv) s4OpenFace (flo) : Prop = for all blind-spot pairs, BwireO + 0 + 0 < flo(t,d) and mown(t,d) <= flo(t,d) - the DECLARED (not proven) open residue, exactly the P12 header statement now a named object.  STATUS after: the remaining open content of the program is exactly the named faces - the hs1 pin family (S1Face/S1Ge), the hs3 wire pin, hWin (S4 window-pin shape), the C-channel row M values (s34f/s34j in flight on the far rows), THIS blind-spot S4 face (s4OpenFace), and the external review of B6.  Card added (95 cards, 695 body lines); _MAP.md S4 block updated; PATHWAY section 2 updated (the 'remaining' line now enumerates the named faces instead of the completed C channel).  NOVELTY SCOPE: naming + machine-closure of a face's own-floor form; the impossibility itself is the 25p certificate restated on the blind-spot predicate.  No RH claim."}, {"n": 102, "date": "2026-10-17", "time": "1035", "title": "The far anchors were repr-t height artifacts, not mpmath corruption: every old census probe ran mpmath at mpf(repr(f64 t)); the old values reproduce EXACTLY at the repr heights under independent channels (5e7G mpmath 16 digits, 1e8G/3e8G C to 12-13); s34o re-issues all eight far rows on exact-t C zeta with ALL M unchanged and exactly quantized; s33b breaks the B7 degeneracy - the far M drift is a pure quadratic in t over three decades; the C channel's double-t quantization bug is found and fixed; MFar.lean pins the far-quadratic identity in Lean (GATED)", "body": "DATA + FORMAL MILESTONE (no RH claim).  MECHANISM FOUND:  s30_far_extreme.py and s31z2_5e8G_zeta.py both evaluated zeta at mp.mpf(repr(t)) with t the row's f64 height - the shortest round-trip decimal, whose EXACT value (mpf is decimal-exact) is OFFSET from the exact f64 integer: 2e6G -2, 5e6G +12, 1e7G +24, 2e7G +48, 5e7G +120, 1e8G +240, 3e8G -256, 5e8G +200, 1e9G +400, 1e10G -26848, 3e10G -46080.  Zero density is ~6 per unit t at these heights, so |Z| changes O(1) per unit of offset - the old 'corrupted' anchors were simply the true zeta values at the repr heights.  REPRODUCTION (independent channels):  5e7G - fresh mpmath at t+120 returns 0.5676737452478491, matching the old recorded anchor to ALL 16 printed digits (tmp/s34p_5e7G_shift.log); 1e8G - the C/quad channel at t+240 returns 4.492961809935 vs old anchor 4.4929618099354 (tmp/s34u_sens.log); 3e8G - C at t-256 returns -1.572802180239 vs old anchor -1.5728021802385705 (tmp/s34v_3e8G.log).  CONSEQUENCE:  mpmath 1.4.1 has not been shown wrong at any height in this audit; the s31z2 5e8G anchor (1.7289704098) was ALSO at the repr height (source uses mpf(repr(t))) - the two 5e8G 'classes' differ in HEIGHT, not state; confirmation runs queued (fresh mpmath at repr 5e8G = T4; forced-low entry width at exact 5e8G = T3; s34l T1 LANDED CLEAN - entry prec 173, captured S1 width 235, logabsz 2.937019955061246 = the C value to all digits; T2, the second fresh process, is RUNNING for the determinism call).  RE-ISSUE (s34o):  all EIGHT far rows (5 sub-wall + 3 extreme) recomputed with M = eps + lz - lm - la - re - I_far (canonical left-to-right f64) on the exact-t C logzeta channels:  ALL M VALUES UNCHANGED (M_shift = 0 for every row) and ALL exactly integer-quantized (resid 0.0) - the M channel is demonstrably uncoupled from O(1-5) lz noise at these scales.  Re-anchored channels (of record, exact t, C/quad):  2e6G 0.865468081636, 5e6G -3.111670188752, 1e7G 0.122468610055, 2e7G 1.242954054874, 5e7G -1.395123890841, 1e8G 1.455437142349, 3e8G 3.284789950625, 5e8G 2.937019955061, 1e9G -1.211098446310, 1e10G 0.455887846369, 3e10G 2.012486593295.  C-CHANNEL TOOLING FIX:  the zchain struct held t as a C DOUBLE and the ZETAC_TEST_T hook parsed with STRTOD - BOTH silently quantize far heights to the f64 grid (the earlier 'height-flatness' test was their artifact: t+240 collapsed onto t); the hook is now strtoflt128 + an f128 override (g_test_t); the table rows are UNAFFECTED (each literal rounds to the exact f64 integer - verified digit by digit - so every recorded C value was already at the exact row height).  After the fix C demonstrably distinguishes neighboring heights (1e8G exact vs +240: 1.455437142349 vs 4.492961809935).  B7 BREAK (s33b, 39 rows, far set through 3e10G, tmp/s33b_stdout.txt):  the far DRIFT D = M - (A ln t + B) with A = -25271000, B = +523877900 (the near-face fit) is a PURE QUADRATIC in t over three decades:  D(1e9G) = -9774967307.0, D(1e10G) = -977529165494.1 (ratio 100.00332), D(3e10G) = -8797765678430.4 (ratio 9.0000033);  c = |D|/t^2 = 1.0860e-29 stable to 3 digits;  in g = t/G units M ~ -9.776e-9 g^2 dominates.  The s33 position-amplitude degeneracy is BROKEN on the measured domain:  the far M law is not the near log law - the residual shape is exactly identified, no free shape parameter.  FORMAL:  formal/RhAttack/MFar.lean GATED (build green) - the four past-the-wall/far M values and the three D values are pinned as Real defs (s33b record) and pinGates machine-checks the quadratic identity FROM THE PINS with norm_num (height steps within 1e-4 with the f64 grid rounding inside the windows - t10 = 10 t9 - 49152, t30 = 3 t10 + 65536 - adjacent |D| ratio windows [100.00,100.01] and [9.00,9.01], c within 0.1% across decades, |M30| <= 1.01 c t30^2).  96 cards / 715 body lines; _MAP updated.  DOCS:  docs/MPMATH-RSSUM-ISSUE.md rewritten v2 (the repr-t audit record; NOT filed upstream); PATHWAY section 2 rewritten (the C/quad+rssum block becomes the far-anchor adjudication; the s33 s-degeneracy-survives reading is superseded by s33b).  PENDING (queued, memory-staggered):  T2 determinism call, T3 forced-low entry width at exact 5e8G, T4 fresh mpmath at repr 5e8G, s34k boundary probe, s34w low-row shift confirmations (2e6G/5e6G/1e7G/2e7G repr tests).  No RH claim."}, {"n": 103, "date": "2026-10-17", "time": "1545", "title": "The repr-t artifact record is CLOSED for the entire row set: s34x reproduces all four old LOW anchors bit-exactly (dt = 0.0) at their repr heights in fresh dps-40 processes - the s34w resolution-floor finding (the 53-bit width estimate quantizes the term count to ~9..90 units at 6e16..6e17, so 2..48-unit shifts are invisible at dps-15 but visible at the s25 dps-40) is confirmed; s34k boundary probe clean (C and mpmath dps-15/dps-40 agree at a = 5.9e8 - no dps collapse); the static data reading guide is generated (docs/DATA-LEDGER.md, 11 rows, all values machine-pulled); MFar.lean pinGates gains a scale gate for Gc (Gc was already correctly scaled - the flagged bug was a misdiagnosis, now machine-checked either way); full formal tree green", "body": "CLOSURE MILESTONE for the far-anchor adjudication (no RH claim;  everything below is data bookkeeping).  (1) s34w at dps-15 had shown the four low-row repr offsets (2e6G -2, 5e6G +12, 1e7G +24, 2e7G +48) INVISIBLE:  fresh dps-15 mpmath at the repr heights returned the exact-t values to 1e-11 while the old s25 anchors sit O(1) away.  Mechanism:  mpmath's rszeta width estimate (the ctx.prec = 53 branch) quantizes the sieved term count;  at 6e16..6e17 that is an effective height resolution of ~9..90 units, below which shifts do not move the value.  (2) s34x (fresh process per height, dps-40 = the s25 census setting, source-verified mpf(repr(t)) at workdps(40)):  2e6G repr t-2 -> -0.8770866008849694 (old -0.8770866008849694, dt = 0.0);  5e6G repr t+12 -> 0.2604606616623537 (dt = 0.0);  1e7G repr t+24 -> 1.639866401622982 (dt = 0.0);  2e7G repr t+48 -> -0.4652521468916362 (dt = 0.0) - ALL FOUR OLD LOW ANCHORS BIT-EXACT at their repr heights (tmp/s34x_lowrepr_dps40.log);  the exact-2e6G control comes back 0.8654680816359783 = canonical to 1 ulp (the exact value is dps-stable).  The repr-t artifact record is now closed for the ENTIRE row set:  every old census anchor, low (2..48 units, dps-40 resolution) and high (120..256 units, dps-15-visible), is the true zeta value at the repr height under the original census digit setting.  mpmath 1.4.1 has not been shown wrong at any height or digit setting in this audit.  (3) s34k boundary probe (t = 2190076357998684160,  a = 5.9039e8,  between the verified-clean 4.886e8 point and 1e8G):  C/quad = -1.863686420607;  fresh mpmath dps-15 = -1.8636864206066681;  fresh mpmath dps-40 = -1.8636864206066681 (bit-identical through 17 digits) - NO precision- or dps-induced discrepancy at the boundary;  the historical 'dps-40 collapse' readings join the far anchors as the same height / artifact class.  (4) THE STATIC DATA READING GUIDE:  docs/DATA-LEDGER.md, generated by scripts/rh/s34p_ledger.py from the on-disk data files (no hand-entered table values):  11 rows with exact f64 integer heights (full), repr offsets, the true-floored N (verified at 100-digit precision;  smallest sqrt-space margin 45 at 5e8G), the C channel-of-record logzeta (the 5e8G row re-anchored at full 12 digits by s34q2:  2.937019955061), full/bare |Z|, the mpmath exact-t crosses, M (all exactly quantized), the M-identity component table (eps, lm, la, re, I_far as recorded), the far-law drift table pinned in Lean, the channel definitions, the repr-t artifact record with per-row reproduction evidence, the file map, and the trap list (T1 repr-t, T2 double-t quantization, T3 12-digit printing, T4 misattributed width capture, T5 memory wall).  Ground rules R1-R8:  f64 heights, the channel of record, mpmath as cross-check with the wall [9e18,3e19), the repr rule with the resolution floor, the left-to-right f64 M identity, provenance, the |Z| columns, and the N convention (mpmath n_terms may run N-1 at 5e8G - harmless:  the R-term imbalance parameter p rebalances;  the true N is pinned by the 100-digit check).  (5) FORMAL:  MFar.lean pinGates gains clause (0) - t9/Gc in [0.99999, 1.00001]*1e9 - machine-checking the row scale;  the Gc value ((30001045999981975555 : R)/10^9 = 3.0001045999981975555e10) was already correctly scaled:  the earlier flagged '1e6 off' bug was a misdiagnosis, and the gate now makes the scale provably right regardless.  Full formal tree rebuild green (17450 jobs);  cards regenerated (96 cards / 715 body lines);  _MAP current.  (6) DOCS:  docs/MPMATH-RSSUM-ISSUE.md verdict updated to closure (items 4-7:  5e8G two-state closed, resolution floor, boundary, ledger pointer);  PATHWAY B7 block carries the ledger pointer and the closure line.  No RH claim.  Next formal work:  the B7 face wiring consuming the MFar pins, alongside the named residual faces (hs1, hs3, hWin, hS2low, S4Blind.s4OpenFace)."}, {"n": 104, "date": "2026-10-17", "time": "1920", "title": "B7 face wired (GATED): formal/RhAttack/B7Far.lean consumes the MFar pins and machine-checks five gates - decomposition (nl = M - D exact), share windows (near-log share |nl|/|M| in [5%,7%]/[6e-4,7e-4]/[7e-5,8e-5] at the three far pins), share decay (>=10x per decade), NOT-A-LINE-IN-LN-T (second drop ratio in [7,9], measured 8.0804, vs the ln-t line 0.477121 and the t*ln-t family 2.2875), and T^2 STEP CONSISTENCY (the drop ratio within 1e-3 absolute of the pure t^2 step ratio (t30^2-t10^2)/(t10^2-t9^2) = 8.0808081 at the EXACT pinned heights, measured gap 4.57e-4, nearest competing family 0.79 away): the residual shape is the t^2 / kernel -t^2/g^2 family, identified at the drop-ratio level in norm_num. b7OpenFace declares the open MECHANISM (a positive far-side excess on the s29 g-window [2e8,1e11] whose generated drift hits the pinned D) in the S4Blind s4OpenFace pattern - measured, not proven. The endpoint is untouched (far region vacuous in the body from [Z78]; the B7 face is a measured constraint, not one of the four named residuals). 97 cards; full tree green (17450 jobs)", "body": "FORMAL MILESTONE (no RH claim): the B7 far-side structure (the census drift) is now a module in the Lean tree.  MODULE:  formal/RhAttack/B7Far.lean (namespace B7F;  imports Mathlib + RhAttack.MFar;  build green;  the full tree re-verified at 17450 jobs, 0 errors).  CONTENT:  (1) the near-log PART nl = M - D pinned from the s33b record by EXACT arithmetic on the pins (nl9 = -609469941, nl10 = -667658569.9, nl30 = -695421601.6):  the 50-digit cross-check A ln t + B vs M - D lives in the Python record (diffs +1.06 / +0.048 / -0.51 units on the three rows = the f64 pipeline noise on the s33b D values) and the Real log never enters a Lean gate.  (2) FIVE GATED gates, all norm_num on the pinned rationals:  decompositionGates (nl = M - D exactly on each pin, so the nl values are the s33b near-log part BY CONSTRUCTION, not a re-fit);  shareWindows (the near-log share |nl|/|M| in [5%, 7%] at 1e9G, [0.06%, 0.07%] at 1e10G, [0.007%, 0.008%] at 3e10G - measured 5.87% / 0.0683% / 0.0079% - windows cross-multiplied to stay in the positive rationals);  shareDecay (the share shrinks by >= 10x from 1e9G to 1e10G and >= 5x from 1e10G to 3e10G:  the t^2 term is what the far M channel IS);  notLineInLnT (the M drops are positive and the second drop ratio drop30/drop10 = 7820264275968/967812386816 = 8.0804 sits in [7, 9], while a line in ln t through the first two far pins would give ln(t30/t10)/ln(t10/t9) = 0.47712125472 and the t ln t family would give 2.28748 - both documented 50-dp facts on the pinned heights:  a factor ~16.9 / a gap 0.79 from the window, so the s33 'degeneracy survives' reading is closed at the data level);  t2stepConsistency (NEW THIS ENTRY:  the cross-multiplied gap |drop30 (t10^2 - t9^2) - drop10 (t30^2 - t10^2)| against drop10 (t10^2 - t9^2) satisfies 1000 * gap <= drop10 (t10^2 - t9^2) - i.e. the measured drop ratio 8.0803515 is within 1e-3 ABSOLUTE of the PURE t^2 step ratio (t30^2 - t10^2)/(t10^2 - t9^2) = 8.0808081 (exact rational at the pinned f64 heights; the pinned ratio itself sits 1.4e-15 from the ideal 800/99 of the 3x/10x steps) with measured gap 4.566e-4 (norm_num margin 2.2x), while every competing measured family is >= 0.79 away (790x the window):  the residual shape is IDENTIFIED as the t^2 family (the kernel -t^2/g^2 tail of the s25 candidate list) at the drop-ratio level, to 4.6e-4 absolute, machine-checked.  (3) b7OpenFace (the S4Blind s4OpenFace PATTERN - a Prop declaration, not a proof):  for ANY mechanism map gen (excess-on-scale to generated drift), there EXISTS a positive far-side count excess E, supported on the measured s29 g-window [2e8, 1e11] in g = t/G units, whose generated drift hits the three pinned D values:  the open MECHANISM mathematics, named, with the five gates as its measured shadow.  HONESTY SPLIT:  LEAN-PROVEN the five gates (norm_num on the pins);  DECLARED the face (measured, not proven);  PINNED the nl values from the s33b record.  ENDPOINT RELATION:  RHEnd.rh_program78 is UNAFFECTED - the far region is VACUOUS in the body from [Z78] (Z78P12.offPairFarEmpty), so the B7 face is a MEASURED CONSTRAINT that any RH proof must reproduce (the PATHWAY section 3 list), NOT one of the four named endpoint residuals (hs1 / hs3 / hWin / hS2low).  CARDS:  97 cards / 749 body lines (new card formal/cards/B7Far.md;  the MFar card's USES now names B7Far as consumer);  _MAP.md carries the B7Far block (five gates + the face + the endpoint-relation note).  Next consumer candidates:  the walk (B1) and the law-territory clause (B5);  the remaining named endpoint faces (hs1, hs3, hWin, hS2low, S4Blind.s4OpenFace) are untouched by this entry."}, {"n": 105, "date": "2026-10-17", "time": "2201", "title": "hWin window face wired (GATED): formal/RhAttack/S4WinCap.lean certifies the window floor cap and the face identity - on the WHOLE window band 1000 <= t, 0 < d < 1/200 the unified S2 floor floStripMin is STRICTLY BELOW a single S4 wire term (floor = own mass mown < 31/(10^5 t^2), and that cap is below the P8 tail term at the wire index on both branches: near t <= 110000 by the squaring chain to 50000^2 t^4, far t > 110000 by 62t < 100000 t^2), so hWinFace (the hWin hypothesis of RHEnd.rh_program78 over the Z78P12 aliases) is EQUIVALENT to zero-exclusion of off-line zeros on [1000, inf) x (0, 1/200). The squeeze instrument is certified NOT to reach the window band; the face is the zero-exclusion statement there. Measured backstop (s35a survey): margin floStripMin - (Bwire + Mr) < 0 at every surveyed point on t in [1e3..3e10] x d in (1e-9, 1/200), floor = 4d^2/t^2 to relative 2e-13, Xwire(110000) = 1.827275e-3 <= RX, 25m total at T0 = 0.936536 < 0.9975. 98 cards; full tree green (17450 jobs)", "body": "FORMAL MILESTONE (no RH claim): the hWin residual of the endpoint is now CHARACTERIZED - the window squeeze is proven to be the wrong instrument on the window band, and the face is named as the zero-exclusion statement the band actually requires.  MODULE:  formal/RhAttack/S4WinCap.lean (namespace S4WC; imports Mathlib + the pinned dependency closure B0/B4/B5/B3Core/S4Asm/S4Window/S4Growth/S4Own/S1LowT/Z78P12/P8Floor/FloorUnif; build green; full tree re-verified at 17450 jobs, 0 errors; 0 sorry).  THREE CONTENTS:  (1) poffOwnMown - at the pair's OWN HEIGHT (gamma = t) the B5 off-line factor product has mass exactly S4O.mown t d: B5's four canonical factors at (t, d, t) are exactly the 8-factor S4Own kernel (z1..z4 via the rhoPP/rhoPM/rhoNP/rhoNM = z1..z4 identification chain, closed by dsimp + Complex.ext + simp/ring, with halfR = (2:R)^-1 = 1/2 as the bridging numeral), and S4O.hMownProd is the 25n closed-form bridge.  (2) floorBelowWire - the window floor cap, proven on the WHOLE band 1000 <= t, 0 < d < 1/200:  floStripMin t d <= |poff| t d t = mown t d [min/max structure of floStripMin + poffOwnMown];  mown t d < 31/(10^5 t^2) [mownWindowScale: each own-kernel factor pinned SEPARATELY and then multiplied - 4d^2 < 1/10000 from d < 1/200 (cross-multiplied), 1 + 1/(16 t^2) <= 16000001/16000000 (one_div_le_one_div + nlinarith on the exact identity), exp(1/t^2) <= 1/(1 - 1/t^2) <= 1000000/999999 (the log x <= x - 1 pin with t^2 >= 10^6); the strict-inequality discipline matches every mul_lt_mul_of_pos_{left,right} call to the goal's literal factor parse];  and 31/(10^5 t^2) is STRICTLY below the p8_B(t, n) tail term at the wire index on BOTH branches:  near (t <= S4W.T0 = 110000) via nearTailBelowScale - the squaring chain 12493 t/8 < 12493 t^4/8 < 2e9 t^4 <= 2.5e9 t^4 = 50000^2 t^4 (all explicit mul_le_mul_of_nonneg_left/right and mul_lt_mul_of_pos_left with the positivity haves made explicit; the wire index floor(13 t/8) is <= the t^2 scale via S4W.hpow1 and Nat.floor_le);  far (t > T0) via farTailBelowScale - 62 t < 100000 t^2 by div_lt_div_iff0 cross-multiplication (31 t / 50000 < t^2, i.e. 31 t < 50000 t^2, at t > 110000), with the wire index floor(t^2) below the t^2 scale again by floor_le.  hXgrowPos carries the far branch: S4G.Xgrow t > 0 for t > T0 (every factor positive; Sbar > 0 by the S4W.hLn27 ln-pin with 27 <= t^2).  (3) THE FACE IDENTITY - def hWinFace (z) restates the hWin hypothesis of RHEnd.rh_program78 VERBATIM over the Z78P12 wire aliases (BwireP/MrP/MfP of Z78P12 == S4A.BwireR/MrR/MfR on the band), and two theorems close the equivalence:  hwinFaceImpliesZeroExclusion (a zero set holding the face has NO off-line zero in [1000, inf) x (0, 1/200):  the endpoint's own squeeze gives wire + Mr + Mf < floor while floorBelowWire gives floor < wire, with Mr >= 0 (hMrgen, branched on t <= T0 with S4W.hXwire_pos / hXgrowPos) and Mf = 0, so wire < wire + Mr + Mf < wire - contradiction by lt_irrefl of the additive form) and zeroExclusionImpliesFace (vacuous direction).  MEASURED BACKSTOP (survey s35a, tmp/s35a_hwin_far_survey.py, log tmp/s35a_hwin_survey.log, re-implementing the Lean pins in Python and reproducing them BEFORE taking results):  the margin floStripMin - (Bwire + Mr) is NEGATIVE at every surveyed point on t in [1e3 .. 3e10] x d in (1e-9, 1/200) (logarithmic grids); the floor equals the own-kernel scale 4 d^2/t^2 to RELATIVE 2e-13; Xwire(110000) = 1.827275e-3 reproduces the pinned RX = 0.00185 regime (strictly below); the 25m total at T0 = 0.936536 sits strictly below the p8_f_near_pin = 0.9975 closure.  THE FACE REMAINS OPEN:  it asserts zero-exclusion of off-line zeros on a band NO INSTRUMENT in the tree reaches (classical zero-free regions give Re > 1 - c/ln t, which is nowhere near 1/2 - 1/200 at any of the surveyed heights) - the Lean module proves the instrument's IRRELEVANCE on the band, not the zero-exclusion.  ENDPOINT RELATION:  RHEnd.rh_program78 is UNAFFECTED - the four named residuals (hs1, hs3, hWin, hS2low) are untouched; hWin is now CHARACTERIZED (a zero-exclusion statement with a certified-inadequate squeeze), not closed.  CARDS:  98 cards / 804 body lines (new card formal/cards/S4WinCap.md); _MAP.md carries the S4WinCap block in the S4-squeeze section and the hWin line in the endpoint block now points at it; PATHWAY-TO-A-SOLUTION.md carries the GATED paragraph after the B7 formal block.  NEXT LEVER:  the face is a zero-exclusion claim on [1000, inf) x (0, 1/200) - its discharge route is an imported zero-free-region result (or a walk/certification over the band), i.e. classical-analytic territory, and it is the only h-family named residual whose Lean-side preparation (the characterizing identity) is now complete."}, {"n": 106, "date": "2026-10-17", "time": "2325", "title": "hWin face shrunk (GATED): formal/RhAttack/WinCount.lean pins two independent shrinks of the hWin residual's OPEN content - (A) the classical frontier: tPT = 30610046000 (the rigorous zero-isolation record, Platt, interval-verified to +-2^-102, the public stream's own end) with [Z-PT] CITED over the abstract ZeroSet in the Z78 pattern, and faceSplit certifying hWinFace q <-> hWinFaceResidual q (zero-exclusion on (tPT, inf) x (0, 1/200)) - the open face shrinks by a height factor of ~3e7; (B) the 3e9 record shadow: Nline = 9064192826 + rvm3e9 = 9064192825.58 pinned with pinGates (diff = 21/50, |diff| = 0.42 <= 3, norm_num), D_even (Even (B0.D q t) for any ZeroSet), and offExcessBound (pinned on-line count + the record's +-3 strip gate => D(q, 3e9) <= 2 = at most one off-line orbit below 3e9; 0 or 2 with D_even). 99 cards; full tree green (17450 jobs)", "body": "FORMAL MILESTONE (no RH claim): the open content of the endpoint's hWin residual - characterized in discovery 0105 (S4WinCap: the face IS zero-exclusion on [1000, inf) x (0, 1/200)) - now has two INDEPENDENT shrink routes pinned into the tree.  MODULE:  formal/RhAttack/WinCount.lean (namespace WinC; imports Mathlib + B0 + P12Uniform + S4WinCap; build green; full tree re-verified at 17450 jobs, 0 errors; 0 sorry; 401 lines).  ROUTE A - THE CLASSICAL FRONTIER (cited):  tPT := 30610046000 pins the rigorous zero-isolation record (Platt, 'Isolating some non-trivial zeros of Zeta': rigorous interval-arithmetic isolation of every non-trivial zero with 0 < Im <= 30,610,046,000 to an absolute precision +- 2^-102, an independent verification that the critical line carries them all to that height; the public LMFDB zeta-zero stream - the project's own 24b-series source - ends at exactly this height, so tPT is the RECORD'S OWN frontier, not an external import).  [Z-PT] allOnLineUpTo q tPT is STATED OVER THE ABSTRACT ZeroSet as a named hypothesis (the Z78-strip / Z-EDGE CITED pattern; the higher literature frontier - RH verified up to 3 x 10^12, Platt-Trudgian, arXiv:2004.09765, located by doc-first search this session - is named in the docstring as an optional add-on input; the tree pins the lower, record-consistent frontier).  Both consequences are LEAN-PROVEN and cite nothing beyond [Z-PT]:  (1) noOffPairBelowPT - there is NO off-pair in [1000, tPT] x (0, 1/200) (a zero at negative height is sent to its positive twin by HFE after HCJ before it can hide);  (2) faceSplit - S4WC.hWinFace q <-> hWinFaceResidual q, where hWinFaceResidual (the named residual def) is zero-exclusion on (tPT, inf) x (0, 1/200): under [Z-PT] the hWin face of the endpoint reduces EXACTLY to zero-exclusion above the frontier.  THE SHRINK FACTOR: the open height interval of the face drops from [1000, inf) to (3.06e10, inf) - a factor of about 3e7 in height.  ROUTE B - THE 3e9 RECORD SHADOW (record-derived, the MFar/B7Far measured-constraint pattern):  the H1 3e9 stream record (day035 ceiling report; the finish gate of day035_3e9_stream.sh) is pinned and re-gated:  Nline := 9064192826 (the EXACT on-line zero count up to t = 3e9 in the verified stream, 'N(3e9) = 9,064,192,826 EXACT'), rvm3e9 := 9064192825.58 (the recorded RVM value; RVM counts the STRIP zeros, which is the count that matters);  pinGates (norm_num, arithmetic only): Nline - rvm3e9 = 21/50 exactly and |Nline - rvm3e9| = 0.42 <= 3, i.e. the fleet's own +-3 RVM finish gate, machine-checked in Lean.  Two structural theorems over ANY ZeroSet, LEAN-PROVEN:  D_even - Even (B0.D q t) for all t > 0 (the whole-slice twin of B0.offSliceEven: the fixed-point-free involution rho |-> 1 - rho-bar preserves the height EXACTLY (im(1 - rho-bar) = im rho), so it tiles the entire off-line slice of (0, t] in 2-cycle blocks; proven by the B0 orbit-tile machinery adapted to the whole slice);  offExcessBound - for any q whose on-line count at tdata matches the pinned Nline (the record data fact about the actual set, entered as a hypothesis like S1LowT.SliceFacts) and whose STRIP count passes the record's +-3 gate (|Ntot - rvm3e9| <= n, the same tolerance the fleet ran, stated for the strip count that RVM counts): B0.D q tdata <= n - 1; at the record's tolerance n = 3: D <= 2 - AT MOST ONE OFF-LINE ORBIT below 3e9 (with D_even: the excess is 0 or 2).  The bound spends ONLY B0's structural axioms (nonReal/conj/fe/finite) + the two record pins + the gate - no classical RVM error content is cited, because the argument reads the gate's tolerance n as a parameter: the strip count is Nline + D exactly (B0.eqNtotMinusNon), the RVM pin sits 21/50 below Nline, so the gate forces D + 21/50 <= n.  HONESTY SPLIT:  CITED [Z-PT] (classical, named, reference in the docstring);  PINNED the two record values (norm_num gate);  LEAN-PROVEN noOffPairBelowPT, faceSplit, D_even, offExcessBound.  ENDPOINT RELATION:  RHEnd.rh_program78 is UNAFFECTED; the four named residuals are untouched; hWin is now CHARACTERIZED (0105) AND SHRUNK (0106): its open content is zero-exclusion on (3.06e10, inf) x (0, 1/200) - no instrument in the tree reaches the residual (the classical zero-free regions stop at Re > 1 - c/ln t, nowhere near Re = 1/2 +- 1/200, and the measured zero walk ends at the frontier).  CARDS:  99 cards / 858 body lines (new card formal/cards/WinCount.md); _MAP.md carries the WinCount block in the S4-squeeze section and the hWin line in the endpoint block now reads CHARACTERIZED by S4WinCap + SHRUNK by WinCount; PATHWAY-TO-A-SOLUTION.md carries the GATED paragraph after the S4WinCap FORMAL block.  NEXT LEVER candidates:  (a) an explicit RVM-error input at 3e9 (a doc-first located published bound) would make route B's gate a CITED single hypothesis and shrink route A and B into one;  (b) wiring WinCount's residual def into the endpoint restatement;  (c) the B7F consumer candidates (B1 walk / B5 law territory) from before, or the hs1 height-uniformity measured piece."}, {"n": 107, "date": "2026-10-18", "time": "0011", "title": "hWin shrink wired AT THE ENDPOINT (GATED): RHEnd Part B3 adds rh_program78_winpt - rh_program78 with the hWin premise DERIVED IN BODY from the cited frontier [Z-PT] (zeros on the line up to tPT = 30,610,046,000) plus the residual face (zero-exclusion of off-line zeros on (tPT, inf) x (0, 1/200)); the endpoint's hWin premise narrows to zero-exclusion above the frontier (open height interval shrunk by ~3e7); full tree green 17450 jobs", "body": "FORMAL MILESTONE (no RH claim): the hWin shrink from discovery 0106 (WinCount: [Z-PT] faceSplit + 3e9 record shadow) is now OPERATIONAL AT THE ENDPOINT.  MODULE:  formal/RhAttack/RHEnd.lean Part B3 (66 lines added; the file's terminal endpoint variants now include a third restatement; build green in one shot; full tree re-verified at 17450 jobs, 0 errors; 0 sorry in RHEnd).  THEOREM:  rh_program78_winpt (q : ZeroSet) (hz78 : Z78.externalZeroFree78) (hqz : zeros) (honline : the named on-line sliver record) (Qside) (hs1 : the S1 witness) (hs3 : the S3 wire) (hPT : WinC.allOnLineUpTo q WinC.tPT) (hres : WinC.hWinFaceResidual q) (hS2low : the S2 low-band pin) : RH q.  BODY:  have hface : S4WC.hWinFace q := (WinC.faceSplit q hPT).mpr hres;  refine rh_program78 q ... hface ...  - the two-line composition relies on the definitional coincidence that S4WC.hWinFace q IS the hWin premise type of rh_program78 (S4WinCap restated it verbatim through the Z78P12 aliases in discovery 0105), so the derived face plugs straight into the endpoint with no adapter.  WHAT IT MEANS:  to run the endpoint program in the window regime, one no longer states 'the window squeeze holds on [1000, inf) x (0, 1/200)' as a named residual; one states (i) the CITED classical frontier [Z-PT] (every non-trivial zero with 0 < Im <= 30,610,046,000 is on the ute merge below the frontier (GATED): WinCount section (C) - dZeroBelowRecord ([Z-PT] => D(3e9) = 0 exactly, the B0.zeroD_of_RH pattern with the frontier; 0 is the even case of D_even) + rvmGateDischarged (the recorded exact count Nline implies the fleet's +-3 gate |Ntot - rvm3e9| <= 3 as a theorem, pure record arithmetic via pinGates); plus the S(t)-bound search record (best explicit unconditional bound at 3e9 is ~2.21 > the 1.875 needed, so the gate stays recorded data); full tree green 17450 jobs", "body": "FORMAL MILESTONE (no RH claim): the two hWin shrink routes are now MERGED below the frontier, closing the route story at 3e9.  MODULE:  formal/RhAttack/WinCount.lean section (C) (module now 451 lines; build green; full tree re-verified at 17450 jobs, 0 errors; 0 sorry).  TWO THEOREMS:  (1) dZeroBelowRecord (q : ZeroSet) (hPT : allOnLineUpTo q tPT) (ht : 0 < tdata) : D q tdata ht = 0 - for ANY zero set consistent with the cited frontier [Z-PT], the off-line excess at the record height 3e9 (= 3,000,000,000 < tPT = 30,610,046,000) is EXACTLY ZERO.  The proof is the B0.zeroD_of_RH pattern verbatim (empty-filter argument on the slice, Finset.filter_false_of_mem), with the RH hypothesis replaced by the frontier applied on (0, tPT] - every zero with 0 < Im <= 3e9 sits on the line, so the off-line slice is empty.  This is STRICTLY SHARPER than the record shadow's offExcessBound (D <= n - 1 under the +-n strip gate; at the record's tolerance n = 3, D <= 2): it replaces a gate-tolerated bound by an exact zero, and consistency is built in: 0 is the even case of D_even (no parity conflict between the two routes).  (2) rvmGateDischarged (q : ZeroSet) (ht0 : 0 < tdata) (hcount : Ntot q tdata ht0 = Nline) : abs ((Ntot q tdata ht0 : ℝ) - (rvm3e9 : ℝ)) <= 3 - for a zero set whose exact count at 3e9 matches the pinned record count Nline = 9064192826 (the ACTUAL set has exactly this recorded data), the fleet's recorded +-3 RVM finish gate holds as a THEOREM: the arithmetic is pu <script>
const E = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
                 .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function md(src) {  // the  log's  markdown-lite,  html-safe
  const out = [];
  let pre = false;
  for (const line of src.split("\n")) {
    if (/^```/.test(line)) {
      out.push(pre ? "</pre>" : "<pre>");
      pre = !pre;
      continue;
    }
    if (pre) { out.push(esc(line)); continue; }
    let t = esc(line);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/\*([^*]+)\*/g, "<i>$1</i>");
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    out.push(t);
  }
  if (pre) out.push("</pre>");
  return out.join("\n");
}
function hl(t, q) {
  if (!q) return t;
  const eq = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(eq, "gi"), m => '<span class="mark">' + m + "</span>");
}
let openSet = new Set();
function render() {
  const q = $("q").value.trim();
  const d1 = $("d1").value, d2 = $("d2").value;
  const ord = $("ord").value;
  const rows = E
    .filter(e =>
      (d1 || !e.date || e.date >= d1) &&
      (d2 || !e.date || e.date <= d2) &&
      (!q || (e.title + " " + e.body).toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => ord === "desc" ? (b.n - a.n) || b.date.localeCompare(a.date)
                                   : (a.n - b.n));
  const list = $("list");
  list.innerHTML = "";
  for (const e of rows) {
    const div = document.createElement("div");
    div.className = "entry" + (openSet.has(e.n) ? " open" : "");
    const hd = document.createElement("div");
    hd.className = "hd";
    hd.innerHTML =
      '<span class="dt">' + (e.date || "n.d.") + "</span>" +
      '<span class="tm">' + (e.time ? (e.time) : "") + "</span>" +
      '<span class="tt">' + hl(esc(e.title), q) + "</span>";
    hd.onclick = () => {
      if (openSet.has(e.n)) openSet.delete(e.n); else openSet.add(e.n);
      div.classList.toggle("open");
    };
    const bd = document.createElement("div");
    bd.className = "bd";
    bd.innerHTML = md(e.body);
    div.appendChild(hd); div.appendChild(bd);
    list.appendChild(div);
  }
  $("stat").textContent =
    rows.length + " of " + E.length + " entries" +
    (!q && !d1 && !d2 ? "" : " (filtered)");
}
["q","d1","d2","ord"].forEach(id => $(id).addEventListener("input", render));
$("ex").onclick = () => { E.forEach(e => openSet.add(e.n)); render(); };
$("co").onclick = () => { openSet.clear(); render(); };
window.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== $("q")) {
    ev.preventDefault(); $("q").focus();
  }
  if (ev.key === "Escape") { $("q").value = ""; render(); }
});
render();
</script>
