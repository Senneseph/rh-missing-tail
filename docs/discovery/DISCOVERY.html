<script id="data" type="application/json">[{"n": 0, "date": "", "time": "", "title": "The  chronicle:  approach,  pieces,  contradictions  (intro  scaffold)", "body": "# DISCOVERY_LOG — the chronicle\n\n> **FROZEN at migration (2026-10-16).**  The living chronicle now lives in\n> **`docs/discovery/`**  (one JSON file per entry,  plus the generated\n> interactive  `docs/discovery/DISCOVERY.html`).  New entries are written\n> as fresh JSON files there  (flow:  `docs/discovery/README.md`)  and are\n> NOT appended to this file.  This file is the archival record of the\n> original chronicle (intro scaffold + entries 5..18 + entries 19..pm9),\n> migrated in full to `docs/discovery/entries/`.\n\n\n*Living document, 2026-09-10. This file chronicles the **approach** and\nthe **pieces we found along the way**, in the order they were found, and\nhow they combine. It does not track setbacks. It **does** track\nimportant contradictions — disagreements between a measurement, an\nexpectation, or a recorded value, and how each was resolved. Every\nnumber below traces to a certified output named in\n`results/`, or to a labeled status (MEASURED / EXACT / IN-FLIGHT) in\nthe staged scaffold (`docs/`). New entries are appended in order; an\nentry is written only when its evidence file lands.*\n\n---\n\n## 1. The approach\n\n**RH is a question about the primes. The zeros are the side question.**\n\nThe classical view attacks the zeros directly (bounds for S(t),\ndensity theorems…). We do the opposite: treat the **prime side** as\nprimary — the truncated prime data, the zeta value computed *from its\ndefinition* (Riemann–Siegel), the partial sums, the integral — treat\nall of it as computable at every height **without using any zero** —\nand ask where, and at what size, the **zero content** must enter that\nbudget. RH then reduces to a counting statement (`D ≡ 0`, no off-line\npair at any height), and the whole program is: build an instrument\nthat certifies its own counts, measure the exact prime-side laws, find\nthe measurable point where zero content first enters, and show that\nentry is *exactly* the Riemann-1859 zero product kernel.\n\nThe working method is the **four operations** on the approximation\n(add / remove / duplicate / alter one term, one cell, one zero, one\nheight at a time), run on an instrument that is disciplined like a lab:\ntwo engines must agree, every count is self-certified (twin-floor),\nevery constant is computed not recalled, every claim is labeled. The\nowner's standing intuition — that **½ is the central object** (the\ncritical line, the half-term, the onset at ½·t = N, (−½)! = √π, the\npower-tower half-attractor…) — enters as a *measurement target*: each\nhome of ½ is measured separately, and the unity claim stays labeled\nINTERPRETATION (PLAN.md, P-G).\n\nThe pieces below are the findings, in order.\n\n---\n\n## 2. The pieces, as found\n\n### 2.1 The self-certifying instrument (days 1–4)\n\nA float64 zero-finding engine (dual dt-stacks + dps oracle spot\nchecks) that **certifies its own counts**: a count is accepted only if\ntwo floor spacings agree (dt/dt2 twin-floor), and the count at each\ncertified height is spot-verified at high precision (2K parity, S\nvalue, dps). **What it caught on its own:** one dead counting chunk in\n~70,000 at the 10⁷ walk (a flat |S| ≈ 247 plateau where flips\nstopped) — localized by S-*size*, not by parity, corrected as +246\nflips, and the whole walk re-certified (`results/certified-zero-survey.md`).\nThis is the referee every later number is measured in front of.\n**Crown jewel of the instrument:** a program that takes n and returns\nthe n-th non-trivial zero *by computation, not lookup* (dps-certified\nbracket → twin-floor walk from a dps anchor → float bisection → dps\ntail; first output γ₁₃₈₀₆₆ = 100000.74372338832472…,\n`results/zero-finder.md`).\n\n### 2.2 The missing-tail / width ladder (days 3–5)\n\nTruncate the zeta series at n = N: the missing tail has an **exact\nresidue split** per Dirichlet cell (Hurwitz zeta per residue class).\nUsed as a *computation* (no asymptotic fitting) it yields, to 10⁻¹⁰:\n\n- the edge law **D = −P** (the edge term is exactly minus the cell\n  partial sum) on 18/18 phases at χ₅ and χ₁₃, 17/17 at χ₁₇;\n- the **width (cell-moment) tables** M₁ — all rational: χ₅ in fifths\n  {2/5, 2/5, −3/5, −3/5, 2/5}, χ₁₃ **all integers** (13 phases),\n  χ₁₇ all integers to 1e-9;\n- two structural laws at every odd-prime modulus measured:\n  **M₁(r) = M₁(−r mod q)** (mirror) and **Σ_r M₁(r) = 0** (zero-sum\n  trace); t-independence of M₁;\n- a complex drift coefficient (3/5 + 2i/5)·(t/N) at the χ₅ r = 1\n  rung, decay exponent −1.0005 ± 0.001, whose real and imaginary parts\n  carry *different* phase-group moments — the first measured\n  cross-phase coupling in a truncation ladder.\n\n**The reading (labeled):** the Dirichlet tail is a **flat action** —\nthe exact part is cell data computable at every order, the remainder\nis zero content. Universality of the ladder is then *by construction*\n(a closed action cannot see zeros or t), which is what the ½\nintuition is about on the prime side. (`results/width-ladder-tables.md`.)\n\n### 2.3 The Euler action identity — E7a (day 6)\n\nThe finite summation-by-parts identity (README §Abstract):\n\n```\nΣ_{n=N+1}^{M} a(n)·n^{−s} = A(M)M^{−s} − A(N)N^{−s} + s ∫_N^M A(u)·u^{−s−1} du\n```\n\nholds **exactly** for every step path a(n), every s, every N < M;\nverified at 50 digits on periodic and non-periodic paths (residuals\n10⁻⁵¹–10⁻⁵³, `FORMULAS.md` §2.1). This is the bridge object: series\nside, action side, and zero-side remainder all speak the same\nlanguage. Used as a *computer* it produced the E2-exact infinite-form\ntest (18/18 phases at 1e-10, zero fits). **2026-09-10: the identity is\nnow PROVEN in Lean** (any commutative ring, one-induction proof) with\na 5/5 independent float64 cross-check against the Python oracle\n(worst deviation 2×10⁻¹⁴) — `formal/`, one-command\nverifiable. A finite identity that was \"measured exact\" is now\n\"machine-checked exact\".\n\n### 2.4 The onset (days 4–5) — where zero content first enters\n\nFor the ζ tail (unbounded path, regularized), the measured\nzero-oscillatory term C obeys, in the onset window,\n\n**C/|I| = ½·(t/N)** — to **four digits**, **N-independent** across\nN ∈ {10³, 10⁴, 10⁵}, first visible at **½·t = N** (the\nunit-magnification configuration of the reciprocal lens). Beyond\nt/N ≈ 2 the scaling changes regime (measured, in the width\nladder tables). Reading (labeled): ½·t = N is the moment the\nzero-side interior action overtakes the edge (cell) action in the\nmissing-tail budget. The classic ½ of the Euler–Maclaurin half-term\nis the same width object M₁ in the smooth-path slot — one ladder, two\nentry points. (P-G in PLAN.md: the six measured homes of ½.)\n\n### 2.5 Certified counterexample search (days 5–9) — and the 246\n\nCertified, no-ghost results standing at v0:\n\n- N(10⁵) = 138,065; N(3×10⁵) = 466,655 (GPU, dt/dt2 exact, gate\n  6.5×10⁻¹⁰); N(10⁶) = 1,747,142; S(10⁵) = −2.558419306,\n  S(10⁶) = −2.508632116 (40+ digits); 2K = −2 at 10⁶ (parity: even,\n  no off-line pair); twin census 19 in (10⁵, 10⁶];\n- **N(10⁷) = 21,136,123 — triple-certified** (dt/dt2-stable window\n  227,197; corrected +246 chunk; dps-40 spot); S(10⁷) = −1.2057\n  (O(1)); 2K(10⁷) = 0 at 2.25×10⁻⁹ (dps-40). One final redundancy\n  re-walk was still in flight at the sync of this document\n  (IN-FLIGHT — closes the last redundancy slot; no scaffold change).\n\nThe 246 itself is the instrument's design point made concrete: an\noff-line pair (or a defect) is **invisible to the parity certificate**\n(2K counts parity only) and is found by **S-size** instead. The\ndetector family the proof later needs (off-line ⇒ measurable\ndeviation) was *already in the pipeline*, proven on a real defect\nbefore the zero-side theory existed. (`results/certified-zero-survey.md`.)\n\n### 2.6 The 24-adic front/back — two cell classes, two laws (days 6–8)\n\nThe ladder was generalized past odd-prime quadratic cells:\n\n- **τ₁₂** (the 2×4×3 multiplicative period-12 cell): exact M₁ table;\n- **F₂₄** (the *non-multiplicative* period-24 cell from the\n  Fibonacci ladder; cell sum 108, code-verified mean 9/2): the raw\n  front/back split is mod-4 identical + a mod-3 slide; M₁ halves are\n  **near-identity** (contrast: the multiplicative even cell τ₁₂ has\n  the **antipode sign-flip** M₁(r+6) = −M₁(r) at 1e-10..1e-14);\n  the F₂₄ cyclotomic pole sits at 9/2 (the \"9/2 pole\", measured, not\n  conflation with τ₁₂'s structure — τ₁₂ and F₂₄ are different\n  objects that both live near 24);\n- the quadruple corner law 180°−720°/q and the multiplicative /\n  non-multiplicative cell split.\n\nThe owner's 12/24 \"front sweeps the front quadrants, back sweeps the\nback\" image was **measured**: the antipode law is real at 1e-10..1e-14\non the multiplicative cell; the 24-cell M₁ landscape is near-identity\nrather than sign-flip. The unification (\"3 units per quadrant in π\")\ndid **not** become a load-bearing object: the side-quest was **sealed\nv0.5–v0.7** after its measured parts passed — a boundary decision,\nrecorded here because the measurement stands while the interpretation\nis deliberately left out of the proof path. (Contradiction log §3.2.)\n\n### 2.7 The zero-side bridge — E7b Stage 1 (day 9)\n\nRead the primary sources verbatim (Riemann 1859, p. 9; DLMF 25.2 /\n25.4): the **product over zeros** is DLMF **25.2.12** —\n\n```\nζ(s) = (2π)^s e^{−(1+γ_E/2)s} / (2(s−1)Γ(s/2+1)) · Π_ρ (1−s/ρ)·e^{s/ρ}\n```\n\n— with the analytic density tail appended. Two structural facts\nmeasured: (i) on the critical line each conjugate **pair-factor is\nexactly real** (the two principal arguments sum to a multiple of π;\natan2 constants cancel in-pair); (ii) the zero side reduces to a\nfloat64-vectorizable sum (B-4: closed per-pair form, dps-25\nunit-checked, cross-validated point-for-point against the certified\ntable by the vector re-run). **Stage 1 result:** the zero-side kernel\n(over the certified 466,655-zero list + analytic tail) **reproduces\nthe measured 4-digit onset** — (N=10³, t/N=1): +0.29%; (N=10⁴,\nt/N=0.1): −1.2%; two borderlines +4.2/+5.8%; the rest below the\nquantified zero-side error floor (the density tail saturates once\nG ≫ t). A prime-side law (computed without using zeros) is reproduced\nby the zero side (which uses *only* the zero list + textbook\nanalysis), at the predicted heights, with 4-digit agreement and a\nquantified error budget: the bridge is **real**, and its constants are\nmeasured. (`spec/onset-bridge-e7b1.md`, `FORMULAS.md` E7b-1.)\n\n### 2.8 The detector — off-line pair ⇒ forced deviation (day 10)\n\nThe G2 question (would an off-line zero be *detectable*?) answered in\ntwo layers:\n\n- **Exact core (B-5, v0.5):** replace one on-line pair in the 25.2.12\n  kernel by an off-line pair at δ = β − ½ ≠ 0. The kernel-deviation\n  ratio R = P_off4 / P_on2 has a **closed form from 4 lines of\n  algebra** (real-signed prefactor × constant-rate phase; the only\n  branch is the on-line prefactor's sign flip at t = γ; δ > 0 has a\n  *no-zero-window*, its magnitude is a δ-polynomial with all-positive\n  coefficients). Measured regimes, all 56 grid points: near resonance\n  |R − 1| ≈ 1 (≥ 0.998); at twice the pair's height exactly 4.0000;\n  in the far regime |R−1| = (t₀/γ*)² to 6 digits — the detector margin\n  **grows quadratically** with height ratio. Verified dps-30, three\n  levels (formula vs definition ≤ 6×10⁻²⁶; formula vs measurement ≤\n  5×10⁻⁴ = the last printed digit).\n- **Mechanism (settled, measured + structural):** an off-line\n  4-tuple is **argumentically invisible on the central line** (its\n  near-pair factor is real-negative, never zero ⇒ net phase 0.000\n  across the straddle window, vs −π on-line) while the\n  Riemann–von Mangoldt count *does* count it ⇒ **2K takes a +2 size\n  step, parity is preserved, no flip**. The detector is therefore\n  exactly the *S-size family that already found the 246* — the\n  instrument built in §2.1 is the theorem's eye. Route-A\n  signal-to-noise, measured against the fine local audit floor: ≥ 8.9×\n  worst configuration, ≥ 14× at the pair's own height; in the\n  relative form |ΔK|/|K| ≥ 0.998 uniformly, no audit floor needed.\n  (`results/e7b1-detector-b5-core.md`, `docs/RH-PROOF-OUTLINE.md` B-5.)\n\n### 2.9 The staged proof skeleton (day 10)\n\nThe pieces combine into a skeleton with numbered blanks\n(`docs/RH-PROOF-OUTLINE.md`, v0.5):\n\n**RH ⇔ D(t) ≡ 0** (B-0, a 2-line counting equivalence from classical\ninputs) where D = N_total − N_on-line jumps by 2 at each off-line pair\nheight. The proof contains **two sides of one identity**: the\ndefinition side (ζ from Riemann–Siegel, P_n, I, hence W(t) — no zero\ninput, computable ∀t) and the zero-side kernel 25.2.12 + tail. The\nthree propositions: (i) on-line ⇒ explicit dynamics (the measured\nonset + exact pair form + rigorous tail — B-1, B-2, B-3, B-4 filled);\n(ii) off-line ⇒ forced deviation (B-5, **core FILLED, exact**);\n(iii) the ∀t closure — the one open wall, with three candidate routes\n(A: prime-oracle + residual floor; B: uniform S/2K dynamics; C:\nhybrid interim) and a written **decision rule on incoming data**\n(D1 tail-saturation walk, D2 beyond-4-digit fits, D3 W-audit, D4\ndetector margin, D5 10⁷ redundancy — D4 all landed; D1, D5 in flight\nat sync). The skeleton is explicitly **not a proof**: every step is\nlabeled, every blank names its data trigger, and the document states\nwhat would kill it.\n\n### 2.10 The formal instrument (days 10–11)\n\nThe reasoning tooling itself became part of the artifact:\n\n- **kainos-logos store trained on the proof object:** a Prolog-style\n  proof store discharged the skeleton's implications, ran the\n  circularity query (**CLEAN** — no cycle touches the target; the\n  \"substitute the on-line zero set into ζ\" knot is a mechanically\n  checked property, not a discipline prayer), honored the invariant\n  that `rh` stays status = hypothesis (**no `theorem:riemann`\n  assertion exists anywhere**), and demonstrated the *drop-in*\n  property four times (new data files appeared ⇒ corresponding\n  assertions flipped candidate→established automatically, no module\n  edited).\n- **Lean 4 + Mathlib:** the E7a identity proven over any commutative\n  ring; 5/5 oracle instances cross-checked by an independent Lean\n  float64 pipeline (worst 2×10⁻¹⁴); `formal/` in this repo,\n  one-command verifiable. The finite core of the proof is now an\n  external, machine-auditable fact.\n- **The B-4 pair identity joined the machine-checked core (same\n  day):** the two DLMF-25.2.12 on-line factors for a certified zero\n  height, `RhAttack/B4.lean` — T1: they collapse *exactly*, for all\n  γ,t > 0 (even at the crossing t = γ), to a real signed prefactor\n  times one exponential; T2: the log-magnitude in the ledger's\n  verbatim form; T3: the additive phase exactly mod 2π — stated in\n  the branch-cut-free circle type (no `atan2` principal-value\n  machinery at all) and in ℝ with an explicit 2πℤ multiple. Cross-\n  checked on the 16 recorded points inside Lean float64 (closed form\n  vs direct fac product): 16/16, worst deviations ~10⁻¹⁴ — the\n  predicted double-roundoff scale. What this means for the story:\n  the per-pair content of the zero-side bridge — \"the constants\n  cancel in-pair, and the crossing is a sign flip, nothing else\" —\n  is now an external, machine-auditable fact, in the same package.\n\n---\n\n## 3. Important contradictions (recorded, resolved or standing)\n\nBy the owner's rule, setbacks are not logged here; contradictions are.\n\n### 3.1 The ledger mis-attribution (DLMF 25.2.11 vs 25.2.12) — RESOLVED\n\nThe formula ledger carried \"25.2.11 = product over zeros\". The\nverbatim read gate (raw TeX captured, committed) found **25.2.11 is\nthe Euler *prime* product**; the zero product is **25.2.12**. Corrected\nin the ledger before any zero-side formula first used it. This is the\ncomputed-not-recalled discipline working exactly as designed: a\nrecorded value disagreed with the primary source, and the primary\nsource won. (Also caught in the same read pass: the 25.11 Hurwitz\ncorrection to the earlier on-line pair-factor note.)\n\n### 3.2 The 12/24 front/back image vs the 24-cell measurements — SEALED, measurement kept\n\nThe owner's image (front 12 / back 12, \"3 units per quadrant in π\")\nsplit under measurement: the **antipode sign-flip law is real**\n(M₁(r+6) = −M₁(r) at 1e-10..1e-14, multiplicative cell) but the\nnon-multiplicative 24-cell (F₂₄) shows **near-identity** halves\ninstead of sign flip, and no 12/24 split of the π structure was\nmeasured at the claimed strength. Resolution: the *measurements*\nstand and are in the width tables (two cell classes, two laws —\ngenuinely informative); the *unifying interpretation* was sealed as a\nclosed side-quest (v0.5–v0.7) and is **excluded from the proof path**\ndeliberately. Important not because it was wrong, but because the\nproject demonstrated it can kill one of its own images on data — and\nchose the measurement over the picture.\n\n### 3.3 The 3-term trap (convergence vs truth) — RESOLVED, discipline written\n\nA three-term fit of the χ₅ edge moment returned **7/5** with a\nresidual of 1e-9 — \"converged\" to the wrong value while the exact\ntable (no fitting involved) said **2/5**. Resolution: exact tables\nonly; the no-3-power-term-fits rule was written into P-0. This is the\none standing reminder in the store that *precision of a fit is not\ntruth of a value*; every width table in `results/` is fitted-or-not\nlabeled accordingly.\n\n### 3.4 2K(10⁶) = −2 vs 2K(10⁷) = 0 — RESOLVED by the instrument\n\nNot a contradiction once read, but a near-miss one that was caught:\nthe parity certificate is even at both heights, but the 10⁶ value\n(−2) is the *un-corrected* count (2K counts flips mod 2: −2 ≡ 0),\nwhile the 10⁷ walk carried the +246 defect correction and the\ndps-40 2K = 0 at 2.25×10⁻⁹. Both are consistent with no off-line\ncontent; the discrepancy is bookkeeping, logged with the defect\npost-mortem in `results/certified-zero-survey.md`.\n\n### 3.5 Standing tension (not resolved — this is the open problem)\n\n**What is measured vs what is closed:** the prime-side law is\nmeasured to 4 digits and N-independent; the zero side reproduces it\ninside a quantified floor; the exact finite core is machine-checked;\nthe *∀t* closure (B-6, the (iii) proposition) is **open**, with its\ncandidate routes, margins, and decision rules written. The skeleton\nis a scaffold with numbered blanks, not a proof; the repository claims\nexactly what the labels say (README §What it does not claim) and no\nmore.\n\n---\n\n## 4. Where the chronicle stands (sync 2026-09-10)\n\nFound and in force: the instrument (§2.1), the flat-action ladder\n(§2.2), E7a EXACT → machine-checked (§2.3), the onset (§2.4), the\ncertified no-ghost bound 10⁶ / 10⁷-triple (§2.5), two cell classes\n(§2.6), the reproduced bridge (§2.7), the exact detector (§2.8).\nCombining: the staged skeleton (§2.9) + the formal instrument\n(§2.10). In flight at sync: the G = 6×10⁶ list walk (decides B-2's\ntail model and the A/B route) and the final 10⁷ redundancy (closes\n§2.5's last slot). Next entry is written when the first of those\nlands."}, {"n": 0, "date": "", "time": "", "title": "THE ENDPOINT COLLAPSES TO THE CITED FRONTIER: EVERY NAMED RESIDUAL IS VACUOUS BELOW tPT, hS2low DISAPPEARS, THE RESIDUE IS CONTENT STRICTLY ABOVE 3.06e10", "body": ""}, {"n": 0, "date": "", "time": "", "title": "LEVER-1 VERDICT: the above-frontier hs1/hs3 FACES ARE NOT BODY-PROVABLE - they reduce to two NAMED analytic gaps (G-hs1 scale anti-degeneracy, G-hs3 off-line lift of the critical-line T4 wire) on the strip band, and the endpoint shrinks to the strip frontier", "body": ""}, {"n": 0, "date": "", "time": "", "title": "B7 WALK CONSUMER WIRED: b7WalkFace P (E1/S-series type) as the zeta component. Raw ratio log = the O1 input. 58 s wall.", "body": ""}, {"n": 0, "date": "", "time": "", "title": "KCS U3c (a) RUN: the 1e10 point of the residual law, measured with the identical U3b exact sieve (all four recorded ladder points 1e7/1e8/3e8/1e9 re-measured and MATCH; pi(1e10) = 455052511, agreeing with the tabulated value - independent ground-truth identity of the 1e10 sieve). New point: meas = 0.546585 (se 2.33e-05), u3-only = 0.542278, R = +0.004307 (z = 184.5 vs u3-only - the residual is still strongly real). The 1e10 point discriminates the three live ansatze of 0173: (A) C(X) = R/(loglog/log)^2 drifts 0.3044 -> 0.2321 and is nearly flat over 1e8..1e10 (0.2480 -> 0.2321, -6.5%, the 1e7 point sits ~25% above the plateau) - not confirmed, not strongly rejected; (B) the alpha power law log alpha = b0 + b1*loglog X (4-point fit: b1 = -1.5524, alpha ~ (loglog X)^-1.55) PREDICTS R(1e10) = 0.003944 vs measured 0.004307: z = 15.5 - RULED OUT, alpha decays slower than any loglog power law; (C) the 2-param mixed form R = a*delta + b*(loglog/log)^2 (a = -0.123764, b = 0.715792 from the 4-point fit) PREDICTS R(1e10) = +0.003639 (pred se 5.49e-04) vs measured +0.004307: z = 1.21 in combined (measurement + prediction) uncertainty - the sole surviving form (a within-noise prediction, not yet a law). Strict gate: against the measurement CI alone |meas - model| = 6.68e-04 = 28.6 se - gate still open; against the 4-point prediction se it is 1.21 sigma. No RH claim: the unit is a prime-gap CLASS STATISTIC over an exact byte sieve; flank, not face.", "body": ""}, {"n": 0, "date": "", "time": "", "title": "KCS U3c (d) RUN: the 3e10 and 1e11 points of the residual law - the out-of-sample test of the sole surviving form (the 2-param mixed R = a*delta + b*(loglog/log)^2 with a, b anchored on 1e7..1e9 BEFORE 1e10 existed in the record). New points (exact U3b-family byte sieve; the interval mechanism gated by an exact identity check against the global sieve at 1e10): 3e10 meas = 0.544733 (pi 1300005926, se 1.38e-05), R = +0.003971 (z = 287.5 vs u3-only); 1e11 meas = 0.542888 (pi 4118054813 = the tabulated pi(10^11), se 7.76e-06), R = +0.003654 (z = 470.7 vs u3-only). VERDICT (supersedes the 0186 verdict line): the 4-point-anchored mixed form systematically UNDER-predicts R at all three out-of-sample points - predicted +0.003639/+0.003139/+0.002655 vs measured +0.004307/+0.003971/+0.003654 at 1e10/3e10/1e11 - and the positive excess grows with X: +6.68e-04 -> +8.32e-04 -> +9.99e-04 (28.6/60.3/128.7 measurement se against each point). The 5-point refit undershoots by a smaller but same-signed amount (+4.36e-04/+5.62e-04). Per-decade R decay ratios over the full 7-point ladder = 0.6853/0.8413/0.8246/0.8337/0.8435/0.8529 (stabilizing at ~0.83-0.85/decade and creeping UP). No tested form is confirmed as THE residual law; the new named target: R(X) = (a decaying component of the tested forms) + (a slowly GROWING positive excess, ~1.4-1.6x/decade over the short 2-point range - suggestive, not a law). The strict gate remains OPEN (now 470.7 se against u3-only at 1e11). No RH claim: prime-gap class statistic over the exact byte sieve; flank, not face.", "body": ""}, {"n": 0, "date": "", "time": "", "title": "KCS U3c (e) RUN: the ansatz-family SCREEN on the seven recorded residual points (mechanism step, no new sieving) - inverse-variance weighted fits of R(X) = meas - u3 over 1e7..1e11 against the 7-member loglog-scale family {delta, (loglog/log)^2, (loglog/log)^3, loglog/log, 1/log, 1/log^2, floor}. Findings: (1) NO single-component form survives (best: 1/log^2, max resid 3.67 se) - consistent with the 0173-0187 record; (2) 19 of 21 two-component pairs pass the screening bar (max|resid| <= 3 se AND chi2 <= 2*dof) - the residual law is a TWO-COMPONENT structure over this ladder, with the 1/log^2 scale in 6 of the top-10 pairs (best pair: 1/log^2 + floor, chi2 = 3.17 / 5 dof, max 1.45 se); (3) three-component fits reach chi2 = 2.76-3.00 / 4 dof (flagged overfit zone: 7 points cannot discriminate among the ~20 compatible 2-param families - the discriminator points 3e11/1e12 are beyond this box's memory, named in 0187); (4) the 0187 growing excess e(X) = +6.68e-04/+8.32e-04/+9.99e-04 at 1e10/3e10/1e11 is consistent with ONE power of loglog X, k = 4.23 over the full span (pair slopes 4.72/3.75), with the middle point predicted through-the-ends within 2.3% - the 'slowly growing excess' is a ~(loglog X)^4.2 hint (2-3 point, not a law), not a constant floor (the growth exceeds the floor-fit spread). Verdict: the mechanism is narrowed to 'decaying loglog-log component (dominated by 1/log^2 scale) + growing ~(loglog X)^4.2 component'; the strict-CI gate stays OPEN (needs a DERIVED correction, e.g. the next-order product term delta*(loglog/log) of the LOS expansion - named as U3c (f)). No RH claim: prime-gap class census residual over exact integers; flank, not face.", "body": ""}, {"n": 0, "date": "", "time": "", "title": "Orbital O4 follow-up MEASURED: the band PHASE SWEEP at fixed x over z in {31,50,71,100,200,400} x {2e5..1e10} (0.3 s, exact integers, the in-tree SieveOrbit definitions) - the 0181 phase table extended 5x in z. Findings: (1) THE LEVEL-1 BAND DOES NOT TIGHTEN: the relative width W/Phi grows in z - 6.56 (z=31) to 20.35 (z=400) at x = 1e10 (x3.1 over the sweep), for every x: deeper sieves WIDEN the band relative to the count; (2) the in-band position rho = (Phi - L1)/W drifts DOWN slowly in z (0.7166 to 0.6083 at x = 1e10), no sign of settling by z = 400, and is x-STABLE at fixed z (spread over x <= 2.2e-3 - the 0181 x-stability law persists at depth, degrading only mildly); (3) at z = 400 the first VISIBLE SPLIT between the main-term-based width and the count-based width appears: W/(xV) = 20.3414 vs W/Phi = 20.3517, i.e. Phi = 0.99949 xV - a 5.06e-4 deficit of the exact count from the sieve main term that the widths do not resolve until depth (the classical sieve error oint excess fit with the 7-point fit PREFER DIFFERENT DESCRIPTIONS (both recorded honestly; the 3-point statistics carried the (loglog)^4.2 shape, the 7-point inverse-variance fit prefers the decay-cancellation). What this is NOT: the derived structure is DATA-COMPATIBLE (the 2-term form passes at 1.86 se) but NOT CONFIRMED - the (-, +) sign structure with ~8x term cancellation is not the naive positive-leading derived form of 0186-ansatz-A (which had C ~ +0.23..+0.30 flat for the single-term fit), and 7 points cannot discriminate among the ~8 now-compatible families (the discriminators 3e11/1e12 remain beyond this box: 0187 memory ceiling). The strict-CI gate stays OPEN. No RH claim: R is the prime-gap class census residual over exact integer sieves; the family screen is a mechanism-narrowing step, flank work, not a law.", "body": ""}, {"n": 0, "date": "", "time": "", "title": "KCS U3c (c) RUN (rows 1e9/1e10/1e11): the LOS paper's r = 2, q = 4 data rows (arXiv:1603.03720v4, Lemke Oliver & Soundararajan, PNAS 2016, Section 5 - fetched and IDENTITY-CHECKED, persisted at tmp/u3c_c_fig/paper.pdf) cross-checked against an INDEPENDENT exact pair-class sieve (numpy odd sieve, the same clearing set as the 0186/0187 ground truth). All three checked rows AGREE at the paper's published precision: 1e9 pi(1,1) = 11,413,177 vs 1.141e7 (diff 3.2e3, tol 5e3), pi(1,3) = 14,010,314 vs 1.401e7 (diff 314); 1e10 pi(1,1) = 103,160,935 vs 1.032e8 (diff 3.9e4), pi(1,3) = 124,362,340 vs 1.244e8 (diff 3.8e4); 1e11 pi(1,1) = 941,199,658 vs 9.412e8 (diff 342), pi(1,3) = 1,117,820,622 vs 1.118e9 (diff 1.8e5, 3-fig-row tolerance 5e5), and pi(1e11) = 4,118,054,813 = the tabulated value (identity). NEW MEASURED STRUCTURE: pi(x;4,(1,3)) = pi(x;4,(3,1)) holds EXACTLY (diff = 0) at all three scales 1e9/1e10/1e11 - the paper's Conjecture 1.5 symmetry pi(a,b) = pi(-b,-a) + O(x^{1/2+epsilon}) is exact at these scales (the oscillating zero-sum is 0, or < 1, up to 1e11). Convention reconciliation: the re  shape: the envelope grows, the bins fluctuate O(0.03-0.05)), header data table + ledger section 8 updated (173.9 billion zeros end-to-end), PLAN item 8 restated. The data-free |DN| <= K theorem - still the single named open one - now has its target shape quantified from the data: a non-constant, o(log), INCREASING ENVELOPE (drift ~0.15/decade at the measured scale) with O(0.03-0.05) bin-scale fluctuations. No RH claim: record and shape work on the data side of the named open clause."}, {"n": 0, "date": "", "time": "", "title": "0203 - B6 SIXTH supersession adopted in tree: PR #90 density-refined 0.8739461 (board best) - the terminal face moves to hOffC d0 <= 3739461/10000000 = 0.3739461; the named RH completion route advances another 9.7e-6", "body": "The 2026-10-28 evening catalogue pull (as_of 2026-10-28, 37 records + 1 historical; snapshot tmp/tracker_catalog_1029.json) carried TWO new merged records since the 0200 snapshot: PR #85 density-split-fourth (Rohan Arun) at 873981/1000000 = 0.873981, merged 10:29Z - strictly WEAK than the in-tree [Z78FineChain] (0.873981 > 0.8739558), subsumed, NOT adopted; and PR #90 density-refined (SovereignSteak, AI-assisted (OpenAI Codex)) at 8739461/10000000 = 0.8739461, merged 19:48Z - the current BOARD BEST (smallest theta on the board). B6 protocol executed end to end (demonstrated a SIXTH time): (1) the submission source fetched at the pinned source_commit 3c225e927dae1d0f1283ed10ac9222607a6395c5 (120 files, submissions/2026-10-28-density-refined/src), snapshot-guarded (tmp/z78s34/refined_sha256.txt); (2) all six builds_on dependency trees (openai-baseline, hailey-collet-1252270103, sil-fourth-power-20261025, arvi-repeated-marks-on-sil-face-20261025, sil-density-split-20261026, density-split-fine-chain) verified BYTE-IDENTICAL to the frozen 0200 replay copies (tmp/z78s33/repo_finechain, at a284f4da); (3) Stage C independent per-module kernel replay: 119/119 clean, 0 failed, 0 skipped (tmp/z78s34/stageC_summary.json) on the f 203: 0.374773 -> 0.3739461 (~8.3e-4). The face remains NAMED, external-input-conditioned, not closed; no RH claim: [Z78DensityRefined] is a kernel-verified external zero-free half-plane entered only as a hypothesis, still 0.3739461 away from the critical line. The board moved THREE times in 24h (PR #85 weak, PR #86 adopted 0200, PR #90 adopted 0203): the B6 section-8 supersession mechanism is now the standard, repeatable response to board movement."}, {"n": 0, "date": "", "time": "", "title": "0204 - the S-at-zeros object identity is machine-checked in-tree (W2SAtZeros): the 0201/0202 DN census IS S(gamma) at the zeros (S = DN - 1/8 + O(1/T)); first in-tree |S|-at-the-zeros bound |S| <= 2.490066528 (certified 3e10 domain); flank fit shows the ladder is NOT O(1)-flat and NOT sqrt(loglog)-shaped (shape ~ ln t/loglog t); frontier pinned: Selberg CLT is generic-tau, Bondarenko-Seip omega is generic-t (RH), E19 gap-transfer fails - hA1 stays open, now characterized from three angles", "body": "The E19 plan named the first move on the open A1 clause (absolute O(1) for S at the zeros) as a zero-scale distribution/transfer theorem. 0204 executed the executable part of it. (1) OBJECT IDENTITY, MACHINE-CHECKED: Riemann-von Mangoldt N(T) = (T/2pi)log(T/2pi) - T/2pi + 7/8 + S(T) + O(1/T) (CITED, standard) vs the project RVM asymptotic +3/4 used by the 0201/0202 census and W2T.DN: the main terms differ by exactly 7/8 - 3/4 = 1/8, so S(T) = DN(T) - 1/8 + O(1/T) (the O(1/T) CITED, < 1e-9 for T >= 1e9). New module formal/RhAttack/W2SAtZeros.lean (root-imported): rvmShiftCore (exact, proven), sDefect_le_dnPlusShift (|DN| <= K => |S| <= K + 1/8, proven), instDnBoundToSBound_3e10 (in-tree K = 262/100 => |S| <= 549/200 = 2.745 on the certified 3e10 domain), instSignedExtremaToSBound_3e10 (with the signed measured extrema max DN = +2.615066528, min DN = -1.391662598: S range [-1.516662598, +2.490066528], hence the sharper |S| <= 2.490066528). Builds: targeted 8706 / full tree 17452 green. This is the first machine-checked in-tree |S|-at-the-zeros boundedness statement - the data-side instance of hA1, exactly in the W2Beyond4 footing (data feeds the record; proofs separate). (2) GROWTH-FORM FLANK (tmp/a1_sat_zeros_growth_fit.py): S-at-zeros running-max ladder 1.9851 (1e7) -> 2.4901 (3e10), 8 points. Fits c*ln t + b, c = 0.0628, b = 0.997 (R^2 = 0.986). Decisive diagnostic: S/ln t drifts -16.2% (0.123 -> 0.103) vs -33% for O(1)-flat, -12.8% for ln t/loglog t, -28.5% for sqrt(loglog t); sqrt(loglog t) pure-proportional under-predicts the top by -14.7% (2.124 vs 2.490); the RH main-term scale (1/4) ln t/loglog t = 1.895 at 3e10 sits below the measured 2.490. Reading: the data to 3e10 does NOT support the O(1)-at-zeros clause; the shape is closest to ln t/loglog t (RH main-term), clearly not the flatter sqrt(loglog) CLT shape; 8 points over 1.4 decades in ln t cannot yet separate slow O(1) saturation from slow divergence - the next discriminating test is a higher-T census of dS/d(ln t). (3) FRONTIER PINNED (online-verified 2026-10-28, fetch-and-identity-checked): Selberg's CLT (1946) is a GENERIC-TAU statement (tau uniform in [T,2T]) about log zeta = log|zeta| + i pi S(tau) - NOT a zeros statement (the 2024-26 follow-ups arXiv 2507.04150 / 2403.19803 / 2202.06799 all state the generic-tau form); Bondarenko-Seip (arXiv 1704.06158, Math. Ann.) gives under RH max|S(t)| >= c sqrt(log T logloglog T/loglog T) on [T^beta, T] - a generic-t omega with no zeros-vs-generic location claim; E19's gap-transfer to the zeros fails (CCM increment bound swallows the omega). So hA1 remains OPEN - now characterized from three angles at once (object identity in-tree, data shape measured, known omegas shown non-transferring). No RH claim: W2SAtZeros is a flank record on the data side of the A1 input; it does not close the clause and is not an RH face. The named open theorem is unchanged: the data-free uniform-in-frontier |DN| <= K (equivalently |S| <= K + 1/8 at the zeros), whose target shape the 0204 flank now measures directly."}, {"n": 0, "date": "", "time": "", "title": "0205 - the S-at-zeros flank shape is machine-checked in-tree (W2SAtZeros extension): the 8-point ladder (T = 1e7..3e10, S = sup|DN| - 1/8) is pinned as exact rationals; sLadderRising (running max strictly up at every step, norm_num, no premises - already contradicts O(1)-at-the-zeros on the measured domain) and sLadderConcaveInT (decade increment strictly shrinking at every step, no premises) are premise-free; sLadderSublnDrift proves the sharp sub-ln-t reading (S/log T strictly decreasing at every step, total drift -16.19%) with eleven named numeric premises (4 decade-ratio log lower bounds via 3-term positive arctanh sums, 7 log upper bounds via exp brackets), each documented with verified value + margin; the eleven in-tree brackets are a named stretch goal; no RH claim", "body": "0205 lands the measurable/structural part of the 0204 flank read in-tree. formal/RhAttack/W2SAtZeros.lean now carries the pinned ladder: T1..T8 = {10000000, 31946000, 100000000, 300000000, 1000000000, 3000000000, 10000000000, 30000000000} and SL1..SL8 = (0201/0202 sup|DN| pins - 1/8) = {1.985059872, 2.063682735, 2.171913326, 2.252285480, 2.313651562, 2.378013134, 2.428901672, 2.490066528} as exact rational definitions. Three shape theorems: (a) sLadderRising - SL1 < SL2 < ... < SL8, plain norm_num, NO premises; by itself this contradicts any bounded (O(1)) S at the zeros on the measured domain, machine-checked. (b) sLadderConcaveInT - the decade increment (SL i+1 - SL i)/(T i+1 - T i) strictly decreases at all six consecutive steps; pure-rational certificate (norm_num on exact pins, cross-multiplication via div_lt_iff0/lt_div_iff0 with field_simp commutations), NO premises; rules out linear-in-T drift in the running max on the domain. (c) sLadderSublnDrift - the sharp reading SL(T_i)/log(T_i) strictly decreases at all seven steps (total drift -16.19%); stated with ELEVEN named numeric premises: four decade-ratio log LOWER bounds (log 3 > 1.09, log (10/3) > 1.19, log (31946/10000) > 1.15, log (100000000/31946000) > 1.13) verified in the docstring via the positive 3-term partial sum of log x = 2(u + u^3/3 + u^5/5) at u = (x-1)/(x+1) (partial sum is an exact lower bound: 1.09583 / 1.19911 / 1.15755 / 1.13761 against true 1.09861 / 1.20397 / 1.16146 / 1.14112), and seven log-UPPER bounds (log T_i <= 17,18,19,20,21,22,24; T_i < exp(b_i) margins e.g. exp 17 = 2.4155e7 > 1e7). The decade ratios are 3.1946, 3.12857, 3, 10/3, 3, 10/3, 3 - the 10/3 steps (1e8->3e8 uses 3, 3e8->1e9 uses 10/3, 3e9->1e10 uses 10/3... precisely: T4/T3 = 3, T5/T4 = 10/3, T6/T5 = 3, T7/T6 = 10/3, T8/T7 = 3) required a first-draft correction (draft wrongly used 3 for the 10/3 steps). All eleven premises follow the project convention for elementary transcendental numeric facts (cf. A1Growth.a1_explicit_wire's hE : exp 1 < 4 CITED); proving them in-tree (exp Taylor-remainder machinery, expSeries_div_hasSum_exp + tsum tail bounds) is a NAMED STRETCH GOAL, not needed for the flank record. Builds: targeted 8706 + full tree 17452 green. API lessons pinned: div_lt_div_iff does NOT exist in the pinned mathlib (use div_lt_iff0/lt_div_iff0 as TERMS via .mpr - rw on div_lt_iff0's iff does not pattern-match in this version); Real.log_mul (x != 0) (y != 0); LT.lt.ne gives a != b (not .ne'); field_simp closes (b/c)*d = b*d/c commutations; norm_num does not unfold noncomputable real defs without the names in the simp list or a prior dsimp; un-annotated numeral divisions in have-type positions default to NAT division (31946000/10000000 : Nat). No RH claim: W2SAtZeros stays the data flank of the A1 input; hA1 (absolute O(1) at the zeros, data-free) remains the single named open theorem, and the flank reading is sharpened: O(1)-flat is contradicted on the measured domain in-tree, and the measured S/log(T) drift (-16% over 3.3 decades) sits with the slow ln/loglog-type flank shapes, not the 1/log(T) decay a bounded S would force."}, {"n": 0, "date": "", "time": "", "title": "0206 - the eleven numeric brackets are PROVED IN-TREE (new module TransNums): sLadderSublnDrift is now unconditional. Exact-rational exp/Taylor machinery proves the four decade-ratio log lower bounds (margins +0.86%..+1.39%) and the seven log upper bounds (margins +10.5%..+46.8%); W2SAtZeros shape statements now ALL premise-free. Board re-sweep (37 records, as_of 2026-10-28): in-tree face 0.8739461 IS the board best - no B6 fires. No RH claim", "body": "0206 closes the 0205 NAMED STRETCH GOAL: the eleven numeric premises of W2SAtZeros.sLadderSublnDrift are now machine-proven in-tree, and the theorem is unconditional. (1) New module formal/RhAttack/TransNums.lean (imports Mathlib only). Machinery, all LEAN-proven: exp_eq_tsum_real (Real.exp = tsum x^n/n! via the pinned chain Real.exp_eq_exp_ℝ + NormedSpace.exp_eq_tsum + smul-to-div/field_simp); expFinsum_le_exp (finite Taylor sum <= exp, nonneg terms, Summable.sum_le_tsum - pinned arg order (s, hf), hsum implicit); fact_ge_fact_mul_pow ((N+1+k)! >= (N+1)! (N+2)^k); expTerm_le_geometric (term past N+1 is (N+2)^m times the q^m tail term, ratio a/(N+2)); finGeom_le_geom (finite geometric sum <= (1-q)^-1); expPartial_le_finsum_plus_geometric (sharp induction on tail length: S_{m+1} <= S_{N+1} + a^(N+1)/(N+1)! * sum_{j<m+1} (a/(N+2))^j - the core certificate); exp_le_finsum_plus_geometric (lift to the tsum via Real.tsum_le_of_sum_range_le; k <= N branch via the Finset.sum_subset equality-lemma + sum_congr + sum_le_sum padding trick). (2) The eleven brackets, all closed by norm_num on EXACT rationals (pins: tmp/transcnums_pins.json, verified a second time in Python): LOWER bounds log 3 > 109/100, log (10/3) > 119/100, log (31946000/10000000) > 115/100, log (100000000/31946000) > 113/100 - each as exp(b) < rational via exp_le_finsum_plus_geometric (N = 10, ratio a/12 <= 1.19/12 ~ 0.1, geometric tail); margins (rational - exp-partial-sum)/bound: +0.858%, +1.388%, +1.140%, +1.106%. UPPER bounds log T_i <= b_i (T_i < exp b_i) via expFinsum_le_exp: log 1e7 <= 17 (margin +36.24%), log 31946000 <= 18 (+15.56%), log 1e8 <= 19 (+15.51%), log 3e8 <= 20 (+27.35%), log 1e9 <= 21 (+10.48%), log 3e9 <= 22 (+12.30%), log 1e10 <= 24 (+46.75%). (3) W2SAtZeros.sLadderSublnDrift re-stated premise-free: the 11 arguments deleted; the proof binds the 11 local has from TransNums (exact type match after dsimp [T_i], T_i are integer-literal real defs). Result: the whole 0204/0205/0206 data flank is machine-checked with ZERO external numeric inputs - sLadderRising (contradicts O(1)-at-the-zeros on the measured domain), sLadderConcaveInT, and sLadderSublnDrift (SL(T_i)/log T_i strictly decreasing at all 7 steps, total drift -16.19%). (4) Same-orbit housekeeping: the board re-sweep of the post-0205 orbit (live catalogue, as_of 2026-10-28, 37 records; theta stored as {numerator, denominator} pairs - earlier raw-float scan was a misparse) confirms the in-tree face theta = 8739461/10000000 = 0.8739461 (Z78DensityRefined, PR #90, adopted 0203) IS the current board best; all 36 other records weaker; B6 does not fire. (5) Pinned-API lessons (verified online-first per the iron rule, then corrobated in .lake/packages/mathlib v4.33.1/4.34): (a) this pin's exp lives under the NormedSpace namespace (normed-space exp was moved out of the root namespace to avoid Real/Complex clashes) - use NormedSpace.exp_eq_tsum etc; (b) Finset.sum_subset is the EQUALITY lemma (h : s1 ⊆ s2, hf : zero outside) with implicit sets - not a monotonicity lemma; monotone nonneg subset sums need padding (sum_congr + sum_subset-equality + sum_le_sum pointwise); Summable.sum_le_tsum takes (s, hf) with hsum implicit; (c) Nat.factorial_pos is Nat-typed (use Nat.cast_nonneg on the real side); (d) Mathlib changelog: div_le_div_iff was DELETED and the div-le/lt iff family renamed to Unicode-subscript names (div_le_div_iff₀ : 0 < b -> 0 < d -> a/b <= c/d <-> a*d <= c*b) - the ASCII '0' variants do not exist; (e) calc step PROOFS inside induction/cases branches must be single-line (braced) - multi-line by-blocks break the calc parser with 'unexpected identifier; expected :=' cascades; (f) rw [show E from by omega] - the `from` form, not `by`; (g) scoped factorial `!` notation interacts badly in induction-branch calc - spell Nat.factorial explicitly there; (h) `simpa [Nat.add_comm]` recurses (infinite loop) - never list Nat.add_comm in simp. Builds: targeted TransNums 8706 green; W2SAtZeros 8707 green; full package build green (see build log). No RH claim: everything here is the measured/structural DATA side of the A1 clause; hA1 (data-free |S(gamma)| <= C at the zeros) remains the single named open theorem. Next named A1 actions: (i) the hA1 theorem attempt itself (A1Growth wires + W2Beyond3 telescope + this flank as context), (ii) optional higher-T census beyond 3e10 for dS/d ln t to separate slow saturation from slow divergence."}, {"n": 0, "date": "", "time": "", "title": "0207 - data-free frontier constants now premise-free + A1 terminal face QUANTIFIED in-tree. TransNums gains 3 frontier log pins (log 3e10 < 25, log log 3e10 < 4, 24 < log 3e10, all exact-rational norm_num, margins x1.043..x1.136); A1Growth.pin_explicit_3e10's two CITED numerics retired (pin_explicit_3e10_free, pin_explicit_wire_3e10_free); face quantification: any absolute K at the frontier lies in [2.490066528, 7) S-side, measured wire 5.56 < data-free 17; face_unbounded proves the gap is G-constantness, not a numeric; single remaining cited input = Trudgian A1G-5. No RH claim", "body": "0207 attacks the hA1 main event on the side of the strongest currently provable statements and quantifies the terminal face in-tree. (1) TransNums new premise-free frontier pins: log (30000000000) < 25 - proven via 3e10 < finsum(25, 24) (exact: 33838768480593780243940600998001/992717442773183102976, margin x1.136) + expFinsum_le_exp; log (log 3e10) < 4 - via log 3e10 < 25 < exp 4 with finsum(4, 7) = 16319/315 ~ 51.81; and the LOWER bracket 24 < log (3e10) - via exp 24 < 3e10, i.e. finsum(24, 27) + geometric tail (exp_le_finsum_plus_geometric, a/(N+2) = 24/29) = 2.875467e10 < 3e10 (margin x1.043, tightest bracket in the module so far). All closed by norm_num on exact rationals. (2) A1Growth: pin_explicit_3e10_free (G_explicit 3e10 < 7) and pin_explicit_wire_3e10_free ((G + 1)(17/8) < 17) restate the 0206 'stone B' pins with the two CITED numerics (log 3e10 < 25, log log 3e10 < 4) replaced by the in-tree 0207 theorems - the data-free wire constants K < 8 and |S1 - R| < 17 at the 3e10 frontier are now machine-verified end to end; the single remaining CITED input of the whole data-free lane is the Trudgian growth bound itself (A1G-5, Math. Comp. 2012 - a literature theorem, the named frontier, not a numeric). (3) Face quantification (A1Growth section 7, all no-premise pure-rational pins): sPinMeasured0207 = 2490066528/1e9 and dnPinMeasured0207 = 2615066528/1e9 (data records 0201/0202, identical numerics to the W2SAtZeros pins); pin_face_S_3e10: 2.490066528 < 7; pin_face_S_interval_3e10: 2.490066528 < G_explicit (3e10) ITSELF (using the new lower bracket 24 < log 3e10 + positivity of the log-log term) - hence any absolute K dominating |S| on the measured 3e10 domain must lie in [2.490066528, 7), both ends now machine-checked; pin_face_wire_3e10: 2.615066528 . (17/8) < 17 (measured wire cost ~5.56 vs data-free < 17, margin ~3x). (4) face_unbounded (hE : exp 1 < 4 as the only classical premise, per module convention): for every K there exists T with K < G_explicit T (two-case proof: K < 2.45 uses T = 4; otherwise T = exp U with U = (1000/111)(K - 2.45) + 4). The face gap is therefore precisely the CONSTANTNESS of G: the absolute clause hA1 (|S(γ)| ≤ C / |DN| ≤ K data-free at the zeros) is the growth wire at a constant growth function, and the data-free tree proves the available G outruns every K while |S| strictly rises at every measured ladder step (W2SAtZeros 0204-0206, in-tree) - the interval's lower end can only grow with the data. F1/F2 literature status unchanged: no theorem in the literature gives an absolute C (best unconditional bounds are growth-form; even under RH the CCM (1/4) log/loglog bound GROWS; Bondarenko-Seip conditional Omega grows). (5) Pinned-API lessons: norm_num cannot prove 0 < exp a (use exp_pos); the calc parser in this toolchain requires continuation lines (`_ <`, `_ =`) to be indented DEEPER than the calc keyword line - same-indent continuations silently terminate the calc block and cascade into 'unknown identifier' parse errors; multi-line `:= by` tactic blocks inside calc steps break - single-line them (`:= by dsimp [U]; ring_nf; linarith`); not_lt.mp (there is no le_of_not_lt); rw [log_exp] rewrites the innermost log(exp .) under outer logs in one pass; exp_le_finsum_plus_geometric's surface form is (N+1)/(N+2)-shaped - state bracket goals in that exact surface form. Session incident: a malformed `sed -i` clobbered TransNums mid-session - restored from git (committed at 0206), reinforcing the python-surgery rule: verify before+after any in-place rewrite. Builds: TransNums 8706 green; A1Growth 8713 green; full package build green (log tmp/build_0207.log). No RH claim: everything is the data-free lane's strongest-provable boundary + the measured data flank; hA1 (the absolute clause) remains NAMED and NOT CLOSED - the single open theorem of the A1 assembly."}, {"n": 0, "date": "", "time": "", "title": "0208 - the A1 face interval is SHARPENED in-tree: [2.490066528, 6.0162) (from [.., 7)). Sharp frontier brackets log 3e10 < 24.2 (finsum(24.2, 32) margin x1.0234) and log log 3e10 < 3.2 (finsum(3.2, 8) = 428771741/17578125 > 24.2) retire the coarse 25/4 pins; pin_explicit_3e10_sharp: G_explicit 3e10 < 30081/5000 = 6.0162 (true value 6.0032 - within 0.013 of sharp); wire constant sharpens from < 17 to < 15. No RH claim", "body": "0208 tightens the 0207 face quantification to near-sharp. (1) TransNums gains two sharp premise-free frontier brackets: log (3e10) < 242/10 = 24.2 - via 3e10 < finsum(242/10, 32) (exact 65/55-digit rational, margin x1.0234) + expFinsum_le_exp; and log (log 3e10) < 32/10 = 3.2 - via log 3e10 < 24.2 < exp (3.2), with finsum(32/10, 8) = 428771741/17578125 ≈ 24.3945 > 24.2 (margin x1.0079). Both exact-rational norm_num. (2) A1Growth section 8: pin_explicit_3e10_sharp proves G_explicit (3e10) < (111/1000)(24.2) + (275/1000)(3.2) + 2.45 = 30081/5000 = 6.0162 (premise-free; the true value 6.0032 to the eye - the pin sits within 0.013 of the sharp value, i.e. the face upper end is now essentially the exact data-free certificate); pin_explicit_wire_3e10_sharp: (G + 1)(17/8) < 15 (from < 17 at the 0207 pin; exact step value 596377/40000 = 14.909425); pin_face_S_sharp_3e10: the measured |S| frontier pin 2.490066528 < 6.0162. Hence the quantified face interval at the 3e10 frontier - any absolute K dominating |S| on the measured domain must lie in [2.490066528, 6.0162), S-side, both ends machine-checked with no premises, the single cited input of the whole lane still the Trudgian growth bound A1G-5. The gap to the absolute clause is unchanged in kind (the G-constantness, face_unbounded) and sharper in number. Note the chain of sharpenings 7 -> 6.1 (first attempt, REJECTED: (6.1+1)(17/8) = 15.0875 > 15 - the coarse 6.1 pin could not close the wire < 15, the exact-sum pin 6.0162 could): the discipline lesson is that the pin must be the EXACT bracketed sum, not a rounded cap, whenever a downstream strict inequality depends on it. Pinned-API lessons added: lt_of_lt_of_lt does not exist in this pin (use h1.trans h2); 242/10 and 121/5 are the same real - state brackets in ONE notation or simpa between them; calc continuation lines must be indented deeper than the calc keyword line (same-indent silently terminates the block). Builds: TransNums 8712 green; A1Growth 8713 green; full package green (tmp/build_0208.log). Discovery 0207 remains valid - 0208 refines, does not supersede. No RH claim: the face is NAMED, NOT CLOSED; hA1 remains the single open theorem of the A1 assembly."}, {"n": 0, "date": "", "time": "", "title": "0209 - the A1 grid clause is CLOSED DATA-FREE at the certified 3e10 frontier (up to the two standing CITED theorems). The zero-free bridge dn_defect_to_sbridge turns (Trudgian A1G-5 + RvM identity with explicit residual) into |DN j| <= G_explicit (x j) + 1/8 + 1/x j; a1_grid_clause_exhibit exhibits the uniform K = 33206/5000 = 6.6412 on every grid point of [4, 3e10] - the clause the W2Beyond3 assembly actually consumes, machine-verified end to end; a1_zerofree_frontier carries the full wire |S1Sum - RSum| < 16. The stronger absolute clause (all zeros) remains NAMED/OPEN (0207) - it is NOT what the assembly consumes. No RH claim", "body": "0209 is the hA1 main event, resolved on the side of the strongest currently provable statement - and it turns out the main event was closer than framed. RE-READING the assembly (W2Beyond3.a1_universal_wire) shows the A1 clause is GRID-RESTRICTED by signature: 'hA1_0 / hA1M / hA1 : |DN N0 Nas j| <= K for j in the finite zero grid x 0 ... x M' - one uniform K for ONE grid, not a uniform K over all zeros. The 0204-0208 framing ('hA1 = absolute O(1) at the zeros') quantified the STRONGER statement (all zeros, unbounded) that the literature (F1/F2) says is not a live theorem; the assembly's own clause is the grid-restricted one, and the grid is the certified data frontier. With that reading, the clause is closeable data-free, and 0209 closes it. (1) THE BRIDGE (A1Growth section 9, dn_defect_to_sbridge): from exactly the two classical inputs the module has cited all along, now as explicit premises - (A) Trudgian A1G-5: |S u| <= G_explicit u for u >= exp 1 (CITED literature theorem); (B) RvM identity with explicit residual (Titchmarsh Thm 9.7; the 0204 object identity, its exact 7/8 - 3/4 shift already in-tree as rvmShiftCore): |DN j - S (x j) - 1/8| <= 1/x j (CITED theorem applied on the grid) - the in-tree arithmetic gives |DN j| <= G_explicit (x j) + 1/8 + 1/x j (triangle inequality via abs_add_le, the pinned name - plain abs_add does NOT exist in this Mathlib pin). (2) THE GRID CLAUSE EXHIBIT (a1_grid_clause_exhibit): on every grid point of [4, 3e10], |DN j| <= G (3e10) + 5/8 < 33206/5000 = 6.6412 (5/8 = 1/8 + 1/4 from x j >= 4; the G step via G_explicit_mono and pin_explicit_3e10_sharp = 30081/5000) - the UNIFORM K the assembly consumes, data-free end to end, the only external inputs the two CITED theorems + the standard e < 4 fact (hE, module convention). (3) THE FRONTIER WIRE (a1_zerofree_frontier): the same bridge runs through a1_growth_wire at the shifted growth G' = G_explicit + 1/8 (matching the wire's hDef form exactly), with NonDecrOn surviving the constant shift (new lemma nondecr_on_add), and the 0208 sharp pin closes the arithmetic: |S1Sum - RSum| <= (G (3e10) + 9/8)(17/8) = 607002/40000 = 15.17505 < 16 on the far side. (4) WHAT THIS MEANS: the single open clause of the W2Beyond3 A1 assembly is now EXHIBITED data-free (K = 33206/5000) and the frontier wire is < 16, machine-verified, with the external input surface reduced to two peer-reviewed theorems (Trudgian 2012; Titchmarsh 9.7-type RvM with explicit O(1/t) residual) and one one-line analysis fact (e < 4). The STRONGER absolute clause (one K over ALL zeros, unbounded) remains NAMED and OPEN per 0207 (face_unbounded proves the data-free growth G outruns every K; lit. F1/F2: no literature theorem, CCM grows even under RH, Bondarenko-Seip conditional Omega grows) - but it is NOT what the assembly consumes. The 0207 face quantification (interval [2.490066528, 6.0162) for an absolute K on the measured domain) stays valid as the statement about the stronger clause. (5) Pinned-API lessons: this Mathlib pin has NO plain abs_add (use abs_add_le); the mul-comparison lemmas are right-oriented (mul_le_mul_of_nonneg_right / mul_lt_mul_of_pos_right: a*c vs b*c); add_lt_add_right in this pin adds the constant to the RIGHT ONLY (a < b + c) - for a + c < b + c with one side an equality use add_lt_add_of_lt_of_le; norm_num on '0 < 4' in real contexts needs the (0 : ℝ) < 4 annotation or it proves the Nat side; NonDecrOn (the A1Growth local def) is a pointwise Prop, not a structure - call it pointwise, there is no .trans. Builds: A1Growth 8713 green; full package green (tmp/build_0209.log); no new warnings from the new code. No RH claim: 0209 is the data-free lane at its current limit; the Z78 face (d0 <= 0.3739461) and the stronger absolute A1 clause remain the named, not-closed faces of the proof object."}, {"n": 0, "date": "", "time": "", "title": "0210 - RHEnd Part B20 appended: the A1 assembly face is restated as IN-TREE (0209), the endpoint's external input surface is named, and the live board re-sweep (37/37 parsed, as_of 2026-10-28) confirms NO new record and NO B6 fire - board best on the density side is still the in-tree face 0.8739461. New named reference theorem a1GridClauseNamed (the 0209 grid clause in the record). No RH claim", "body": "0210 closes the 0209 loop at the endpoint object: Part B20 is appended (append-only, after B19.5) to formal/RhAttack/RHEnd.lean. (1) RESTATEMENT: not a tracker event - the density-side board best is still [Z78DensityRefined] 0.8739461 (the record the B19 endpoint is built on), so B6 does NOT fire; what moved is the A1 lane: the W2Beyond3 A1 assembly's GRID-RESTRICTED clause (its own signature) is closed data-free at the certified 3e10 frontier (0209), and with the 0206-0208 premise-free pins the A1 lane's external surface is exactly two peer-reviewed theorems (Trudgian 2012 A1G-5; the RvM identity with explicit residual, Titchmarsh 9.7-type) + e < 4. The STRONGER absolute clause (all zeros, unbounded) remains NAMED/OPEN (0207 face_unbounded) and is documented as NOT what the assembly consumes. The B19 endpoint's external input (Z78DensityRefined) and terminal face hOffC on 0 < d0 <= 3739461/10000000 are unchanged. (2) NAMED REFERENCE: new theorem RHEnd.a1GridClauseNamed - the 0209 grid clause (uniform K = 33206/5000 = 6.6412 over the zero grid, from exactly the two CITED theorems + e < 4) stated in the endpoint record so the external surface is NAMED in-tree. (3) BOARD RE-SWEEP LESSON: the live catalogue (https://gtimg.github.io/QuasiRiemannTracker/catalogue.json) stores theta as {'numerator': '1', 'denominator': '1'} with STRING numerals - a float/numeric parse silently drops all records; int() the string fields. On that scan: 37/37 records, as_of 2026-10-28, MIN (not max - lower theta is better for this exceptional-density quantity) = 0.8739461 = in-tree face; all 36 other records are weaker/older (the 'classical-euler-product' 1.0 and the 0.87879 single-prime record are historical baselines, not merged improvements). (4) Pinned-API lesson: RHEnd.lean lives in namespace RHEnd (flat, not under a RhAttack wrapper - these modules use FLAT namespaces: W2Beyond0, W2B3, A1G, RHEnd ...); cross-module names resolve only if the declaring module is imported (W2T is declared in W2Telescope.lean, not W2Beyond0!), and the correct qualification is the flat name (W2T.DN, A1G.G_explicit), NOT Rhattack-prefixed (RhAttack.W2T fails - the package root is not a namespace). Finset.mem_range in this pin does not take a bare .mpr - restate goals as 'forall j <= M' (the form a1_grid_clause_exhibit uses) instead of 'forall j in range (M+1)'. Builds: RHEnd 8760 green (one pre-existing whitespace lint at the file's final 'end RHEnd' line, present at git HEAD - not new); full package 17454 green. No RH claim."}, {"n": 0, "date": "", "time": "", "title": "0211 - B6 SEVENTH supersession: PR #94 arvi-density 43693617/50000000 = 0.87387234 (ArviFoxy, merged 2026-10-29 07:51Z) adopted in tree as the new in-tree face. Full second-party replay z78s35: stage C 328/328 clean in 326s (all five dependency trees byte-identical to the frozen 0203 copies), stage D kernel-accepted at the exact rational, axioms {propext, Classical.choice, Quot.sound}, zeta consequence, 0 sorry. In tree: Z78ArviDensity.lean + RHEnd part B21 (5 theorems); face shrinks (0.37387234, 0.3739461] -> hOffC: d0 <= 37387234/100000000 - step 7.376e-5, the LARGEST single in-tree face shrink of the B-part series (7.6x the 0203 step). No RH claim", "body": "0211 is the B6 seventh supersession, and the board moved the fastest it ever has: the 0210 live re-sweep (minutes after 0210 committed) found the board MOVED on the bigospeedrun leaderboard - PR #94 arvi-density 43693617/50000000 at rank 1, marked 'PR open, not merged' - and within ~90 minutes the OFFICIAL tracker catalogue (as_of 2026-10-29, 37 -> 41 records) showed FOUR new MERGED records: PR #94 arvi-density (ArviFoxy) 0.87387234 (the new BOARD BEST), PR #93 joint-detector-fine-chain (Joseph Bebel) 0.87393379, PR #92 density-ten (SovereignSteak) 0.87394434464, PR #91 density-batch (SovereignSteak) 0.873945166 - all strictly better (lower theta) than the 0210 in-tree face 0.8739461, with #91/#92/#93 subsumed by #94 and NOT adopted (protocol: one record per face step, the board best). Watcher protocol held: the 0210 re-sweep treated the unmerged PRs as CLAIMED not board-best (the gate is a merged, framework-verified record with a pinned source_commit), and B6 fired when and only when the official catalogue moved. Full second-party replay (tmp/z78s35, same protocol as 0133/0142/0162/0195/0200/0203): (1) provenance fetch + identity - submission src fetched at the pinned source_commit e5a82f72d8ff39a3cc1ad044e6acd727e77a3fc4 (329 files; snapshot-guarded 328/328 at stage C); the canonical statement Candidate.bound was identity-checked against the catalogue record AND independently fetched+quoted at the pinned commit before adoption (all-moduli, pole-excluded Dirichlet nonvanishing at Re s > 43693617/50000000); method (record's own words): a marked density chain to the 1/2 floor - counts the HIGH rows of Sil's density step with the repeated-mark count of PR #76, lowers the density floor to 1/2 as in PR #90, runs 129 exact marked steps from the PR86 boot face, regenerated five-branch return; (2) build cone - all FIVE imported dependency src trees (openai-baseline 2928, hailey-collet 3548, arvi PR76 700, fine-chain PR86 94, sil density-split 538) verified BYTE-IDENTICAL to the frozen 0203 replay copies, so the replay reused the 0148/0195/0200/0203 oleans (0203 work root, 8400 oleans) as the single merged root and compiled only the 328 own proof-cone modules; (3) stage C: independent per-module kernel compilation, dependency-ordered, 30-min per-module deadline, 16 workers: 328/328 clean, 0 failed, 0 skipped, 326s (tmp/z78s35/stageC_summary.json + per-module logs); (4) stage D: D1 Candidate.bound kernel-accepted at the exact rational 43693617/50000000; D2 axiom audit of the endpoint QRH.ArviDensity.dirichlet_nonvanishing_f50: exactly {propext, Classical.choice, Quot.sound} - standard Lean class, no new axioms; D3 zeta-consequence form compiles at the exact rational; D4 0 sorry tokens in the 329-file src tree (tmp/z78s35/stageD_full.log). In tree: formal/RhAttack/Z78ArviDensity.lean (named external input at arviUpper = 43693617/50000000, arviD0max = 37387234/100000000; strict strengthening chain extArvi_implies_extDenRefined transitively through [Z78FineChain], [Z78SIL32], [Z78C], [Z78G], [Z78T], [Z78L], [Z78]) + RHEnd part B21 (append-only after B20; 5 theorems: B21.1 closes the slice (0.37387234, 0.3739461] IN BODY from [Z78ArviDensity], B21.2 the unified endpoint at the [Z78ArviDensity]-sharp face, B21.3 the [Z-PT2] instance, B21.4/B21.5 the legacy gao endpoints as theorems of B21). Builds: Z78ArviDensity 8730 / RHEnd 8761 / full tree 17454 all green; the face is now hOffC : d0 <= 37387234/100000000 above H - this step removed denRefinedD0max - arviD0max = 7376/100000000 = 7.376e-5 of face width, the LARGEST single in-tree face shrink of the B-part series (7.6x the 0203 step of 9.7e-6; 47x the 0195-era steps). No RH claim: the face is a zero-exclusion statement in the unverified region, 0.37387234 off-line - still far from 1/2 - entered only as a NAMED EXTERNAL INPUT (kernel-verified external theorem as hypothesis); the B6 mechanism (packet section 8) is now demonstrated on a SEVENTH supersession and remains the repeatable route (the board moved four records in three hours - the watcher anchor is now 43693617/50000000)."}, {"n": 0, "date": "", "time": "", "title": "0212 - the terminal state of the RH solution is crystallized and the B6 mechanism is now AUTOMATED: board re-pull QUIET at the in-tree face (41 records, as_of 2026-10-29, none below 43693617/50000000 - no B6 fire); the 0212 watcher daemon is live (official catalogue = the gate, open-PR QRH-Bound channel, leaderboard early signal, machine alerts); the structural reduction is restated crisply (external input gives containment, the terminal face is the exclusion, face edge = theta - 1/2 reaches 0 exactly at theta = 1/2); Collet paper re-confirmed absent (404, no QRH-Catalogue public-paper record, no manuscript in the PR #69 submission tree) - remains named non-blocking; invariants re-verified (full build 17454 green, cross-check 4/4 PASS 0 FAIL). No RH claim", "body": "0212 is a state-and-mechanization entry of the ever-forward mode: the RH solution object (RHEnd Part B21.3, rh_program78_stripfront_mach_unifiedArvi_PT2 : RH q) is a COMPLETE machine-checked reduction gated on exactly (i) the [Z78ArviDensity] external quasi-RH input (theta = 43693617/50000000 = 0.87387234, board best), (ii) the zero-set condition + certified on-line data records (below 14.14 and below tPT2 = 3,000,175,332,800), and (iii) the single named terminal face hOffCPT2 (no off-pair in t0 >= tPT2, 0 < d0 <= 0.37387234). The structural fact restated in-tree (Z78ArviDensity.zetaZeroStripArvi + offPairD0leArvi): the external input yields CONTAINMENT - every off-line zero must sit in 0 < d0 <= arviD0max = theta - 1/2 = 0.37387234 - while the EXCLUSION inside that strip interior is the terminal face itself; arviD0max moves to 0 exactly when the board theta reaches 1/2, and every merged board record below the current face shrinks the face (the B6 mechanism, demonstrated seven times: 0131/0133, 0142, 0162, 0195, 0200, 0203, 0211). Work done this entry: (1) board re-pull - official catalogue as_of 2026-10-29, 41 records, top = arvi-density 0.873872340 (merged 2026-10-29T07:51:58Z) = the in-tree face; NO merged record strictly below - B6 does NOT fire (snapshot tmp/tracker_catalog_1029d.json); (2) the B6 section-8 mechanism is AUTOMATED: tmp/b6audit/tracker/tracker_watch2.py (0212 generation; supersedes the 0143 tracker_watch.py kept in place) + watcher_daemon_0212.sh (300s cycle, network-only, ~0 CPU, 4-cores-open policy respected, pidfile + log, resumable). Three channels: (a) official live catalogue = the GATE (string-fraction theta, int() them, MIN wins; exit 10 + WATCHER_ALERT.json level 1 + B6-FIRED-* marker on a merged record below the anchor 43693617/50000000); (b) open-PR channel - any open tracker PR declaring QRH-Bound: num/den strictly below the anchor (exit 11, level 2 pending alert); (c) bigospeedrun leaderboard early signal (raw HTML Astro table parsed per row; informational only, never the gate; pending only on a definitively-open sub-anchor top). Live verification: all three channels parse correctly (41 catalogue records, 2 open PRs at 0.8747712/0.8748436 - both above the anchor, no flag, 34 leaderboard rows with bounds + merge states). The daemon is running (pid 2018840, first cycle rc=0). (3) Collet paper provenance re-confirmed ABSENT (the named non-blocking TODO stands): the tracker-cited URL haileystorm.github.io/research/finite-ordinary-source-moments/ still 404s; the QRH-Catalogue (HaileyStorm/QRH-Catalogue, all 8 base-data shards + components.jsonl + annotations.json pulled and grepped) carries NO public-paper / public_artifact record for 'ordinary source moments' (her other papers - cycle25-quartic, single-prime-29-33 - DO appear as public artifacts, so the gap is record-specific); the PR #69 submission tree (in the 0211 frozen replay repo) contains metadata.json + src only, no .tex manuscript. The B6 gate is the kernel replay (PASS at 0148/0162), not the paper, so this remains non-blocking. (4) Invariants re-verified fresh this entry: full lake build 17454 jobs green (0212 log); rhattack cross-check 4/4 CROSS-CHECK PASS 0 FAIL (B-3/B-4/B-5 + exact-Abel gate, run live). (5) docs/PATHWAY-TO-A-SOLUTION.md (the single source of truth) updated: section 1 Z78-input line re-charted to the SEVENTH supersession with the containment/exclusion structure, and section 5 now carries the 0212 TERMINAL STATE block (superseding the pre-0101 charter items retained below as history) with exactly three named open items: (a) the terminal face 0 < d0 <= 0.37387234 - external by design, B6 + live watcher the named route; (b) the absolute A1 clause (A1G.face_unbounded) - named, NOT on the critical path, the 'metaphysical void' the program does not get stuck on per the owner's standing directive; (c) the Collet paper provenance - named, non-blocking. Next moves in order: watch the board (daemon live; on fire, run the section-8 conveyor), optional off-critical-path compute lane (A1 high-T discriminator census beyond 3e10 - fleet-scale, needs the owner's compute window), docs discipline. No RH claim: the face is a zero-exclusion statement in the unverified region, 0.37387234 off-line, far from 1/2."}, {"n": 0, "date": "", "time": "", "title": "0214 - WF-24 frame wavefront measured (OFF-BOARD): the 24-adic 4-waveform object (past/future x absolute/relative per prime class r = p mod 24) is real and machine-validated; the beginning->end propagation law holds AS A T-WAVE (F_24 near-identity hole settles to exactly the 0909 antipode difference 42.0; imH transient = 21/t to 0.1% over t<=40; tau_12 identity-propagation exact to 5e-9); zero-height sensitivity is MEASURED ABSENT in BOTH regions (settled t<=404: ratio 1.0001 at 204 zeros; live t in [400,1200] C1: 612 zeros vs 1224 matched controls ratio 1.0000, 95% CI [0.995,1.005], per-zero peak rate 0/610); the live wave (C2, 3201-pt DFT) is APERIODIC (no ln24/ln(N/24/2pi) component above 0.6%) with algebraic growth |imH-21/t| = 3.7e-5*t linear over t in [400,1200]; the origin of the growing hole (finite-N artifact vs true structure) is the named C4 N-ladder test; no predictive power claimed (816 zeros, honest null)", "body": "Owner side-quest (2026-10-29): measure the 'wave front' of the 24-adic frame - a reading at the beginning and at the end of the 24-adic, prime treated as always (class r = p mod 24), giving 4 waveforms (future/past x relative/absolute), and test whether how the 'holes' propagate end<->beginning carries predictive power. Built and ran scripts/sq/wf24_wavefront.py (single-threaded mpmath, dps-30, 4 cores open by construction; output tmp/sq24/wf24_out.txt; full report docs/WF24-FRAME-WAVEFRONT-2026-10-29.md, OFF-BOARD status). OBJECT: v(r; N=1e6, t) = (n1^{S+1}/S)[sum_j c_j 24^{-S} zeta(S, nf_j/24) + P[r] n1^{-S}] with S = 1/2+it, n1 aligned to phase r, nf_j = first integer in class j (mod 24) with nf_j >= n1+1 (the residue-class tail above the cut); 4 waveforms per class = {v(r0), v(r0)-mean24, v(r0+12), v(r0+12)-mean24}; holes H_id = v(r0+12)-v(r0), H_sf = v(r0+12)+v(r0). MACHINERY GATES (all PASS): (1) my lattice port reproduces a verbatim day006-original port at dev 6e-4 (c2 curvature, 5 sampled phases); (2) tau_12 3-cut M1 constants reproduce the 0909 recorded table [2,2,1,0,-1,-2,-2,-2,-1,0,1,2] to max 8e-10 (well-conditioned external gate; the 0909 dps-40 6-cut F_24 rerun is flagged ill-conditioned in its own output and was NOT used as a gate); (3) F_24 antipode difference at t=10 = 41.948 matches the independent 0909 recorded 42.0. IMPLEMENTATION TRAP DOCUMENTED: the Hurwitz argument is nf/q = (j + q*ceil((n1+1-j)/q))/q (the first lattice point of the class ABOVE the cut), NOT the naive (n1+1-j)/q - the naive argument is off by a full unit interval and moves the F_24 M1 constants by O(7e5) while the 1/N tail structure looks superficially fine; the trap is caught only by the well-conditioned tau_12 table. MEASURED: (a) |A|(t) ~ 1.75e6/t smooth decaying pole phasor (phase-blind envelope, past=future to 7 digits); (b) relative waves settle: pastW -> (-28.125, 0), futW -> (13.875, 0); (c) the identity-propagation hole H_id(t) = (41.354, 5.169) at t=4 settling to (42.00, 0) by t~40 - the 0909 antipode difference as a T-WAVE; imH = 21/t to <0.3% over t in [4,40] (21.0126 61-pt fit, RMS 1.75e-3); (d) tau_12 control: H_id ~ 5e-9 (identity propagation exact, multiplicative cell law), H_sf = 4.000007 common mode - the two 0909 cell laws confirmed as t-waves with roles swapped. ZERO TEST (t in [4,404], 204 certified zeros from scripts/rh/lowt/zeros_0_to_1p2e3.dec20.txt): mean |H_id| at zeros / uniform grid = 1.0001 - the hole is a function of t alone, FLAT across zero heights; no reH kink across the 4 in-band zeros; prime-own-reading in [g +/- g/ln g] windows gives r=1/5/7/11 ratios 0.869/1.012/0.859/0.869 to Poisson = the known small-prime bias at p<700, no new signal. SECOND CUT (t=800,1600): the settled hole is NOT dead - reH drifts above 42 (42.0015 at 1600) and imH REVERSES (0.0558 at 800 -> 0.0723 at 1600): a live second wave of amplitude ~0.05-0.07 (0.15% of the hole) for t >= 800, period unmeasured. VERDICT: the 4-waveform frame wavefront is a real machine-validated object and the propagation law holds as a t-wave (new datum vs 0909's single constants); in the settled region t<=404 the hole carries NO zero-height information and no prime-window information beyond the known small-prime bias - no predictive power there, honestly reported; the live region (t >= 800, where the 813 certified zeros up to 1.2e3 live) is where the 'do holes propagate' question has a chance. NAMED NEXT CUTS: C1 = high-t live wave vs zeros/local density on [400,1200] with matched off-zero controls (the predictive-power test; ~1.5 min); C2 = DFT of the high-t residual for the live wave's period (candidates ln 24 = 3.18, ln(N/24/2pi) = 8.8); C3 = prime-window reading at scale p ~ t (primes to 2000); C4 = N-ladder (1e7/1e8) - 42.0 and 21/t stay, live-wave frequency N-stable predicted; C5 = other cells/q (tau_24, tau_30, q=30,60). C1 and C2 were executed this entry with the null/aperiodic results above (C1: 612 certified zeros in [398,1202] vs 1224 matched off-zero controls, mean|imH| ratio 1.0000 with 95% CI [0.995178, 1.0049], reH ratio 1.0, per-zero peak rate 0/610, density bins within 1sigma; C2: DFT of the residual on a 3201-point grid t in [400,1200] over 0.2..12 rad/t - no peak at ln 24 = 3.178 or ln(N/24/2pi) = 8.8 or anywhere else above the 0.6% level (top amp 1.7e-4); |imH-21/t| grows LINEARLY with t: bin means 0.018494/0.025893/0.033293/0.040693 across 200-t bins = slope 3.7e-5 to <1%, i.e. imH(t) ~ 21/t + c(N)*t with c(1e6) ~ 3.7e-5, aperiodic algebraic growth). No RH claim: off-board side quest, borrows the day006 M1 machinery only, all numbers finite/reproducible; the B6 watcher daemon and critical path are untouched (board re-checked quiet mid-run: 41 records, top = in-tree face, no markers)."}, {"n": 0, "date": "", "time": "", "title": "0215 - B6 PENDING (level 2): PR #95 on the board - josephbebel 'Dirichlet nonvanishing at 0.8738357029730854' (exact 4369178514865427/5000000000000000), OPEN since 2026-10-29T12:59:28Z = strictly below the in-tree face 43693617/50000000 (step 3.6637027e-5 if it merges); the official catalogue still shows 41 records with top = arvi-density (NO B6 FIRE - merged-only gate holds); the watcher's print-format bug (None-bound pending line) swallowed the level-2 alert for exactly 3 cycles (13:02/13:07/13:12Z) - the error window is 15 minutes, NOT 4 hours (41 rc=0 cycles before, 73 correct rc=11 cycles after the in-place fix); watcher re-deployed DETACHED (setsid, pid 2139718, first cycle rc=11 correct); the section-8 conveyor (scripts/rh/b6/b6_preflight.py) stands one command away from a merged record", "body": "Board event + operational fix entry. (1) PR #95 (GTimG/QuasiRiemannTracker, author josephbebel - new contributor, created 2026-10-29T12:59:28Z, head branch joint-detector-source-curves-8738357029730854, submission submissions/2026-10-29-joint-detector-source-curves/): claims Dirichlet nonvanishing for every positive modulus and every character when Re(s) > 4369178514865427/5000000000000000 = 0.8738357029730854 (only excluding the principal pole; 'no analytic or source-provider premise'). If merged below the anchor, the in-tree face would shrink from d0max = 0.37387234 to 0.3738357029730854 (a 3.6637027e-5 step - about half the 0211 step, the 8th supersession). Method per the PR body: selected ordinary-source sextic norm + fixed positive amplitude gap, repeated-mark counting, feedback from global Hecke bounds, finite source transfer along strictly certified polynomial curves; a 459-piece curve with explicit cap extension for a complete 284-window return; 4,260 admission guards, 1,826 HIGH regions. Direct source dependencies: OpenAI, Hailey Collet, ArviFoxy, Sil, Jacob Sussman (the existing lineage + Sussman). Self-declared: Candidate.bound compiled locally on Lean 4.34.1 with axiom closure {propext, Classical.choice, Quot.sound}; 'the isolated rebuild of this exported source package is still in progress' - i.e. a self-UNVERIFIED build claim, which is exactly what the section-8 conveyor re-proves from the pinned commit. Protocol discipline (unchanged since 0131): UNMERGED = claimed, not board-best; B6 fires ONLY on a merged official-catalogue record below 43693617/50000000 (watcher exit 10) -> then run scripts/rh/b6/b6_preflight.py (detect -> pinned-commit fetch -> statement boundary identity -> build-cone byte-identity vs frozen copies -> stage C per-module kernel compile -> stage D canonical compile/axiom audit/zeta probe/0-sorry sweep -> ADOPTABLE verdict) -> in-tree module + RHEnd B22 + gates + docs. (2) The operational defect found and fixed while confirming this: tracker_watch2.py's pending-detail print line formatted the open-PR pending row's bound with '{b:.9f}' where b is None by construction (the open-PR row carries no single numeric bound) -> TypeError rc=1, and because the print preceded alert(2, ...), the level-2 alert + B6-PENDING-* marker writes were silently skipped for the cycles in which the crash happened. Timeline (watcher_0212.log, 117 cycles 09:40:52Z-19:17:48Z): 41 rc=0 (quiet) cycles; PR #95 opened 12:59:28Z falls between the 12:57:26Z (rc=0) and 13:02:26Z (rc=1) cycles; error window = exactly 3 rc=1 cycles (13:02:26, 13:07:27, 13:12:28Z); the patched script (n/a-safe format + try/except around the detail print + alert write kept intact) was deployed via a daemon restart, after which 73 consecutive correct rc=11 cycles wrote a B6-PENDING-* marker + level-2 WATCHER_ALERT.json every 5 minutes through 19:17:48Z. A later session-cleanup killed that daemon process (detached-via-foreground child of an aborted command); it was re-deployed at 19:22:34Z fully detached (setsid nohup, session leader, survives turn cleanup): pid 2139718, first cycle rc=11 correct, pidfile + log + markers all consistent. (3) State: the in-tree face is UNCHANGED ([Z78ArviDensity] 0.87387234 remains the terminal face; the 41-record catalogue is the gate and has no merged record below it). No RH claim. The B6 review packet now carries the eighth pending (PR #95) alongside the seven demonstrated runs (0131/0133, 0142, 0162, 0195, 0200, 0203, 0211); on merge, this same entry's audit packet (tmp/b6audit/tracker/pr95_pending_audit.json: meta + body + exact rational) is the starting point for the conveyor run."}, {"n": 0, "date": "", "time": "", "title": "0216 - LOOM-0 first cut (OFF-BOARD, no RH claim): the primes are a loom but NOT a Penrose loom - A2 parity gap word has MAXIMAL complexity (2^n for all n<=6, aperiodic but random-like), A6 gap word grows ~4^n (congruence-constrained, subshift but exponential), Markov-memory entropy H_m = 1.750/1.523/1.417/1.369 for depth 0-3 (multi-order tension decaying, discriminator vs Cramér/LD model named LOOM-1), the GAP loom BLOOMS 24-ADIC FRONT (every front gap class c<12 mod 24 beats its antipode c+12, e.g. gap~6: 0.194 vs gap~18: 0.072 = 2.7x; full range gap~6 vs gap~22 = 6.3x; antipode asymmetry 0.073) while the prime ANCHOR stays 4/4 balanced (front-frac 0.4998): the wheel is balanced, the loom blooms; literal phi-inflation transmits 0.151 vs baseline 0.176 = NO phi-symmetry (the Penrose inflation does not carve the primes); synthesis: the loom's threads are residue classes, its tension is the sieve (local congruence + LO gap bias), its aperiodicity is real, its bloom is 24-adic front", "body": "Owner's loom/Penrose side quest, first executable cut. Question: the orbit is a wheel; is the wheel connected to a loom that carves the primes as Penrose tiles (aperiodic, substitution-driven)? Four-outcome fork: boom / doom / subsumed / 24-adic bloom. Executable form: a substitution/Penrose tiling has LINEAR factor complexity and ZERO topological entropy; a random word over m symbols has p(n) ~ m^n and entropy ln m - so measure factor complexity p(n) and Markov-memory entropy rates H_m on the prime gap-class words A2 = {gap/2 mod 2} (2 symbols) and A6 = {gap/2 mod 6} (6 symbols, the true gap-class word) at X = 2,000,000 (148,933 primes), plus the 24-adic antipode structure and a literal phi-inflation test on admissible k=3 constellations. Script scripts/sq/loom0_penrose_weave.py, output tmp/loom/loom0_out.txt, run <1s single-threaded. Results: (A) A2 complexity = 2,4,8,16,32,64 = EXACTLY 2^n for all n<=6 (maximal: every binary pattern occurs; the word never repeats = aperiodic AS THE OWNER HOPED, but not Penrose-like - Penrose/substitution words have linear complexity). A6 complexity = 6,29,122,498,2018,8078
