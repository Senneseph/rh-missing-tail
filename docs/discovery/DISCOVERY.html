rphic\n  {Basic,Order,Divisor} with MeromorphicOn.divisor +\n  meromorphicOrderAt (verified against the local lake\n  package) -- the counting-data half of the argument\n  principle is now library-ready at the pin,  and the\n  argument principle itself exists upstream in Tau Ceti\n  (Lean-FRO-incubated,  github TauCetiProject/TauCeti)  as\n  TauCeti.Contour.argumentPrinciple.  The Zeta23 borrow\n  source moved to anthropics/formal-math (zeta23/ subdir;\n  the old RvM/Backlund path is gone from main,  re-inventory\n  needed).  Build order ap1 -\\u003e ap2 -\\u003e ap3 recorded in the\n  forensics D4 section."}, {"n": 52, "date": "2026-10-13", "time": "s3", "title": "ap1 stage 1: argument principle PORTED IN-HOUSE (no borrow)", "body": "Owner standing directive applied: advance D3/D4 or document the\nnamed dead end. Worked the cheapest live D4 advance (the ap1\nprobe) to completion.\n\n  * Ported the zeta23 argument-principle base from\n    anthropics/formal-math (former zeta-23-lean) commit\n    e1a4e6508154, Apache-2.0, attribution headers preserved:\n      RhAttack/Ap1Tactic.lean            (additive_combination\n                                          tactic, extending\n                                          Mathlib.Tactic.\n                                          LinearCombinationPrime)\n      RhAttack/Ap1Rectangle.lean         (rectangle/border\n                                          calculus, nhds\n                                          characterizations)\n      RhAttack/Ap1Residue.lean           (H/V integrals,\n                                          ResidueTheoremIn\n                                          Rectangle +\n                                          punctured-rectangle\n                                          residue statement)\n      RhAttack/Ap1ArgumentPrinciple.lean (residueTheorem_finset,\n                                          finite_zeros_rectangle,\n                                          rectangleIntegral'_\n                                          mul_logDeriv_of_poles,\n                                          rectangleIntegral'_\n                                          mul_logDeriv [the\n                                          weighted argument\n                                          principle],\n                                          rectangleIntegral'_\n                                          mul_logDeriv')\n\n  * Decided NOT to add TauCeti or zeta23 as package\n    dependencies (different mathlib pins; D4 needs house-\n    proven, not cited). Port instead, per the iron rule's\n    borrow-with-citation clause (source commit + file paths\n    cited in the file headers and in\n    formal/RH-LEAN-PROVENANCE.md [A1G-6], updated here).\n\n  * All mathlib prerequisites verified present at the pinned\n    v4.33.1 (one authorized local grep, per the iron rule):\n    the Rectangle definition itself\n    (Mathlib.Data.Complex.Basic:845),\n    rectangle_eq_convexHull (Analysis.Complex.Convex),\n    differentiableOn_update_limUnder_of_bddAbove,\n    integral_boundary_rect_eq_zero_of_differentiableOn,\n    analyticOrderAt_* + analyticOrderAt_id, logDeriv_*,\n    LinearCombinationPrime helpers (Expanded, add_pf, ...).\n\n  * Two SELF-TEST theorems run the ported principle in\n    working form (Ap1ArgumentPrinciple.lean, section\n    Ap1Selftest), zero sorry:\n      ap1_selftest_residue_finset    : (1/2pi i)-int 1/s around\n                                       [-2,2]x[-2,2] = 1 (the\n                                       finset residue mechanism)\n      ap1_selftest_weighted_simple_zero: the WEIGHTED argument\n                                       principle evaluates a\n                                       simple-zero contour via\n                                       the order sum (1 . g(0))\n                                       = 0, integral never\n                                       computed by hand.\n\n  * GATES: lake build green (17450 jobs, 0 errors, zero sorry\n    in Ap1*); lake exe rhattack all four gates PASS.\n\n  * Next in the same line (ap2/ap3 sources inventoried and\n    ready in the same source commit): the RVM window identity\n    (RvM/CountByIntegral.lean: completed-zeta rectangle integral\n    = zero count in the window) and the Backlund horizontal\n    O(log T) bound (RvM/Backlund.lean, explicit ~310 log T\n    form) -- these carry the S-identity wire ap2 and the 17/2\n    base-cost input ap3, currently CITED in A1Growth.lean."}, {"n": 53, "date": "2026-10-13", "time": "s4", "title": "ap2 COMPLETE: the RVM window identity is house-PROVEN", "body": "Continuing the D4 argument-principle line (owner directive:\nadvance D3/D4, or name the stop).\n\n  * Ported the RVM zero-count layer in-house from the same\n    source commit (anthropics/formal-math e1a4e65,  Apache-\n    2.0,  cited):\n      RhAttack/Ap2Defs.lean            (reflect,  ZeroConfig,\n                                         paperFT,  Params...)\n      RhAttack/Ap2Counting.lean        (abstract\n                                         [eq:trivialchain])\n      RhAttack/Ap2Statement.lean       (IsNontrivialZero,\n                                         zeroMult =\n                                         analyticOrderAt,\n                                         zerosIn,  Ncount,\n                                         N0/N0star/N0s/Ns/\n                                         Nd,  ZetaSeam,  RH\n                                         sanity anchors)\n      RhAttack/Ap2Seam.lean            (one_le_mult via the\n                                         identity theorem;\n                                         finite_window via\n                                         local finiteness of\n                                         the zero set +\n                                         compactness)\n      RhAttack/Ap2Reflect.lean         (Schwarz reflection\n                                         zeta(conj s) =\n                                         conj zeta(s);  order\n                                         invariance under\n                                         conj and under the\n                                         functional equation)\n      RhAttack/Ap2CountByIntegral.lean (zetaSeam,  NO paper\n                                         inputs;  + the main\n                                         theorem)\n\n  * MAIN RESULT,  now LEAN-PROVEN in this repo:\n    rectangleIntegral'_logDeriv_completedZeta_eq_Ncount:\n    for 0 < T1 <= T2 with no zero of ordinate exactly T1 or\n    T2,\n        (1/2 pi i) * int (Lambda'/Lambda) ds  =  N(T1, T2)\n    around the rectangle  (-1 + iT1) -> (2 + iT1) ->\n    (2 + iT2) -> (-1 + iT2),  Lambda = completed zeta,\n    N = multiplicity sum of the nontrivial zeros  (order =\n    analyticOrderAt in Mathlib).  This is the classical\n    RvM counting wire the whole  S-identity argument\n    (N(T) = main + 7/8 + S(T)/pi + ...)  hangs from,  and\n    it was previously CITED  (A1G-6).\n\n  * Self-test (working form):  ap2_selftest_RH_counts_on_line\n    -- under Mathlib's RiemannHypothesis the same contour\n    integral equals the ON-LINE count N0 (the integral is\n    never evaluated by hand).  The sanity anchors\n    (RH_implies_all_on_line,  trivial_chain0,\n    zerosIn_finite)  port over and build.\n\n  * GATES:  lake build green;  all four  lake-exe-rhattack\n    runtime gates  PASS;  zero sorry in Ap1*/Ap2*.\n\n  * AP3 named boundary (documented,  inventoried):  the\n    Backlund-line explicit input  (the  ~310 log T\n    horizontal-variation bound,  source of the  17/2\n    base-cost datum in  A1Growth)  needs  Backlund.lean,\n    ReZeroCount.lean,  LocalCount.lean,  Halving.lean,\n    ZetaGrowth.lean  plus exactly three lemmas out of the\n    3060-line PNT+ ZetaBounds port  (Zeta0,  Zeta0EqZeta,\n    ZetaBnd_aux1b).  That is the remaining port on the D4\n    line;  it is bounded (roughly 1500 lines of source,\n    all mathlib-based) but multi-iteration."}, {"n": 54, "date": "2026-10-13", "time": "s5", "title": "ap3 COMPLETE: the Backlund bound layer is house-PROVEN", "body": "The final bound layer of the D4 argument-principle line, same\nsource commit (anthropics/formal-math e1a4e65,  Apache-2.0):\n\n  * Ap3Prelude            -- the one-line instance-search\n                             hygiene (LieAlgebra.toModule\n                             demoted),  verbatim from the\n                             source Prelude.\n  * Ap3StrongPNTPrefix    -- the  482-line  PNT+ prefix\n                             through  ZerosBound  (the\n                             Jensen/Borel-Caratheodory\n                             disk  zero-count).\n  * Ap3ZetaBounds         -- exactly the  three  ZetaBounds\n                             lemmas the bound layer needs\n                             (Zeta0 /  Zeta0EqZeta /\n                             ZetaBnd_aux1b)  plus  their\n                             ~450-line  helper  closure,\n                             out of the  3060-line  source\n                             file  (the rest  stays\n                             unported  by design).\n  * Ap3Growth             -- the  explicit  half-plane\n                             bound  ||zeta||  <=  1/2 +\n                             1/|1-s| + |s|/sigma  [Tit\n                             (2.1.4)  with  N=1],  linear\n                             growth  (5/2 + delta^-1)|t|\n                             for  sigma  >=  delta,\n                             &&zeta - 1&&  <=  zeta(2) - 1\n                             for  Re  >=  2.\n  * Ap3Halving            -- reflection  halving\n                             N(T1,T2)  <=  2 x  (right-\n                             half  window  count).\n  * Ap3BacklundDefs       -- reZeroSet(T)  (the  zeros  of\n                             Re  zeta(sigma + iT)  on\n                             [1/2, 2]).\n  * Ap3LocalCount         -- the  Jensen/Landau  local\n                             zero  count  on  a  disc\n                             (via the ported disk\n                             ZerosBound).\n  * Ap3ReZeroCount        --  reZeroSet_card_le:  the\n                             Jensen bound  counting  the\n                             horizontal  Re-zeros.\n  * Ap3Backlund           --  backlund_horizontal:  |Im\n                             int_{1/2}^{2}  zeta'/zeta\n                             dsigma|  <=  explicit  O(log\n                             T)  (the  raw  ~310 log T\n                             integral  constant  form,\n                             pre-Rosser-McCurley)  and\n                             vertical_two:  the  sigma  =\n                             2  vertical  side  is  bounded\n                             by  pi.\n\n  * This is the 17/2 base-cost input  A1Growth.lean  used\n    to carry as CITED  (A1G-6):  the counting  side  of\n    the S-identity wire  (window count  =  contour  of\n    Lambda'/Lambda  +  the  two  side-bound  inputs)  is\n    now LEAN-PROVEN end-to-end through  the  in-house\n    weighted  argument  principle.\n\n  * GATES:  lake build  green;  all four  runtime  gates\n    PASS;  zero sorry  in  Ap1*/Ap2*/Ap3*.\n\n  * Next on the D4 line (bounded,  inventoried):  the\n    main-term  assembly  --  RvM/MainTerm  (486)  +\n    RvM/Fold  (203)  +  RvM/GammaSide  (202)  +  the\n    23-line  RvM/Statement  assembler  =  the  full  RvM\n    formula  N(T1,T2)  =  int  mu  +  (1/pi)  Im\n    int_{1/2+iT1}^{2+iT1->2+iT2->1/2+iT2}  zeta'/zeta  +\n    bounds,  with explicit error terms."}, {"n": 55, "date": "2026-10-13", "time": "s6", "title": "ap4 COMPLETE: the D4 line is done -- full RvM, no extra hypotheses", "body": "The final layer of the argument-principle line (same source\ncommit,  Apache-2.0,  cited):\n\n  * Ap3Hypotheses   --  the  GammaFacts  and  PaperInputs\n                         structures  (the  paper  inputs  as\n                         explicit  hypotheses  by  design).\n  * Ap3RvMDefs      --  GoodHeight,  halfContour  (the\n                         right  half  contour  1/2+iT1 ->\n                         2+iT1 -> 2+iT2 -> 1/2+iT2  as  three\n                         interval  integrals),  the\n                         RiemannVonMangoldt  packaging.\n  * Ap3XiLogDeriv   --  logDeriv  Lambda  =  logDeriv  zeta\n                         +  logDeriv  Gamma  (Re  s  >  0),\n                         Lambda(1-s)  =  Lambda(s),\n                         conj  symmetry.\n  * Ap3ZetaConj     --  the  41-line  PNT+  zeta\n                         conjugation  helper.\n  * Ap3NcountWindow --  window  count  lemmas.\n  * Ap3Fold         --  the  fold:  for  zero-free\n                         ordinates,  N(T1,T2)  =  (1/pi)\n                         Im  halfContour(Lambda'/Lambda),\n                         via  Lambda(1-s')  =  Lambda(s).\n  * Ap3GammaSide    --  (1/pi)(halfContour  logDeriv\n                         Gamma).im  =  int  mu  (the\n                         gamma  side  becomes  the  mu\n                         density).\n  * Ap3MainTerm     --  rvM_main_param  (the  parametric\n                         assembly  of  the  main  term  with\n                         the  ported  Backlund  +  vertical\n                         +  local-count  +  mu  inputs)\n                         and  its  corollaries  rvM_main /\n                         rvM_main_aux.\n  * Ap3RvMStatement --  the  assembler  (23-line  source).\n  * THE GAMMAFACTS DISCHARGE (about 2.4k lines,  all\n                         mathlib-PROVED):\n      Ap3GammaSeries         (digamma  series)\n      Ap3GammaStirling       (Stirling  for  Gamma\n                               off  the  ported  series)\n      Ap3GammaMu             (mu(tau)  =  (1/2pi)\n                               log(|tau|/2pi)  +  O(tau^-2))\n      Ap3GammaIntMu          (the  mu  integral  identity\n                               against  the  main  term)\n      Ap3GammaStirlingVert   (the  vertical  Stirling\n                               estimate)\n      Ap3GammaComplete       (gammaFacts :\n                               GammaFacts,  the  single\n                               discharge  theorem)\n\n  * TOP-LEVEL RESULT,  hypothesis-free  in  this  repo:\n      ap4_selftest_rvM_main_no_extra_hypotheses :\n        EX  C T0,  forall  T >=  T0,\n          |N(T,2T)  -  (T/2pi)  ell1(T)|  <=  C log T\n      ap4_selftest_riemannVonMangoldt_no_extra_hypotheses :\n        RiemannVonMangoldt  zetaZeroConfig\n    i.e.  the  full  Riemann-Von  Mangoldt  formula,  N =\n    main  +  O(log T),  proven  inside  this  package\n    from  mathlib  +  the  ported  Apache-2.0  sources,\n    no  paper  inputs,  no  extra  hypotheses.\n\n  * D4 VERDICT:  the  classical  S-identity  wire  is\n    COMPLETE  in-house  --  ap1  (argument  principle)  +\n    ap2  (window  identity)  +  ap3  (side  bounds)  +\n    ap4  (main  term,  RvM,  GammaFacts)  =  34  files,\n    about  7.5k  lines,  all  LEAN-PROVEN.  What  used  to\n    be  CITED  (the  whole  classical  counting  side)  is\n    now  PROVEN.  The  one  remaining  CITED  input  in\n    A1Growth.lean  is  the  Trudgian  II  explicit\n    S-bound  itself  (A1G-5)  --  a  genuinely\n    frontier-level  citation  (the  bound  the  wire\n    consumes),  not  part  of  the  counting  wire.\n\n  * GATES:  lake  build  green  (34  new  files,  0\n    errors,  zero  sorry  across  Ap1*/Ap2*/Ap3*);  all\n    four  lake-exe-rhattack  runtime  gates  PASS.\n\n  * WHAT THIS MEANS FOR THE RH PROGRAM:  every  classical\n    input  of  the  S-identity  leg  is  now  machine-\n    checked  in  this  repository.  The  formal  side  of\n    the  margin  certificate  (the  data-free  clause  +\n    the  wire  cost)  has  its  entire  classical \n    substrate  PROVEN.  What  remains  genuinely  open  on\n    the  formal  side  is  the  growth  form  of  the  S\n    bound  at  the  zeros  (A1G-5,  frontier)  --  i.e.\n    exactly  the  D3  frontier  (zero-scale  transfer),\n    now  that  D4  (the  machinery  under  it)  has  been\n    removed  from  the  trust  pile."}, {"n": 56, "date": "2026-10-13", "time": "s7", "title": "D3: P2 read in full; zero-scale oscillation vs measured zero-scale flatness", "body": "* P2 (Inoue-Kobayashi-Toma, arXiv:2510.14309) 8-page PDF\n    read in full:  Theorem 1 (RH,  effective,  h in [C/log\n    T,  c/loglog T]):  sup +/-(S(t+h)-S(t)) >= (1-E)\n    sqrt(h log T / pi)  with explicit E;  AT THE EXACT ZERO\n    SCALE h = c'/log T every E-term tends to zero,  so the\n    zero-scale S-increment is  (1-o(1)) sqrt(c'/pi)  (about\n    0.56 at c' = 1).  Theorem 3:  the M-O/resonance\n    barrier (large gaps <= ~3.022,  small >= ~0.508).  The\n    zero-scale oscillation lower bound is the refutation\n    mechanism for any \"S flat at zero scale\" clause\n    (counting-only,  RH-conditional).  See forensics\n    section 3.10.\n\n  * MEASURED (505-point ledger,  read-only):  the k-layers\n    are sliding t-windows of width 5.0 stepped by 0.5  (~109\n    zeros per window).  Over all 483 adjacent-in-t pairs:\n    max |dmnew| = 3.19e-4,  median = -8e-8.  The data-free\n    margin is FLAT to 3e-4 between windows shifted by 11\n    zero-spacings,  while P2 (RH) predicts S-increments of\n    ~0.2-0.6 per spacing and O(1)+ over 0.5 shifts.\n    Compatibility requires the margin to be\n    window-averaged / O(1)-bounded off / wire-cancelled in\n    its S-dependence (the D4 Lean line just proved is the\n    cancellation mechanism).  The ledger therefore does not\n    adjudicate the flat clause:  it cannot see zero-scale S\n    structure at window resolution.\n\n  * NAMED NEXT EXPERIMENT (single-zero sweep):  evaluate the\n    margin / S1-R residual at t-resolution 0.02-0.05 (one\n    zero per step) at ~3.23e9 and ~1e10,  200 steps per\n    anchor (engine at dps-30,  or mpmath S-walk for the\n    S-side alone);  compare single-step deltas with the P2\n    prediction.  Roughness of predicted size  =>  P2\n    becomes the in-data refutation of the flat clause;\n    continued smoothness  =>  the margin is provably\n    S-insensitive at zero scale and the flat-clause\n    question moves to the main-term (G = C log) side."}, {"n": 57, "date": "2026-10-13", "time": "s8", "title": "S-side single-zero sweep: zero-scale S IS rough; margin flat; tension quantified", "body": "* Sweep (scripts/rh/s0_singlezero_swalk.py,  dps-25,\n    cross-checked at dps-45 to 6 digits,  20 s runtime):\n    S(t) = (1/pi) arg zeta(1/2+it)  continuous branch,\n    0.025 t-steps  (quarter zero-spacing)  over 5 t-units\n    at the band head (t0 ~ 3.23217e9)  and at 1e10.\n      per-step S-increment:  ~0.08 median,  ~0.14 mean\n      (S units);  crossing steps (zero jumps):  ~0.92;\n      crossings in 5 units:  15-16  vs RVM prediction\n      ~15.9  (MATCH);  every crossing on the critical line\n      (weak local RH-consistency signal).\n  * Against P2 Thm 1:  the sqrt(h log T / pi)  scale at\n    h = 0.025 is ~0.42  (S units,  SUP over the dyadic):\n    the typical smooth increment  (0.08-0.14)  and the\n    crossing events  (~0.92)  bracket it as expected --\n    QUALITATIVELY CONSISTENT at true zero resolution.\n  * TENSION LOCKED:  S is rough at zero scale;  the\n    505-point margin is flat to 3e-4 at 0.5 t-shifts\n    (~2 zero-spacings).  The margin's flatness,  if real,\n    is an S-INSENSITIVITY property of the certificate\n    (window-averaged / O(1)-bounded off / wire-cancelled;\n    the cancellation mechanism is the RVM identity we\n    just proved in Lean).  The flat-at-zeros clause\n    remains OPEN,  and the adjudicating experiment (the\n    ENGINE-SIDE single-zero margin sweep:  re-evaluate\n    the margin / S1-R residual at t-step 0.02-0.05 and\n    compare its deltas with the S-side deltas just\n    measured)  is  named precisely  in  forensics 3.10.\n    Rough margin deltas of S-side size  =>  P2's\n    oscillation bound is the in-data refutation;  flat\n    margin deltas  =>  the clause question moves to the\n    main-term  (G = C log)  side."}, {"n": 58, "date": "2026-10-13", "time": "s9", "title": "ap5 (in-house): point-scale RvM with O(log T) error is house-PROVEN; A1G-6 rebase formalized", "body": "* New file  formal/RhAttack/S1Point.lean  (namespace S1B,\n    ~450 lines,  NO external source --  in-house theorem,\n    built only from the ported ap1-ap4 machinery + mathlib):\n      S1B.point_rvM (hΓ : GammaFacts) (hC9 : C9NoZerosLow) :\n        ∃ C T0, ∀ T ≥ T0, GoodHeight T →\n          |(Ncount 4 T : ℝ) - f_pt T| ≤ C · log T\n    where  f_pt T = T/(2π)·(log(T/2π) − 1)  and  Ncount 4 T\n    counts ALL nontrivial zeros 0 < Im ≤ T  (by C9 none lie\n    on (0,4]).  This is the classical point-scale\n    Riemann-von Mangoldt with O(log T) error  (the S-defect\n    bound;  Backlund 1918 / Titchmarsh Thm 9.4  point form)\n    --  the last CITED classical input of the wire line is\n    now an in-repo theorem.\n  * One named input remains:  S1B.C9NoZerosLow  (no\n    nontrivial zero on 0 < Im ≤ 4;  first zero 14.134725...\n    --  numerically trivial,  certified in the data layer,\n    not decidable in Lean).  Everything else is proved:\n    winding identity  (ported ap2),  half-contour split\n    (ap3),  gamma side = int mu  (ap3),  Stirling form of mu\n    (ap3, discharged),  Backlund explicit horizontal bound +\n    vertical_two  (ap3).\n  * Components:  int_log_point  (FTC anchor  ∫_4^T\n    (1/2π)log(τ/2π) = f_pt T − f_pt 4),  int_mu_point_form\n    (direct integration of the Stirling field:  ∫_4^T μ =\n    f_pt T − f_pt 4 + O(1),  NO dyadic telescoping --  the\n    O(1/U) per-window errors are immaterial at the point\n    scale because the log terms integrate exactly),\n    hc_zeta_im_bound  (the ζ part of the half-contour [4,T]\n    is O(log T):  both horizontals by backlund_horizontal_at\n    at the explicit Jensen constant CJ ≈ 48.3,  the σ=2 side\n    by vertical_two ≤ π),  f_pt_4_abs_le  (|f_pt 4| ≤ 2,\n    explicit),  point_rvM  (assembly),  rebase_a1g6_dn_form,\n    s1_selftest_point_rvM_discharged.\n  * REBASE A1G-6:  S1B.rebase_a1g6_dn_form proves the wire's\n    hSbound premise form  |DN| ≤ C·log t + 1/t  in the\n    classical smooth-count instantiation  (Nas = f_pt)  at\n    every good height  t ≥ T0.  The only remaining CITED\n    input in A1Growth.lean is the Trudgian II explicit\n    S-bound  (A1G-5)  --  the unconditional frontier,  by\n    design not a rebase target.\n  * Gates:  lake build green  (0 errors),  all four\n    rhattack runtime gates PASS,  zero sorry in S1Point.lean.\n  * day056  (the adjudicating experiment,  forensics 3.10)\n    launched:  single-zero margin sweep at 0.025 t-steps at\n    three ledger anchors  (band head 3.23217e9,  mid 1e10,\n    top 2.788e10),  the dps-30 chain of cert_point  (no\n    engine change),  self-validated against the certified\n    dps-30 ledger mnew values at 6 ledger t's per anchor\n    (expect agreement < 1e-9;  the cross-check rows verify\n    the fast chain before the grid rows are trusted)."}, {"n": 59, "date": "2026-10-13", "time": "s10", "title": "SQUEEZE IDENTITY DECODED: Kfull = -c(x) * zeta exactly; the margin is structurally flat; E19 re-scoped to E1", "body": "* Full-throttle owner order (\"whichever gets results first\").\n    No new compute needed:  the answer came out of the 505-point\n    ledger itself,  one arithmetic pass over  (Kabs,  zeta,\n    residf)  per row.\n  * FACT (all 505 certified points,  22 windows,  3.2e9 ..\n    2.8e10):  the reconstruction ratio  Kfull / zeta  lies on\n    the NEGATIVE REAL AXIS  at every certified point:\n        cos(theta) = -1.0000000   (to >= 7 digits,  every row)\n    with magnitude  c(x) = |Kfull|/|zeta|  CONSTANT inside each\n    window (spread ~ 1e-5)  and varying smoothly across the\n    band:  c = 0.9909  (x = 3.23e9)  ...  c = 0.2111  (x =\n    2.79e10),  decelerating-then-accelerating (not a power\n    law:  c ~ a x^-0.448 fits only the lower band;  c collapses\n    near G_LAST = 3.0001e10).\n  * CONSEQUENCE 1 (the margin's flatness IS a theorem,  not\n    data):\n        residf = |zeta - Kfull| = (1 + c(x)) * |zeta|   (exact)\n        mnew = |zeta| dev / (pb + residf) = dev / (1 + c(x))\n    with  dev ~ 1 (the straddle window is empty of zeros by\n    construction:  R_closed ~ O(1/g) ~ 3e-10,  Bdev ~ 5e-32)\n    and  pb ~ 1e-24  (negligible).  The margin is therefore\n    T-INDEPENDENT inside every window,  to the assembly noise\n    floor  (~1e-5,  f64 stream).  The observed 505-point\n    flatness (adjacent deltas ~ 3e-4)  and the smooth rise\n    0.502 -> 0.826 across the band are exactly the prediction\n    of  1/(1 + c(x)).  The day056 single-zero engine sweep and\n    the s3 ledger-reconstruction sweep (both running) are\n    PREDICTED to show |dm| ~ 1e-9 .. 1e-5  at the 0.025 step\n    --  flatness at zero resolution,  for the trivial reason\n    that the margin is a constant.\n  * CONSEQUENCE 2 (E19 re-scoped):  the \"tension\" (S rough at\n    zero scale vs margin flat) was the WRONG DIAGNOSIS:  the\n    margin does not track S at all.  It is the t-independence\n    certificate of the zero-product identity\n        zeta(1/2+it) = -c(x) * exp(lm + la + i ar + re + i im)\n                       * exp(Qrem + Qext),\n    where  re/im  = the discrete log-kernel sum over the\n    verified zeros of (1e7, G_LAST],  la/ar  the (0, 1e7]\n    on-line product,  lm  the functional-equation main term,\n    Qrem/Qext  the quadrature remainder.  The identity holds\n    up to the window-constant  -c(x)  factor  (c(x) is a\n    genuine x-dependent zero-set/convention factor;  its\n    closed form is a queued follow-up).  An OFF-LINE zero in\n    a window would bend the ratio off the negative-real locus\n    (relative wiggle ~ O((d/delta_g)^2) >= ~1e-2  for offset\n    d ~ 0.1)  --  against the noise floor ~ 1e-5  --  so the\n    squeeze is a genuine zero-exclusion certificate at offset\n   -band (DG = 0.005..0.5)  resolution:  every zero in every\n    window is on the line,  to 1e-5.\n  * CONSEQUENCE 3 (the one open clause,  unchanged but now\n    clean):  RH beyond the data frontier still needs E1  (the\n    walk):  |DN(gamma)| <= K  uniform  at zero heights,  i.e.\n    S is O(1) at the zeros  (classical smoothing  Nas = f_pt:\n    DN = S + O(1/x)).  Status:  open unconditionally (3.8\n    citations);  refuted in the limit under RH (P1\n    zero-weighted CLT:  S at zero-weighted heights ~\n    sqrt(loglog T)/pi,  unbounded;  P2 zero-scale\n    oscillation).  The margin data neither supports nor\n    refutes E1  (it does not measure E1).\n  * DOOR VERDICT (the solution shape,  sharpened):\n      Door A (E1 true):  the program completes to RH via data\n      +  wire  +  the E1 theorem  --  a new theorem that does\n      not exist in the literature (zero-restricted\n      S-boundedness,  open in both directions).\n      Door B (E1 false / growing):  the program re-scopes to\n      the verified sub-RH theorem  (RH to 3e10 certified;\n      zero counts beyond O(log)-constrained by the wire).\n      The single-zero sweeps (day056 engine,  s3\n      reconstruction)  now serve to CONFIRM the structural\n      flatness prediction (the identity,  not the zeros,\n      drives the margin)  --  expected outcome on both,\n      ~1e-5 max |dm|."}, {"n": 60, "date": "2026-10-14", "time": "", "title": "SINGLE-ZERO DOOR ADJUDICATED:  DOOR B -- the margin", "body": "carries zero-scale structure;  the 505 \"flatness\"\n                 was a 0.5-step sampling artifact\n\n  * Full-throttle owner order,  continued.  The s3 ledger-\n    reconstruction sweep  (engine-free,  anchored on the\n    certified 505-point ledger)  completed:  360 grid\n    points  (3 anchors x 120,  0.025 step  = one zero-\n    spacing)  + 18 gate rows.  GATE PASS at every anchor:\n    max |mnew_recon - mnew_ledger| = 9.6e-9  (100x tighter\n    than the engine's own Bexp budget 3.9e-4).  la/ar\n    bit-exact re-evaluation  (max diff 0.0  vs ledger).\n  * RESULT -- the margin is ROUGH at true single-zero\n    resolution  (Door B,  the first branch of the 3.10\n    named experiment):\n        |dm| per 0.025 step:  median 4.4e-3,  p99 8.7e-2,\n        max 1.7e-1   (band-wide,  357 steps)\n        |dS| per 0.025 step:  median 0.08,  mean 0.25,\n        max 1.9  (twin steps);  net S +9.5..+12.5 over\n        ~3 units  (~1 per zero,  by definition).\n    The 505-point \"flatness\"  (max 3.2e-4)  was measured\n    at the 0.5 step  = 20 zero-spacings:  a sampling\n    artifact that averages the wiggle out.\n  * MECHANISM (now decoded,  forensics 3.11):  the margin\n    is a pure readout of the Efull identity ratio\n        Kfull / zeta = -c(t)   (negative real,  all 505\n    points,  phase pi to >= 7 digits),\n        mnew ~ 1/(1 + c(t)).\n    c(t) has a window-constant part  (smooth cancellation\n    of lm/la/quad/re to 1e-5;  the band rise 0.502 ->\n    0.826  =  1/(1+c(x)),  c = 0.9909 ... 0.2111)  PLUS a\n    zero-scale wiggle  --  the S-flow of the discrete\n    product  (the margin wiggles at the same zero scale\n    where S wiggles;  attenuated,  weak alignment with S-\n    crossings:  0-2 of 5  top steps per anchor).\n  * NEAR-MISS RECORDED (forensics 3.11(3)):  the far-\n    quadrature value  -1.2929983e9  was chased as a\n    possible mp.quad bug for an hour.  It is CORRECT:\n    the integrand is O(2e9)/ln-unit at the lower limit\n    (h ~ t^2 e^{-u} (u/2pi)^2).  Verified three\n    independent ways  (engine 400-node log-quad,  tanh-\n    sinh dps-35 clean u-intervals,  1e6-pt u-grid)  --\n    agree to 1e-3 absolute on the 1.29e9.  The traps\n    that produce nonsense:  ln-space instead of g-space\n    measure  (returns -0.02),  complex128 g-linear\n    trapezoid over octaves  (10x-1000x garbage).\n  * IMPLICATIONS:\n    (1)  The 3.8/3.10 \"tension\"  dies:  S rough at zero\n        scale AND margin rough at zero scale  --\n        correlated,  no tension.  S3/S4 (P1/P2) remain\n        the limit refutation of any flat-O(1) clause.\n    (2)  The one open clause is UNCHANGED:  E1  (|DN| <=\n        K at zero heights  =  S = O(1) at the zeros)  --\n        open unconditionally,  refuted in the limit under\n        RH.  The squeeze was a zero-EXCLUSION\n        certificate all along  (off-line zero at offset\n        d lifts the margin ~ (d/(t-g))^2 c/(1+c):\n        d = 0.1  ->  +3.7e-2  vs the 3e-4 floor)  --\n        now with the identity known exactly.\n    (3)  The sub-RH verified-theorem statement gains one\n        ingredient:  the margin's growth shape  (window-\n        constant 1/(1+c(x))  + zero-scale S-flow wiggle\n        of measured amplitude).\n  * The day056 engine sweep (14 workers) was stopped for\n    cost  (~4 h re-stream per grid point  ->  days,  vs\n    s3's 66 min for the whole question with a stricter\n    gate).  s3 is the record;  artifacts in scripts/rh/\n    (s3_ledger_recon_margin_sweep.py,  s3_interpret.py)\n    and tmp/  (s3_ledger_recon_margin_sweep_summary.md,\n    s3_interpret.md)."}, {"n": 61, "date": "2026-10-14", "time": "s2", "title": "c(t) CLOSED: main-term identity proven numerically; the c theorem; LEAN-GUIDE created", "body": "* s5 finished (stream 3338s + quads); its genus-1 RHS did not\n    close (kernel mismatch vs the engine's pair kernel) -- s5 is\n    superseded, JSONL kept as data.\n  * s6 (quad-only) re-bookkeeping found: the engine's Kabs tail\n    term covers ACTUAL zeros (1e7, G] (day023 shard stream, incl\n    the (1e7, 3.19e7] slice and both micro-gaps) -- there is NO\n    unmodeled gap below G.  Engine composition code-read:\n    Kfull = exp(lm + la + i ar + re + i im) * exp(qrem) * exp(qext);\n    the B-fields are bounds, not exponent addends.\n  * VERIFIED main-term identity (both ledger heights, to 1e-6):\n    lm_re = log|main_ex| + log(1/2) - Ex_total, where\n    main_ex = 2 pi^{s/2}/(s (s-1) Gamma(s/2)) (zeta = xi/main_ex,\n    xi(0) = 1/2 verified).  The engine Stirling main term (the\n    S1Point lean side) equals the exact xi-convention main factor\n    minus the Ex bookkeeping.  Lean-certifiable (atoms exist in\n    Ap4 + S1Point).\n  * s7: the engine 400-node dps-30 far quad equals the exact\n    RVM u-quad to 2.4e-7 absolute -- the quad is exact.  Hence the\n    ONE-LINE c THEOREM:\n      log c(t) = EPS + Q_engine(t) - I_far,RVM(t) - M_true(t),\n      EPS ~ +/-2e-6 (t-independent),  Q_engine readable from the\n      ledger (= log|Kabs| - lm - la - re),  I_far,RVM computable\n      (u-quad, seconds),  M_true(t) = RVM tail model error, and\n      M_true(t) = EPS - log c(t) is MEASURABLE at every ledger\n      row.  Measured: log c = -0.009110 at t = 3.23217e9,\n      -1.555411 at t = 2.78843e10:  the true tail product\n      deviates from the RVM model by e^{0.009} / e^{1.555}.\n      c(t) is nothing else:  constant + ledger quad pieces +\n      RVM model error.\n  * CONSEQUENCE for E1:  the open clause \"S = O(1) at zero\n    heights\" now has an exact measurable numeric face\n    (M_true(t) = EPS - log c(t));  the drift of c between the\n    two windows IS the RVM model error of the (G, 1e30] tail,\n    not a new macro quantity.\n  * formal/LEAN-GUIDE.md created at the owner's direction:\n    the navigation + convention layer (module lines, kernel\n    table with code-verified definitions, formal-numeric\n    wiring, pins, accumulated pitfalls, open-content map).\n    Build re-verified green (17450 jobs, 0 errors, sorry-free).\n  * Scripts: scripts/rh/s6_c_closedform.py, s7_c_theorem.py;\n    outputs in tmp/s6_c_closedform.{md,jsonl}, tmp/s7_c_theorem.{md,jsonl}."}, {"n": 62, "date": "2026-10-14", "time": "s3", "title": "s8: M(t) mapped at all 505 rows; the missing-tail", "body": "face of (CL) bounded in-hand; the 2 dK ln t infinity\n                law derived; f64 trap cancellation diagnosed\n\n  The c theorem (yesterday's entry) gave the MISSING-TAIL error\n  M(t) a measurable face:  M(t) = EPS(t) + Q_engine(t) -\n  I_far,RVM(t) - log c(t).  s8 evaluates every term at ALL 505\n  certified ledger rows (22 windows x 24 k/2 straddles,  t from\n  3.232e9 to 2.788e10,  i.e. t/G in [0.108, 0.929],  G = G_LAST\n  = 3.0001e10).  All 505 in 71 s on one core\n  (scripts/rh/s8_m_true_sample.py;  tmp/s8_m_true_sample.{md,jsonl}).\n\n  MEASURED:\n  * M(t) >= 0 at every row.  min +0.009100218 (t = 3.232e9),\n    median +0.043389335,  max +1.555465754 (t = 2.788e10).\n  * M is FLAT within each window (24 straddles):  worst spread\n    1.3e-3 (1.5541783 .. 1.5554658 in the top window),  best\n    1.4e-5.  The zero-scale S-flow wiggle (Door B) is NOT in the\n    smooth residual -- M is a pure window-position function.\n  * Between windows  M grows as t - G (approach):  the 22 window\n    medians fit  M = 1.242 (t/G)^2.256  (edge law;  local slope\n    dM/dln t  +0.02 -> +6.5 across the sample).  A plain\n    M = a ln t + b fit leaves max residual 0.78:  the sample is\n    NOT in the log regime.\n  * EPS = lm - log|main_ex| - ln(xi0) + Ex_total  verified at ALL\n    505 rows:  |EPS| <= 2.073e-6  (min -1.741e-6)  -- the s7\n    main-term identity extends from 2 heights to the whole\n    ledger.\n  * I_far quadrature health:  dps-40 single-interval vs\n    split-interval quad agree to 3.5e-8 (t/G = 0.11) .. 5.8e-6\n    (t/G = 0.93);  engine dps-30 quad agrees to the last digit at\n    the two endpoints (s7).  Primary = quad,  certified.\n\n  CONTRADICTION LOGGED AND RESOLVED (f64 trap):\n  * The NAIVE f64 u-trapezoid of the far integral  -- kernel\n    log|g-t| + log(g+t) - log(g^2 + 1/4)  -- is CANCELLED NOISE\n    for u > ~45:  three terms of size ~2u minus a signal of\n    ~t^2/g^2 < 1e-27 give +-1.7e10 integrand noise and a\n    -4.76e10 bias against the certified -1.2929983e9 at\n    t = 3.23e9 (both f64 trap variants agree with each other and\n    are both wrong:  the error is systematic,  not resolution).\n    This is the same artifact a previous pass (s7-era probe)\n    hit;  it is now diagnosed to the bit level (forensics 3.12(4)).\n  * Fix:  every ledger row has  g >= G_LAST > t,  so\n      W_pair = log1p(- (t/g)^2) - log1p(1/(4 g^2))\n    is EXACT and cancellation-free.  Rebuilt trap:  vs quad\n    -5.1e-2 at t/G = 0.11, degrading only as the trapezoid\n    under-resolves the integrable log singularity at g = t as\n    t/G - 0.93  (-4.7e1 at 0.929).  The trap is a valid\n    cross-check in the safe region,  void near g = t.\n\n  DERIVED (RH-free,  no zero positions used):  as  t - infinity\n  (window (G, 1e30] fixed),  every window zero has  g << t  and\n      W_pair(g,t) = 2 ln t - (g/t)^2 - ln(g^2 + 1/4) + o(1)\n  so\n      M(t) = 2 * dK * ln t - D + o(1),\n      dK = N_true(G, 1e30] - N_RVM(G, 1e30],   D = O(1) fixed.\n  Generically  dK != 0  (true count integer,  RVM span count not):\n  the raw missing-tail sum is O(ln t)  at infinity.  This is the\n  sharp species of the documented P1/P2 zero-restricted limit\n  failure (SOLUTION-SHAPE 1b/section 3:  \"refuted in the limit\n  under RH\"),  now with an explicit measurable coefficient.  The\n  in-hand sample (t < G) is the window-edge regime,  NOT the log\n  regime:  the edge law 1.242 (t/G)^2.256  is what the data\n  actually carry.\n\n  CONSEQUENCE for (CL)/E1:  unchanged in status (the one open\n  clause,  open unconditionally).  The data now say:  the\n  smooth missing-tail face is bounded by 1.556 across the full\n  3e10 sample with no zero-scale structure,  edge-driven near G;\n  the coefficient dK is measurable by ANY ledger points at\n  t > G  (engine re-issue,  ~4 h per point;  not run this pass).\n  Nothing here is a proof step;  it is the measured face of the\n  open clause plus its infinity law.\n  * Artifacts:  scripts/rh/s8_m_true_sample.py;  tmp/s8_m_true_\n    sample.{md,jsonl};  forensics 3.12;  SOLUTION-SHAPE section 6."}, {"n": 63, "date": "2026-10-14", "time": "s4", "title": "MainBridge.lean GATED: the main-term bridge is a Lean theorem (0 errors, sorry-free, lake build green)", "body": "The Lean-certificate face of the s7 c theorem is now in the\n  base.  formal/RhAttack/MainBridge.lean (604 lines) builds clean\n  on the pin (lean 4.33.1 / mathlib v4.33.1):  `lake build\n  RhAttack.MainBridge` green, 0 errors, no sorry (the only grep\n  hit is the header comment).\n\n  CONTENT (exact, no zero-free hypothesis anywhere):\n  - mainFac s = 2 / (s (s-1) GammaR s)  (xi-convention main\n    factor),  xiz s = (s/2) (s-1) xi(s),  engine_lm s (the\n    engine Stirling main term as a complex function).\n  - Core identity exp(engine_lm s) = mainFac s exp(s C_bridge) / 2\n    is BRANCH-FREE for 0 < s.re, s != 0,1 (log/gamma principal\n    branches cancel via Gamma(1 + s/2) = (s/2) Gamma(s/2)).\n  - Headline (line form, t > 0):\n        (engine_lm (1/2 + it)).re =\n          log|mainFac (1/2 + it)| + C_bridge/2 - log 2        exact\n    and its EPS face bridge_eps_form (residual\n    EPS = C_bridge/2 + Ex_total, the measured O(1e-6)).\n  - xiz_zero_tendsto: xi(0) = 1/2 along the punctured\n    neighborhood (pole case handled by |s| >= 2m norm estimates).\n  - Part C (E7a-style f64 gates, compiled into the base):\n    C/2 + Ex_total -> -1.2e-7,  Ex_total -> 0.011548, and the\n    mirror -Ex_total -> -0.011548 at Float precision.\n\n  METHOD NOTE (for the record):  the build closed one error at a\n  time against the PINNED mathlib source (rg + #print + probes),\n  per the doc-first workflow; the latest upstream docs (Lean\n  4.35 era) were consulted online first, then corroborated in\n  .lake.  Several v4.33.1 shapes differ from memory:  Tendsto is\n  the filter-ordering prop (map f l <= l'), ContinuousAt.comp is\n  (outer, inner), Real.log_mul/log_div take *nonzero* (not\n  positivity) arguments, Real.sqrt_pos is an iff,\n  differentiableAt_riemannZeta / ofReal_log / log_inv carry\n  implicit-first signatures, norm_num `at h` closes a FALSE goal\n  when h becomes False, and simp does not unfold context-lets\n  (dsimp first).  All recorded in the pitfalls as they were hit.\n\n  CONSEQUENCE:  the program's one open clause (E1:  S = O(1) at\n  zero heights) now has BOTH faces Lean-adjacent:  the ap stack\n  (S1Point et seq.) + the exact main-term bridge.  Next data step\n  (Python, hours):  sample M_true(t) = EPS - log c(t) at zero\n  heights from the 696-row ledger -- the decisive E1 test.\n\n  * Artifacts:  formal/RhAttack/MainBridge.lean;\n    formal/LEAN-GUIDE.md (MainBridge line + convention row);\n    scratch probes preserved in /tmp/mb_probes/ (moved, not\n    deleted)."}, {"n": 64, "date": "2026-10-14", "time": "s5", "title": "E1Clause.lean GATED: the single open clause is named in Lean (0 errors, sorry-free, lake build green)", "body": "WHAT:  the program's one open clause (E1:  S = O(1) at zero\n  heights) is now a NAMED LEAN STATEMENT with its entire formal\n  neighborhood.  New module formal/RhAttack/E1Clause.lean (223\n  lines), gated with the same 34-fix one-at-a-time method as\n  MainBridge:  `lake build RhAttack.E1Clause` green (8733 jobs),\n  0 errors, 0 warnings, sorry-free;  3/3 Part-C Float #eval gates\n  re-evaluate the s8 data face at f64 against the dps-50 oracle.\n\n  CONTENT:\n    - Definitions pinned:  G_LAST / U_TOP (the s7/s8 far window),\n      farRVM (the RVM model integral of the W2Pair kernel . Rho\n      over the window;  measurability proven,  integrability not\n      claimed),  farZeros (upper-half-plane TRUE zeros in the\n      window, from B0.finite),  M_true (true far-window pair-kernel\n      sum minus farRVM = the missing-tail model error),  zeroHeight,\n      and E1Clause q B:  |M_true q t| <= B  at every zero height in\n      (G_LAST, U_TOP].\n    - E1Clause is the ONE remaining open statement of the program;\n      it is NOT proven here (nor anywhere in the base).  The module\n      names it and proves everything that composes around it.\n    - Lean-proven glue:  farZeros membership + CONJUGATE-PAIR\n      UNIQUENESS (farZeros counts each conjugate pair exactly once\n      —  only the ZeroSet conj + nonReal axioms used);\n      zeta_abs_line  (|zeta(1/2+it)| = |mainFac| |xiz|  on the\n      critical line for t > 0,  from MainBridge.zeta_eq_main_xi +\n      Complex.norm_mul;  no nonzero exception anywhere);\n      if_E1_and_walk  (the residual program:  E1Clause q 2 + the\n      four P12 structural legs  ->  RH q  on any actual-set zero\n      set;  pure one-line composition through\n      ZetaZeroSet.rhIfMarginZeta).\n    - Data face (locked in the module,  Gate C 3/3):  s8's 505\n      measured zero-height rows give  0.009100218 <= M_true <=\n      1.555465754;  data-supported bound  B = 2  with margin\n      0.4445342.\n\n  NEW PINNED-SHAPE FINDINGS (v4.33.1,  added to the MainBridge\n  method note):\n    - Bare `norm_num` does not unfold plain defs:  `theorem gPos :\n      0 < G_LAST := by norm_num` fails on `G_LAST := 30001...`;\n      needs `dsimp only [G_LAST]` first.  (#eval still works on the\n      literal.)\n    - `dsimp [d]` with no `at` site rewrites only the GOAL;  a\n      def buried in a hypothesis needs `at h`.\n    - `dsimp ... at h.1` is a parse error (\"unexpected term\");\n      extract the component into its own have first.\n    - Conjugation is `star` (and `simp` knows `(star z).im = -z.im`);\n      there is no field `z.conj` and no global `conj` function on\n      C.\n    - In this pin `Set.mem_inter_iff` has ALL arguments explicit\n      (x, s, t);  the short form `Set.mem_inter_iff.mp h` is a\n      \"projection on a non-constant\" parse, and even parenthesized\n      it needs the three explicit args.\n    - MainBridge / ZetaZeroSet are NAMESPACED:  their definitions\n      are MainBridge.mainFac, MainBridge.zeta_eq_main_xi,\n      ZetaZeroSet.ZetaLike,  ...  (autoImplicit silently turns\n      misspelled names into bound variables —  the error reads\n      \"Function expected at X\").\n    - `Set.Finite.mem_toFinset` is the toFinset membership iff\n      (protected;  takes the Finite proof explicitly).\n\n  CONSEQUENCE:  the full residual program is now one named clause\n  with a data-supported constant:  E1Clause q 2  +  four structural\n  legs  ->  RH q  (if_E1_and_walk,  pure composition).  Both faces\n  of E1 (Lean clause + numeric M_true) live in the base.  No RH\n  claim is made;  E1Clause is open and named.\n\n  * Artifacts:  formal/RhAttack/E1Clause.lean (new,  gated);\n    formal/LEAN-GUIDE.md (73-module map,  Gate C 3/3,  E1Clause\n    line,  sections 5/6 updated)."}, {"n": 65, "date": "2026-10-14", "time": "s6", "title": "E1Clause v2:  clause re-targeted onto the measured face (M_wp + straddleRow);  s9 above-G run launched", "body": "WHY:  a definitional audit against the s7/s8 scripts found the\n  v1 clause was not the clause the data supports,  in two ways:\n\n  1. KERNEL CONVENTION.  The engine pair factor is\n      Ker(g,t) = re[log(1-s/r1)+log(1-s/r2) + s/r1+s/r2]\n              = pairLog(g,t) + (1/2)/(g^2+1/4)\n     while s7/s8's I_far integrates pairLog alone  (the s/r\n     convergence term is t-independent and is tracked in\n     Ex_total,  not I_far).  v1 had the clause on the Ker face\n     with the pairLog-face data  (a t-independent offset,  but the\n     named clause should be the measured face).\n  2. HEIGHT DEFINITION.  v1's \"zeroHeight\" (t exactly a zero\n     height) is the WRONG clause:  at a true zero height the true\n     pair factor of the zero itself vanishes (|1-s/r1| = 0  with\n     r1 = the zero),  so the missing-tail face is singular there.\n     The program's clause lives at the DETUNED straddle rows\n     (t = g + k/2,  k != 0)  --  exactly what s8 measured\n     (k in -12..12,  k != 0).\n  3. DOMAIN.  The clause's t-domain is (G_LAST, U_TOP)  --  above\n     the last on-disk zero --  but s8's 505 rows all sit BELOW G.\n     The above-G face had never been measured.\n\n  FIX (v2,  gated):  E1Clause.lean re-targeted:\n    - pairLog + convTerm + ker_split + m_true_true_side_shift\n      (the two conventions differ by a t-independent shift;  the\n      true side is an exact theorem,  the model side is integral\n      linearity,  documented).\n    - M_wp = the data face  (s8's M(t) IS M_wp:  zeta-residual\n      EPS + log|zeta| - lm - la - re - I_far;  the true zero set\n      never has to be enumerated).  M_true kept as the Ker-face\n      alias.\n    - straddleRow replaces zeroHeight (self-pair exclusion baked\n      in).  E1Clause q B now:  |M_wp q t| <= B at every straddle\n      row in (G_LAST, U_TOP).\n    - if_E1_and_walk unchanged (pure composition).\n    - Gates:  lake build RhAttack.E1Clause green (8733 jobs),\n      full lake build green (17450 jobs),  0 errors,  sorry-free.\n\n  PINNED-SHAPE FINDINGS (v4.33.1,  added):\n    - A `noncomputable` def used inside another def does NOT unfold\n      under dsimp/unfold unless the reference resolves to the SAME\n      constant;  an unknown `log` (file lacks `open Real`) becomes\n      an autoImplicit GLOBAL via relaxedAutoImplicit-off + the\n      elaboration fallback,  silently poisoning the def (the goal\n      then displays the poisoning as `sorry`  --  misleading).\n      W2Kernel opens `open Real Filter BigOperators`;  E1Clause now\n      opens `Real` too.\n    - Div/log defs need the noncomputable flag (Real.div is\n      marked noncomputable in this pin;  W2Kernel marks every\n      such def;  E1Clause's convTerm/pairLog now do too).\n    - `positivity` refuses 0 < 1/2/(g^2+1/4)  (no hint on the\n      quadratic);  use  div_pos (by norm_num) + nlinarith [sq_nonneg g].\n\n  s9 (LAUNCHED,  taskset -c 0):  scripts/rh/s9_dk_above_g.py  --\n  the above-G face of the clause.  M(t)  at  17 heights:\n  straddle t = G_LAST + k/2 (k = 1..10;  G_LAST is a TRUE zero --\n  the last on-disk one --  so these are provable straddle rows)\n  + log-spread t = G_LAST * r (r = 1.05..2.2)  for the\n  M = a ln t - D  fit  (a = 2*dK).  ONE streaming pass over the\n  1.016e11-zero tail (L+A+B+C+D,  ~815GB),  chunk-vectorized over\n  all 17 heights.  No qrem/qext needed:  qeng cancels identically\n  in the residual.  Components smoke-verified before launch\n  (EPS = 2.07e-6 at G+1/2,  inside s8's verified EPS band;\n  log|zeta| = -0.816 dps-25).  ETA ~30 min.\n\n  * Artifacts:  formal/RhAttack/E1Clause.lean (v2,  gated);\n    scripts/rh/s9_dk_above_g.py (new);  formal/LEAN-GUIDE.md\n    (E1Clause line re-targeted)."}, {"n": 66, "date": "2026-10-15", "time": "", "title": "s9/s10:  the above-G face of the E1 clause is refuted by data at  ~1e8 scale;  the 7% dead zone located;  forensics clean", "body": "s9 (threaded v2,  cores 0-11,  commit a22553f)  completed at 00:34:\n  17 rows on the clause's real t-domain  (G, 2.2G]:\n    M(t)  =  EPS + log|zeta| - lm - la - re - I_far,RVM\n    t = G + k/2   (k = 1..10,  TRUE straddle rows on the top zero):\n                M = -8.577e7  (all ten,  spread  1.5)\n    t = G*r      (r = 1.05..2.2):  M  falls  -8.70e7 .. -1.057e8\n  The  Lean  E1Clause  (|M_wp|  <=  2  at  every  straddle  row  in\n  (G,  U_TOP])  is  therefore  REFUTED  BY  DATA  on  its  own\n  domain,  by  ~7  orders  of  magnitude,  on  the  measured  rows.\n  This  is  a  model-face  refutation:  the  far  RVM  model\n  (pairLog  x  Rho  over  (G,  1e30])  under-predicts  the  true\n  zero  product  by  ~8.6e7  there.  No  RH  claim  is  affected\n  one  way  or  the  other;  the  clause's  B  =  2  form  is  dead\n  as  formulated  and  must  be  re-derived  (domain,  model,  or\n  both  --  see  the  open  item  below).\n\n  FORENSICS  (all  ruled  out  by  measurement):\n    - I_far  quadrature:  dps-50  peak-isolated  agrees  with  the\n      run's  value  to  5.5;  the  f64  trapezoid  converges  to  it\n      as  resolution  rises  (1.47e7  ->  1.19e6  over  10x  grid).\n    - P(t)  =  log|zeta| - lm - I_far:  12-step  march  across  G,\n      perfectly  smooth,  no  code-path  discontinuity  at  G.\n    - STREAMED  DATA  SIDE:  independent  re-computation  of\n      the  whole  (1e7, G]  re-sum  at  t = G + 0.5  (engine  kernel\n      form,  single-expression,  longdouble  blocks,  8  threads)\n      agrees  with  the  stream  to  1.0e-4  absolute  on\n      1.2883e11.  The  numbers  are  what  they  are.\n    - la/re  kernels  identical  term-for-term  to  the  engine  (\n      day037  _prod_budget_day034).\n\n  THE  DEAD  ZONE  (s10  march,  11  rows,  one  pass):\n    s8  evidence  ends  at  t/G  =  0.92944  (M  =  +1.555);\n    s10:   0.940G:  M  =  -8.421e7\n           0.960G:  -8.474e7      0.980G:  -8.526e7\n           0.990G:  -8.552e7      0.999G:  -8.575e7\n           G-0.90, G-0.59, G-0.33, G-0.08  (true  midpoints  between\n           consecutive  recorded  zeros):  -8.577e7,  flat  at  O(1)\n           within  the  last  1.5  units  of  t  across  G\n    The  entire  ~8.4e7  transition  sits  in  the  t-window\n    (0.9294G,  0.940G)  --  a  7%  hole  no  prior  run  covered.\n    (Side  note:  the  naive  \"G - 0.5\"  detune  sits  2.3e-4  from\n    the  recorded  zero  at  G - 0.49977;  true  midpoints  used\n    instead.)  s11  (running)  maps  the  zone-substitution  error\n    Sum_minus_Int  over  the  data-covered  (0.7G, G]  at  14\n    heights  to  localize  the  mechanism  (local  substitution\n    vs  global  weighting).\n\n  UNCHANGED  /  STILL  STANDING:\n    - MainBridge  (gated),  c(t)  closure  theorem,  EPS  band\n      (verified  at  every  measured  row,  |EPS|  <=  2.07e-6),\n      and  ALL  below-0.929G  evidence  (M  in  [+0.009,  1.556],\n      flat  within  windows).\n    - The  drift  law  M  ~  1.242 (t/G)^2.256  was  fit  on\n      [0.108G,  0.929G]  ONLY;  its  \"threat  near  1.3G\"\n      extrapolation  is  retired  --  the  data  never  supported\n      it  and  the  true  structure  is  the  step  located\n      above.\n\n  * Artifacts:  tmp/s9_dk_above_g.{jsonl,md};  scripts/rh/\n    s9_diag_far.py, s9_diag_far2.py, s9_diag_p.py, s9_diag_reD.py;\n    scripts/rh/s10_deadzone_march.py + tmp/s10_deadzone_march.\n    {jsonl,md};  scripts/rh/s11_zone_sub_err.py  (running)."}, {"n": 67, "date": "2026-10-15", "time": "s2", "title": "s11-s16 close the forensics;  the E1 clause is re-derived and GATED as v3  (data-supported  M_defect  face)", "body": "THE  MECHANISM  (s11/s15/s18,  ruled  out  one  by  one):\n    - s11  zone-substitution:  Z(t)  =  Sum_(0.7G,G]  pairLog\n      -  Int_(0.7G,G]  pairLog  Rho  is  O(1..20)  at  14\n      heights  including  the  G+0.5  endpoint  --  the\n      ~8.6e7  defect  is  NOT  a  local  substitution  error;\n      it  is  global  far-range  weighting.\n    - s15  smooth-bias  fit  (e(g)  =  c0 + c1 ln g + c2/g\n      over  (G, 1e30],  least  squares  on  the  17  above-G\n      rows):  max  residual  1.48e7  --  no  smooth\n      3-parameter  far-density  bias  reproduces  the  shape;\n      the  generator  must  be  structured  in  t.\n    - s18  regularized  deconvolution:  unphysical  profiles\n      (total  charge  ~2.2e36)  --  the  naive  1-D\n      inversion  on  a  single  flank  is  ill-posed  as  set\n      up;  the  two-flank  version  stays  open  (physics\n      track,  not  clause  work).\n    - s13  dyadic-band  count  solve:  the  far  zero-count\n      discrepancy  required  to  explain  the  defect  through\n      (G, 1e30]  bands  is  O(1e17)  signed  --  six  orders\n      above  RH-scale  |DN|  <<  x^(7/64)  at  1e13-1e20.\n      Refutes  the  \"literal  missing  zeros  above  G\"\n      reading  of  the  defect;  the  RVM  far  face  simply\n      does  not  model  the  true  far  structure  as  a\n      count  offset.\n\n  THE  DEFECT  LAW  (s12  +  s16  GROWTH  FAMILY):\n    - s12  (27  rows,  (0.94G,  2.2G]):  M  =  a  ln  t  +  b\n      fits  to  1.7e3;  linear-in-t  is  1.5e6  (ruled  out).\n    - s16  (4  rows,  t  =  10G/50G/100G/1000G):\n        t/G  =  10:     M = -1.4393e8\n        t/G  =  50:     M = -1.8458e8\n        t/G  =  100:    M = -2.0208e8\n        t/G  =  1000:   M = -2.6023e8\n      decade  slope  -5.815e7  constant  to  0.5%  --  the\n      ln-t  family  holds  across  4.5  log-decades;\n      t  ln t  (count  offset  /  pole  at  G)  and\n      t^2/G  (far-bias  kernel)  are  ruled  out  at  the\n      data  level.\n    - 21  deduped  rows  above  G  (s9  +  s10-G+0.5  +\n      s16):  M  =  A  ln  t  +  B  with  A = -25256007,\n      B = +523513775  (exact-integer  least-squares),\n      max  |residual|  =  6704.088  (worse  row  2.2G);\n      far  part  (10G, 1000G]:  5792.878.\n\n  THE  PLUNGE  (0.9294G,  0.940G)  --  fully  in-chain,\n  no  bug:  re  cusp  sweep  +3.75e9;  I_far  cusp\n  approach  -3.92e9  with  ANALYTIC  and  numerically\n  verified  slope  I_far'(t)  =  -2*Rho(t)*ln((G+t)/(G-t))\n  (=  -12.37  per  unit  at  the  window,  matches  the\n  11-row  march);  lm  growth  -2.49e8  (lm'(t)  =  pi/4\n  -  1.75/t,  exact);  a  REAL  zeta  swing  +2.2  (zeta\n  wiggles  0.09  ->  12.7  across  the  window;  from-\n  scratch  Riemann-Siegel  agrees  with  mpmath  to\n  3e-3,  and  the  s10  stored  value  is  stable  dps-25\n  to  dps-60);  la  +0.48e6.  Sum  of  channel  deltas:\n  -8.4207e7  =  dM  to  13  digits.\n\n  I_FAR  METHOD  NOTE  (locked  after  s16):  the  f64\n  u-uniform  trapezoid  cross-check  IS  known-bad  at\n  high  t:  trap-vs-quad  differs  by  -6.8e7  (10G),\n  +5.4e7  (50G),  -5.4e8  (100G),  -4.6e9  (1000G)  --\n  a  log-cusp  cell  error  ~13*h  with  h  =  t*du,\n  growing  in  t.  The  dps-40  tanh-sinh  quadrature  is\n  the  trusted  I_far  method  (4-way  cross-check  to\n  5.5  at  G+0.5,  including  the  dps-50  peak-isolated\n  value).  s16  rows  stand  on  the  quad.\n\n  INTERPRETATION  (physics,  not  clause):  the\n  identity  dM/d(ln  t)  =  2*E0  on  (G,  1000G]  pins\n  a  far-discrepancy  charge  E0  =  -1.263e7  (weighted\n  zeros):  the  Rho  model  over-counts  by  ~12.6\n  million  weighted  zeros  in  its  first  region  above\n  G.  A  narrow  charge  near  g  =  G  reproduces  the\n  above-G  slope  EXACTLY  (2*E0  =  A)  but  predicts\n  M_wp  >  0  immediately  below  G,  contradicting  the\n  measured  O(1)  below-G  face  --  so  the  generating\n  e(g)  is  NOT  a  single  near-G  delta;  the  two-\n  flank  e(g)  deconvolution  is  the  open  physics\n  question.  The  defect  is  consistent  with  everything\n  verified  (zeros  certified  to  1.4e13;  the  ln-t\n  rows  constrain  only  the  discrepancy  structure,\n  not  the  zero  COUNT,  below  there).\n\n  THE  RE-DERIVED  CLAUSE  (E1Clause  v3,  GATED  in\n  formal/RhAttack/E1Clause.lean,  full  lake  build\n  green,  sorry-free):\n    T_MEAS  =  1000*G_LAST;  defect_A  =  -25256007;\n    defect_B  =  +523513775;  M_defect  t  =  A*ln  t  +  B;\n    E1ClauseV3  q  B  =  |M_wp  q  t  -  M_defect  t|  <=  B\n    at  every  straddle  row  in  the  MEASURED  domain\n    (G_LAST,  T_MEAS]  --  data-supported  B  =  7000\n    (margin  295.91  over  21  rows).\n  Glue  (all  Lean-proven):\n    mdefect_bounded:  |M_defect  t|  <=  7.6e20  on  the\n    domain  --  deliberately  LOOSE:  the  pinned  Lean\n    4.33.1  /  mathlib  v4.33.1  norm_num  does  NOT\n    evaluate  Real.exp  (probe:  even  `exp 1 < 4`\n    fails);  the  tight  2.85e8  bound  is  recorded  at\n    the  data  level  and  affects  only  this  glue\n    line,  never  the  clause.\n    e1V3_implies_e1:  E1ClauseV3  q  B  ->  |M_wp  q  t|\n    <=  B  +  7.6e20  on  (G_LAST,  T_MEAS]  (triangle\n    through  M_defect)  --  the  composition  path  back\n    to  the  original  absolute  clause  form.\n  E1Clause  (B  =  2)  and  E1ClauseV3  (B  =  7000)  are\n  both  still  named  OPEN  data-supported  clauses;  v3\n  is  the  form  the  above-G  data  actually  supports.\n  if_E1_and_walk  composes  unchanged  from  the\n  E1Clause  face.  Part  C  re-verified  3/3;  Part  C2\n  (above-G  gates)  5/5  (#eval  Float  gates  incl.\n  +6704.088459  at  2.2G  and  -5287.599966  at  1000G).\n\n  UNCHANGED  /  STILL  STANDING:\n    - Gated  base  untouched  (MainBridge,  c-t  theorem,\n      S4/P12/ZetaZeroSet,  all  prior  gates).  No  RH\n      claim  is  made.  The  zeta  channel  is  healthy\n      (s14  from-scratch  Riemann-Siegel  vs  mpmath:\n      3.3e-3  at  G+0.5,  1.4e-3  at  1.05G,  2.5e-3  at\n      2.2G,  1.1e-2  at  1e7).\n    - Below  0.9294G:  M  in  [+0.009,  1.556],  B  =  2\n      supported  there  (s8,  505  rows).\n\n  * Artifacts:  scripts/rh/s11_zone_sub_err.py  +\n    tmp/s11_zone_sub_err.{jsonl,md};  tmp/s12_defect_law.\n    md;  tmp/s13_disp_solve.py;  tmp/s14_rs_check.py;\n    tmp/s15_smooth_fit.py;  scripts/rh/s16_M_far.py  +\n    tmp/s16_M_far.{jsonl,md};  tmp/s17_families.py;\n    tmp/s18_deconv.py;  formal/RhAttack/E1Clause.lean\n    (v3  +  Part  C2);  formal/LEAN-GUIDE.md  (UPDATE 2\n    on  the  clause  line)."}, {"n": 68, "date": "2026-10-15", "time": "pm", "title": "s19:  the two-flank  e(g)  deconvolution  completes  --  the  defect  IS  a  small  local  Rho  departure  with  a  big  count", "body": "METHOD  (no  quadrature  anywhere):  M  =  Int_G^1e30\n  pairLog(g,t)  e(g)  dg  with  EXACT  analytic  band\n  kernels  (anti-derivatives  of  log|g-t|  (primitive\n  continuous  through  the  cusp),  log(g+t),  and\n  log(g^2+1/4));  cusp  verified  against  a  2e8-point\n  shifted  midpoint  quad  to  2e-4.  Grid:  2000  fine\n  linear  bands  (G,  G+500]  +  80  log  bands  to\n  1e30.  Tikhonov  (first-diff),  lam  swept  1..1e12:\n  the  solution  is  LAM-INSensitive  (min-norm\n  dominated).  79  measured  rows  (58  below-G  from\n  the  upper  s8  face  +  s10  transition  +  s9  +\n  s16).\n\n  FIT:  max|residual|  =  1.4045  on  the  1e8  scale\n  (rel  ~1e-11  at  the  high-t  rows;  O(0.02)  on  the\n  O(1)  below-G  face)  --  the  ENTIRE  measured  defect,\n  both  flanks,  is  reproduced  by  a  single  bounded\n  e  on  (G,  1e30].\n\n  WHERE  THE  CHARGE  IS  (min-norm  read):\n    (G,   1.2G]:     O(1e-7)     (NO  boundary  layer\n                      at  G  --  the  near-G  delta\n                      hypothesis  is  dead)\n    (2G,  5G]:      -7.7e8\n    (5G,  1000G]:   -7.3e8  to  -2.2e9  per  log  band,\n                      cumulative  -8.1e9  zeros  at\n                      1000G\n    (1000G, 1e5G]:  -3.6e9  (slow  tail)\n    (1e5G,  1e30]:  unobservable  gauge  for  every\n                      measured  row  (t  <=  1000G);\n                      min-norm  dresses  it  with\n                      +-1e23  oscillation  --  not\n                      physics.\n\n  LOCAL  AMPLITUDE  (the  honest  size):\n    max|e|  =  0.0139  per  unit  g,  at  g  ~  4.2G:\n    0.36%  of  Rho  there;  0.17%  at  5-9G;  0.09%  at\n    10G;  0.009%  at  100G;  0.001%  at  1000G.  The\n    ~1e10  cumulative  zero  count  is  built  out  of  a\n    sub-0.5%-of-Rho  local  bias  spread  over  the\n    first  ~1000G.\n\n  ROBUSINESS  (grids  and  penalties  swept  before\n  the  read  was  trusted):  the  FIT  is  stable\n  (max|res|  in  [1.34,  1.55]  across  L  =  500/\n  2000,  h  =  1/4,  n_log  =  80/160,  lam  =\n  1e2/1e8),  but  the  min-norm  representative\n  MOVES  with  the  grid:\n    2080 bands:  max|e|  =  1.39e-2,  E(1000G)  =  -7.4e9\n    2160 bands:  max|e|  =  6.36e-3,  E(1000G)  =  +4.6e9\n    4160 bands:  max|e|  =  2.11e-3,  E(1000G)  =  +3.5e8\n    4240 bands:  max|e|  = 1.72e-4,  E(1000G)  =  +2.4e7\n  so  the  specific  peak  (0.36%  of  Rho  at  4G)\n  and  the  specific  cumulative  (~8e9  by\n  1000G)  are  REPRESENTATIVE,  not  predicted:  the\n  rows  determine  M,  not  e  --  e  is  pinned\n  only  up  to  the  kernel  near-null  space  and\n  the  grid  resolution.\n\n  READ  (the  stable  content):\n    1.  EXISTENCE:  the  entire  measured  defect,\n        both  flanks,  is  reproduced  to  1.4  by  a\n        bounded,  smooth  e  on  (G,  1e30];  the\n        minimum  representative  has  max|e|  <=\n        0.36%  of  Rho  and  can  be  made\n        thinner  still  with  finer  structure.\n    2.  NO  boundary  layer  at  G  (in  every\n        configuration;  also  follows  directly\n        from  the  below-G  O(1)  face).\n    3.  The  far  region  (1e5*G,  1e30]  is\n        unobservable  gauge  for  every  measured\n        row  (t  <=  1000G).\n  So  the  \"missing  tail\"  is  a  BOUNDED  Rho\n  departure  somewhere  in  the  first  un-\n  certified  decades  above  G:  not  a  boundary\n  layer  at  G,  not  individual  missing  zeros,\n  not  a  pole,  not  a  kernel  failure.  Its\n  location  and  amplitude  are  NOT  yet  pinned\n  by  the  current  rows  (more  t-coverage,\n  especially  (100G,  1e5G],  would  sharpen\n  this).  (s13's  O(1e17)  band\n  solve  is  the  coarse-65-band  centroid  basis\n  reading  of  the  same  data,  with  rank  6  and\n  residual  3.1e5;  s19's  exact-kernel  2080-band\n  solve  supersedes  it.)  No  RH  claim  is  made:\n  this  is  a  statement  about  the  true  zeros  vs\n  the  Rho  model  on  the  M_wp  face,  consistent\n  with  all  data  verified  to  the  frontier.\n\n  * Artifacts:  tmp/s19_twoflank_deconv.{py,jsonl,md};\n    cusp-kernel  verification  (analytic  vs  2e8-point\n    shifted  midpoint:  2e-4,  in-band  and  at-band-edge\n    cusps)."}, {"n": 69, "date": "2026-10-15", "time": "pm2", "title": "s20:  the  ln-t  defect  law  survives  four  more  decades;  the  e-track  closes  at  the  data  limit", "body": "s20  (5  new  rows,  the  la/re  CACHE-VERIFY\n  FIX  landed  first  --  a  first  launch  had\n  silently  reused  s16's  la/re  cache,  and\n  those  rows  were  invalid  and  discarded\n  before  reporting):\n    t/G  =  2e3:     M  =  -2.77736186e8\n    t/G  =  5e3:     M  =  -3.00875798e8\n    t/G  =  1e4:     M  =  -3.18380239e8\n    t/G  =  5e4:     M  =  -3.59024315e8\n    t/G  =  1e5:     M  =  -3.76528829e8\n\n  THE  LAW  (now  26  rows,  1.05G  ..  1e5G,\n  5.3  log-decades):  A  =  -2.525487e7,\n  B  =  +5.234857e8,  max  residual  7673\n  (growing  smoothly  to  -1.64e4  at  1e5G\n  against  the  gated  21-row  constants  --\n  no  family  break).  Decade  slope\n  -5.815e7  holds  to  ~3e-7  relative  at\n  1e5G.  (Candidate  sub-log  term,  THIN\n  evidence:  the  residual  growth  fits\n  -1344*(t/G)^0.217;  flagged,  not\n  claimed.)  The  gated  v3  clause  is\n  UNCHANGED  (its  21-row  face  stands);\n  the  law  extension  is  recorded,  not\n  re-gated.\n\n  e-TRACK  CLOSURE  (s19b  with  s20  rows,\n  84  rows  total):  the  grid  sweep  is\n  UNCHANGED  by  the  5  leverage  rows\n  (max|res|  ~1.56  in  every  config;\n  E(1000G)  grid-representative  as\n  before;  coarse-representative  peak\n  max|e|  =  0.0139  at  4.2G  unchanged).\n  Conclusion  (the  data  limit):  the\n  measured  defect  is  a  SMOOTH  ln-t\n  law,  and  smooth  rows  cannot\n  separate  the  location  of  the  e  that\n  produces  it  --  pinning  it  needs\n  non-smooth  input  (independent\n  zero-count  data  above  the  3.1e10\n  certified  frontier,  e.g.  a  far\n  band  census).  Stable  physics\n  (final):  the  missing  tail  =  a\n  BOUNDED  Rho  departure  (coarse\n  representative  <=  0.36%  of  Rho,\n  thinner  with  structure),  NO  G\n  boundary  layer,  (1e5*G,  1e30]\n  unobservable;  M  =  A  ln  t  +  B\n  (26-row  constants  above)  on\n  (1G,  1e5G]  to  O(1e4).  No  RH\n  claim.\n\n  * Artifacts:  scripts/rh/s20_M_farter.py  (la/re\n    cache  now  stores  and  verifies  its  ts);\n    tmp/s20_M_farter.{jsonl,md};\n    tmp/s19b_twoflank_pin.{py,jsonl}."}, {"n": 70, "date": "2026-10-15", "time": "pm3", "title": "s21  +  s22:  the  defect  law  is  the  final law  --  pure  ln  t  over  6.3  log-decades;  sub-log  flag retired", "body": "s21  (2  new  rows  beyond  the  s20  range):\n    t/G  =  3e5:     M  =  -4.04273493e8\n    t/G  =  1e6:     M  =  -4.34686996e8\n\n  s22  (family  discriminator,  28  rows,\n  t/G  =  1.0  ..  1.0e6,  6.3  log-decades):\n    F1  pure  ln  t:        A  =  -2.525484e7,\n        B  =  +5.234850e8,  max  residual\n        7719  (worst  row  at  10G).\n    New  rows  vs  F1:  3e5G  res  =\n        -3810;  1e6G  res  =  +3625  --\n        both  squarely  inside  the  F1\n        residual  band.\n    F2  with  sub-log  term\n        C*(t/G)^a:  NOTHING  --  the\n        best  interior  a  =  0.10  buys\n        only  650  on  the  7700  scale,\n        and  the  unconstrained  fit\n        degenerates  to  the  a ->  0\n        log  re-split  (C*(t/G)^0.025  =\n        another  ln  t  with  a\n        constant).  The  thin\n        sub-log  flag  (pm2,  2-point\n        fit,  -1344*(t/G)^0.217)  is\n        RETIRED  as  unsupported.\n\n  THE  DEFECT  LAW  (final,  28  rows):\n      M(t)  =  -25254840  ln  t  +\n      523485000    on  (1G,  1e6*G],\n      max  residual  7719  (~2e-5\n      relative  at  the  far  end).\n  The  gated  v3  clause  (21-row  face,\n  B  =  7000,  T_MEAS  =  1000*G)  is\n  UNCHANGED  --  the  extension  is\n  recorded,  not  re-gated.  No  RH\n  claim.\n\n  * Artifacts:  scripts/rh/s21_M_beyond.py;\n    tmp/s21_M_beyond.{jsonl,md};\n    tmp/s22_family.{py,md}."}, {"n": 71, "date": "2026-10-15", "time": "pm4", "title": "S1Sample  gated;  phase  plan  for  the sample->uniform  reduction", "body": "S1Sample.lean  GATED  (commit  f13c188,  full  build\n  green):  the  proven  sample  ->  uniform  bridge  for\n  the  S1  leg  (Lipschitz  +  cover  lemma,  glue  on\n  (G_LAST,  T_MEAS],  restriction  back  to  the  named\n  v3  clause).  The  open  surface  of  the  clause  is\n  now  EXACTLY  three  data  claims:  row  face  (gated),\n  LIP  face  (s23  running),  cover  (gated:  Dv  =\n  900*G  =  2.7000941e13  --  AMENDED,  the  earlier\n  2.3383e11  was  the  2.2G  ->  10G  gap  only).\n  Uniform  bound  candidate  on  landing:  B_whole  =\n  7719  +  L2  *  Dv.  Gate  pattern  learned:  the\n  Real  world  is  not  #eval-able  (classical\n  axioms);  data  gates  are  Float  LITERALS,  exact\n  Real  forms  carry  the  theorems.\n\n  BELOW-G  COVER  (measured  now  from  the  505  s8\n  rows):  t  range  (0.107735G,  0.929444G);  gaps:\n  p50  =  p90  =  0.5  (adjacent  straddle  rows),\n  p99  =  1.4026e9,  MAX  =  5.809927e9  at  t/G\n  0.2713  ->  0.4650  (the  s8  rows  skip  0.19G  in\n  one  region);  row  face  min  =  0.0091,  max  =\n  1.5555.  Dv1  =  5.8099e9.\n\n  PHASE  PLAN  (queued):\n    P1  (running,  ~3.6h):  s23  --  M-prime  face\n        above  G  (31  targets:  21  in-domain  rows\n        +  6  s10  dead-zone;  per-channel  dps  with\n        the  streamed  dsum  over  1.016e11  zeros).\n    P2  (queued,  ~3-5h,  launches  after  P1):\n        s24_mprime_bg.py  --  M-prime  face  below  G\n        (28  stratified  targets,  8  dense  in  the\n        0.27..0.47G  big-gap  region;  face  =\n        max|M'|,  uniform  candidate  =  1.5555  +\n        L1  *  5.8099e9).\n  After  P1  +  P2  land:  the  full  two-flank\n  sample  ->  uniform  reduction  is  data-backed  on\n  both  faces  (above-G  residual  face,  below-G\n  absolute  face),  with  uniform  bounds  B +  L*Dv\n  from  the  proven  lemma  --  the  clause  open\n  surface  reduced  to  measured  rows  +  measured\n  derivatives  +  measured  gaps,  each  #eval-gated.\n  No  RH  claim."}, {"n": 72, "date": "2026-10-15", "time": "pm5", "title": "s23  landed  --  the  derivative  face and  the  scope  settlement  of  the  S1Sample  bridge", "body": "s23  (31  rows:  6  s10  plunge  +  21  in-domain  +\n  the  4  far  rows,  all  channels  at  dps,  dsum\n  streamed  over  1.016e11  certified  zeros,  total\n  ~50  min  --  much  faster  than  the  3.6h\n  estimate):\n\n  THE  DERIVATIVE  FACE  (the  main  result):\n    *  M-prime  above  G  is  a  CUSP  TRAIN  at  the\n      TRUE  (mostly  un-certified)  super-G  zeros:\n      the  fast  oscillation  is  logzeta'  =  ~1/d\n      (d  =  distance  to  the  nearest  true  zero,\n      known  only  through  zeta,  not  from  the\n      certified  ledger);  the  certified  dsum  has\n      NO  cusp  above  G  (it  ends  at  G_LAST)  and\n      is  smooth  there  (+8.2..+9.2).\n    *  max  |M-prime|  over  the  31  rows  =  78.9887\n      (a  row  with  d  ~  0.013  to  a  true\n      super-G  zero);  max  |M-prime  -  A/t|  =\n      78.9887  at  the  same  row;  the  far  rows\n      (10G..1000G)  settle  to  |M-prime|  <=  1.34\n      (the  slow  drift  face).\n    *  lm-prime  =  pi/4  +  O(1/t)  confirmed  to\n      2e-6  (the  main  term  is  LINEAR  in  t,\n      ~0.785*t  --  the  earlier  t-log-t  scale\n      estimates  were  wrong;  all  per-channel\n      floors  are  <=  0.11  row-dependent,  see\n      the  module).\n    *  per-channel  floors  (dsum  1.3e-5  f64-t\n      cusp  amplification;  lm  1e-11;  I_far  5e-8;\n      logzeta  1e-14;  eps  1e-38):  the  face  is\n      REAL  data,  not  floor.\n\n  SCOPE  SETTLEMENT  (corrects  the  pm4  framing):\n    *  The  S1Sample  t-Lipschitz  bridge  is  the\n      correct  reduction  ONLY  where  Mres  is  C^1:\n      BELOW  G  (the  wp  pairing  cancels  the\n      self-zero  cusp;  M_wp  finite  and\n      smooth)  --  P2  (s24,  12  targets,\n      RUNNING  now)  measures  that  face.\n    *  ABOVE  G  the  wp  face  KEEPS  the  ln\n      cusps  (M_wp  ->  -oo  at  every  true\n      super-G  zero):  the  hLip  premise  of  the\n      glue  FAILS  at  those  points;  the  t-metric\n      bound  (7719  +  79*2.7e13  ~  2.1e15)  is\n      formal  but  VACUOUS,  and  the  bridge  is\n      declared  OUT  OF  SCOPE  there  (documented\n      in  the  module  header).\n    *  The  v3  clause  stays  a  ROW-FACE  clause\n      above  G,  and  its  face  is  ROBUST  to\n      unmeasured  rows:  the  ln  cusp  AMPLITUDE\n      AT  A  ROW  is  at  most  ln(1/d)  +  face\n      (d  =  nearest  zero  distance  at  the  row):\n      the  row  offset  net  (>=  0.5  from  the\n      row's  own  certified  zero)  plus  the zero\n      spacing  bound  the  reachable  d  from\n      below  in  any  measurable  case;  even  at\n      d  =  1e-6  the  amplitude  is  ~14,  far\n      inside  the  7719  face.  The  clause  needs\n      no  whole-domain  statement  above  G  --\n      the  walk  composition  consumes  the  row\n      face  as  its  S1  input.\n    *  Net:  the  S1  leg's  open  content  is  now\n      (a)  the  below-G  face  =  row  face\n      (0.0091..1.5555,  gated)  +  LIP  face\n      (s24,  running)  +  cover  (5.8099e9,\n      measured)  +  proven  bridge;  (b)  the\n      above-G  v3  row  face  (gated  7000/7719)\n      +  the  derivative  record  (s23,  gated  in\n      the  module)  +  the  robustness  argument\n      (this  entry).  No  RH  claim.\n\n  s24  is  running  (12  stratified  targets  below\n  G,  ~1.5-2h  at  the  s23  speed  --  the  D  pass\n  took  ~45  min,  not  3.5h).  No  RH  claim."}, {"n": 73, "date": "2026-10-15", "time": "pm6", "title": "s24  landed  --  the  S1  track  is settled  at  the  data  limit", "body": "s24  (12  stratified  targets  below  G,  ~20  min):\n    L1  face  =  max  |M-prime|  =  13.5856  (at\n    0.65G);  the  structure  is  the  SAME  cusp  pair\n    as  above  G:  logzeta-prime  and  dsum-prime  are\n    both  ~1/d  at  the  nearest  CERTIFIED  zero\n    (partially  cancelling  in\n    M-prime  =  eps-prime  +  logzeta-prime  -\n    lm-prime  -  dsum-prime  -  I_far-prime);\n    targets  far  from  zeros  settle  to\n    |M-prime|  <=  1.1  (the  smooth  remainder\n    face);  per-row  floors  <=  8.1e-5.\n\n  FINAL  STATEMENT  (the  S1  track,  both  flanks):\n    *  The  clause  is  a  ROW-FACE  object  everywhere\n      (M_wp  keeps  the  ln  cusps  at  every  zero  on\n      both  sides  of  G;  the  wp  replacement  fires\n      only  at  the  exact  zero  height).  Its  faces\n      are  measured:  below  G  =  0.0091..1.5555\n      (505  rows,  gated),  above  G  =  the  v3\n      residual  face  (gated  7000/7719  on  28\n      heights).\n    *  CUSP  ROBUSTNESS  (the  operative  between-row\n      evidence):  at  a  row,  the  ln  cusp  amplitude\n      is  at  most  ln(1/d)  +  face  (d  =  the\n      row's  nearest  zero  distance):  ~7  at\n      d  =  1e-3,  ~14  at  d  =  1e-6  --  inside\n      both  faces  by  orders  of  magnitude.\n    *  The  t-Lipschitz  bridge  (S1Sample,  proven)\n      is  OUT  OF  SCOPE  at  the  cusps  (hLip  false);\n      its  uniform  bounds  are  FORMAL  BUT  VACUOUS\n      at  the  measured  L-faces  (below-G  candidate\n      7.89e10  vs  1.5555;  above-G  ~2.1e15  vs\n      7719).  Derivative  interpolation  across  the\n      measured  gaps  is  IMPOSSIBLE  at  L  ~  O(1-80)\n      --  the  gap  regions  must  be  measured\n      directly,  or  controlled  by  the  squeeze  leg\n      (P12,  named  open  program  component;  its\n      O(1)-walk  face  below  G  is  the  s8  c(t)\n      walk,  and  above  G  the  v3  residual  face  on\n      the  28  measured  heights).\n    *  The  proven  lemma  remains  the  bridge  for\n      C^1  auxiliaries  (e.g.  the  cusp-excision\n      face  M*  =  M  -  zero-log-product,  whose\n      derivative  face  is  the  O(0.01-1.1)  smooth\n      remainder  --  a  P3  candidate  if  ever\n      needed).\n    *  S1  track  COMPLETE  at  the  data  limit:\n      row  faces  (gated),  L-faces  (gated:\n      78.9887  above,  13.5856  below,  floors\n      recorded),  covers  (measured:  900G  /\n      5.8099e9  +  the  gap  spectrum),  proven\n      bridge  +  scope  (module),  robustness\n      argument  (this  log).  No  RH  claim.\n\n  * Artifacts:  scripts/rh/s24_mprime_bg.py;\n    tmp/s24_mprime_below_g.{jsonl,md};  all  in\n    the  S1Sample  gates  (9/9  Float,  build\n    green)."}, {"n": 74, "date": "2026-10-15", "time": "pm7", "title": "external  input  reviewed: openai/math  (release  2026-10-06)  --  family  003 (quasi-RH,  Re  s  >  7/8)  +  Z78Strip  module  GATED", "body": "OWNER  ASKED  FOR  A  REVIEW  OF  github.com/openai/math\n  (\"744  or  so  things  proven  or  discovered  etc\").\n  Catalog  counts  in  flight:  722  at  release  (3\n  withdrawn  ->  719  live  per  the  pinned  commit\n  README),  community  trackers  count  749  at  the\n  Oct-8  update  commit;  372  result  families.\n\n  REVIEW  SUMMARY\n    *  A  single  release  of  model-produced  manuscripts\n      with  a  Lean  library  (123,565  files,  ~26M\n      lines,  Lean  4.34.1  +  Mathlib).  The  number-\n      theory  center  of  gravity  is  FAMILY  003:\n      \"The  quasi-Riemann  hypothesis\":  every  Dirichlet\n      L-function,  including  zeta,  is  zero-free  in\n      Re  s  >  7/8  (199  pp,  30  Sep);  a  companion\n      11/12  proof  (human  edited);  \"Uniform  exclusion\n      of  Landau-Siegel  zeros\"  (9  pp,  (1-beta)log  q\n      >=  c  uniform).  The  paper  states  EXPLICITLY\n      that  RH  remains  open.  No  family  in  the\n      catalog  touches  critical-line  |zeta|  behavior\n      (no  mollifiers,  no  Z(t),  no  moments)  --  so\n      nothing  in  the  release  addresses  the  S1-gap\n      form  of  our  program.\n    *  PROOF  STRUCTURE  (read  from  the  preprint):\n      two  stages  (11/12  first,  then  7/8  via  prime\n      compensation  +  asymmetric  scales  +  two  more\n      moment  estimates);  a  common  continuation\n      principle  comparing  two  representations  of  a\n      completed  cubic-theta  sum  over  the  finite-\n      order  Hecke  characters  of  Q(√-3);  builds  on\n      cited  public  results  (Dunn-Radziwill  cusp\n      expansions,  Goldmakher-Louvel  +  Heath-Brown\n      large  sieve,  Huxley,  a  sextic  specialization\n      proved  in  the  paper).  Family-specific  machinery\n      --  not  directly  transferable  to  the  single-\n      function  zeta  walk  of  our  program.\n    *  VERIFICATION  STATUS  (logged  2026-10-15):\n      kernel-verified  by  at  least  TWO  independent\n      replays  on  two  kernels  sharing  no  code  (Lean\n      4.34.1  default  kernel  +  NanoDa;  Goldblatt\n      re-run  Oct-7  63  min  single  machine;  teal-sea\n      laboratory  replay  Oct-8:  #print  axioms  =\n      exactly  propext  +  Classical.choice  +  Quot.\n      sound;  Comparator  exit  0  on  zeta/Dirichlet/\n      Siegel  configs);  the  import  closure  is\n      published  and  text-scanned  sorry-free  (closure\n      sorry-freedom  depends  on  a  published  31k-line\n      patch  to  one  third-party  dependency,  pinned  by\n      their  build);  HUMAN  REVIEW  STILL  IN  PROGRESS\n      (the  199  pp  largely  unread;  Banks  line-\n      checked  the  Siegel  paper,  arXiv  2610.15483,\n      unrefereed;  MathOverflow  discussion  active;\n      follow-up  Liu  arXiv  2610.12234  imports  the\n      OpenAI  preprint  inputs  as  load-bearing  --\n      flagged  by  third-party  review  as  the  soft\n      spot).\n      Sparse  clone  at  references/openai/math  (blobless;\n      manifests  +  comparator  files  +  family  003\n      preprints  inspected).\n\n  LEAN  INTEGRATION  (GATED,  commit  below)\n    *  New  module  formal/RhAttack/Z78Strip.lean:\n      the  three  external  results  as  NAMED  PROPS  in\n      Mathlib  vocabulary  (externalZeroFree78,\n      externalZeroFreeDirichlet78  --  with  [NeZero  q]\n      as  in  their  pinned  comparator,  externalSiegelGap);\n      PROVEN  from  externalZeroFree78:\n      zetaZeroStrip  (every  non-real  zero  of  Mathlib's\n      riemannZeta:  1/8  <=  Re  <=  7/8;  the  lower\n      edge  =  functional  equation  riemannZeta_one_sub\n      +  cpow_ne_zero_iff  +  Gamma_ne_zero  +\n      Complex.cos_eq_zero_iff,  all  pinned-mathlib)\n      and  offPairD0le  (every  off-line  pair  of  an\n      actual-zeta  zero  set  has  d0  <=  3/8).  3/3\n      Float  gates.  Full  build  green  (17450  jobs).\n      A  new  INPUT  CLASS  for  the  program:\n      independently  kernel-verified  external  theorems\n      (stronger  than  citation-only,  weaker  than\n      proven-i
