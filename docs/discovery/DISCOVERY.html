eclaration, not a proof):  for ANY mechanism map gen (excess-on-scale to generated drift), there EXISTS a positive far-side count excess E, supported on the measured s29 g-window [2e8, 1e11] in g = t/G units, whose generated drift hits the three pinned D values:  the open MECHANISM mathematics, named, with the five gates as its measured shadow.  HONESTY SPLIT:  LEAN-PROVEN the five gates (norm_num on the pins);  DECLARED the face (measured, not proven);  PINNED the nl values from the s33b record.  ENDPOINT RELATION:  RHEnd.rh_program78 is UNAFFECTED - the far region is VACUOUS in the body from [Z78] (Z78P12.offPairFarEmpty), so the B7 face is a MEASURED CONSTRAINT that any RH proof must reproduce (the PATHWAY section 3 list), NOT one of the four named endpoint residuals (hs1 / hs3 / hWin / hS2low).  CARDS:  97 cards / 749 body lines (new card formal/cards/B7Far.md;  the MFar card's USES now names B7Far as consumer);  _MAP.md carries the B7Far block (five gates + the face + the endpoint-relation note).  Next consumer candidates:  the walk (B1) and the law-territory clause (B5);  the remaining named endpoint faces (hs1, hs3, hWin, hS2low, S4Blind.s4OpenFace) are untouched by this entry."}, {"n": 105, "date": "2026-10-17", "time": "2201", "title": "hWin window face wired (GATED): formal/RhAttack/S4WinCap.lean certifies the window floor cap and the face identity - on the WHOLE window band 1000 <= t, 0 < d < 1/200 the unified S2 floor floStripMin is STRICTLY BELOW a single S4 wire term (floor = own mass mown < 31/(10^5 t^2), and that cap is below the P8 tail term at the wire index on both branches: near t <= 110000 by the squaring chain to 50000^2 t^4, far t > 110000 by 62t < 100000 t^2), so hWinFace (the hWin hypothesis of RHEnd.rh_program78 over the Z78P12 aliases) is EQUIVALENT to zero-exclusion of off-line zeros on [1000, inf) x (0, 1/200). The squeeze instrument is certified NOT to reach the window band; the face is the zero-exclusion statement there. Measured backstop (s35a survey): margin floStripMin - (Bwire + Mr) < 0 at every surveyed point on t in [1e3..3e10] x d in (1e-9, 1/200), floor = 4d^2/t^2 to relative 2e-13, Xwire(110000) = 1.827275e-3 <= RX, 25m total at T0 = 0.936536 < 0.9975. 98 cards; full tree green (17450 jobs)", "body": "FORMAL MILESTONE (no RH claim): the hWin residual of the endpoint is now CHARACTERIZED - the window squeeze is proven to be the wrong instrument on the window band, and the face is named as the zero-exclusion statement the band actually requires.  MODULE:  formal/RhAttack/S4WinCap.lean (namespace S4WC; imports Mathlib + the pinned dependency closure B0/B4/B5/B3Core/S4Asm/S4Window/S4Growth/S4Own/S1LowT/Z78P12/P8Floor/FloorUnif; build green; full tree re-verified at 17450 jobs, 0 errors; 0 sorry).  THREE CONTENTS:  (1) poffOwnMown - at the pair's OWN HEIGHT (gamma = t) the B5 off-line factor product has mass exactly S4O.mown t d: B5's four canonical factors at (t, d, t) are exactly the 8-factor S4Own kernel (z1..z4 via the rhoPP/rhoPM/rhoNP/rhoNM = z1..z4 identification chain, closed by dsimp + Complex.ext + simp/ring, with halfR = (2:R)^-1 = 1/2 as the bridging numeral), and S4O.hMownProd is the 25n closed-form bridge.  (2) floorBelowWire - the window floor cap, proven on the WHOLE band 1000 <= t, 0 < d < 1/200:  floStripMin t d <= |poff| t d t = mown t d [min/max structure of floStripMin + poffOwnMown];  mown t d < 31/(10^5 t^2) [mownWindowScale: each own-kernel factor pinned SEPARATELY and then multiplied - 4d^2 < 1/10000 from d < 1/200 (cross-multiplied), 1 + 1/(16 t^2) <= 16000001/16000000 (one_div_le_one_div + nlinarith on the exact identity), exp(1/t^2) <= 1/(1 - 1/t^2) <= 1000000/999999 (the log x <= x - 1 pin with t^2 >= 10^6); the strict-inequality discipline matches every mul_lt_mul_of_pos_{left,right} call to the goal's literal factor parse];  and 31/(10^5 t^2) is STRICTLY below the p8_B(t, n) tail term at the wire index on BOTH branches:  near (t <= S4W.T0 = 110000) via nearTailBelowScale - the squaring chain 12493 t/8 < 12493 t^4/8 < 2e9 t^4 <= 2.5e9 t^4 = 50000^2 t^4 (all explicit mul_le_mul_of_nonneg_left/right and mul_lt_mul_of_pos_left with the positivity haves made explicit; the wire index floor(13 t/8) is <= the t^2 scale via S4W.hpow1 and Nat.floor_le);  far (t > T0) via farTailBelowScale - 62 t < 100000 t^2 by div_lt_div_iff0 cross-multiplication (31 t / 50000 < t^2, i.e. 31 t < 50000 t^2, at t > 110000), with the wire index floor(t^2) below the t^2 scale again by floor_le.  hXgrowPos carries the far branch: S4G.Xgrow t > 0 for t > T0 (every factor positive; Sbar > 0 by the S4W.hLn27 ln-pin with 27 <= t^2).  (3) THE FACE IDENTITY - def hWinFace (z) restates the hWin hypothesis of RHEnd.rh_program78 VERBATIM over the Z78P12 wire aliases (BwireP/MrP/MfP of Z78P12 == S4A.BwireR/MrR/MfR on the band), and two theorems close the equivalence:  hwinFaceImpliesZeroExclusion (a zero set holding the face has NO off-line zero in [1000, inf) x (0, 1/200):  the endpoint's own squeeze gives wire + Mr + Mf < floor while floorBelowWire gives floor < wire, with Mr >= 0 (hMrgen, branched on t <= T0 with S4W.hXwire_pos / hXgrowPos) and Mf = 0, so wire < wire + Mr + Mf < wire - contradiction by lt_irrefl of the additive form) and zeroExclusionImpliesFace (vacuous direction).  MEASURED BACKSTOP (survey s35a, tmp/s35a_hwin_far_survey.py, log tmp/s35a_hwin_survey.log, re-implementing the Lean pins in Python and reproducing them BEFORE taking results):  the margin floStripMin - (Bwire + Mr) is NEGATIVE at every surveyed point on t in [1e3 .. 3e10] x d in (1e-9, 1/200) (logarithmic grids); the floor equals the own-kernel scale 4 d^2/t^2 to RELATIVE 2e-13; Xwire(110000) = 1.827275e-3 reproduces the pinned RX = 0.00185 regime (strictly below); the 25m total at T0 = 0.936536 sits strictly below the p8_f_near_pin = 0.9975 closure.  THE FACE REMAINS OPEN:  it asserts zero-exclusion of off-line zeros on a band NO INSTRUMENT in the tree reaches (classical zero-free regions give Re > 1 - c/ln t, which is nowhere near 1/2 - 1/200 at any of the surveyed heights) - the Lean module proves the instrument's IRRELEVANCE on the band, not the zero-exclusion.  ENDPOINT RELATION:  RHEnd.rh_program78 is UNAFFECTED - the four named residuals (hs1, hs3, hWin, hS2low) are untouched; hWin is now CHARACTERIZED (a zero-exclusion statement with a certified-inadequate squeeze), not closed.  CARDS:  98 cards / 804 body lines (new card formal/cards/S4WinCap.md); _MAP.md carries the S4WinCap block in the S4-squeeze section and the hWin line in the endpoint block now points at it; PATHWAY-TO-A-SOLUTION.md carries the GATED paragraph after the B7 formal block.  NEXT LEVER:  the face is a zero-exclusion claim on [1000, inf) x (0, 1/200) - its discharge route is an imported zero-free-region result (or a walk/certification over the band), i.e. classical-analytic territory, and it is the only h-family named residual whose Lean-side preparation (the characterizing identity) is now complete."}, {"n": 106, "date": "2026-10-17", "time": "2325", "title": "hWin face shrunk (GATED): formal/RhAttack/WinCount.lean pins two independent shrinks of the hWin residual's OPEN content - (A) the classical frontier: tPT = 30610046000 (the rigorous zero-isolation record, Platt, interval-verified to +-2^-102, the public stream's own end) with [Z-PT] CITED over the abstract ZeroSet in the Z78 pattern, and faceSplit certifying hWinFace q <-> hWinFaceResidual q (zero-exclusion on (tPT, inf) x (0, 1/200)) - the open face shrinks by a height factor of ~3e7; (B) the 3e9 record shadow: Nline = 9064192826 + rvm3e9 = 9064192825.58 pinned with pinGates (diff = 21/50, |diff| = 0.42 <= 3, norm_num), D_even (Even (B0.D q t) for any ZeroSet), and offExcessBound (pinned on-line count + the record's +-3 strip gate => D(q, 3e9) <= 2 = at most one off-line orbit below 3e9; 0 or 2 with D_even). 99 cards; full tree green (17450 jobs)", "body": "FORMAL MILESTONE (no RH claim): the open content of the endpoint's hWin residual - characterized in discovery 0105 (S4WinCap: the face IS zero-exclusion on [1000, inf) x (0, 1/200)) - now has two INDEPENDENT shrink routes pinned into the tree.  MODULE:  formal/RhAttack/WinCount.lean (namespace WinC; imports Mathlib + B0 + P12Uniform + S4WinCap; build green; full tree re-verified at 17450 jobs, 0 errors; 0 sorry; 401 lines).  ROUTE A - THE CLASSICAL FRONTIER (cited):  tPT := 30610046000 pins the rigorous zero-isolation record (Platt, 'Isolating some non-trivial zeros of Zeta': rigorous interval-arithmetic isolation of every non-trivial zero with 0 < Im <= 30,610,046,000 to an absolute precision +- 2^-102, an independent verification that the critical line carries them all to that height; the public LMFDB zeta-zero stream - the project's own 24b-series source - ends at exactly this height, so tPT is the RECORD'S OWN frontier, not an external import).  [Z-PT] allOnLineUpTo q tPT is STATED OVER THE ABSTRACT ZeroSet as a named hypothesis (the Z78-strip / Z-EDGE CITED pattern; the higher literature frontier - RH verified up to 3 x 10^12, Platt-Trudgian, arXiv:2004.09765, located by doc-first search this session - is named in the docstring as an optional add-on input; the tree pins the lower, record-consistent frontier).  Both consequences are LEAN-PROVEN and cite nothing beyond [Z-PT]:  (1) noOffPairBelowPT - there is NO off-pair in [1000, tPT] x (0, 1/200) (a zero at negative height is sent to its positive twin by HFE after HCJ before it can hide);  (2) faceSplit - S4WC.hWinFace q <-> hWinFaceResidual q, where hWinFaceResidual (the named residual def) is zero-exclusion on (tPT, inf) x (0, 1/200): under [Z-PT] the hWin face of the endpoint reduces EXACTLY to zero-exclusion above the frontier.  THE SHRINK FACTOR: the open height interval of the face drops from [1000, inf) to (3.06e10, inf) - a factor of about 3e7 in height.  ROUTE B - THE 3e9 RECORD SHADOW (record-derived, the MFar/B7Far measured-constraint pattern):  the H1 3e9 stream record (day035 ceiling report; the finish gate of day035_3e9_stream.sh) is pinned and re-gated:  Nline := 9064192826 (the EXACT on-line zero count up to t = 3e9 in the verified stream, 'N(3e9) = 9,064,192,826 EXACT'), rvm3e9 := 9064192825.58 (the recorded RVM value; RVM counts the STRIP zeros, which is the count that matters);  pinGates (norm_num, arithmetic only): Nline - rvm3e9 = 21/50 exactly and |Nline - rvm3e9| = 0.42 <= 3, i.e. the fleet's own +-3 RVM finish gate, machine-checked in Lean.  Two structural theorems over ANY ZeroSet, LEAN-PROVEN:  D_even - Even (B0.D q t) for all t > 0 (the whole-slice twin of B0.offSliceEven: the fixed-point-free involution rho |-> 1 - rho-bar preserves the height EXACTLY (im(1 - rho-bar) = im rho), so it tiles the entire off-line slice of (0, t] in 2-cycle blocks; proven by the B0 orbit-tile machinery adapted to the whole slice);  offExcessBound - for any q whose on-line count at tdata matches the pinned Nline (the record data fact about the actual set, entered as a hypothesis like S1LowT.SliceFacts) and whose STRIP count passes the record's +-3 gate (|Ntot - rvm3e9| <= n, the same tolerance the fleet ran, stated for the strip count that RVM counts): B0.D q tdata <= n - 1; at the record's tolerance n = 3: D <= 2 - AT MOST ONE OFF-LINE ORBIT below 3e9 (with D_even: the excess is 0 or 2).  The bound spends ONLY B0's structural axioms (nonReal/conj/fe/finite) + the two record pins + the gate - no classical RVM error content is cited, because the argument reads the gate's tolerance n as a parameter: the strip count is Nline + D exactly (B0.eqNtotMinusNon), the RVM pin sits 21/50 below Nline, so the gate forces D + 21/50 <= n.  HONESTY SPLIT:  CITED [Z-PT] (classical, named, reference in the docstring);  PINNED the two record values (norm_num gate);  LEAN-PROVEN noOffPairBelowPT, faceSplit, D_even, offExcessBound.  ENDPOINT RELATION:  RHEnd.rh_program78 is UNAFFECTED; the four named residuals are untouched; hWin is now CHARACTERIZED (0105) AND SHRUNK (0106): its open content is zero-exclusion on (3.06e10, inf) x (0, 1/200) - no instrument in the tree reaches the residual (the classical zero-free regions stop at Re > 1 - c/ln t, nowhere near Re = 1/2 +- 1/200, and the measured zero walk ends at the frontier).  CARDS:  99 cards / 858 body lines (new card formal/cards/WinCount.md); _MAP.md carries the WinCount block in the S4-squeeze section and the hWin line in the endpoint block now reads CHARACTERIZED by S4WinCap + SHRUNK by WinCount; PATHWAY-TO-A-SOLUTION.md carries the GATED paragraph after the S4WinCap FORMAL block.  NEXT LEVER candidates:  (a) an explicit RVM-error input at 3e9 (a doc-first located published bound) would make route B's gate a CITED single hypothesis and shrink route A and B into one;  (b) wiring WinCount's residual def into the endpoint restatement;  (c) the B7F consumer candidates (B1 walk / B5 law territory) from before, or the hs1 height-uniformity measured piece."}, {"n": 107, "date": "2026-10-18", "time": "0011", "title": "hWin shrink wired AT THE ENDPOINT (GATED): RHEnd Part B3 adds rh_program78_winpt - rh_program78 with the hWin premise DERIVED IN BODY from the cited frontier [Z-PT] (zeros on the line up to tPT = 30,610,046,000) plus the residual face (zero-exclusion of off-line zeros on (tPT, inf) x (0, 1/200)); the endpoint's hWin premise narrows to zero-exclusion above the frontier (open height interval shrunk by ~3e7); full tree green 17450 jobs", "body": "FORMAL MILESTONE (no RH claim): the hWin shrink from discovery 0106 (WinCount: [Z-PT] faceSplit + 3e9 record shadow) is now OPERATIONAL AT THE ENDPOINT.  MODULE:  formal/RhAttack/RHEnd.lean Part B3 (66 lines added; the file's terminal endpoint variants now include a third restatement; build green in one shot; full tree re-verified at 17450 jobs, 0 errors; 0 sorry in RHEnd).  THEOREM:  rh_program78_winpt (q : ZeroSet) (hz78 : Z78.externalZeroFree78) (hqz : zeros) (honline : the named on-line sliver record) (Qside) (hs1 : the S1 witness) (hs3 : the S3 wire) (hPT : WinC.allOnLineUpTo q WinC.tPT) (hres : WinC.hWinFaceResidual q) (hS2low : the S2 low-band pin) : RH q.  BODY:  have hface : S4WC.hWinFace q := (WinC.faceSplit q hPT).mpr hres;  refine rh_program78 q ... hface ...  - the two-line composition relies on the definitional coincidence that S4WC.hWinFace q IS the hWin premise type of rh_program78 (S4WinCap restated it verbatim through the Z78P12 aliases in discovery 0105), so the derived face plugs straight into the endpoint with no adapter.  WHAT IT MEANS:  to run the endpoint program in the window regime, one no longer states 'the window squeeze holds on [1000, inf) x (0, 1/200)' as a named residual; one states (i) the CITED classical frontier [Z-PT] (every non-trivial zero with 0 < Im <= 30,610,046,000 is on the line - the rigorous interval-verified zero-isolation record, +- 2^-102, the end of the public stream; cited exactly like [Z78]) and (ii) the RESIDUAL: no off-line zero in (tPT, inf) x (0, 1/200).  The open height interval of the hWin residual at the endpoint is thus (3.06e10, inf) instead of [1000, inf) - a shrink by a factor of about 3e7 in height.  THE 3e9 RECORD SHADOW STAYS OUTSIDE:  WinCount.offExcessBound (with the pinned record counts Nline = 9064192826 and rvm3e9 = 9064192825.58 and the record's +-3 tolerance, the off-line excess below 3e9 is 0 or 2 - at most one orbit) is a record-derived CONSTRAINT on the same open region, intentionally not folded into the endpoint premises (the endpoint composes around CITED classical inputs + named residuals; record data enters via the measurement track).  HONESTY SPLIT  UNCHANGED:  [Z-PT] CITED (classical, docstring reference to Platt's interval isolation); the residual OPEN (no instrument in the tree reaches (tPT, inf) x (0, 1/200) - classical zero-free regions stop at Re > 1 - c/ln t, nowhere near Re = 1/2 +- 1/200, and the measured zero walk ends at the frontier); the endpoint statement rh_prog ilter_false_of_mem), with the RH hypothesis replaced by the frontier applied on (0, tPT] - every zero with 0 < Im <= 3e9 sits on the line, so the off-line slice is empty.  This is STRICTLY SHARPER than the record shadow's offExcessBound (D <= n - 1 under the +-n strip gate; at the record's tolerance n = 3, D <= 2): it replaces a gate-tolerated bound by an exact zero, and consistency is built in: 0 is the even case of D_even (no parity conflict between the two routes).  (2) rvmGateDischarged (q : ZeroSet) (ht0 : 0 < tdata) (hcount : Ntot q tdata ht0 = Nline) : abs ((Ntot q tdata ht0 : ℝ) - (rvm3e9 : ℝ)) <= 3 - for a zero set whose exact count at 3e9 matches the pinned record count Nline = 9064192826 (the ACTUAL set has exactly this recorded data), the fleet's recorded +-3 RVM finish gate holds as a THEOREM: the arithmetic is pure record content (pinGates norms Nline - rvm3e9 = 21/50 and |21/50| = 0.42 <= 3); the frontier is deliberately absent from the hypothesis list (it is not used in the arithmetic).  THE MERGE:  below tPT the two routes carry each other's load - [Z-PT] (route A, cited classical) gives D = 0, and the pinned count (route B, recorded data) re-derives the +-3 gate that offExcessBound consumes as a hypothesis.  For the actual zero set both inputs are available, so the 3e9 record shadow is fully accounted for: D(3e9) = 0 (not merely <= 2), and the +-3 gate is a theorem rather than an input.  SEARCH RECORD (the lever that did NOT land):  a fully CITED RVM error bound |S(t)| <= c at 3e9 would have made the +-3 gate cited rather than recorded (the exact RVM formula differs from the record's rvm(t) = (t/2 pi) ln(t/2 pi) - t/2 pi + 7/8 by S(t) - 5/8 - (1/8) ln(1 - t^-2), so forcing |N - rvm| <= 3 needs |S(3e9)| <= 3 - 5/8 = 1.875).  Doc-first search of explicit unconditional S(t) bounds found:  Trudgian, 'A modest improvement on the function S(T)' (arXiv:1010.4596; Math. Comp. 78 (2009) 1-18): |S(T)| <= 0.1013 log T for large T - at 3e9 this is 0.1013 * 21. <script>
const E = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
                 .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function md(src) {  // the  log's  markdown-lite,  html-safe
  const out = [];
  let pre = false;
  for (const line of src.split("\n")) {
    if (/^```/.test(line)) {
      out.push(pre ? "</pre>" : "<pre>");
      pre = !pre;
      continue;
    }
    if (pre) { out.push(esc(line)); continue; }
    let t = esc(line);
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    t = t.replace(/\*([^*]+)\*/g, "<i>$1</i>");
    t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener">$1</a>');
    out.push(t);
  }
  if (pre) out.push("</pre>");
  return out.join("\n");
}
function hl(t, q) {
  if (!q) return t;
  const eq = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(eq, "gi"), m => '<span class="mark">' + m + "</span>");
}
let openSet = new Set();
function render() {
  const q = $("q").value.trim();
  const d1 = $("d1").value, d2 = $("d2").value;
  const ord = $("ord").value;
  const rows = E
    .filter(e =>
      (d1 || !e.date || e.date >= d1) &&
      (d2 || !e.date || e.date <= d2) &&
      (!q || (e.title + " " + e.body).toLowerCase().includes(q.toLowerCase())))
    .sort((a, b) => ord === "desc" ? (b.n - a.n) || b.date.localeCompare(a.date)
                                   : (a.n - b.n));
  const list = $("list");
  list.innerHTML = "";
  for (const e of rows) {
    const div = document.createElement("div");
    div.className = "entry" + (openSet.has(e.n) ? " open" : "");
    const hd = document.createElement("div");
    hd.className = "hd";
    hd.innerHTML =
      '<span class="dt">' + (e.date || "n.d.") + "</span>" +
      '<span class="tm">' + (e.time ? (e.time) : "") + "</span>" +
      '<span class="tt">' + hl(esc(e.title), q) + "</span>";
    hd.onclick = () => {
      if (openSet.has(e.n)) openSet.delete(e.n); else openSet.add(e.n);
      div.classList.toggle("open");
    };
    const bd = document.createElement("div");
    bd.className = "bd";
    bd.innerHTML = md(e.body);
    div.appendChild(hd); div.appendChild(bd);
    list.appendChild(div);
  }
  $("stat").textContent =
    rows.length + " of " + E.length + " entries" +
    (!q && !d1 && !d2 ? "" : " (filtered)");
}
["q","d1","d2","ord"].forEach(id => $(id).addEventListener("input", render));
$("ex").onclick = () => { E.forEach(e => openSet.add(e.n)); render(); };
$("co").onclick = () => { openSet.clear(); render(); };
window.addEventListener("keydown", ev => {
  if (ev.key === "/" && document.activeElement !== $("q")) {
    ev.preventDefault(); $("q").focus();
  }
  if (ev.key === "Escape") { $("q").value = ""; render(); }
});
render();
</script>
