 B5 → B6 → B7 → B8, five atoms on the complex decaying\nexponential, mirroring the L4 `p4_op2c_bound` pattern including the\nmeasurability/continuity plumbing), the finite-sum + M→∞ assembly\n(boundary terms telescope because B4/B6/B8 have equal endpoint values; the\nfirst non-zero boundary at n is B4(0)·(−s−3)/4·n^{−s−3} → the −S₂·n^{−s−3}/720\nleading term after the s(s+1) prefactor), then `p4_T3_expansion` (F1 exact\nidentity), `p4_T3_bound` (4-term triangle), and the list-scale wall\ncorollary (F4b, positive at t ≤ 90 000; PINNED dps-50 wall 0.896783 up to\n1e8 recorded separately, not claimed LEAN-PROVEN).\n\n### 25ae Lean port — Stage 2 LANDED (2026-09-16, per-period IBP atoms, full build green)\n\nThe six per-period integration-by-parts atoms of the 25ae ladder are now\nLEAN-PROVEN in `formal/RhAttack/P4Limit.lean` (all under `noncomputable\nsection`, `s.re = 1/2`, `j : ℕ`, `0 < j`).  Full `lake build`: 17434 jobs,\n0 errors, 0 sorry.\n\n- **`p4_25ae_ibp_b2to3`** (i-i): over [j, j+1],\n  `∫ B2(x−j)·(x:ℂ)^(−s−2) dx = (s+2)/3 · ∫ B3(x−j)·(x:ℂ)^(−s−3) dx`\n  (vanishing boundary: B3(0) = B3(1) = 0).\n- **`p4_25ae_ibp_b3to4`** (i-ii):\n  `∫ B3·x^(−s−3) = ((B4(0)/4):ℂ)·(u(j+1) − u(j)) + (s+3)/4·∫ B4·x^(−s−4)`,\n  `u(x) = (x:ℂ)^(−s−3)`.\n- **`p4_25ae_ibp_b4to5`** (i-iii): boundary vanishes (B5(0) = 0),\n  coefficient (s+4)/5.\n- **`p4_25ae_ibp_b5to6`** (i-iv): boundary `((B6(0)/6):ℂ)·(u(j+1)−u(j))`,\n  coefficient (s+5)/6.\n- **`p4_25ae_ibp_b6to7`** (i-v): boundary vanishes (B7(0) = 0),\n  coefficient (s+6)/7.\n- **`p4_25ae_ibp_b7to8`** (i-vi): boundary `((B8(0)/8):ℂ)·(u(j+1)−u(j))`,\n  coefficient (s+7)/8, `u(x) = (x:ℂ)^(−s−7)`.\n\nEach atom = `intervalIntegral.integral_mul_deriv_eq_deriv_mul` with\n`u(x) = (x:ℂ)^(−s−k)` (derivative via `hasDerivAt_ofReal_cpow_const`) and\n`v(x) = (B_{k+1}(x−j) : ℂ)/(k+1)` (derivative via the Stage-1 HasDerivAt\nchain + `HasDerivAt.ofReal_comp`), with uIcc continuity/integrability\nplumbing (the L4 pattern).\n\n**Proof-design lessons (durable, cost a full round of iteration):**\n\n1. **State intermediate calc targets in the SAME term language as the\n   current side.**  The H-step term carries the local `set`-definitions\n   (`u`, `v`) as atoms.  If a calc target writes the *unfolded* term\n   (e.g. `((j+1:ℝ):ℂ)^(−s−k)` instead of `u (j+1:ℝ)`), then\n   `u (j+1:ℝ)` and `((j+1:ℝ):ℂ)^(−s−k)` are DIFFERENT ring atoms\n   (def-let vs cpow application, ofReal-wrapped base vs cast base, and\n   even exponent summand order `−s−k` vs `−k−s` survives to the kernel),\n   and `ring` silently fails with a cryptic normal-form residue.  Fix:\n   intermediate targets use `u`-form; the bridge to the unfolded cpow\n   form is a separate `have hu : u (j+1) = … := by dsimp only [u]` +\n   `rw`, which is literal.\n2. **`set v : ℝ → ℂ := fun x => ((B (x−j)) / K : ℂ)` elaborates as a\n   COMPLEX division**: stored body `(↑(B (x−j))) / K`, not\n   `(↑((B (x−j)) / K))`.  Boundary hypotheses must target the stored\n   form (or `simp`, which knows the `ofReal` division rewrite\n   `(↑a)/b ↔ ↑(a/b)`, will normalize them).  `rfl` between the two forms\n   fails (not definitional).\n3. **`fun_prop` cannot see through a `def`**: `ContinuousOn (fun x =>\n   (B4poly (x−j) : ℂ))` needs `dsimp only [B4poly]` first, then `fun_prop`\n   closes the expanded polynomial.\n4. **`simpa` is NOT a ring closer**: `simpa [h]` fails on goals that need\n   distributivity after the simp step; write `simp [h]; ring` explicitly.\n   Conversely, a `rw` that leaves an rfl goal + an extra `rfl`/`simpa`\n   line reports \"No goals to be solved\".\n5. **`simp [hB4]` with `hB4 : B4poly 1 = B4poly 0` evaluates the whole\n   coefficient to the numeral** (−1/30 → −1/120) — simp does ground\n   evaluation under `ofReal`, which is what makes the subsequent `ring`\n   trivial.\n6. When a coefficient identity like `(-(s+k)) / K = -((s+k) / K)` is\n   needed, prove it coefficient-only (`ring` closes it) and `rw` it inside\n   the product — do not `ring` a block leaves `f`, `g` as metavariables: the by-block's goal is\n   `?f x = ?g x`, `dsimp`/`rw` see nothing, the by fails, and the outer rw\n   never applies.  `EqOn` is `Set.EqOn` (needs `open Set` or the qualified\n   name).\n3. **`B2poly` (and the Stage-1–3 `B{K}poly` defs) unfold across files with\n   `dsimp only [B2poly]`** — the real gotcha is the constant term: a polynomial\n   written with a `: ℂ` ascription over the whole expression stores `1/6` as a\n   COMPLEX division, while the def-body form stores `↑(1/6 : ℝ)`.  The two are\n   equal only via `simp [Complex.ofReal_div]` (not `rfl`, not `ring`).\n4. **Under `induction' k`, any hypothesis containing `k` is REVERTED into the\n   IH as a premise** (`IH : (hsumf at k) → (sum = endpoint)`); apply it as\n   `IH (hsumf recon struct ed at k)`.  The plain `rw [IH]` then fails with\n   \"pattern not found\" because the goal carries the `set`-defined summand form\n   while the IH carries the raw form.\n5. **`omega` is context-fragile**: `n + (k + 1) = (n + k) + 1` closes in a bare\n   context but fails inside heavy tactic contexts (hypotheses with\n   integrals/coercions).  `by ring` is context-independent — prefer it for\n   `show` witnesses in induction blocks.\n6. **Brace-implicit arguments are not positional**: atoms declared\n   `theorem p4_25ae_ibp_bKtoK1 {s : ℂ} (hsre : s.re = 1/2) (j : ℕ) (hj : 0 < j)`\n   must be applied as `… (s := s) hsre j hjpos`; passing `s` positionally\n   shifts everything (`s` lands in the `hsre` slot).  Same for\n   `p4_25ae_telescope_pow (p := …)` and `p4_25ae_telescope_pow_aux` (no\n   explicit `p` at all).\n7. **`Finset.mem_Ico` is not omega-visible**: derive `0 < j` from\n   `j ∈ Finset.Ico n M` via `rw [Finset.mem_Ico] at hj; omega`.  Note the\n   integrability argument of `sum_integral_adjacent_intervals_Ico` passes a\n   `Set.Ico` hypothesis (`Set.mem_Ico.mp hk |>.1`), while the finset-level\n   goals use `Finset.mem_Ico` — both exist, both are `@[simp]`.\n8. **`ContinuousOn` target-set casts**: `(j + 1 : ℝ)` stores as `↑j + 1`,\n   while lemma targets often carry `((j+1:ℕ) : ℝ)` (`↑(j+1)`); bridge with\n   `.mono (by intro x hx; rw [show (j:ℝ) + 1 = ((j+1:ℕ) : ℝ) from\n   (Nat.cast_succ j).symm]; exact hx)]`.  And `0 < x` on [j, j+1] needs the\n   `n ≤ j` leg (`0 < n` alone does not give `0 < x`).\n9. Telescoping base case: `simp [Finset.Ico_self]` closes\n   `0 = (((n+0:ℕ):ℝ):ℂ)^p − ((n:ℝ):ℂ)^p` (add_zero + sub_self under casts);\n   a trailing `ring` then reports \"No goals to be solved\".\n10. Calc assembly: when the left side is already in `((s+2)/3) * S3` order,\n    `rw [mul_comm]` (no anchors) normalizes to the `S3 * ((s+2)/3)` order that\n    the ladder hypotheses (`h3`–`h7`) expect; an anchored `rw [mul_comm S3 _]`\n    fails because the pattern is not present.\n\n**NEXT (Stage 3B):** the `M → ∞` passage (`p4_25ae_J_iota`: endpoint terms →\n0 via `tendsto_rpow_neg_atTop`; S8 → the improper integral I₈ via the Cauchy\ncriterion on period sums, comparison against `x^(−17/2)`), then\n`p4_25ae_I8_bound` (|I₈| ≤ n^(−15/2)/225), `p4_T3_expansion` (the F1 exact\n4-term identity), `p4_T3_bound` (4-term triangle), and the list-scale wall\ncorollary (provable at t ≲ 94 550; the dps-50 PINNED wall `0.896783` up to\n1e8 remains a measurement, not a Lean claim).\n\n## 25ae Stage 3B — the M → ∞ passage, the sharpened T3 bound machine-proven, and the F1/F4 exponent corrections (2026-09-16)\n\n**Status: Stage 3B atoms 3B.1–3B.10 LEAN-GREEN in `formal/RhAttack/P4Limit.lean`;\nfull package build 17434 jobs / 0 errors / 0 sorry.  3B.11 (the Lean\nlist-scale wall corollary) is the one remaining Stage-3B atom.**\n\n### Landed atoms (all in the P4Limit `noncomputable section`)\n\n| atom | statement |\n|---|---|\n| 3B.1 `p4_B8cpw8_integrableOn_Ioi` | `B8·x^{−s−8}` absolutely integrable on `(c,∞)`, `Re s > −7` (majorant `(1/30)x^{−(Re s+8)}`) |\n| 3B.2 `p4_B8cpw8_tendsto` | `∫_n^M B8 x^{−s−8} → ∫_n^∞ …` as `M → ∞` |\n| 3B.3 `p4_25ae_cpwtendsto0` | `M^{−s−k} → 0` (`Re s = 1/2`, `k ≥ 3`), via `Complex.norm_cpow_eq_rpow_re_of_pos` + `tendsto_rpow_neg_atTop` |\n| 3B.4 `p4_25ae_S8_eq_interval` | the B8 period-sum `S8(n,M)` equals `∫_n^M B8 x^{−s−8}` |\n| 3B.5 `p4_25ae_S8_tendsto` | `S8(n,M) → ∫_n^∞ B8 x^{−s−8} =: I8` (Cauchy on period sums) |\n| 3B.6 `p4_25ae_J_iota` | `∫_n^M B2 x^{−s−2} → 4-term expression` (finite ladder of Stage-2 atoms + 3B.2–3B.5) |\n| 3B.7a `p4_25ae_int_Icc_rpow172` | `∫_n^M x^{−17/2} = (2/15)(n^{−15/2} − M^{−15/2})` — FTC-2 via `integral_eq_of_hasDerivAt_off_countable` + `hasDerivAt_rpow_const` |\n| 3B.7b `p4_25ae_int_Ioi_rpow172` | `∫_n^∞ x^{−17/2} = (2/15)n^{−15/2}` — order-limit from 3B.7a |\n| 3B.7c/3B.8 `p4_25ae_I8_bound` | `‖I8‖ ≤ (n:ℝ)^{−15/2}/225` on the critical line (`|B8| ≤ 1/30` + 3B.7b; `norm_integral_le_integral_norm` + monotone finite-integral majorant + order limit) |\n| 3B.9a `p4_25ae_t3kernel_integrableOn_Ioi` | `B2·x^{−s−2}` integrable on `(c,∞)` for `Re s > −1` (majorant `(1/6)x^{−(Re s+2)}`) |\n| 3B.9b `p4_25ae_J_eq` | `∫_n^∞ B2 x^{−s−2} = ` the exact 4-term expression (improper integral = `J_iota` limit via `intervalIntegral_tendsto_integral_Ioi` + `tendsto_nhds_unique`) |\n| 3B.10 `p4_25ae_T3_bound` | `‖−(1/2)s(s+1)∫_n^∞ B2 x^{−s−2}‖ ≤ T3UB` — the sharpened 4-term triangle bound stated below |\n\n### THE CORRECTIONS (discovered during the Lean port; the anchor script was wrong)\n\n1. **F1 second-term exponent: `n^{−9/2}` → `n^{−11/2}`.**  The anchor\n   `day026_25ae_final.py` (and the F1 docstring) carried the second triangle\n   term as `|S4|·n^{−9/2}/30240`.  On the critical line `Re(−s−5) = −(1/2+5) =\n   −11/2`, so the endpoint term `n^{−s−5}` has norm `n^{−11/2}`.  The Lean\n   theorem carries `n^{−11/2}` (`hN5`).  This is a hard correction: it makes\n   the S4-term decay as `t^{−1/2}` (rather than grow as `t^{+1/2}`) at list\n   scale, so it dominates the wall.\n2. **F1/F4 fourth-term exponent: `n^{−31/2}` was a typo.**  Correct\n   `|I8| ≤ (1/30)·(2/15)·n^{−15/2} = n^{−15/2}/225` (3B.8), hence the\n   fourth triangle term is `|S6|·|s+7|·n^{−15/2}/9072000`.\n3. **The CORRECTED 4-term bound (3B.10, machine-proven):**\n   ```\n   T3UB(n,s) = |s(s+1)(s+2)|·n^{−7/2}/720\n             + |s(s+1)(s+2)(s+3)(s+4)|·n^{−11/2}/30240\n             + |s(s+1)(s+2)(s+3)(s+4)(s+5)(s+6)|·n^{−15/2}/1209600\n             + |s(s+1)·…·(s+7)|·n^{−15/2}/9072000\n   ```\n   (last factor `= |S6(s+7)|/9072000 = |S6|·|s+7|/9072000`; `9072000 =\n   20160·450`).\n4. **Wall re-anchor (list scale `n = ⌊13t/8⌋`, `s = 1/2 + it`):**\n   crossover of `T3UB/|T1|` with `1 − (1/6)(8/13) = 0.8974359…` is now\n   **`t ≈ 1.217e8`** (recomputed, dps-safe scan).  At `t = 1e8`: ratio\n   `0.7374597`, **wall margin `≈ 0.15998` (16 %)**.  The old anchor figure\n   `94 550` is voided (it used the wrong `n^{−9/2}` second term); the old\n   dps-50 pin `0.896783 @1e8` is superseded by the corrected measurement\n   `0.73746 @1e8` (PINNED measurement, not yet a Lean claim).\n5. **Chosen Lean wall for 3B.11: `t ≤ 1e8`** — a clean constant with a 16 %\n   margin under the corrected bound.\n\n### Incident (file corruption during a bulk insertion)\n\nAn anchored bulk Python insertion (the first attempt at 3B.10) transiently\ncorrupted `P4Limit.lean` — it dropped the top-level L5 block\n(`p4_zeta_split`…`p4_T4_ratio`) and a section boundary, breaking\n`RhAttack.P8Floor`.  Rebuilt from `HEAD` (3A prefix + L5, verbatim) + the\ncurrent 3B content inserted inside the `noncomputable section` before its\n`end`; full package build verified green after each step.  Standing lesson\n(appended to the cumulative list): for bulk edits > 50 lines in this module,\nverify anchor uniqueness AND inspect the resulting `git diff` stat before\nbuilding — prefer extracting from two known-good snapshots over in-place\nreplacement.\n\n### Proof-engineering notes (Stage 3B, cumulative)\n\n- **FTC-2 for real powers:** `integral_eq_of_hasDerivAt_off_countable` with\n  `s := ∅`; integrand `x ↦ (−17/2)·x^{−19/2}` via `hasDerivAt_rpow_const\n  (Or.inl (ne_of_gt hx))`; the constant-multiplier derivative bridged with\n  `HasDerivAt.const_mul (c) h` + `.congr_deriv (c) (show by ring)` —\n  `convert (HasDerivAt.const_mul _ h) using 1` can spawn extra typeclass\n  goals (`ring` cannot rewrite rpow exponents, so exponent arithmetic like\n  `−(15/2) − 1 = −(17/2)` is a separate `show … by ring`).\n- **`Complex.continuousAt_ofReal_cpow_const x y (0 < y.re ∨ x ≠ 0)`** is the\n  pointwise cpow-continuity entry point; on `(c,∞)` feed `Or.inr (ne_of_gt\n  (hc.trans hx))`.\n- **`norm_integral_le_integral_norm (f := …) (μ := volume.restrict (Ioi c))`**\n  — pin `f` and `μ` explicitly (curly `B` stays inferred); the LHS indicator\n  cancels by simp; the RHS variation bridge is `ae_restrict_iff'\n  measurableSet_Ioi` + `ae_of_all`.\n- **Order-limit pattern for `∫_n^M ≤ C` with `F(M) → L`:** split\n  `eventually [Ici (max …)]` into `eventually (F → L)` and\n  `eventually (F ≤ C)` via `Metric.ball_mem_nhds` + `mem_of_superset`; then\n  `L ≤ C` by `lt_of_le_of_lt`/`le_of_lt` composition.\n- **`intervalIntegrable_iff` + `uIoc` bridge:** for the closed-interval\n  majorant, `rw [intervalIntegrable_iff]` at both the hypothesis and the\n  goal; `uIoc (n : ℝ) M ⊆ Ioi (n : ℝ)` holds for all `M` (the min/max\n  definition makes the left endpoint inclusive exactly when `n ≤ M`).\n- **Cauchy on period sums (S8 → I8):** `IntegrableOn.cauchy` gives\n  `eventually (fun p q => ‖∫ in a..b‖ < 3ε)` on `Ioi c ×ˢ Ioi c`;\n  `set PQ` + a single `filter_upwards` with `M,N ≥ max(n, (n:M)+ceil c)`\n  closes both coordinate projections (no `Filter.Fsim` needed).\n- **`Tendsto.congr'` for the `=ᶠ` bridge:** direction is\n  `f₁ =ᶠ[l] f₂` with the *known-tendsto* function as `f₁`; the `Ici n`\n  filter carries the `M ≥ n` side condition of `p4_25ae_J_finite`.\n- **`tendsto_nhds_unique`** (T2 + `NeBot`) is the limit-uniqueness closer;\n  `intervalIntegral_tendsto_integral_Ioi a hInt tendsto_id` composes with\n  `tendsto_natCast_atTop_atTop (R := ℝ)` for the ℕ-indexed passage.\n- **`rw` auto-closes** a goal that becomes reflexive — trailing `ring` after\n  a closing `rw` then errors \"No goals to be solved\"; same for `calc` steps\n  whose target equals the goal's remainder.\n- **`0 < x` chaining:** write `have h0x : 0 < x := hc.trans hcx` explicitly;\n  inline `hc.trans hcx` inside `ne_of_gt (…)` mis-parses (the `.trans`\n  expects a proof argument, not a relation).\n- **`linarith` polymorphic-literal trap:** `zero_lt_one` in a real goal can\n  spawn a stuck `NeZero 1` instance; `show (0 : ℝ) < 1 by norm_num` avoids\n  it.\n- **`calc` in `≤` goals:** `=` steps rewrite the goal's LHS; the final\n  obligation is `TARGET ≤ TARGET` — close it with an explicit `_ ≤ TARGET :=\n  le_rfl` step (or wrap the `=` calc in a `have hcalc : LHS = TARGET` and\n  conclude with `exact le_of_eq hcalc`).\n- **`gcongr` does not use hypotheses for its core atom automatically when\n  the term shapes differ**; the explicit `apply\n  mul_le_mul_of_nonneg_left hBOUND; positivity` is the reliable closer.\n- **Rational-literal rpow exponents:** `-(15/2 : ℝ)` and `-(15 : ℝ)/2` are\n  extensionally equal but NOT definitionally — `simpa` fails across the\n  two forms; bridge with `have heq : -(15/2 : ℝ) = (-(15 : ℝ)/2) := by\n  norm_num` + `simpa [heq]`.\n\n### 25ae 3B.11 — Part A LANDED (2026-09-16, list-scale wall on 1 ≤ t ≤ 13)\n\nThe 3B.11 wall corollary landed in two parts; **Part A (this entry)**\ncovers `1 ≤ t ≤ 13` (four floor-bands); **Part B (13 ≤ t ≤ 1e8)** follows\nin the next commit.\n\n**Landed in `RhAttack/P4Limit.lean` (all LEAN-PROVEN, full build\n17434 jobs / 0 errors / 0 sorry):**\n\n- `t3w_prod`, `t3w_p`, `t3w_d`, `t3w_term`, `t3w_T3UB` — the sharpened\n  4-term bound at list scale.  Term indices `{2, 4, 6, 7}` match the four\n  products of `p4_25ae_T3_bound` (`∏_{k≤i} (t² + (k+1/2)²)`, i = 2, 4, 6,\n  7; i = 7 is the 8-factor `|S6|·|s+7|` product ending at 15/2).\n- `t3w_qA{1..4}_{r}`, ack.P4Limit` green (8709 jobs); full `lake build` green (17434 jobs).\n\n**INCIDENT — the blank \"atoms green\" commit (38aec05), retracted**: an earlier session reported batch-3 atoms as\ngreen and committed; the commit added a single blank line and the atom text was never in the target file, so later\n\"green\" build/job counts were for unchanged content. Discipline now recorded as permanent: (1) an \"atoms green\" claim\nrequires `#check` of the new names against the compiled olean *and* inspection of the actual inserted lines, not just\nmarker counts / `git diff --stat` / a green default-target build. The batch-3 block was re-derived from\n`/tmp/b3_final.lean`, spliced in, and made genuinely green across ~60 targeted compile iterations.\n\n**Proof-engineering notes (batch 3, permanent traps)**:\n- `DifferentiableAt.comp {f g x} (hg : DifferentiableAt g (f x)) (hf : DifferentiableAt f x) : DifferentiableAt (g ∘ f) x` —\n  the point is an *explicit* parameter and the order is **outer-first**; member syntax `a.comp b` mis-elaborates\n  (x-slot confusion). Call it as `DifferentiableAt.comp t hOuter hInner`.\n- `logDeriv_comp` is also outer-first: `logDeriv_comp (hdf_outer) (hdg_inner)`; when the composition point is a compound\n  expression (e.g. `(13/8)·t + 0`), bridge the function to literal `f ∘ g` form with a `funext`-`rfl` show first.\n- `LT.lt.ne' (h : a < b) : b ≠ a` is the direction `hasDerivAt_sqrt` wants from `0 < P`; `.ne` gives the reverse.\n- `hasDerivAt_rpow_const (h : x ≠ 0 ∨ 1 ≤ p)` — the exponent is implicit (do not pass `y` explicitly).\n- `div_mul_cancel₀ (a) (h : b ≠ 0) : a / b * b = a` is the field version; bare `div_mul_cancel` is the group lemma\n  (the 2-arg form with no hypothesis is not the field one).\n- `((n + 1 : Real) + 1/2)` elaborates to `↑n + 1 + 1/2` while `((n + 1 : ℕ) + 1/2)` elaborates to `↑(n+1) + 1/2`;\n  `ring` cannot bridge `↑(n+1)` and `↑n + 1`. Pick one cast form and use it in every factor of an induction step.\n- `rw [show ARGED by\n  `s2_strip_min`** on the covered region t0 ≥ 707/50 (the whole strip\n  above the first zero 14.1347…); the only S2 residual is ONE small\n  pinned hypothesis `hs2sliver` on 0 ≤ t0 ≤ 707/50 (the C1b regime gap,\n  where the window floors are floWin = min(23/1000, 1 - 25/γ) ≤ 0 and\n  the floor content is the PINNED measurement of record, not a regime).\n  hs1 (the CITED 25.2.12 zero side in Mf form), hs3 (the P8 A5\n  definition-side terminal under explicit machine inputs), hs4 (the\n  day030 measured squeeze) and the grid-adequacy `hgrid` stay PROMISED\n  per H6 (finite data by design; no closed-form uniform low-t lower\n  bound). NO RH claim in-file (v1 header stands).\n- **Toolchain lessons (pinned Lean 4.33.1 + mathlib v4.33.1, local-grepped\n  after online search per the owner's directive)**: (1) TOP-LEVEL\n  FORWARD REFERENCES DO NOT RESOLVE — a `def` cannot reference a\n  top-level constant defined LATER in the file (`Unknown identifier`);\n  order declarations dependency-first. (2) ℝ numerals (`1 : ℝ`, `23`)\n  are NOT judgmentally equal to `Nat.cast (1 : ℕ)` / the cast of a nat\n  expression — bridge single casts with `norm_num`, cast-OF-SUM/SUB with\n  `Nat.cast_add`/`Nat.cast_sub`, and route through `nlinarith`/`linarith`\n  which normalize cast numinals. (3) `if h : c then …` (named-binder ite)\n  is not rewritable by `if_pos`/`if_neg` — drop the unused named binder\n  from the def or use `split_ifs`. (4) `Finset.univ.inf` / `⨅ x ∈ s, …`\n  over ℝ require `OrderTop ℝ` (absent); finite minima need the foldl\n  (with `List.foldl_append` + `List.range_succ` induction) or explicit\n  nested `min`. (5) `List.minimumOf` does not exist in 4.33.1 (newer\n  mathlib only). (6) `by norm_num` inside a top-level `def` proof term\n  can silently `sorry` — prefer proof-term constants (`Nat.zero_lt_succ`).\n- **Honest split (delta vs day030 v1).** LEAN-PROVEN — everything v1\n  plus: `s2_strip_window`, `strideU_floor`, `devStripMin_lower`,\n  `s2_strip_min`, `strip_squeeze_v2` (the S2 covered-region discharge).\n  PROMISED (residual hypotheses, explicitly named) — `hs2sliver` (the\n  0 ≤ t0 ≤ 707/50 sliver), hs1/hs3/hs4, `hgrid` (all as in v1, now with\n  the concrete dev/flo forms). PINNED — `SliceFacts` 813-zero/0.221\n  record, 7357/1000 floor, `floWin` constants (23/1000, 25), 707/50\n  (the C1b regime bottom, 14.14 — just above the first zero). CITED —\n  25.2.12 (zero side), P8 A5 machinery (via P8Floor import), C1b\n  atom (its CITED status flows in).\n\n### day032 D(t) re-channel: the IBP refinement lands, with a corrected walk-level (2026-09-18)\n\n- **What landed** (scripts/rh/day032_dt_ichannel.py +\n  out_day032_dt_ichannel.txt, 564s, mpmath 1.4.1 dps-30): the named\n  day029 re-channel refinement -- D_re redone as an IBP against the full\n  counting function so the O_w common model error cancels by\n  construction.\n- **The exact identity** (Stieltjes IBP + weighted telescoping; holds at\n  every height incl. split mode, where the R(t)*f(t) = 0*(-inf) boundary\n  terms cancel by continuity of R):\n    D_re(t) = Wb*f(G2) - Int W(g) f'(g; t) dg,\n  W(g) = N((G1,g]) - R(g) the lattice walk (true zero count minus the\n  smooth model count R = int rho), Wb = N_band - R(G2) = +0.106322129\n  (the day029 wband constant, now a closed-form endpoint term at every\n  height; b = G2 because the last zero IS G2 -- no half-mass\n  convention).  Measured split: D_re = B_end - Iwalk with\n  Iwalk = L - Q, L = N*f(G2) - S_re (pure per-zero fsum, exact to\n  rounding), Q = R(G2)*f(G2) - int f*rho (the single dps-30 quad; the\n  O_w model error cancels in the L - Q combination by construction).\n- **RESULTS** (D_re column reproduces day029 to its own noise;\n  |check| = algebra/fsum consistency of the closed-form side, note the\n  quad appears with OPPOSITE sign in D_re and Iwalk and CANCELS from\n  the check):\n    t        D_re         B_end      -Iwalk     Fsum       Rmndr   |check|  mode\n    1.5e9   -1.464113235 -0.0876561 -1.3764567 -9.32e-01  -4.44e-01 3.7e-07  split\n    2.5e9   -1.374426603 -0.0616902 -1.3127365 -1.93e-01  -1.12e+00 8.8e-08  plain\n    4.0e9   -0.827099800 +0.1165593 -0.9436593 -1.39e-01  -8.05e-01 1.9e-07  plain\n    1.0e10  -0.492496490 +0.3377042 -0.8302002 -1.22e-01  -7.08e-01 4.5e-07  plain\n  (Fsum = the Wbar-centered walk sum, Wbar = -0.090427 t-EXACT to 6\n  digits as it must be; Rmndr = -Iwalk - Fsum.)\n- **FINDINGS**\n  (1) THE IDENTITY HOLDS AND THE O_W CANCELS: the decomposition\n      reproduces D_re down to the quad noise floor (day029 ladder:\n      < 5e-5 stable at the 4th decimal across the 200->2000-point\n      grid ladder); the closed-form check is at fsum rounding\n      (<= 4.5e-07).  No unknown drift or trend remains anywhere:\n      every piece is closed-form, per-zero exact, or one smooth quad.\n  (2) THE WALK IS NOT O(1e-4) -- CORRECTION TO THE day029\n      PREDICTION: Fsum (the centered walk coupling) is O(0.12-0.19)\n      and smooth in t for the plain heights, not the sqrt(N)*|f'|*gap\n      ~ 1e-4 random-walk estimate.  The estimate assumed independent\n      walk increments; the zero count walk W(g) = N(g) - R(g) is the\n      RH counting remainder -- a BOUNDED O(1)-amplitude mean-excess\n      process (measured Wbar = -0.090427, narrow range), anti-\n      correlated across scales, not a free random walk.  Its coupling\n      with the smooth f' (total variation O(0.5-1) over the band)\n      is O(0.1-0.2) -- exactly as observed.\n  (3) T-STRUCTURE: as t moves away from the band, B_end rises\n      smoothly (-0.06 -> +0.12 -> +0.34, the closed-form endpoint\n      term Wb*f(G2)) while -Iwalk flattens (-1.31 -> -0.94 -> -0.83)\n      -- the day029 t-trend in D_re is a smooth redistribution\n      between two measured pieces, not a residual.\n  (4) SPLIT MODE (t in (G1, G2]): Fsum carries the log|t^2 - g^2|\n      splice structure at O(0.9) -- the same endpoint/lattice\n      structure day029 flagged; no O(1e-4) claim in split mode.\n- **CONSEQUENCE**: the re-channel calibration is now level-exact per\n  height to the quad floor (~5e-5): cross-splice Efull comparisons in\n  the re channel can be made level-accurate at ~1e-4 (fsum+quad),\n  matching the im channel (pi*wband, 6.5e-8).  Both splice channels\n  are accounted down to their numeric floors.\n- **HONEST SPLIT**: MEASURED -- the full day032 table (dps-30 quads,\n  float64 fsum per-zero; screen-grade as per day029's class).\n  PINNED -- Wb = +0.106322129 (closed form from G1, G2, N_band; the\n  day029 wband datum), Wbar = -0.090427 (data mean of W at the\n  zeros).  LEAN-PROVEN: none (measurement record; the IBP identity is\n  classical Stieltjes calculus, not a new theorem here).  CITED: the\n  classical zero-counting remainder being an O(1)-bounded process\n  (the boundedness of N(x) - N_model(x) in the RH strip, the same\n  content as the Riemann-von Mangoldt remainder scale).\n\n### day033 -- item 6, the d < 1/200 sharper d-dependent floor (25af residual (3)) (2026-09-19)\n\n- **What landed** (scripts/rh/day033_dfloor.py + out_day033_dfloor.txt,\n  exact Fraction algebra + mpmath dps-30 cross-check, a few seconds):\n  the 25af residual ordered item (3) -- \"-- a sharper d-dependent floor\n  is a separate constant study\".\n- **THE FLOOR** (exact, from the S4Own closed forms, mirrored):\n    mown(t, d) = d^2 (d^2 + 4 t^2) / (A B) * e^c,\n    A = t^2 + (1/2 + d)^2,  B = t^2 + (1/2 - d)^2,\n    c = (1/2 + d)/A + (1/2 - d)/B  > 0   (so e^c > 1: dropped in the floor),\n  = 4 d^2 * g(t^2) * e^{c(t)} with\n    g(u) = u(u + a)/(u^2 + c0 u + d0),  u = t^2,\n    a = d^2/4,  c0 = 2 d^2 + 1/2,  d0 = (1/4 - d^2)^2.\n  g is STRICTLY increasing in u for all 0 < d < 1/2:\n    g'(u)*denom^2 = (c0 - a) u^2 + 2 d0 u + a d0 > 0\n  (c0 - a = (7/4)d^2 + 1/2 > 0, d0 > 0, a >= 0).  With u0 = 10^6\n  (t = 1000), the t-uniform d-DEPENDENT floor:\n    mown(t, d) >= F_sharp(d) * t^-2,  all t >= 1000, 0 < d < 1/2,\n    F_sharp(d) = 4u (10^6 + u/4) 10^6 / (10^12 + 10^6 (2u + 1/2)\n                                              + (1/4 - u)^2),  u = d^2\n  -- an EXACT rational function of u = d^2.\n- **SHARPENINGS MEASURED** (exact rationals):\n  [1] at d = 1/200: F_sharp - F4 = +1.5e-10 (relative +1.5e-6 over the\n      old floor F4 = 10^8/(10^6+1)^2) -- a strict improvement, same\n      atom family (hMownScaleLo) with the exact (2d^2 + 1/2) and\n      (1/4 - d^2)^2 structure instead of the 1/16/1 lump.\n  [2] the FLOOR-LEVEL squeeze edge: with Cw = A1 + (A2 + A3 +\n      25/10^15)/1000 (the day028 W-side cap, exact rationals;\n      Cw = 8.981000000052499e-5), the squeeze WUB + Mterm < floor\n      closes for F_sharp(d) > Cw, i.e. P(u) = 0 with\n        P(u) = (Cw - 10^6) u^2 + ((2*10^6 - 1/2) Cw - 4*10^12) u\n               + Cw (10^12 + 5*10^5 + 1/16)   (exact rational coeffs)\n      one positive root (exact bisection, 120 iters):\n        u_F in [2.245251122726485e-05, 2.245251122726485e-05] (15-digit\n        printed bracket; exact Fractions in the script)\n        d_F in [0.0047384080, 0.0047384081]  (10-decimal brackets)\n      Honest sign note: the FLOOR bracket r1 (below d_F) has a\n      NEGATIVE margin (-3.411e-12) by construction; the SAFE certified\n      edge is the upper bracket rounded up:\n        r2' = 47384091/10^10 = 0.0047384091,\n        F_sharp(r2'^2) - Cw = +3.8287e-11  (exact positive rational).\n  [3] RESTATEMENT: the bound-level strip squeeze\n      (p8_B(t, n4) + M e^{X4} X4 <= Cw t^-2, st_hSQ) therefore extends\n      from the d >= 1/200 edge to d >= r2' = 0.0047384091 -- a 5.23%\n      extension of the closure-relevant own-regime strip; on\n      (r2', 1/200) the mown(t, d) floor is F_sharp(d) (the old F4\n      atom is 0/inapplicable there).\n  [4] AGREEMENT WITH 25af [7]: the data-level edge d* = 0.004738\n      (printed from the measured squeeze) vs the bound-level d_F =\n      0.004738408 (this study): both in (0.00473840, 0.00473842);\n      F_sharp(0.0047385^2) - Cw = +3.484e-09 > 0, i.e. the bound\n      level covers the whole printed d* interval.  The ~2e-9 bound-\n      level offset above the true squeeze crossing is exactly the\n      anchor (A1 above the true (1/2)(3.1e7)^(-1/2) = 8.9802651e-5 by\n      7.35e-9) + floor (g below the true ratio by ~5e-7 relative)\n      margin structure.  The old d-grid edge 1/200 sits 5.5% above the\n      squeeze edge (25af [7]); it now sits 5.5% above a CLOSED edge.\n  [5] t-structure (measured, dps-30): the TRUE mown*t^2 is DECREASING\n      in t and down-converges to 4 d^2 -- the e^c factor (c ~ 1/t^2,\n      e^c > 1) dominates the slowly-increasing g(t^2) part.  The floor\n      is UNAFFECTED: mown*t^2 = 4 d^2 g(t^2) e^{c(t)} >= 4 d^2 g(t^2)\n      >= 4 d^2 g(10^6) = F_sharp.  (First run of this study mislabeled\n      the [3]/[4] columns and the monotone direction; corrected in the\n      committed output -- the exact algebra was correct from the start.)\n  [6] BELOW d_F: intrinsically open at the t^-2 wire level\n      (F_sharp -> 4u < Cw as u -> 0) -- as 25af [7] stated for the\n      data edge: not closure-relevant; the S2 floor side / the near\n      pin 0.9975 at the witness handles that region (unchanged).\n- **HONEST SPLIT**: MEASURED -- [3]/[4]-style mpmath dps-30 cross-\n  check tables (true mown closed form vs F_sharp vs Cw; the true\n  squeeze-crossing location).  PINNED -- day033 script + output\n  (exact F_sharp, P coefficients, u_F bracket, r2' = 47384091/10^10,\n  margin 3.8287e-11; day028 Cw/F4 constants).  LEAN-PROVEN -- none\n  new yet (this is the constant study; all inputs are existing atoms:\n  S4O.mown closed form, S4Own c > 0 one-line, S4Strip day028 constants\n  A1..A3/MT/F4, st_hSQ).  CITED -- the S4Own.hMownScaleLo/Hi atoms\n  (status flows from S4Own).\n- **LEAN FOLLOW-UP (named, per the 25af pattern: constants first, port\n  second)**: (i) st_mownfloor_sharp: F_sharp(d) * t^-2 <= mown(t, d)\n  for all t >= 1000, 0 < d < 1/2 (c > 0 one-line positivity; the g'\n  positivity line (c0-a)u^2 + 2 d0 u + a d0 > 0; the g(u0) ratio\n  comparison -- exact rationals, norm_num-able); (ii) the d-edge\n  parameter 1/200 -> r2' in s4_strip_close (margin 3.8287e-11 via\n  st_finalconst's norm_num); (iii) S4A.s4asm_S4_on_pairs: the\n  d0 < 1/200 near-pin case split edge moves 1/200 -> r2' (the band\n  (r2', 1/200) becomes covered by mown(t, d0)).  Per the owner's\n  standing rule (2026-09-19): the port searches ONLINE FIRST for any\n  latest-mathlib lemma or reorganization (monotone ratio/pow/div\n  chains, positivity) before deriving atoms by hand.\n\n================================================================\n2026-09-19  day033 LEAN PORT — LANDED (item 6, the d-dependent floor)\n================================================================\n\nScope: the day033 sharper d-dependent floor F_sharp (queue item 6) is now\nLEAN-PROVEN, additive to the green 1/200 line (nothing on the old line\ntouched).  New declarations, all building on the pinned\nleanprover/lean4:v4.33.1 + mathlib v4.33.1:\n\nRhAttack/S4Strip.lean:\n  r2prime : R = 47384091 / 10^10 (= 0.0047384091; flat exact integer\n    form, NOT a 10^10 power term -- see the whnf note below).\n    hr2prime_pos : 0 < r2prime.\n  FshU (u : R) := 1000000 * u * (u + 4000000) /\n      (1000000000000 + 2000000 * u + 500000 + ((1/4 : R) - u)^2)\n    (the sharp floor in u = d^2, i.e. F_sharp(u) of the day033 note;\n    the numerator is the day033 Xf AFTER cancelling the common u;\n    flat exact-integer constants by design).\n  Fsh (d : R) := FshU (d^2).\n  st_mownfloor_sharp : (1000 <= t, 0 < d <= 1/2)\n      -> Fsh d * t^(-2 : R) <= S4O.mown t d.\n    (the day033 floor, the whole strip 0 < d <= 1/2 at every t >= 1000;\n    exact algebra: after cancelling u the cross-multiplied deficit is\n    N4(v) = Aco*(v-10^6)^2 + Bsh*(v-10^6) with\n    Aco = 4(1/4-u)^2 + 7000000*u + 2000000 > 0 and Bsh > 0,\n    verified EXACTLY in tmp/der_n4.py (fractions.Fraction grid) BEFORE\n    writing Lean; the first Xf draft (leading u) was wrong and was\n    caught by the exact grid.)\n  st_Fsh_mono : 0 < u1 <= u2 <= 1/4 -> FshU u1 <= FshU u2\n    (via the exact cross factor Nsh(u2)*D2star(u1) - Nsh(u1)*D2star(u2)\n    = (u2 - u1) * Q with Q > 0, Q flat-exact-integer form).\n  st_hfinal_sharp : A1 + (A2 + A3 + 25/10^15)/1000 < FshU (r2prime^2)\n    (the margin Cw = 8981000000052500001/10^20 vs F_sharp(r2'^2),\n    +3.8287e-11, as an exact-norm_num rational inequality).\n  s4_strip_close_sharp : (1000 <= t, r2prime <= d <= 1/2,\n      0 <= M <= Zbound t) ->\n      p8_B t (n4 t) + M * e^(X4fun t) * X4fun t < S4O.mown t d.\n    (day031's s4_strip_close with the d-edge MOVED from 1/200 to r2prime.)\n\nRhAttack/S4Asm.lean (section 7, additive):\n  s4asm_strip_region_S4_sharp (edge S4Strip.r2prime <= d0, calls\n    s4_strip_close_sharp with Zbound as M).\n  s4asm_S4_on_pairs_sharp : the pair coverage with the if-split at\n    r2prime -- strip branch via the sharp lemma, window branch via the\n    EXISTING d-independent s4asm_window_region_S4 (its near-pin bound\n    p8_f_near_pin has no d, so the edge moves for free).\n  The old s4asm_window_region_S4 / s4asm_S4_on_pairs (1/200 edge) are\n  UNCHANGED; both assemblies hold simultaneously, the sharp one\n  strictly stronger (the band (r2', 1/200] added at 5.23% of the old\n  strip width).\n\nVerification (per the standing verification discipline, not the default\ntarget alone):\n  lake build (whole project)                          0 errors\n  lake env lean RhAttack/S4Strip.lean                 0 errors\n  lake env lean RhAttack/S4Asm.lean                   0 errors\n  #check of all 10 new constants (st_mownfloor_sharp,\n    st_Fsh_mono, st_hfinal_sharp, s4_strip_close_sharp,\n    s4asm_strip_region_S4_sharp, s4asm_S4_on_pairs_sharp, r2prime,\n    FshU, Fsh, hr2prime_pos): exact types as intended.\n\nPer the owner's rule (SEARCH ONLINE FIRST, reinforced 2026-09-19), the\nport went: online search for current mathlib lemmas -> local pinned-\nmathlib grep -> probe -> patch.  The big ring/norm_num atoms used are\nold territory (ring, ring_nf, norm_num, linarith, field_simp,\ndiv_le_div_iff0, Real.one_le_exp, Real.rpow_neg, sq_pos_of_pos,\npow_le_pow_left0, mul_le_mul* family); nothing new was needed beyond\nthat.\n\nTOOLCHAIN HITS (pinned 4.33.1 + mathlib 4.33.1, all reproducible):\n\n1. KERNEL WHNF TIMEOUT ON POW-LITERAL CONSTANTS.  A top-level def whose\n   body contains (10 : R)^12 / (10 : R)^6 power terms (the original\n   FshU writing) made every ring-touching rewrite of that body time\n   out deterministically at whnf (200000 heartbeats): the pow term\n   expands to an 11- or 6-fold nested mul tree in the kernel.  Fix:\n   write 10^12-scale constants as FLAT NUMERALS (1000000000000,\n   2000000, 500000, 4000000000000, 10000000000) in the def bodies and\n   in every ring/linarith context.  r2prime = 47384091/10^10 was\n   likewise flattened to /10000000000.  After flattening the whole\n   port compiles under the repo's existing heartbeat convention\n   (set_option maxHeartbeats 1600000 scoped around the two heavy\n   theorems, as already used at line 819 of S4Strip for the old big\n   proof; restored afterwards).\n\n2. LOCAL SETS DEFAULT TO NAT FOR BARE NUMERAL BODIES.  `set K :=\n   1000000000000 + 500000 + 1/16` (no type ascription) types K as NAT:\n   1/16 in N is 0, silently dropping the fractional part and breaking\n   every downstream ring equality (linarith/ring then honestly refuse\n   an inequality that is no longer true).  Same trap for\n   `set Dneg := 2000000000000 + 500000`.  Fix: ascribe the first\n   literal ((... : R)); a body that already contains a (1/4 : R)\n   subterm is safe.  Lesson: every flat-integer local set in a\n   mixed-fraction context gets an explicit R ascription.\n\n3. CALC PARSER: MULTI-LINE LHS + NEXT-LINE BY-BLOCK.  In this pin, a\n   calc whose FIRST expression spans more than one line followed by a\n   step justified `:= by` with the tactic block on the NEXT LINE fails\n   to parse (\"unexpected token ... expected ':='\", the by-block is\n   seen as empty and the next line re-parsed as a calc step).  With a\n   single-line first expression the same form parses.  Fix: put the\n   first tactic on the `:= by` line itself (`:= by ring_nf at h ⊢;\n   linarith [...]`).  (Generalizes the earlier ProbeN6 pin:\n   calc-step justifications are same-line by or by { } blocks only.)\n\n4. LINARITH ARITH ATOM MISMATCH UNDER UNFOLDED LOCAL SETS.\n   linarith/nlinarith \"failed to find a contradiction\" on a goal that\n   is one weighted sum away, when the goal and the hypotheses contain\n   the same local-set constant in different unfolded forms (Dneg as a\n   folded local def in the hypothesis, flat in the goal).  Fixes that\n   worked: (a) `dsimp only [Dneg] at hn` BEFORE the linarith call;\n   (b) `ring_nf at hT1 hneg ⊢` before linarith (normalizes both sides\n   to identical atoms, including the K-folded terms).  The\n   nlinarith variant of the same step also failed; the explicit calc\n   chain with ring_nf-at preconditions closed it.\n\n5. RPOW NUMERAL BRIDGES IN THIS PIN.  `Real.rpow_natCast` exists but\n   is NOT a simp lemma in mathlib v4.33.1 (bare `simp` /\n   `simp only [rpow_natCast]` report \"made no progress\" on\n   t^(2 : R) = t^2 goals).  `norm_num` closes t^(2 : R) = t^2\n   directly (it evaluates numeric rpow); the t^(-2 : R) = 1/v bridge\n   is then `rw [Real.rpow_neg htpos.le (2 : R), inv_eq_one_div,\n   <norm_num bridge>]`.  ring does NOT close t^(2:R) = t^2 on its\n   own (the rpow atom is not a monomial for ring).\n\n6. LE_OF_EQ / MUL_LE_MUL_COMMUTATIVITY.  In calc tail steps proving\n   A <= A*e^c: mul_le_mul_of_nonneg_right produces c1 <= c2 in the\n   form m*a <= m*b (multiplier on the LEFT), so the calc chain must\n   pass through `A = 1*A := by ring`, then\n   `1*A <= e^c*A := mul_le_mul_of_nonneg_right ...`, then\n   `e^c*A = A*e^c := by ring`; writing the middle goal as\n   `A*1 <= A*e^c` type-mismatches (commutativity is not definitional).\n   And the final mown-identification step closed by `dsimp only\n   [S4O.mown]` ALONE (the local u/v sets are transparent, so the goal\n   is judgmentally reflexive; a following rewrite is a \"No goals to be\n   solved\" error -- the standing \"dsimp may close\" pin, recurring).\n\n7. EXACT-GRID-FIRST FOR POLY IDentities.  The first N4 draft (Xf WITH\n   a leading u factor) produced a nonzero ring residual and a false\n   \"identity is wrong\" signal; the exact fractions.Fraction grid\n   (tmp/der_n4.py, clean add/sub/mul helpers) caught it before Lean\n   was touched, and the corrected Xf = 10^6*(u + 4*10^6) (no leading\n   u) passed the grid first.  The helper-script Dstar was ALSO buggy\n   in one intermediate draft (a -u/2 term lost when expanding\n   (1/4-u)^2) -- the grid caught it too.  Rule reaffirmed: every big\n   polynomial identity is grid-verified EXACTLY in Python before it is\n   written into Lean, using a clean monomial-dict helper (wrong\n   monomial keys in hand-written dicts produce SILENT identity\n   failures that mimic \"the math is wrong\").\n\nHonest split update (day033 port): the day033 sharp floor is now\nLEAN-PROVEN (st_mownfloor_sharp, st_Fsh_mono, st_hfinal_sharp,\ns4_strip_close_sharp, the two S4Asm sharp assemblies) on the pinned\n4.33.1 stack; the data-side constants (r2' = 47384091/10^10, the d_F\nbracket [0.0047384080, 0.0047384081], the +3.8287e-11 margin, the\n5.23% band-width figure) remain MEASURED/PINNED exactly as recorded in\nthe day033 note.  No old statement changed; the 1/200 line stays\ngreen and untouched."}, {"n": 17, "date": "2026-09-19", "time": "", "title": "(day034) — item 7: CITED demotion audit (queue 7, part b)", "body": "For item 7, each of the five CITED universals (KNOWN_LIMITATIONS §3)\nwas checked against the pinned toolchain (mathlib v4.33.1, local\ngrep + source read of the pinned checkout) with the current upstream\nstate corroborated online first, per the search-first discipline.\nFindings:\n\n1. **Backlund RVM envelope (Zbound = 1.6·t^{1/4}·log t)** — NOT in\n   mathlib 4.33.1. No zero-free-region or zeta zero-counting content\n   anywhere in the pinned checkout; `NumberTheory/LSeries/ZetaZeros.lean`\n   (76 lines) carries only the topological facts about the zero set\n   (closed, discrete, finite on compacta, cofinite cocompact). ONLINE:\n   a community formalization **Zeta23** (anthropics/zeta-23-lean,\n   2026, the \"more than two thirds of the zeros lie on the critical\n   line\" paper) proves Weil's explicit formula for ζ and an RVM\n   local-count bound (Titchmarsh Thm 9.2 shape: the zero count in\n   (t, t+1] is O(log(...))), with an abstract ZeroConfig layer over\n   the strip multiset. Status: **stays CITED and load-bearing above\n   the data band; on [1e3, 1e9] the counting load is carried by the\n   pinned data** (the exact seam/Nt re-verification). Demotion path:\n   Zeta23-style adoption or re-derivation of an explicit RVM count —\n   scheduled as its own project.\n2. **P-T Sbar Cor 1 (log-scale on-line counting defect)** — NOT in\n   mathlib 4.33.1 (same check). **On the band the empirical defect is\n   PINNED at 0** (the 25af Sbar datum, the 813-zero structure), so the\n   CITED theorem bears only above 1e9 and for the production\n   methodology. Same demotion path as 1 (the Sbar statement is\n   RVM-counting machinery).\n3. **A2c bridge (W_n = em_expr on Re s = ½)** — classified\n   differently from 1/2/4/5: it is a FORMAL ALGEBRAIC identity\n   (gamma/reflection/functional equation on the critical line), not a\n   counting or zero-free universal. mathlib 4.33.1 carries the zeta\n   and gamma infrastructure (`NumberTheory/LSeries/RiemannZeta.lean`\n   with the completed zeta and pole structure). **Next small\n   formalization candidate** — a demotion to LEAN-PROVEN is a\n   finite-task port once the A2c module defines both sides.\n4. **Classical zero-free regions (d0 > 1/2)** — NOT in mathlib\n   4.33.1; Zeta23's abstract zero-config ASSUMES the strip locus\n   (0<β<1) rather than proving the classical zero-free region, so it\n   does not demote this item. **Stays CITED and load-bearing; a\n   dedicated classical port (Hadamard–de la Vallée Poussin at\n   σ = 1 + reflection at σ ≤ 0) is a separate project.**\n5. **P-T 3×10¹² on-line data backbone** — already half-demoted in\n   fact: on [0, 1e9] the backbone IS our own exact re-verification\n   (PINNED: seam Nt = 73,426,758 at G = 3.1946e7, verified\n   LMFDB(0,1e7] 21,136,125 + cache(1e7, G] 52,290,633; band\n   2,792,198,664 to G_LAST = 1.006345999847005e9), with their\n   certificate bearing the methodology beyond the band.\n\nArithmetic sanity (computed, not recalled): N(3.1946e7) ≈\n(3.1946e7/2π)(log(3.1946e7/2π) − 1) ≈ 7.33e7 — the seam constant is\nconsistent with RVM; and the tail nlt at t ≈ 1e9 read 2,825,411,910\nin the day034 single-point calibration, consistent with the RVM\nasymptotic N(1e9) ≈ 2.83e9 — the band's 2.79e9 entries close\nG_LAST − the cache end as expected.\n\nKNOWN_LIMITATIONS §3 carries the one-paragraph version of this\naudit (appended under item 5, 2026-09-19)."}, {"n": 18, "date": "2026-09-19", "time": "s2", "title": "(day034) — item 7, part a in flight: H1-cert design + budget selftest LANDED", "body": "The H1 reissuance (certificate-grade, per KNOWN_LIMITATIONS H1 *Fix*,\nsecond variant: machine-verified error budget, Platt–Trudgian style,\nnot interval arithmetic) is implemented in\n`scripts/rh/day034_h1cert.py` (uncommitted until the full run lands):\n\n- **Grid**: windows x = 1e6·1.08^k (k = 0..89, x ≤ ~1e9), each with\n  the verbatim day029 25-straddle set t = g_x + k/2 (k = −12..12,\n  k≠0), g_x = the real zero nearest x; the 400-node dps-30 quad at\n  every straddle (a superset of the sweep's value configuration).\n- **Budgets tracked per point**: tail (per-term unit-roundoff +\n  zero-representation dg terms + pairwise chunk bound + longdouble\n  cross-chunk + nlt-merge guard); GN product (same model); quad\n  precision/node ladder (dps 30/60 × 400/800 per section, B = max\n  corner-pair spread); dps-30/60 agreement for zeta, the 25.2.12 main\n  term, and the 500-delta dev; exact-integer nlt with a\n  NLT_GUARD = 1e-4 boundary-zero flag.\n- **Propagation**: residf_cert = residf30 + L·(e^Bexp − 1 + e^Bexp·Bph)\n  + Bz; dev_cert = dev30 − Bdev; z_cert = |z30| − Bz; margin_cert is\n  the claim `true margin ≥ margin_cert`.\n- **SELFTEST (the budget is verified before it is trusted)**: budget\n  containment against dps-60 exact per-zero arithmetic on 2000-point\n  pseudo arrays in two settings (stored == true; true = stored +\n  0.5-ulp random offsets to exercise the representation bound), for\n  the tail (re, im) and product (la, ar) channels. First run FAILED\n  on the im channel by exactly 2π·(count) — a selftest design\n  artifact (the nlt·π convention term was put in only one side) —\n  fixed the test; second run exposed one genuine model gap (the\n  nlt·π + longdouble→float merge rounding, now in B_im). Final\n  result: PASS with 20-50x containment margin on all four channels\n  (tail re: 1.1e-12 ≤ 3.8e-11; tail im: 2.1e-15 ≤ 2.2e-13; prod la:\n  1.2e-12 ≤ 2.2e-11; prod ar: 6.2e-13 ≤ 4.0e-12).\n- **Single-point calibration** (window nearest zero of 1e9 =\n  1000000000.1157, t = g + 0.5): mnew = 1.081644 (reproducing the\n  committed A-1 sweep value to 1.3e-6 on the neighboring straddle),\n  mcert = 1.0816365, Bexp + Bph = 8.6e-5 (Btail_re 6.3e-5 dominant —\n  the 2.8e9-zero representation bound, By design), quad ladders at\n  2.5e-21/7.9e-9, dps-30/60 zeta agreement 4e-22, dev agreement\n  7.7e-32, nlt = 2,825,411,910 (consistent with RVM, see above),\n  dmin = 0.085 ≫ NLT_GUARD, per-point cost ≈ 250 s CPU (quads\n  dominant: 8 sections × dps-30/60/400/800).\n- Smoke run (6 windows × 25 straddles, 9 workers, cores 0-9)\n  launched; full grid (90 windows × 25, 29 workers, cores 0-29)\n  estimated ≈ 4.7 h wall after the smoke validates the multi-point\n  path.\n\nPRE-REGISTERED readings (from the script header, before any result):\nC-1 all points margin_cert ≥ 1 → H1 band re-issued at certificate\ngrade; C-2 isolated cert-fails inside computed ≥ 1 → per-point\ndps-90/120 + 1600-node reissue; C-3 any computed < 1 → A-2/B-2 onset\nreading and the Phase-1a ceiling report as deliverable."}, {"n": 19, "date": "2026-09-19", "time": "s3", "title": "(day034) — H1-cert: per-point run rate rejected, two-phase window-batched build", "body": "The day034 SMOKE (6 windows x 25 straddles, 9 workers, cores 0-9,\nsub-chunked tail, quad dps-30/60 pairs) validated the pipeline\n(crash-free ~105+ min, memory stable at 47-52GB of 124, the 1e9-\nwindow values reproduce the committed A-1 sweep to 1.3e-6, selftest\nPASS), but the measured rate was ~350-400 s/POINT under six\nconcurrent 22GB-stream workers.  Extrapolated, the full\nper-point grid (2250 points at 8% spacing) would be 30-41 h wall —\nrejected; the run was killed at ~3 h with no completed window\nresults (the old build wrote its detail file at the end).\n\nRestructure (day034b_h1cert.py, committed with this note):\n  PHASE 1 (bandwidth-bound, 10 workers, cores 0-9): ONE band pass\n  per window computes, for all 25 straddles of the window in the\n  same pass (t-batched, 5 deep): the tail sums + budgets, nlt,\n  dmin guards, GN product + budget.  Stored per-window to\n  tmp/h1cert_p1/win_<i>.npz.  The band traffic thus scales with\n  71 WINDOWS, not 1775 points.\n  PHASE 2 (compute-bound, 27 workers, cores 0-26): per straddle,\n  the quad dps-30/60 pair budgets (400 nodes, both sections), the\n  dps-30/60 zeta + 25.2.12 main term, the 500-delta dev at 30/60,\n  the propagation, the cert row; plus the 4-corner audit ladder\n  once per window (the convergence evidence).  Rows merged to\n  out_day034_h1cert_b.txt; per-window incremental progress lines.\n  Grid: 12% window spacing (71 windows, x = 1e6*1.12^k <= 1e9),\n  25 straddles per window (1775 points total) -- still ~2.7x\n  denser than the sparse screen grid.\nThe certified pipeline is the SAME per-term model as day034_h1cert\n(same SUB = 2^25, same GAM10/GAM1 unit-roundoff bounds, same dg\nrepresentation bounds, same quad pair budget, same nlt guard,\nsame propagation).  The only value-level difference is the\n0.5/A -> 0.5*invA precompute roundings (last-ulp per term),\ncovered by the tracked budget and bounded by the crosscheck gate.\n\nEQUIVALENCE GATE before any full run (H1CERTB crosscheck,\nrunning): one window (x = 1e9) through BOTH the batched window\npass and the verified per-point day034 path; requires\n|re/im batch - point| <= 1e-9 on three straddles and full-row\nmnew/mcert agreement <= 1e-6 (plus the already-green budget\nselftest).  If the gate fails, fix the batched pass; do not\nweaken the gate."}, {"n": 20, "date": "2026-09-19", "time": "s4", "title": "(day034) — correction: exact day034b grid count", "body": "The restructure note above estimated 71 windows / 1775 points at\n12% spacing; the exact count (computed, not estimated) is\n61 geometric windows (x = 1e6*1.12^k, last = 8.976e8) + the\nexplicit 1.0e9 anchor window = **62 windows, 1550 straddle\npoints**.  Phase counts in the chain are keyed to the actual\nfile count (62), not to any hand estimate."}, {"n": 21, "date": "2026-09-19", "time": "s5", "title": "(day034) — crosscheck PASS (bit-exact); phase-1 COW", "body": "bug found and fixed; chain restarted (v2)\n\nEquivalence gate: PASS, better than the threshold required —\nthe batched window pass and the verified per-point path agree\nBIT-EXACT on the tail sums (|re/im difference| = 0 on all three\nstraddles of the 1e9 window; the 0.5/A -> 0.5*invA precompute\nproved last-ulp-neutral here, and the budget covers it\nindependently) and the full per-point rows agree to 9e-22\n(mnew 1.081644032 on both paths; mcert 1.081636859 both).\n\nPhase 1 (first launch, 10 workers) died ~2 min in with\nBrokenProcessPool: one worker OOM-killed with anon-rss 25.5GB —\na full private copy of the 22GB band. Root cause:\n`phase1_window` (the task) called `TH.tail()` but the parent\n`phase1_run` never loaded T before the pool, so every worker\nloaded its own copy (10 x 25GB on a 124GB machine). Fix in\nday034b: `phase1_run` now loads `T = TH.tail()` in the parent\nbefore the pool (workers COW-inherit the module singleton; the\ntask's own `TH.tail()` call returns the inherited instance).\nP1 workers reduced 10 -> 8 (bandwidth-bound anyway; memory\nmargin: 25GB parent + 8 x ~5GB private). Chain v2 restarted:\ncrosscheck verdict already on file -> straight to phase 1."}, {"n": 22, "date": "2026-09-19", "time": "s6", "title": "(day034) — throughput model pinned; fused tail pass;", "body": "verbatim reissue grid (39 windows / 975 points)\n\nMeasured (not estimated) machine facts from the two failed\nattempts, which pin the cost model:\n- single-stream band-derivation rate (crosscheck, one worker, hot\n  cache): ~3.6-4 GB/s effective per derived array;\n- 6-8 concurrent streams saturate the machine at ~4-5 GB/s TOTAL\n  (per-stream rate collapses ~8x; more workers do not add\n  throughput);\n- the irreducible volume is the per-STRADDLE derived arrays over\n  the 2.8e9 band: ~10 array-derivations x 268MB x 83 sub-chunks ~\n  223GB per straddle for the fresh-array reference path.  2250\n  straddles would be ~550TB (~140 h); window-batching the shared\n  part saved only ~6% (the per-t part dominates -- the batching's\n  real value was the crosscheck equivalence, not throughput).\n\nThe fix is a memory-fused tail pass (day034b, committed with the\nchain restart): exactly THREE 268MB working buffers per straddle\n(D = |g2-t2| -> log|d| -> re_t, in place; E = 2cc/|d| + base_dre =\ndredg, then reused as |re_t|; tmp = dg*dredg for the pairwise dot);\nthe im value folds to the exact scalar t * (f64-pairwise sub-chunk\nsum of invA) with zero per-t arrays; the dg-dimdg bound factors as\nt * (per-sub-chunk dg.tcoef sum, t-independent); the scale bound\nuses the explicit per-sub-chunk max of 0.5/A (A monotone in g, max\nat the first element).  ~3.3x traffic cut: ~67GB per straddle.\n\nGrid: the reissue is now the SCREEN grid verbatim (honest\ncoverage, no coarsening anywhere): the day029 A-1 31 windows\n(3.9e7-1e9, spacing as swept) + the 4 P1.1 trend points\n(1e6, 2e6, 4e6, 6e6) + 4 flagged connector windows\n(1.0e7, 1.6e7, 2.4e7, 3.3e7) bridging 6e6 -> 3.9e7, where the\nscreen had no straddle coverage (report says so).  39 windows x\n25 straddles = 975 points.  Est. total: gate ~1 h, phase 1\n(8 workers, cores 0-7) ~4.5 h (~72TB at ~4.5GB/s), phase 2\n(27 workers, cores 0-26) ~1.1 h.  Crosscheck v2 (fused path vs\nthe verified per-point reference, same 1e-9/1e-6 gate) running;\nchain v3 armed behind it."}, {"n": 23, "date": "2026-09-19", "time": "s7", "title": "(day035, night) — END_GAME_PLAN written; the", "body": "detector-side probe lands (section 3 of the plan)\n\nThe end-game plan is at docs/END_GAME_PLAN.md (the metric in\nplain terms, the ranked wall: W1 the uniform theorem / W2 the\nEfull oscillation bound / W3 the 3e10 falsification-first\ndecision / W4 the carpentry, the pre-registered outcome\nledger, and the start-here section on the detector's\npolynomial structure with the owner's seed intuition quoted\nverbatim).\n\nFirst probe (scripts/rh/day035_s3a_probe.py, exact Fraction\narithmetic): the algebraic core of R_closed on the quantized\nstraddles t = g + k/2:\n- sup over d in [0, 1/2] is at d = 1/2 (endpoint), all g, k;\n- sup over k is at k = 12 (the outer straddle), monotone in k;\n- R_alg(g, 12, 1/2) < 1 for all g >= 15 tested (0.9636 at g = 15;\n  decays ~12/g: 0.256 at 50, 1.21e-2 at 1000, 1.21e-5 at 1e6).\nSo dev >= 1 - B(g) with B(g) ~ 12/g an explicit rational\nfunction: the quantization (half-unit legal step t - g = k/2) plus\nthe sum-of-squares factorization (g^2 - t^2)^2 = (t-g)^2 (t+g)^2\nkeeps the algebraic core off the danger value 1 by a\nquantifiable gap -- the owner's \"indirect truth\" intuition was\nstructurally right.\nREVISED WALL PICTURE: the measured margin decay (about 1000 ->\n1.08) is driven by the NOISE side (the Efull oscillation, 0.0009\n-> 2.58 across the band), not the detector side (dev sits at\n1 - 12/g).  The bottleneck of the uniform theorem is therefore\nW2 (a proven oscillation bound for the far-integral remainder)\nwith the detector side reduced to: exact g0 crossing + d- and\nk-monotonicity lemmas (fixed-degree polynomial sign analysis) + a\nLean port.  See END_GAME_PLAN section 3.4 for the full revised\norder of attack.\nStatus of the H1-cert run at this entry: phase 1 at 24/39\nwindows, pace ~24 windows/104 min; phase 2 (~975 points / 27\nworkers, ~1 h) follows automatically; verdict expected around\n10:30 EDT."}, {"n": 24, "date": "2026-09-19", "time": "s8", "title": "(day035, night, post-compaction) — back-pocket", "body": "notes saved; Fibonacci mirror corrected to its exact fact\n\nThe owner's end-of-day \"back pocket\" facts were each checked\nagainst exact arithmetic and saved to\ndocs/BACK-POCKET-NOTES-2026-09-19.md (flavor file: verified facts\n+ explicit closed dead ends, per owner direction):\n- Cubes: the identity telescopes (T(k)^2 - T(k-1)^2 = k^3);\n  p = 3 is the unique exponent with a perfect-power power sum\n  (sympy-verified p = 1..12 plus obstruction: even p have a\n  simple (2n+1) factor; odd p have R(0) negative/square-free at\n  p = 5,7,9,11); the golden quadratic n^2+n-1 first appears in\n  the core factorizations at p = 9, 10 (verified range).\n- Fibonacci mirror, EXACT form (verified): with 1-based position\n  P(n) = n+1, P(n) - F(n) = 1 if and only if F(n) = n; the\n  fixed points are EXACTLY {0, 1, 5} (monotonicity beyond 5:\n  F(n) - n grows strictly, step F(n) - 1 >= 4); the full\n  difference census d(n) = +1,+1,+2,+2,+2,+1,-1,-5,-12,-24,-44,\n  ... is strictly decreasing from n = 6, so the small-n shape is\n  complete: the \"unit\" recurrence lives exactly at the three\n  fixed points, the
