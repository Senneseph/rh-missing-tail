1) = −1/30, B5(0) = B5(1) = 0, B6(0) = B6(1) = 1/42,\n  B7(0) = B7(1) = 0, B8(0) = B8(1) = −1/30, B8(1/2) = 127/3840.\n- **Derivative chain** `B_kpoly' = k·B_{k−1}poly` for k = 4..8\n  (HasDerivAt proofs + `@[simp]` derivative-value lemmas).\n- **`B8poly_bound_Icc : |B8poly u| ≤ 1/30` on [0,1]** — the 4-term-bound\n  kernel constant, LEAN-PROVEN.\n\n**Method notes (durable):**\n\n1. **The Bernstein on-curve convex-hull draft was REFUTED before it reached\n   Lean** — by exact `Fraction` arithmetic: the identity\n   `P(u) = Σ_j P(j/8)·C(8,j)·u^j(1−u)^{8−j}` is FALSE (verified: LHS ≠ RHS\n   at 12 sample points; the on-curve values are not Bernstein control\n   points).  The true control points are b = (−1/30, −1/30, −1/105, 4/105,\n   8/105, 4/105, −1/105, −1/30, −1/30) and `ring` itself rejected the false\n   identity — a clean diagnostic.  The convex hull of the true control\n   points gives only |B₈| ≤ 8/105 (not ≤ 1/30), so even the correct\n   Bernstein argument would NOT have sufficed.\n2. **The proof that works is pure algebra, no calculus:**\n   `30·B8(u) + 1 = u²(1−u)²·T(u)` with T(u) = 30u⁴−60u³−10u²+40u+20,\n   and `T(u) − 20 = 10u(u−1)(3u²−3u−4) ≥ 0` and\n   `255 − 8·T(u) = (2u−1)²(−60u²+60u+95) ≥ 0` on [0,1] (both `ring`\n   identities + sign decompositions; no derivative machinery needed).\n   With u²(1−u)² ≤ 1/16: −1/30 ≤ B8(u) ≤ 127/3840 < 1/30.\n3. **`ring` in this toolchain DOES normalize rational constants**\n   (probed: `(3/2)·(2·u) = 3u`, `30·(14/3) = 140` — both close by `ring`).\n   The earlier constant-atom worry was misplaced; the Bernstein failure was\n   the FALSE IDENTITY, not the tactic.\n4. **4.33.1 API findings, this round:**\n   - `mul_le_mul (h1 : a ≤ b) (h2 : c ≤ d) (c0 : 0 ≤ c) (b0 : 0 ≤ b) :\n     a·c ≤ b·d` — side-order is (0 ≤ c, 0 ≤ b), from\n     `Mathlib/Tactic/GCongr/Core.lean`; NOT the old-library (0 ≤ c, 0 ≤ a).\n   - `pow_le_pow_left` not found; the 0 ≤ a ≤ 1 ⇒ a² ≤ 1 step closes by\n     plain `nlinarith [h0a, ha1]`.\n   - `hasDerivAt_const x c` takes BOTH arguments positionally (an explicit\n     `x`); `hasDerivAt_const_mul c` still synthesizes `x`.\n   - No `div_le_iff`; use `le_div_iff`/`div_le_iff₀` or avoid.\n   - `set F := fun (x : ℝ) => ...` — tactic-mode `set` takes no binder\n     ascription or body ascription (`fun (x : ℝ) : ℝ =>` parses but the\n     ascription is rejected; `fun (x : ℝ) =>` is the form).\n   - `rw [hT]` (NOT `rw [← hT]`) when the goal contains the LHS of\n     `hT : LHS = CTERM` and the chain term is `CTERM`: the direction is\n     goal-LHS → CTERM.\n   - A `by` block left with an open goal inside a `show … from by …`\n     term-position reports \"invalid 'by' tactic, expected type has not been\n     provided\" — add the closer (here `ring`).\n\n**NEXT (Stage 2/3, next round):** the per-period IBP ladder\n(B3 → B4 → B5 → B6 → B7 → B8, five atoms on the complex decaying\nexponential, mirroring the L4 `p4_op2c_bound` pattern including the\nmeasurability/continuity plumbing), the finite-sum + M→∞ assembly\n(boundary terms telescope because B4/B6/B8 have equal endpoint values; the\nfirst non-zero boundary at n is B4(0)·(−s−3)/4·n^{−s−3} → the −S₂·n^{−s−3}/720\nleading term after the s(s+1) prefactor), then `p4_T3_expansion` (F1 exact\nidentity), `p4_T3_bound` (4-term triangle), and the list-scale wall\ncorollary (F4b, positive at t ≤ 90 000; PINNED dps-50 wall 0.896783 up to\n1e8 recorded separately, not claimed LEAN-PROVEN).\n\n### 25ae Lean port — Stage 2 LANDED (2026-09-16, per-period IBP atoms, full build green)\n\nThe six per-period integration-by-parts atoms of the 25ae ladder are now\nLEAN-PROVEN in `formal/RhAttack/P4Limit.lean` (all under `noncomputable\nsection`, `s.re = 1/2`, `j : ℕ`, `0 < j`).  Full `lake build`: 17434 jobs,\n0 errors, 0 sorry.\n\n- **`p4_25ae_ibp_b2to3`** (i-i): over [j, j+1],\n  `∫ B2(x−j)·(x:ℂ)^(−s−2) dx = (s+2)/3 · ∫ B3(x−j)·(x:ℂ)^(−s−3) dx`\n  (vanishing boundary: B3(0) = B3(1) = 0).\n- **`p4_25ae_ibp_b3to4`** (i-ii):\n  `∫ B cannot see through a `def`**: `ContinuousOn (fun x =>\n   (B4poly (x−j) : ℂ))` needs `dsimp only [B4poly]` first, then `fun_prop`\n   closes the expanded polynomial.\n4. **`simpa` is NOT a ring closer**: `simpa [h]` fails on goals that need\n   distributivity after the simp step; write `simp [h]; ring` explicitly.\n   Conversely, a `rw` that leaves an rfl goal + an extra `rfl`/`simpa`\n   line reports \"No goals to be solved\".\n5. **`simp [hB4]` with `hB4 : B4poly 1 = B4poly 0` evaluates the whole\n   coefficient to the numeral** (−1/30 → −1/120) — simp does ground\n   evaluation under `ofReal`, which is what makes the subsequent `ring`\n   trivial.\n6. When a coefficient identity like `(-(s+k)) / K = -((s+k) / K)` is\n   needed, prove it coefficient-only (`ring` closes it) and `rw` it inside\n   the product — do not `ring` a one-atom goal containing an\n   interval-integral atom (observed `ring_nf made no progress` on that\n   shape).\n\n**NEXT (Stage 3):** telescope the six atoms over j = n..M−1 (boundary\ndifferences telescope: Σ_j (u(j+1)−u(j)) = M^p − n^p), pass M→∞\n(M^{−s−k} → 0 for k = 3,5,7; the B8 tail is absolutely convergent via\n`B8poly_bound_Icc` + ∫ x^{−15/2}), then `p4_T3_expansion` (the F1 exact\n4-term identity, constants 720/30240/1209600/40320) and `p4_T3_bound`\n(4-term triangle), and the list-scale wall corollary (F4b: provable at\nt ≲ 94 550; the dps-50/PINNED wall 0.896783 up to 1e8 stays recorded, not\nLEAN-claimed).\n\n### 25ae Lean port — Stage 3A LANDED (2026-09-16, B8 periodic + finite telescope + J_finite, full build green)\n\nStage 3A of the 25ae Lean port is LEAN-PROVEN in `formal/RhAttack/P4Limit.lean`.\nFull `lake build` (leanprover/lean4:v4.33.1 + mathlib v4.33.1): 17434 jobs,\n0 errors, 0 sorry (the four \"sorry\" grep hits in the package are doc comments\nstating \"No sorry\").\n\nComponents landed (all in `formal/RhAttack/P4Limit.lean`):\n\n- **`def B8 (x : ℝ) := B8poly (x - ⌊x⌋₊)`** — the periodic 8-gonal kernel,\n  following nd `dsimp only [S8]`.\n\n**Proof-design lessons (durable, each cost a debug round):**\n\n1. **`sum_integral_adjacent_intervals_Ico (a) (h) (hint)` needs the\n   third argument** (the per-period integrability proof); omitting it leaves\n   the rw applied but with an unsolved integrability side-goal.  Its target\n   uses the upper endpoint `((k+1:ℕ) : ℝ)` (`↑(k+1)`), while hand-written\n   targets usually use `(k+1 : ℝ)` (`↑k + 1`): bridge with a follow-up\n   `rw [Finset.sum_congr rfl (fun k _ => by\n     rw [show ((k+1:ℕ) : ℝ) = (k:ℝ) + 1 from Nat.cast_succ k])]` (L4 pattern).\n2. **`intervalIntegral.integral_congr (h : EqOn f g [[a,b]])` — `[[a,b]]` is\n   `Icc a b` and `f, g` must be PINNED** (a named `have hIC : Set.EqOn f g s`,\n   then `exact (integralIntegral.integral_congr (μ := ...) hIC)`).  Passing an\n   inline `by` block leaves `f`, `g` as metavariables: the by-block's goal is\n   `?f x = ?g x`, `dsimp`/`rw` see nothing, the by fails, and the outer rw\n   never applies.  `EqOn` is `Set.EqOn` (needs `open Set` or the qualified\n   name).\n3. **`B2poly` (and the Stage-1–3 `B{K}poly` defs) unfold across files with\n   `dsimp only [B2poly]`** — the real gotcha is the constant term: a polynomial\n   written with a `: ℂ` ascription over the whole expression stores `1/6` as a\n   COMPLEX division, while the def-body form stores `↑(1/6 : ℝ)`.  The two are\n   equal only via `simp [Complex.ofReal_div]` (not `rfl`, not `ring`).\n4. **Under `induction' k`, any hypothesis containing `k` is REVERTED into the\n   IH as a premise** (`IH : (hsumf at k) → (sum = endpoint)`); apply it as\n   `IH (hsumf recon struct ed at k)`.  The plain `rw [IH]` then fails with\n   \"pattern not found\" because the goal carries the `set`-defined summand form\n   while the IH carries the raw form.\n5. **`omega` is context-fragile**: `n + (k + 1) = (n + k) + 1` closes in a bare\n   context but fails inside heavy tactic contexts (hypotheses with\n   integrals/coercions).  `by ring` is context-independent — prefer it for\n   `show` witnesses in induction blocks.\n6. **Brace-implicit arguments are not positional**: atoms declared\n   `theorem p4_25ae_ibp_bKtoK1 {s : ℂ} (hsre : s.re = 1/2) (j : ℕ) (hj : 0 < j)`\n   must be applied as `… (s := s) hsre j hjpos`; passing `s` positionally\n   shifts everything (`s` lands in the `hsre` slot).  Same for\n   `p4_25ae_telescope_pow (p := …)` and `p4_25ae_telescope_pow_aux` (no\n   explicit `p` at all).\n7. **`Finset.mem_Ico` is not omega-visible**: derive `0 < j` from\n   `j ∈ Finset.Ico n M` via `rw [Finset.mem_Ico] at hj; omega`.  Note the\n   integrability argument of `sum_integral_adjacent_intervals_Ico` passes a\n   `Set.Ico` hypothesis (`Set.mem_Ico.mp hk |>.1`), while the finset-level\n   goals use `Finset.mem_Ico` — both exist, both are `@[simp]`.\n8. **`ContinuousOn` target-set casts**: `(j + 1 : ℝ)` stores as `↑j + 1`,\n   while lemma targets often carry `((j+1:ℕ) : ℝ)` (`↑(j+1)`); bridge with\n   `.mono (by intro x hx; rw [show (j:ℝ) + 1 = ((j+1:ℕ) : ℝ) from\n   (Nat.cast_succ j).symm]; exact hx)]`.  And `0 < x` on [j, j+1] needs the\n   `n ≤ j` leg (`0 < n` alone does not give `0 < x`).\n9. Telescoping base case: `simp [Finset.Ico_self]` closes\n   `0 = (((n+0:ℕ):ℝ):ℂ)^p − ((n:ℝ):ℂ)^p` (add_zero + sub_self under casts);\n   a trailing `ring` then reports \"No goals to be solved\".\n10. Calc assembly: when the left side is already in `((s+2)/3) * S3` order,\n    `rw [mul_comm]` (no anchors) normalizes to the `S3 * ((s+2)/3)` order that\n    the ladder hypotheses (`h3`–`h7`) expect; an anchored `rw [mul_comm S3 _]`\n    fails because the pattern is not present.\n\n**NEXT (Stage 3B):** the `M → ∞` passage (`p4_25ae_J_iota`: endpoint terms →\n0 via `tendsto_rpow_neg_atTop`; S8 → the improper integral I₈ via the Cauchy\ncriterion on period sums, comparison against `x^(−17/2)`), then\n`p4_25ae_I8_bound` (|I₈| ≤ n^(−15/2)/225), `p4_T3_expansion` (the F1 exact\n4-term identity), `p4_T3_bound` (4-term triangle + `tendsto_nhds_unique`) |\n| 3B.10 `p4_25ae_T3_bound` | `‖−(1/2)s(s+1)∫_n^∞ B2 x^{−s−2}‖ ≤ T3UB` — the sharpened 4-term triangle bound stated below |\n\n### THE CORRECTIONS (discovered during the Lean port; the anchor script was wrong)\n\n1. **F1 second-term exponent: `n^{−9/2}` → `n^{−11/2}`.**  The anchor\n   `day026_25ae_final.py` (and the F1 docstring) carried the second triangle\n   term as `|S4|·n^{−9/2}/30240`.  On the critical line `Re(−s−5) = −(1/2+5) =\n   −11/2`, so the endpoint term `n^{−s−5}` has norm `n^{−11/2}`.  The Lean\n   theorem carries `n^{−11/2}` (`hN5`).  This is a hard correction: it makes\n   the S4-term decay as `t^{−1/2}` (rather than grow as `t^{+1/2}`) at list\n   scale, so it dominates the wall.\n2. **F1/F4 fourth-term exponent: `n^{−31/2}` was a typo.**  Correct\n   `|I8| ≤ (1/30)·(2/15)·n^{−15/2} = n^{−15/2}/225` (3B.8), hence the\n   fourth triangle term is `|S6|·|s+7|·n^{−15/2}/9072000`.\n3. **The CORRECTED 4-term bound (3B.10, machine-proven):**\n   ```\n   T3UB(n,s) = |s(s+1)(s+2)|·n^{−7/2}/720\n             + |s(s+1)(s+2)(s+3)(s+4)|·n^{−11/2}/30240\n             + |s(s+1)(s+2)(s+3)(s+4)(s+5)(s+6)|·n^{−15/2}/1209600\n             + |s(s+1)·…·(s+7)|·n^{−15/2}/9072000\n   ```\n   (last factor `= |S6(s+7)|/9072000 = |S6|·|s+7|/9072000`; `9072000 =\n   20160·450`).\n4. **Wall re-anchor (list scale `n = ⌊13t/8⌋`, `s = 1/2 + it`):**\n   crossover of `T3UB/|T1|` with `1 − (1/6)(8/13) = 0.8974359…` is now\n   **`t ≈ 1.217e8`** (recomputed, dps-safe scan).  At `t = 1e8`: ratio\n   `0.7374597`, **wall margin `≈ 0.15998` (16 %)**.  The old anchor figure\n   `94 550` is voided (it used the wrong `n^{−9/2}` second term); the old\n   dps-50 pin `0.896783 @1e8` is superseded by the corrected measurement\n   `0.73746 @1e8` (PINNED measurement, not yet a Lean claim).\n5. **Chosen Lean wall for 3B.11: `t ≤ 1e8`** — a clean constant with a 16 %\n   margin under the corrected bound.\n\n### Incident (file corruption during a bulk insertion)\n\nAn anchored bulk Python insertion (the first attempt at 3B.10) transiently\ncorrupted `P4Limit.lean` — it dropped the top-level L5 block\n(`p4_zeta_split`…`p4_T4_ratio`) and a section boundary, breaking\n`RhAttack.P8Floor`.  Rebuilt from `HEAD` (3A prefix + L5, verbatim) + the\ncurrent 3B content inserted inside the `noncomputable section` before its\n`end`; full package build verified green after each step.  Standing lesson\n(appended to the cumulative list): for bulk edits > 50 lines in this module,\nverify anchor uniqueness AND inspect the resulting `git diff` stat before\nbuilding — prefer extracting from two known-good snapshots over in-place\nreplacement.\n\n### Proof-engineering notes (Stage 3B, cumulative)\n\n- **FTC-2 for real powers:** `integral_eq_of_hasDerivAt_off_countable` with\n  `s := ∅`; integrand `x ↦ (−17/2)·x^{−19/2}` via `hasDerivAt_rpow_const\n  (Or.inl (ne_of_gt hx))`; the constant-multiplier derivative bridged with\n  `HasDerivAt.const_mul (c) h` + `.congr_deriv (c) (show by ring)` —\n  `convert (HasDerivAt.const_mul _ h) using 1` can spawn extra typeclass\n  goals (`ring` cannot rewrite rpow exponents, so exponent arithmetic like\n  `−(15/2) − 1 = −(17/2)` is a separate `show … by ring`).\n- **`Complex.continuousAt_ofReal_cpow_const x y (0 < y.re ∨ x ≠ 0)`** is the\n  pointwise cpow-continuity entry point; on `(c,∞)` feed `Or.inr (ne_of_gt\n  (hc.trans hx))`.\n- **`norm_integral_le_integral_norm (f := …) (μ := volume.restrict (Ioi c))`**\n  — pin `f` and `μ` explicitly (curly `B` stays inferred); the LHS indicator\n  cancels by simp; the RHS variation bridge is `ae_restrict_iff'\n  measurableSet_Ioi` + `ae_of_all`.\n- **Order-limit pattern for `∫_n^M ≤ C` with `F(M) → L`:** split\n  `eventually [Ici (max …)]` into `eventually (F → L)` and\n  `eventually (F ≤ C)` via `Metric.ball_mem_nhds` + `mem_of_superset`; then\n  `L ≤ C` by `lt_of_le_of_lt`/`le_of_lt` composition.\n- **`intervalIntegrable_iff` + `uIoc` bridge:** for the closed-interval\n  majorant, `rw [intervalIntegrable_iff]` at both the hypothesis and the\n  goal; `uIoc (n : ℝ) M ⊆ Ioi (n : ℝ)` holds for all `M` (the min/max\n  definition makes the left endpoint inclusive exactly when `n ≤ M`).\n- **Cauchy on period sums (S8 → I8):** `IntegrableOn.cauchy` gives\n  `eventually (fun p q => ‖∫ in a..b‖ < 3ε)` on `Ioi c ×ˢ Ioi c`;\n  `set PQ` + a single `filter_upwards` with `M,N ≥ max(n, (n:M)+ceil c)`\n  closes both coordinate projections (no `Filter.Fsim` needed).\n- **`Tendsto.congr'` for the `=ᶠ` bridge:** direction is\n  `f₁ =ᶠ[l] f₂` with the *known-tendsto* function as `f₁`; the `Ici n`\n  filter carries the `M ≥ n` side condition of `p4_25ae_J_finite`.\n- **`tendsto_nhds_unique`** (T2 + `NeBot`) is the limit-uniqueness closer;\n  `intervalIntegral_tendsto_integral_Ioi a hInt tendsto_id` composes with\n  `tendsto_natCast_atTop_atTop (R := ℝ)` for the ℕ-indexed passage.\n- **`rw` auto-closes** a goal that becomes reflexive — trailing `ring` after\n  a closing `rw` then errors \"No goals to be solved\"; same for `calc` steps\n  whose target equals the goal's remainder.\n- **`0 < x` chaining:** write `have h0x : 0 < x := hc.trans hcx` explicitly;\n  inline `hc.trans hcx` inside `ne_of_gt (…)` mis-parses (the `.trans`\n  expects a proof argument, not a relation).\n- **`linarith` polymorphic-literal trap:** `zero_lt_one` in a real goal can\n  spawn a stuck `NeZero 1` instance; `show (0 : ℝ) < 1 by norm_num` avoids\n  it.\n- **`calc` in `≤` goals:** `=` steps rewrite the goal's LHS; the final\n  obligation is `TARGET ≤ TARGET` — close it with an explicit `_ ≤ TARGET :=\n  le_rfl` step (or wrap the `=` calc in a `have hcalc : LHS = TARGET` and\n  conclude with `exact le_of_eq hcalc`).\n- **`gcongr` does not use hypotheses for its core atom automatically when\n  the term shapes differ**; the explicit `apply\n  mul_le_mul_of_nonneg_left hBOUND; positivity` is the reliable closer.\n- **Rational-literal rpow exponents:** `-(15/2 : ℝ)` and `-(15 : ℝ)/2` are\n  extensionally equal but NOT definitionally — `simpa` fails across the\n  two forms; bridge with `have heq : -(15/2 : ℝ) = (-(15 : ℝ)/2) := by\n  norm_num` + `simpa [heq]`.\n\n### 25ae 3B.11 — Part A LANDED (2026-09-16, list-scale wall on 1 ≤ t ≤ 13)\n\nThe 3B.11 wall corollary landed in two parts; **Part A (this entry)**\ncovers `1 ≤ t ≤ 13` (four floor-bands); **Part B (13 ≤ t ≤ 1e8)** follows\nin the next commit.\n\n**Landed in `RhAttack/P4Limit.lean` (all LEAN-PROVEN, full build\n17434 jobs / 0 errors / 0 sorry):**\n\n- `t3w_prod`, `t3w_p`, `t3w_d`, `t3w_term`, `t3w_T3UB` — the sharpened\n  4-term bound at list scale.  Term indices `{2, 4, 6, 7}` match the four\n  products of `p4_25ae_T3_bound` (`∏_{k≤i} (t² + (k+1/2)²)`, i = 2, 4, 6,\n  7; i = 7 is the 8-factor `|S6|·|s+7|` product ending at 15/2).\n- `t3w_qA{1..4}_{r}`, `t3w_rA{1..4}_{r}` — strict rational endpoint\n  constants (records: `scripts/rh/day026_25ae_t3wall.py`, exact\n  `Fraction` + `isqrt`; `q` = `(isqrt(a·b)+1)/b` upper bound of\n  `√(a/b)`; `r` upper bound of `n_min^{−p}` via the integer lower bound of\n  `√n_min`).\n- `t3w_prod_mono` (product ↑ in t), `t3w_invpow_le_one` (n^{−p} ≤ 1).\n- **`t3w_wall_A1..A4`** — with `n = ⌊13t/8⌋₊`:\n  - A1: `1 ≤ t < 16/13` (n ≥ 1) → `T3UB < 35/78`  (bound ≈ 0.0218, margin 0.427)\n  - A2: `16/13 ≤ t < 4` (n ≥ 2) → `T3UB < 35/234`  (bound ≈ 0.0186, margin 0.131)\n  - A3: `4 ≤ t < 8` (n ≥ 6) → `T3UB < 35/312`  (bound ≈ 0.00187, margin 0.110)\n  - A4: `8 ≤ t < 13` (n ≥ 13) → `T3UB < 35/390`  (bound ≈ 0.000488, margin 0.089)\n\n  Each band: per term, `√(t3w_prod t r) < q_{r}(t*)` by monotonicity +\n  `Real.sqrt_lt'`/`norm_num`, and `(n:ℝ)^{−p_r} ≤ r_{r}` (A1: `t3w_invpow_le_one`\n  with `r = 1`; A2–A4: `1/n^p ≤ 1/n_min^p` via `rpow_le_rpow` + strict\n  `1/n_min^p < r_{r}` via the `x^{(2k+1)/2} = √(x^{2k+1})` rewrite and\n  `one_div_lt` + `Real.lt_sqrt`), then sum the four\n  `q·r/d` rational constants `< Hlb` by one `norm_num`.\n\n**In-session incidents (honest record):**\n\n1. **The original q-constants were mathematically WRONG** (the scan script's\n   `qdump` used `m/(b·m₁)`, `ub` used `isqrt(a·b²)` — both wrong formulas).\n   The q-lemma proofs (`√(prod) < q`) were false statements; every build\n   that \"passed\" was a false pass (see 2).\n2. **Grep bug masked the failures:** `lake env lean` prints errors\n   path-prefixed (`Path/File.lean:N:M: error:`), so `grep ^error` matched\n   nothing and several \"green\" checks were false.  Rule now: grep `error`\n   without `^`, or check the build exit code properly (`PIPESTATUS`).\n3. **Identifier primes are ASCII in Lean sources** (`t'`, `sqrt_lt'`);\n   the Unicode prime U+2032 in source is a *different token* and breaks\n   parsing (`{t t′ : ℝ}` → `unexpected token '′'`).\n4. **`one_div_le_one_div` argument order** (`1/a ≤ 1/b ↔ b ≤ a`) must be\n   matched to the goal's a/b or it silently re-purposes the positivity\n   proofs and the final `rpow_le_rpow` unifies backwards.\n5. **norm_num does not unfold `def`-constants silently** — the rational\n   endpoint constants must be listed in `norm_num [t3w_qB_r, …]`.\n\n**Next: 3B.11 Part B (13 ≤ t ≤ 1e8).**  Design (validated numerically,\nexact `Fraction`): per-term log-derivative\n`h_i(t) = s_i t/(t² + 169/4) + 1/(2t) − p_i·(13/8)/(13t/8 − 1)`;\nterms 1–3 (s = 2, 4, 6) have `h_i < 0` on `[13, ∞)` (cleared-denominator\nquartics `M₁(t) = 364t⁴ − 260t³ + 15539t² − 2197t + 1352`,\n`M₂(t) = 572t⁴ − 468t³ + 24455t² − 2197t + 1352`,\n`M₃(t) = 780t⁴ − 676t³ + 33371t² − 2197t + 1352`, all with positive\nTaylor-at-13 coefficients); term 4 (s = 8) is handled by splitting at 100: a uniform crude bound on\n`[13, 100]`, and endpoint-max (max at `t = 1e8`) on `[100, 1e8]` — signs:\nh₄(13) < 0, h₄(100) > 0, h₄(1e8) > 0, h₄ strictly convex (so it has at most\ntwo zeros; after the unique crossing it is increasing).  Endpoint sum\n`K1 + K2 + K3 + K4 < 1` (K₄ ≈ 0.82108; total ≈ 0.82117; margin ≈ 0.1788).\nFinal theorem: `1 ≤ t ≤ 1e8 → T3UB(n(t), 1/2 + it) < (1/2)·n(t)^{−1/2}·(35/39)`\n(bridging `t3w_T3UB ≤ p4_25ae_T3_bound`'s sum and `n ≤ 13t/8` for the\nright-hand-side height lower bound).\n\n### NEXT (3B.11 Part B: 13 ≤ t ≤ 1e8)\n\nAfter Part B lands: the combined wall theorem `p4_25ae_wall_list_scale` (1 ≤ t ≤ 1e8) + Stage-3B closeout (docs, mirror, push, wiki).\n\n### 25ae 3B.11 — Part B batches 1–3 LANDED (2026-09-16, commits 94ffd81, 5bf1063, 912ac4b, 16211bd; 38aec05 voided)\n\n**Part B scope**: the list-scale wall on `13 ≤ t ≤ 1e8` via the log-derivative method on the normalized ratio\n`R_i(t) = sqrt(t3w_prod t i) · (13t/8 − 1)^(−p_i) · 2·(13t/8)^(1/2) · (78/70) / d_i` with `i ∈ {2,4,6,7}`,\nso that `Σ_i R_i(t) < 1` and `T3UB < ½·n^(−1/2)·(35/39)`. Constants: `scripts/rh/day026_25ae_t3wallB.py` (+ sidecar).\n\n**Batch 1 (94ffd81, pushed)** — flat exact numerator/denominator forms for `h_i(t) = R_i'(t)/R_i(t)`:\n`t3wB_num2/4/6/7`, `t3wB_den` (shared positive denominator), `t3wB_h*_id` bridges; exact K-constants\n`K2 = 69379921/76684038375`, `K4 = 58741168772/5963180876155125`, `K6 = 134976489576526/1082001280435718965875`,\n`K7 = 27152220160000230793871360000541788613017600365952532275199977013110761687 / 33069018044903324635418068668593060916969864823485826249274579824803840000`.\n`i = 2,4,6`: reduced numerator has all-negative coefficients, denominator positive for `t > 0` ⇒ `h_i < 0` ⇒ `R_i` decreasing, max at `t = 13`.\n`i = 7`: numerator degree 17, one interior zero; endpoint control via `B7_13 < LB7_1e8`.\n**Bug fixed in this batch**: the i=7 numerator had a degree slip (a `-71303168` coefficient wrongly at `t^15` instead of\n`t^16`; corrected sympy numerator has no `t^15` term). Gates: `N7(13) = −55519170304302480236900400 < 0`,\n`N7(20) = 97030023834507112821255360000 > 0`. Sum of K-constants ≈ 0.821992029204 < 1 (margin ≈ 0.178).\n\n**Batch 2 (912ac4b, pushed)** — i = 7 single-zero structure on `[13, ∞)`: shifted Taylor atoms at `t = 13`\n(`t3wB_N7shift/f1/pp`: `b_0 < 0`, `b_1 < 0`, `b_k > 0` for k ≥ 2; second derivative all-positive),\n`exists_deriv_eq_slope` chains, strict increase of the first derivative, and `t3wB_num7_single_zero`.\n\n**Batch 3 (16211bd, pushed)** — derivative identities: `t3wB_logDeriv_quad`, `t3wB_prod_differentiableAt`,\n`t3wB_logDeriv_t3wProd` (induction via `logDeriv_mul` with pointwise nonzero hypotheses — `logDeriv_prod`'s\nproduct-of-functions form does not match the pointwise `t3w_prod`), `t3wB_prod_deriv`, `t3wB_logDeriv_sqrtProd`,\n`t3wB_logDeriv_rpowLin` (outer-first `logDeriv_comp` + explicit `∘`-bridge where the point does not split\nsyntactically), and the headline\n`t3wB_RhasDerivAt : HasDerivAt (fun x => t3wB_R i x) (t3wB_R i t · (t3wB_num i t / t3wB_den i t)) t`\nfor `i ∈ {2,4,6,7}`, `t ≥ 13`. All 7 new theorems `#check`-verified against the compiled olean.\n`lake build RhAttack.P4Limit` green (8709 jobs); full `lake build` green (17434 jobs).\n\n**INCIDENT — the blank \"atoms green\" commit (38aec05), retracted**: an earlier session reported batch-3 atoms as\ngreen and committed; the commit added a single blank line and the atom text was never in the target file, so later\n\"green\" build/job counts were for unchanged content. Discipline now recorded as permanent: (1) an \"atoms green\" claim\nrequires `#check` of the new names against the compiled olean *and* inspection of the actual inserted lines, not just\nmarker counts / `git diff --stat` / a green default-target build. The batch-3 block was re-derived from\n`/tmp/b3_final.lean`, spliced in, and made genuinely green across ~60 targeted compile iterations.\n\n**Proof-engineering notes (batch 3, permanent traps)**:\n- `DifferentiableAt.comp {f g x} (hg : DifferentiableAt g (f x)) (hf : DifferentiableAt f x) : DifferentiableAt (g ∘ f) x` —\n  the point is an *explicit* parameter and the order is **outer-first**; member syntax `a.comp b` mis-elaborates\n  (x-slot confusion). Call it as `DifferentiableAt.comp t hOuter hInner`.\n- `logDeriv_comp` is also outer-first: `logDeriv_comp (hdf_outer) (hdg_inner)`; when the composition point is a compound\n  expression (e.g. `(13/8)·t + 0`), bridge the function to literal `f ∘ g` form with a `funext`-`rfl` show first.\n- `LT.lt.ne' (h : a < b) : b ≠ a` is the direction `hasDerivAt_sqrt` wants from `0 < P`; `.ne` gives the reverse.\n- `hasDerivAt_rpow_const (h : x ≠ 0 ∨ 1 ≤ p)` — the exponent is implicit (do not pass `y` explicitly).\n- `div_mul_cancel₀ (a) (h : b ≠ 0) : a / b * b = a` is the field version; bare `div_mul_cancel` is the group lemma\n  (the 2-arg form with no hypothesis is not the field one).\n- `((n + 1 : Real) + 1/2)` elaborates to `↑n + 1 + 1/2` while `((n + 1 : ℕ) + 1/2)` elaborates to `↑(n+1) + 1/2`;\n  `ring` cannot bridge `↑(n+1)` and `↑n + 1`. Pick one cast form and use it in every factor of an induction step.\n- `rw [show E from by …]` with a multi-tactic by-block inside a bracketed rw list is a parse trap; pull the show into a\n  standalone `have` (or keep the by to a single tactic on one line).\n- `logDeriv_const (a) : logDeriv (fun _ ↦ a) = 0` is point-free; rewriting under an application leaves `0 t`\n  (function-zero application). Close with `change … + 0 = … ; exact add_zero _`.\n- `field_simp` frequently auto-closes the goal it normalizes (then a trailing `ring` is a \"No goals\" error); when it\n  leaves a cross-multiplied residue, that residue is ring-closable. `ring` does not bridge distinct ring-atoms under an\n  inverse: `((13/8)·t + 0)⁻¹ ≠ (13t/8)⁻¹` to `ring` — unify the denominator inside the show instead.\n- `rw` auto-closes goals that become reflexive; a `have`/`ring` placed after such an rw is then a \"No goals\" error.\n- A recursive theorem being defined must be referenced via the induction hypothesis `ih`, not by its own name, inside\n  its own induction (self-call inside `rw` fails structural-recursion elimination).\n\n**BATCH 4 LANDED (2026-09-16)**: monotonicity / endpoint / final wall closeout. The 22 planned atoms\ncame out as 33 theorems (helpers split), all LEAN-PROVEN, `#check`-verified against the compiled\nolean, full build green (17434 jobs). Statement of the closeout (`p4_25ae_wall_list_scale`):\n\n  ∀ t, 1 ≤ t ≤ 1e8, n = ⌊13t/8⌋₊  ⟹  t3w_T3UB n t < (1/2)·n^(−1/2)·(35/39).\n\n  * i = 2,4,6: `t3wB_num2/4/6_neg` (batch 1) + `t3wB_RhasDerivAt` (batch 3) ⇒ `t3wB_R_strict_anti` /\n    `t3wB_R246_anti` (MVT + `exists_deriv_eq_slope`) ⇒ `R_i(t) ≤ R_i(13) < K_i` (endpoint squares are\n    EXACT rationals: e.g. `t3wB_R2_13_sq` gives R_2(13)² = 118844923935296/154571611490816995125;\n    each K_i² comparison closes by `norm_num` on the Python-exact literals).\n  * i = 7: IVT (+ batch-2 gates N7(13)<0<N7(20)) gives the unique zero z* ∈ (13,20) —\n    `t3wB_num7_zero_in_13_20`; sign lemmas `t3wB_num7_sign_left/right` (uniqueness from batch 2 +\n    fresh-zero contradiction, all by_cases/¬-style, no trichotomy) ⇒ `R_7` decreases on [13,z*] and\n    increases on [z*,1e8] ⇒ `t3wB_R7_le_1e8` (endpoint maximum, since `t3wB_R7_13_lt_1e8` from the\n    canonical `B7_13 < LB7_1e8` pin) ⇒ `R_7(t) ≤ R_7(1e8) < K7`.\n  * `t3wB_K_sum_lt_1`: K2+K4+K6+K7 < 1 EXACT (margin ≈ 0.17800797, norm_num on the canonical\n    rationals) ⇒ `t3wB_wall_sum` ⇒ floor-corrected bridge `t3wB_term_le` (valid whenever 13t/8 − 1 ≤ n;\n    holds for n = ⌊13t/8⌋₊) ⇒ `t3wB_wall_band` (13 ≤ t ≤ 1e8: T3UB < t3wB_target t).\n  * Final theorem: Part B by wall band + n ≤ 13t/8 ⇒ target ≤ n-form; Part A by the four\n    `t3w_wall_A*` bands with n-form comparisons (A2–A4 via √m < k; A1 special).  CANONICAL\n    CONSTANTS unchanged: scripts/rh/day026_25ae_t3wallB.py.\n\n**Proof-engineering notes (batch 4, permanent traps)**:\n- `Nat.floor_le (ha : 0 ≤ a) : (⌊a⌋₊ : R) ≤ a`, `Nat.le_floor`, `Nat.le_floor_iff (ha : 0 ≤ a)`,\n  `Nat.floor_lt (ha : 0 ≤ a)` live in `namespace Nat` (Mathlib/Algebra/Order/Floor) — unqualified\n  `floor_le`/`le_floor`/`floor_lt` do NOT resolve. `Real.one_rpow` is namespaced under `Real`.\n- The nat-floor route beats the `Int.floor_toNat`/`toNat_of_nonneg` route: `rw [← Int.floor_toNat …,\n  Int.toNat_of_nonneg …]` on ℝ-cast goals fails to match (the toNat equation elaborates at a cast\n  level that never meets the target subterm). Use `rw [hn]; rw [Nat.floor_le/le_floor_iff …]` after,\n  and close the cast-normalized residues with `linarith` (which does normalize ↑1 vs OfNat-1).\n- `rw` lists ELABORATE their arguments against the PRE-rewrite goal: `rw [hn, Nat.le_floor_iff (by\n  linarith [h])]` can fail where two sequential `rw`s succeed (the by-argument is elaborated before\n  `hn` changes the goal).\n- `1 ≤ 13·t` must be PROVED as `13 * 1 ≤ 13 * t := mul_le_mul_of_nonneg_left (1 ≤ t) (by norm_num)`\n  with that exact target shape; the `(13 : ℝ) ≤ 13 * t` / `(1 : ℝ) * 13 ≤ 1 * t` shapes leave a meta\n  in the multiplier and `norm_num` then fails with an unsolved `0 ≤ ?m` (same trap in both Part A and\n  Part B of the final theorem).\n- Exponent-SYNTAX is identity: the file's target def writes `^ (-(1/2 : ℝ))` while theorem statements\n  use `^ (-1/2 : ℝ)` — these are NOT defeq, so `rw`/`exact` reject the switch; bridge with\n  `rw [show (-(1/2 : ℝ)) = (-1/2 : ℝ) by ring]` exactly once at the use site.\n- `mul_lt_mul_of_nonneg_left` does not exist; the left-multiplication lemma is\n  `mul_lt_mul_of_pos_left (hbc : b < c) (ha : 0 < a) : a * b < a * c` (and `…_of_nonneg_left` is its\n  ≤ sibling with `0 ≤ a`). Lean 4 has no `ring at h ⊢` — use `ring_nf at h ⊢` or a calc with\n  `mul_comm`/`mul_one`.\n- `One ^ x = 1` is `Real.one_rpow` with the exponent implicit-ish: pass nothing (or the goal's exact\n  term) — `Real.one_rpow (-(1/2 : ℝ))` reintroduces the syntax split above.\n- A flat degree-17 polynomial identity (`num_7 (13+u) = N7shift u`) closes with `dsimp only […]; ring`\n  in ~3s at boosted `maxHeartbeats 600000` when ISOLATED; embedded inside a differentiability proof\n  it hits deterministic isDefEq/whnf timeouts — cache it as its OWN theorem first, then compose the\n  smoo TIVE margin (-3.411e-12) by construction; the SAFE certified\n      edge is the upper bracket rounded up:\n        r2' = 47384091/10^10 = 0.0047384091,\n        F_sharp(r2'^2) - Cw = +3.8287e-11  (exact positive rational).\n  [3] RESTATEMENT: the bound-level strip squeeze\n      (p8_B(t, n4) + M e^{X4} X4 <= Cw t^-2, st_hSQ) therefore extends\n      from the d >= 1/200 edge to d >= r2' = 0.0047384091 -- a 5.23%\n      extension of the closure-relevant own-regime strip; on\n      (r2', 1/200) the mown(t, d) floor is F_sharp(d) (the old F4\n      atom is 0/inapplicable there).\n  [4] AGREEMENT WITH 25af [7]: the data-level edge d* = 0.004738\n      (printed from the measured squeeze) vs the bound-level d_F =\n      0.004738408 (this study): both in (0.00473840, 0.00473842);\n      F_sharp(0.0047385^2) - Cw = +3.484e-09 > 0, i.e. the bound\n      level covers the whole printed d* interval.  The ~2e-9 bound-\n      level offset above the true squeeze crossing is exactly the\n      anchor (A1 above the true (1/2)(3.1e7)^(-1/2) = 8.9802651e-5 by\n      7.35e-9) + floor (g below the true ratio by ~5e-7 relative)\n      margin structure.  The old d-grid edge 1/200 sits 5.5% above the\n      squeeze edge (25af [7]); it now sits 5.5% above a CLOSED edge.\n  [5] t-structure (measured, dps-30): the TRUE mown*t^2 is DECREASING\n      in t and down-converges to 4 d^2 -- the e^c factor (c ~ 1/t^2,\n      e^c > 1) dominates the slowly-increasing g(t^2) part.  The floor\n      is UNAFFECTED: mown*t^2 = 4 d^2 g(t^2) e^{c(t)} >= 4 d^2 g(t^2)\n      >= 4 d^2 g(10^6) = F_sharp.  (First run of this study mislabeled\n      the [3]/[4] columns and the monotone direction; corrected in the\n      committed output -- the exact algebra was correct from the start.)\n  [6] BELOW d_F: intrinsically open at the t^-2 wire level\n      (F_sharp -> 4u < Cw as u -> 0) -- as 25af [7] stated for the\n      data edge: not closure-relevant; the S2 floor side / the near\n      pin 0.9975 at the witness handles that region (unchanged).\n- **HONEST SPLIT**: MEASURED -- [3]/[4]-style mpmath dps-30 cross-\n  check tables (true mown closed form vs F_sharp vs Cw; the true\n  squeeze-crossing location).  PINNED -- day033 script + output\n  (exact F_sharp, P coefficients, u_F bracket, r2' = 47384091/10^10,\n  margin 3.8287e-11; day028 Cw/F4 constants).  LEAN-PROVEN -- none\n  new yet (this is the constant study; all inputs are existing atoms:\n  S4O.mown closed form, S4Own c > 0 one-line, S4Strip day028 constants\n  A1..A3/MT/F4, st_hSQ).  CITED -- the S4Own.hMownScaleLo/Hi atoms\n  (status flows from S4Own).\n- **LEAN FOLLOW-UP (named, per the 25af pattern: constants first, port\n  second)**: (i) st_mownfloor_sharp: F_sharp(d) * t^-2 <= mown(t, d)\n  for all t >= 1000, 0 < d < 1/2 (c > 0 one-line positivity; the g'\n  positivity line (c0-a)u^2 + 2 d0 u + a d0 > 0; the g(u0) ratio\n  comparison -- exact rationals, norm_num-able); (ii) the d-edge\n  parameter 1/200 -> r2' in s4_strip_close (margin 3.8287e-11 via\n  st_finalconst's norm_num); (iii) S4A.s4asm_S4_on_pairs: the\n  d0 < 1/200 near-pin case split edge moves 1/200 -> r2' (the band\n  (r2', 1/200) becomes covered by mown(t, d0)).  Per the owner's\n  standing rule (2026-09-19): the port searches ONLINE FIRST for any\n  latest-mathlib lemma or reorganization (monotone ratio/pow/div\n  chains, positivity) before deriving atoms by hand.\n\n================================================================\n2026-09-19  day033 LEAN PORT — LANDED (item 6, the d-dependent floor)\n================================================================\n\nScope: the day033 sharper d-dependent floor F_sharp (queue item 6) is now\nLEAN-PROVEN, additive to the green 1/200 line (nothing on the old line\ntouched).  New declarations, all building on the pinned\nleanprover/lean4:v4.33.1 + mathlib v4.33.1:\n\nRhAttack/S4Strip.lean:\n  r2prime : R = 47384091 / 10^10 (= 0.0047384091; flat exact integer\n    form, NOT a 10^10 power term -- see the whnf note below).\n    hr2prime_pos : 0 < r2prime.\n  FshU (u : R) := 1000000 * u * (u + 4000000) /\n      (1000000000000 + 2000000 * u + 500000 + ((1/4 : R) - u)^2)\n    (the sharp floor in u = d^2, i.e. F_sharp(u) of the day033 note;\n    the numerator is the day033 Xf AFTER cancelling the common u;\n    flat exact-integer constants by design).\n  Fsh (d : R) := FshU (d^2).\n  st_mownfloor_sharp : (1000 <= t, 0 < d <= 1/2)\n      -> Fsh d * t^(-2 : R) <= S4O.mown t d.\n    (the day033 floor, the whole strip 0 < d <= 1/2 at every t >= 1000;\n    exact algebra: after cancelling u the cross-multiplied deficit is\n    N4(v) = Aco*(v-10^6)^2 + Bsh*(v-10^6) with\n    Aco = 4(1/4-u)^2 + 7000000*u + 2000000 > 0 and Bsh > 0,\n    verified EXACTLY in tmp/der_n4.py (fractions.Fraction grid) BEFORE\n    writing Lean; the first Xf draft (leading u) was wrong and was\n    caught by the exact grid.)\n  st_Fsh_mono : 0 < u1 <= u2 <= 1/4 -> FshU u1 <= FshU u2\n    (via the exact cross factor Nsh(u2)*D2star(u1) - Nsh(u1)*D2star(u2)\n    = (u2 - u1) * Q with Q > 0, Q flat-exact-integer form).\n  st_hfinal_sharp : A1 + (A2 + A3 + 25/10^15)/1000 < FshU (r2prime^2)\n    (the margin Cw = 8981000000052500001/10^20 vs F_sharp(r2'^2),\n    +3.8287e-11, as an exact-norm_num rational inequality).\n  s4_strip_close_sharp : (1000 <= t, r2prime <= d <= 1/2,\n      0 <= M <= Zbound t) ->\n      p8_B t (n4 t) + M * e^(X4fun t) * X4fun t < S4O.mown t d.\n    (day031's s4_strip_close with the d-edge MOVED from 1/200 to r2prime.)\n\nRhAttack/S4Asm.lean (section 7, additive):\n  s4asm_strip_region_S4_sharp (edge S4Strip.r2prime <= d0, calls\n    s4_strip_close_sharp with Zbound as M).\n  s4asm_S4_on_pairs_sharp : the pair coverage with the if-split at\n    r2prime -- strip branch via the sharp lemma, window branch via the\n    EXISTING d-independent s4asm_window_region_S4 (its near-pin bound\n    p8_f_near_pin has no d, so the edge moves for free).\n  The old s4asm_window_region_S4 / s4asm_S4_on_pairs (1/200 edge) are\n  UNCHANGED; both assemblies hold simultaneously, the sharp one\n  strictly stronger (the band (r2', 1/200] added at 5.23% of the old\n  strip width).\n\nVerification (per the standing verification discipline, not the default\ntarget alone):\n  lake build (whole project)                          0 errors\n  lake env lean RhAttack/S4Strip.lean                 0 errors\n  lake env lean RhAttack/S4Asm.lean                   0 errors\n  #check of all 10 new constants (st_mownfloor_sharp,\n    st_Fsh_mono, st_hfinal_sharp, s4_strip_close_sharp,\n    s4asm_strip_region_S4_sharp, s4asm_S4_on_pairs_sharp, r2prime,\n    FshU, Fsh, hr2prime_pos): exact types as intended.\n\nPer the owner's rule (SEARCH ONLINE FIRST, reinforced 2026-09-19), the\nport went: online search for current mathlib lemmas -> local pinned-\nmathlib grep -> probe -> patch.  The big ring/norm_num atoms used are\nold territory (ring, ring_nf, norm_num, linarith, field_simp,\ndiv_le_div_iff0, Real.one_le_exp, Real.rpow_neg, sq_pos_of_pos,\npow_le_pow_left0, mul_le_mul* family); nothing new was needed beyond\nthat.\n\nTOOLCHAIN HITS (pinned 4.33.1 + mathlib 4.33.1, all reproducible):\n\n1. KERNEL WHNF TIMEOUT ON POW-LITERAL CONSTANTS.  A top-level def whose\n   body contains (10 : R)^12 / (10 : R)^6 power terms (the original\n   FshU writing) made every ring-touching rewrite of that body time\n   out deterministically at whnf (200000 heartbeats): the pow term\n   expands to an 11- or 6-fold nested mul tree in the kernel.  Fix:\n   write 10^12-scale constants as FLAT NUMERALS (1000000000000,\n   2000000, 500000, 4000000000000, 10000000000) in the def bodies and\n   in every ring/linarith context.  r2prime = 47384091/10^10 was\n   likewise flattened to /10000000000.  After flattening the whole\n   port compiles under the repo's existing heartbeat convention\n   (set_option maxHeartbeats 1600000 scoped around the two heavy\n   theorems, as already used at line 819 of S4Strip for the old big\n   proof; restored afterwards).\n\n2. LOCAL SETS DEFAULT TO NAT FOR BARE NUMERAL BODIES.  `set K :=\n   1000000000000 + 500000 + 1/16` (no type ascription) types K as NAT:\n   1/16 in N is 0, silently dropping the fractional part and breaking\n   every downstream ring equality (linarith/ring then honestly refuse\n   an inequality that is no longer true).  Same trap for\n   `set Dneg := 2000000000000 + 500000`.  Fix: ascribe the first\n   literal ((... : R)); a body that already contains a (1/4 : R)\n   subterm is safe.  Lesson: every flat-integer local set in a\n   mixed-fraction context gets an explicit R ascription.\n\n3. CALC PARSER: MULTI-LINE LHS + NEXT-LINE BY-BLOCK.  In this pin, a\n   calc whose FIRST expression spans more than one line followed by a\n   step justified `:= by` with the tactic block on the NEXT LINE fails\n   to parse (\"unexpected token ... expected ':='\", the by-block is\n   seen as empty and the next line re-parsed as a calc step).  With a\n   single-line first expression the same form parses.  Fix: put the\n   first tactic on the `:= by` line itself (`:= by ring_nf at h ⊢;\n   linarith [...]`).  (Generalizes the earlier ProbeN6 pin:\n   calc-step justifications are same-line by or by { } blocks only.)\n\n4. LINARITH ARITH ATOM MISMATCH UNDER UNFOLDED LOCAL SETS.\n   linarith/nlinarith \"failed to find a contradiction\" on a goal that\n   is one weighted sum away, when the goal and the hypotheses contain\n   the same local-set constant in different unfolded forms (Dneg as a\n   folded local def in the hypothesis, flat in the goal).  Fixes that\n   worked: (a) `dsimp only [Dneg] at hn` BEFORE the linarith call;\n   (b) `ring_nf at hT1 hneg ⊢` before linarith (normalizes both sides\n   to identical atoms, including the K-folded terms).  The\n   nlinarith variant of the same step also failed; the explicit calc\n   chain with ring_nf-at preconditions closed it.\n\n5. RPOW NUMERAL BRIDGES IN THIS PIN.  `Real.rpow_natCast` exists but\n   is NOT a simp lemma in mathlib v4.33.1 (bare `simp` /\n   `simp only [rpow_natCast]` report \"made no progress\" on\n   t^(2 : R) = t^2 goals).  `norm_num` closes t^(2 : R) = t^2\n   directly (it evaluates numeric rpow); the t^(-2 : R) = 1/v bridge\n   is then `rw [Real.rpow_neg htpos.le (2 : R), inv_eq_one_div,\n   <norm_num bridge>]`.  ring does NOT close t^(2:R) = t^2 on its\n   own (the rpow atom is not a monomial for ring).\n\n6. LE_OF_EQ / MUL_LE_MUL_COMMUTATIVITY.  In calc tail steps proving\n   A <= A*e^c: mul_le_mul_of_nonneg_right produces c1 <= c2 in the\n   form m*a <= m*b (multiplier on the LEFT), so the calc chain must\n   pass through `A = 1*A := by ring`, then\n   `1*A <= e^c*A := mul_le_mul_of_nonneg_right ...`, then\n   `e^c*A = A*e^c := by ring`; writing the middle goal as\n   `A*1 <= A*e^c` type-mismatches (commutativity is not definitional).\n   And the final mown-identification step closed by `dsimp only\n   [S4O.mown]` ALONE (the local u/v sets are transparent, so the goal\n   is judgmentally reflexive; a following rewrite is a \"No goals to be\n   solved\" error -- the standing \"dsimp may close\" pin, recurring).\n\n7. EXACT-GRID-FIRST FOR POLY IDentities.  The first N4 draft (Xf WITH\n   a leading u factor) produced a nonzero ring residual and a false\n   \"identity is wrong\" signal; the exact fractions.Fraction grid\n   (tmp/der_n4.py, clean add/sub/mul helpers) caught it before Lean\n   was touched, and the corrected Xf = 10^6*(u + 4*10^6) (no leading\n   u) passed the grid first.  The helper-script Dstar was ALSO buggy\n   in one intermediate draft (a -u/2 term lost when expanding\n   (1/4-u)^2) -- the grid caught it too.  Rule reaffirmed: every big\n   polynomial identity is grid-verified EXACTLY in Python before it is\n   written into Lean, using a clean monomial-dict helper (wrong\n   monomial keys in hand-written dicts produce SILENT identity\n   failures that mimic \"the math is wrong\").\n\nHonest split update (day033 port): the day033 sharp floor is now\nLEAN-PROVEN (st_mownfloor_sharp, st_Fsh_mono, st_hfinal_sharp,\ns4_strip_close_sharp, the two S4Asm sharp assemblies) on the pinned\n4.33.1 stack; the data-side constants (r2' = 47384091/10^10, the d_F\nbracket [0.0047384080, 0.0047384081], the +3.8287e-11 margin, the\n5.23% band-width figure) remain MEASURED/PINNED exactly as recorded in\nthe day033 note.  No old statement changed; the 1/200 line stays\ngreen and untouched."}, {"n": 17, "date": "2026-09-19", "time": "", "title": "(day034) — item 7: CITED demotion audit (queue 7, part b)", "body": "For item 7, each of the five CITED universals (KNOWN_LIMITATIONS §3)\nwas checked against the pinned toolchain (mathlib v4.33.1, local\ngrep + source read of the pinned checkout) with the current upstream\nstate corroborated online first, per the search-first discipline.\nFindings:\n\n1. **Backlund RVM envelope (Zbound = 1.6·t^{1/4}·log t)** — NOT in\n   mathlib 4.33.1. No zero-free-region or zeta zero-counting content\n   anywhere in the pinned checkout; `NumberTheory/LSeries/ZetaZeros.lean`\n   (76 lines) carries only the topological facts about the zero set\n   (closed, discrete, finite on compacta, cofinite cocompact). ONLINE:\n   a community formalization **Zeta23** (anthropics/zeta-23-lean,\n   2026, the \"more than two thirds of the zeros lie on the critical\n   line\" paper) proves Weil's explicit formula for ζ and an RVM\n   local-count bound (Titchmarsh Thm 9.2 shape: the zero count in\n   (t, t+1] is O(log(...))), with an abstract ZeroConfig layer over\n   the strip multiset. Status: **stays CITED and load-bearing above\n   the data band; on [1e3, 1e9] the counting load is carried by the\n   pinned data** (the exact seam/Nt re-verification). Demotion path:\n   Zeta23-style adoption or re-derivation of an explicit RVM count —\n   scheduled as its own project.\n2. **P-T Sbar Cor 1 (log-scale on-line counting defect)** — NOT in\n   mathlib 4.33.1 (same check). **On the band the empirical defect is\n   PINNED at 0** (the 25af Sbar datum, the 813-zero structure), so the\n   CITED theorem bears only above 1e9 and for the production\n   methodology. Same demotion path as 1 (the Sbar statement is\n   RVM-counting machinery).\n3. **A2c bridge (W_n = em_expr on Re s = ½)** — classified\n   differently from 1/2/4/5: it is a FORMAL ALGEBRAIC identity\n   (gamma/reflection/functional equation on the critical line), not a\n   counting or zero-free universal. mathlib 4.33.1 carries the zeta\n   and gamma infrastructure (`NumberTheory/LSeries/RiemannZeta.lean`\n   with the completed zeta and pole structure). **Next small\n   formalization candidate** — a demotion to LEAN-PROVEN is a\n   finite-task port once the A2c module defines both sides.\n4. **Classical zero-free regions (d0 > 1/2)** — NOT in mathlib\n   4.33.1; Zeta23's abstract zero-config ASSUMES the strip locus\n   (0<β<1) rather than proving the classical zero-free region, so it\n   does not demote this item. **Stays CITED and load-bearing; a\n   dedicated classical port (Hadamard–de la Vallée Poussin at\n   σ = 1 + reflection at σ ≤ 0) is a separate project.**\n5. **P-T 3×10¹² on-line data backbone** — already half-demoted in\n   fact: on [0, 1e9] the backbone IS our own exact re-verification\n   (PINNED: seam Nt = 73,426,758 at G = 3.1946e7, verified\n   LMFDB(0,1e7] 21,136,125 + cache(1e7, G] 52,290,633; band\n   2,792,198,664 to G_LAST = 1.006345999847005e9), with their\n   certificate bearing the methodology beyond the band.\n\nArithmetic sanity (computed, not recalled): N(3.1946e7) ≈\n(3.1946e7/2π)(log(3.1946e7/2π) − 1) ≈ 7.33e7 — the seam constant is\nconsistent with RVM; and the tail nlt at t ≈ 1e9 read 2,825,411,910\nin the day034 single-point calibration, consistent with the RVM\nasymptotic N(1e9) ≈ 2.83e9 — the band's 2.79e9 entries close\nG_LAST − the cache end as expected.\n\nKNOWN_LIMITATIONS §3 carries the one-paragraph version of this\naudit (appended under item 5, 2026-09-19)."}, {"n": 18, "date": "2026-09-19", "time": "s2", "title": "(day034) — item 7, part a in flight: H1-cert design + budget selftest LANDED", "body": "The H1 reissuance (certificate-grade, per KNOWN_LIMITATIONS H1 *Fix*,\nsecond variant: machine-verified error budget, Platt–Trudgian style,\nnot interval arithmetic) is implemented in\n`scripts/rh/day034_h1cert.py` (uncommitted until the full run lands):\n\n- **Grid**: windows x = 1e6·1.08^k (k = 0..89, x ≤ ~1e9), each with\n  the verbatim day029 25-straddle set t = g_x + k/2 (k = −12..12,\n  k≠0), g_x = the real zero nearest x; the 400-node dps-30 quad at\n  every straddle (a superset of the sweep's value configuration).\n- **Budgets tracked per point**: tail (per-term unit-roundoff +\n  zero-representation dg terms + pairwise chunk bound + longdouble\n  cross-chunk + nlt-merge guard); GN product (same model); quad\n  precision/node ladder (dps 30/60 × 400/800 per section, B = max\n  corner-pair spread); dps-30/60 agreement for zeta, the 25.2.12 main\n  term, and the 500-delta dev; exact-integer nlt with a\n  NLT_GUARD = 1e-4 boundary-zero flag.\n- **Propagation**: residf_cert = residf30 + L·(e^Bexp − 1 + e^Bexp·Bph)\n  + Bz; dev_cert = dev30 − Bdev; z_cert = |z30| − Bz; margin_cert is\n  the claim `true margin ≥ margin_cert`.\n- **SELFTEST (the budget is verified before it is trusted)**: budget\n  containment against dps-60 exact per-zero arithmetic on 2000-point\n  pseudo arrays in two settings (stored == true; true = stored +\n  0.5-ulp random offsets to exercise the representation bound), for\n  the tail (re, im) and product (la, ar) channels. First run FAILED\n  on the im channel by exactly 2π·(count) — a selftest design\n  artifact (the nlt·π convention term was put in only one side) —\n  fixed the test; second run exposed one genuine model gap (the\n  nlt·π + longdouble→float merge rounding, now in B_im). Final\n  result: PASS with 20-50x containment margin on all four channels\n  (tail re: 1.1e-12 ≤ 3.8e-11; tail im: 2.1e-15 ≤ 2.2e-13; prod la:\n  1.2e-12 ≤ 2.2e-11; prod ar: 6.2e-13 ≤ 4.0e-12).\n- **Single-point calibration** (window nearest zero of 1e9 =\n  1000000000.1157, t = g + 0.5): mnew = 1.081644 (reproducing the\n  committed A-1 sweep value to 1.3e-6 on the neighboring straddle),\n  mcert = 1.0816365, Bexp + Bph = 8.6e-5 (Btail_re 6.3e-5 dominant —\n  the 2.8e9-zero representation bound, By design), quad ladders at\n  2.5e-21/7.9e-9, dps-30/60 zeta agreement 4e-22, dev agreement\n  7.7e-32, nlt = 2,825,411,910 (consistent with RVM, see above),\n  dmin = 0.085 ≫ NLT_GUARD, per-point cost ≈ 250 s CPU (quads\n  dominant: 8 sections × dps-30/60/400/800).\n- Smoke run (6 windows × 25 straddles, 9 workers, cores 0-9)\n  launched; full grid (90 windows × 25, 29 workers, cores 0-29)\n  estimated ≈ 4.7 h wall after the smoke validates the multi-point\n  path.\n\nPRE-REGISTERED readings (from the script header, before any result):\nC-1 all points margin_cert ≥ 1 → H1 band re-issued at certificate\ngrade; C-2 isolated cert-fails inside computed ≥ 1 → per-point\ndps-90/120 + 1600-node reissue; C-3 any computed < 1 → A-2/B-2 onset\nreading and the Phase-1a ceiling report as deliverable."}, {"n": 19, "date": "2026-09-19", "time": "s3", "title": "(day034) — H1-cert: per-point run rate rejected, two-phase window-batched build", "body": "The day034 SMOKE (6 windows x 25 straddles, 9 workers, cores 0-9,\nsub-chunked tail, quad dps-30/60 pairs) validated the pipeline\n(crash-free ~105+ min, memory stable at 47-52GB of 124, the 1e9-\nwindow values reproduce the committed A-1 sweep to 1.3e-6, selftest\nPASS), but the measured rate was ~350-400 s/POINT under six\nconcurrent 22GB-stream workers.  Extrapolated, the full\nper-point grid (2250 points at 8% spacing) would be 30-41 h wall —\nrejected; the run was killed at ~3 h with no completed window\nresults (the old build wrote its detail file at the end).\n\nRestructure (day034b_h1cert.py, committed with this note):\n  PHASE 1 (bandwidth-bound, 10 workers, cores 0-9): ONE band pass\n  per window computes, for all 25 straddles of the window in the\n  same pass (t-batched, 5 deep): the tail sums + budgets, nlt,\n  dmin guards, GN product + budget.  Stored per-window to\n  tmp/h1cert_p1/win_<i>.npz.  The band traffic thus scales with\n  71 WINDOWS, not 1775 points.\n  PHASE 2 (compute-bound, 27 workers, cores 0-26): per straddle,\n  the quad dps-30/60 pair budgets (400 nodes, both sections), the\n  dps-30/60 zeta + 25.2.12 main term, the 500-delta dev at 30/60,\n  the propagation, the cert row; plus the 4-corner audit ladder\n  once per window (the convergence evidence).  Rows merged to\n  out_day034_h1cert_b.txt; per-window incremental progress lines.\n  Grid: 12% window spacing (71 windows, x = 1e6*1.12^k <= 1e9),\n  25 straddles per window (1775 points total) -- still ~2.7x\n  denser than the sparse screen grid.\nThe certified pipeline is the SAME per-term model as day034_h1cert\n(same SUB = 2^25, same GAM10/GAM1 unit-roundoff bounds, same dg\nrepresentation bounds, same quad pair budget, same nlt guard,\nsame propagation).  The only value-level difference is the\n0.5/A -> 0.5*invA precompute roundings (last-ulp per term),\ncovered by the tracked budget and bounded by the crosscheck gate.\n\nEQUIVALENCE GATE before any full run (H1CERTB crosscheck,\nrunning): one window (x = 1e9) through BOTH the batched window\npass and the verified per-point day034 path; requires\n|re/im batch - point| <= 1e-9 on three straddles and full-row\nmnew/mcert agreement <= 1e-6 (plus the already-green budget\nselftest).  If the gate fails, fix the batched pass; do not\nweaken the gate."}, {"n": 20, "date": "2026-09-19", "time": "s4", "title": "(day034) — correction: exact day034b grid count", "body": "The restructure note above estimated 71 windows / 1775 points at\n12% spacing; the exact count (computed, not estimated) is\n61 geometric windows (x = 1e6*1.12^k, last = 8.976e8) + the\nexplicit 1.0e9 anchor window = **62 windows, 1550 straddle\npoints**.  Phase counts in the chain are keyed to the actual\nfile count (62), not to any hand estimate."}, {"n": 21, "date": "2026-09-19", "time": "s5", "title": "(day034) — crosscheck PASS (bit-exact); phase-1 COW", "body": "bug found and fixed; chain restarted (v2)\n\nEquivalence gate: PASS, better than the threshold required —\nthe batched window pass and the verified per-point path agree\nBIT-EXACT on the tail sums (|re/im difference| = 0 on all three\nstraddles of the 1e9 window; the 0.5/A -> 0.5*invA precompute\nproved last-ulp-neutral here, and the budget covers it\nindependently) and the full per-point rows agree to 9e-22\n(mnew 1.081644032 on both paths; mcert 1.081636859 both).\n\nPhase 1 (first launch, 10 workers) died ~2 min in with\nBrokenProcessPool: one worker OOM-killed with anon-rss 25.5GB —\na full private copy of the 22GB band. Root cause:\n`phase1_window` (the task) called `TH.tail()` but the parent\n`phase1_run` never loaded T before the pool, so every worker\nloaded its own copy (10 x 25GB on a 124GB machine). Fix in\nday034b: `phase1_run` now loads `T = TH.tail()` in the parent\nbefore the pool (workers COW-inherit the module singleton; the\ntask's own `TH.tail()` call returns the inherited instance).\nP1 workers reduced 10 -> 8 (bandwidth-bound anyway; memory\nmargin: 25GB parent + 8 x ~5GB private). Chain v2 restarted:\ncrosscheck verdict already on file -> straight to phase 1."}, {"n": 22, "date": "2026-09-19", "time": "s6", "title": "(day034) — throughput model pinned; fused tail pass;", "body": "verbatim reissue grid (39 windows / 975 points)\n\nMeasured (not estimated) machine facts from the two failed\nattempts, which pin the cost model:\n- single-stream band-derivation rate (crosscheck, one worker, hot\n  cache): ~3.6-4 GB/s effective per derived array;\n- 6-8 concurrent streams saturate the machine at ~4-5 GB/s TOTAL\n  (per-stream rate collapses ~8x; more workers do not add\n  throughput);\n- the irreducible volume is the per-STRADDLE derived arrays over\n  the 2.8e9 band: ~10 array-derivations x 268MB x 83 sub-chunks ~\n  223GB per straddle for the fresh-array reference path.  2250\n  straddles would be ~550TB (~140 h); window-batching the shared\n  part saved only ~6% (the per-t part dominates -- the batching's\n  real value was the crosscheck equivalence, not throughput).\n\nThe fix is a memory-fused tail pass (day034b, committed with the\nchain restart): exactly THREE 268MB working buffers per straddle\n(D = |g2-t2| -> log|d| -> re_t, in place; E = 2cc/|d| + base_dre =\ndredg, then reused as |re_t|; tmp = dg*dredg for the pairwise dot);\nthe im value folds to the exact scalar t * (f64-pairwise sub-chunk\nsum of invA) with zero per-t arrays; the dg-dimdg bound factors as\nt * (per-sub-chunk dg.tcoef sum, t-independent); the scale bound\nuses the explicit per-sub-chunk max of 0.5/A (A monotone in g, max\nat the first element).  ~3.3x traffic cut: ~67GB per straddle.\n\nGrid: the reissue is now the SCREEN grid verbatim (honest\ncoverage, no coarsening anywhere): the day029 A-1 31 windows\n(3.9e7-1e9, spacing as swept) + the 4 P1.1 trend points\n(1e6, 2e6, 4e6, 6e6) + 4 flagged connector windows\n(1.0e7, 1.6e7, 2.4e7, 3.3e7) bridging 6e6 -> 3.9e7, where the\nscreen had no straddle coverage (report says so).  39 windows x\n25 straddles = 975 points.  Est. total: gate ~1 h, phase 1\n(8 workers, cores 0-7) ~4.5 h (~72TB at ~4.5GB/s), phase 2\n(27 workers, cores 0-26) ~1.1 h.  Crosscheck v2 (fused path vs\nthe verified per-point reference, same 1e-9/1e-6 gate) running;\nchain v3 armed behind it."}, {"n": 23, "date": "2026-09-19", "time": "s7", "title": "(day035, night) — END_GAME_PLAN written; the", "body": "detector-side probe lands (section 3 of the plan)\n\nThe end-game plan is at docs/END_GAME_PLAN.md (the metric in\nplain terms, the ranked wall: W1 the uniform theorem / W2 the\nEfull oscillation bound / W3 the 3e10 falsification-first\ndecision / W4 the carpentry, the pre-registered outcome\nledger, and the start-here section on the detector's\npolynomial structure with the owner's seed intuition quoted\nverbatim).\n\nFirst probe (scripts/rh/day035_s3a_probe.py, exact Fraction\narithmetic): the algebraic core of R_closed on the quantized\nstraddles t = g + k/2:\n- sup over d in [0, 1/2] is at d = 1/2 (endpoint), all g, k;\n- sup over k is at k = 12 (the outer straddle), monotone in k;\n- R_alg(g, 12, 1/2) < 1 for all g >= 15 tested (0.9636 at g = 15;\n  decays ~12/g: 0.256 at 50, 1.21e-2 at 1000, 1.21e-5 at 1e6).\nSo dev >= 1 - B(g) with B(g) ~ 12/g an explicit rational\nfunction: the quantization (half-unit legal step t - g = k/2) plus\nthe sum-of-squares factorization (g^2 - t^2)^2 = (t-g)^2 (t+g)^2\nkeeps the algebraic core off the danger value 1 by a\nquantifiable gap -- the owner's \"indirect truth\" intuition was\nstructurally right.\nREVISED WALL PICTURE: the measured margin decay (about 1000 ->\n1.08) is driven by the NOISE side (the Efull oscillation, 0.0009\n-> 2.58 across the band), not the detector side (dev sits at\n1 - 12/g).  The bottleneck of the uniform theorem is therefore\nW2 (a proven oscillation bound for the far-integral remainder)\nwith the detector side reduced to: exact g0 crossing + d- and\nk-monotonicity lemmas (fixed-degree polynomial sign analysis) + a\nLean port.  See END_GAME_PLAN section 3.4 for the full revised\norder of attack.\nStatus of the H1-cert run at this entry: phase 1 at 24/39\nwindows, pace ~24 windows/104 min; phase 2 (~975 points / 27\nworkers, ~1 h) follows automatically; verdict expected around\n10:30 EDT."}, {"n": 24, "date": "2026-09-19", "time": "s8", "title": "(day035, night, post-compaction) — back-pocket", "body": "notes saved; Fibonacci mirror corrected to its exact fact\n\nThe owner's end-of-day \"back pocket\" facts were each checked\nagainst exact arithmetic and saved to\ndocs/BACK-POCKET-NOTES-2026-09-19.md (flavor file: verified facts\n+ explicit closed dead ends, per owner direction):\n- Cubes: the identity telescopes (T(k)^2 - T(k-1)^2 = k^3);\n  p = 3 is the unique exponent with a perfect-power power sum\n  (sympy-verified p = 1..12 plus obstruction: even p have a\n  simple (2n+1) factor; odd p have R(0) negative/square-free at\n  p = 5,7,9,11); the golden quadratic n^2+n-1 first appears in\n  the core factorizations at p = 9, 10 (verified range).\n- Fibonacci mirror, EXACT form (verified): with 1-based position\n  P(n) = n+1, P(n) - F(n) = 1 if and only if F(n) = n; the\n  fixed points are EXACTLY {0, 1, 5} (monotonicity beyond 5:\n  F(n) - n grows strictly, step F(n) - 1 >= 4); the full\n  difference census d(n) = +1,+1,+2,+2,+2,+1,-1,-5,-12,-24,-44,\n  ... is strictly decreasing from n = 6, so the small-n shape is\n  complete: the \"unit\" recurrence lives exactly at the three\n  fixed points, the +2 window is exactly {2,3,4} (the\n  F(n) = n-1 fact, also terminal), and n = 6 is the first\n  overtake (the anti-mirror) with no return.\n- Prime-fractal recurrence question: CLOSED DEAD END as far as\n  known (Binet crossing is generic; no mechanism found). The\n  charted neighborhood (rank of apparition / mod-5 category,\n  F(n)-prime implies n-prime-or-4, infinitely-many-Fibonacci-\n  primes OPEN) is recorded for reference, not as our thread.\n- Active probes saved from the night: the telescoping test for\n  the Efull lattice walk (the day030 \"full counting-function\n  IBP\" sub-item — the direct application of the cube lesson),\n  the residual-walk vs zero-gap correlation, and the W3 3e10\n  falsification chain.\nStatus: day034b phase 1 DONE (39 windows, 168.3 min, gates\nclean); PHASE 2 (975-point cert) running since 09:24 EDT,\nverdict expected ~10:30 EDT."}, {"n": 25, "date": "2026-09-19", "time": "s9", "title": "(day035, ~11:00 EDT) — S3b anatomy probe built;", "body": "first run OOM-killed; re-armed to run solo after phase 2\n\nThe S3b probe (scripts/rh/day035_s3b_ibp_anatomy.py) was built to\nmap the anatomy of the Efull lattice walk: the exact identity\nS1 = B - Dc + R over (1e7, G_LAST] with the pinned zero data\n(S1 = sum p(gamma); B = boundary count-defect terms; Dc = the\nwalk-weighted gap sum sum DN(x_k) dp_k, split near/far around t;\nR = the smooth N_asym part ~= -int N_asym p').  Smoke test on the\n(1e7, 5e7] slice at t = 3.2e7 + 1/2: the gate (S1 vs the\nN-weighted L-form) closed at 0.000e+00 (longdouble fsum\nprecision); smoke anatomy: S1 = -5.322382e7, B = -0.293, Dc =\n-2.105 (near -0.149 / far -1.956), R = -5.322383e7: the walk\npiece (B - Dc = +1.81) is O(1)-O(2), commensurate with the O(1)-\nO(4) defect -- the pre-registered \"walk carries the O(1) scale\"\nreading is in the right ball park; full-band numbers (t =\n3.9e7/1e8/3e8 + 1/2) are the actual map read, pending.\nOPS NOTE: the first full run was OOM-killed (dmesg\nanon-rss 56.8GB killed while phase-2 quad held its own 23GB\nCOW-shared copy): this box hosts ONE 23GB-anon consumer plus\ntemps at a time (true headroom while phase-2 runs: ~45GB,\nwhich does not fit a second 23GB load + 30GB temps). The\nafter-runner (tmp/day035_s3b_after_p2.sh) polls the chain log\nfor \"phase2 rc=\" and then runs S3b solo on taskset 27 with an\n8h safety cap. Phase-2 status at this entry: 27/39 windows,\nin a slow (heavy-quad) stretch, advancing on CPU; full verdict\nexpected by ~11:45 EDT."}, {"n": 26, "date": "2026-09-19", "time": "s10", "title": "(day034/035, ~11:25 EDT) — H1 CERT", "body": "RE-ISSUED (reading C-1) + S3b anatomy map landed\n\n- **PHASE 2 landed 11:07 EDT** (wall 101.5 min, 27 workers,\n  chain gates clean): STATUS: C-1 — all 975 points (39 windows x\n  25 straddles: LOW4 + CONN4 + A-1 verbatim) certified;\n  **margin_cert < 1: NONE; margin_computed < 1: NONE**; worst\n  margin_cert = **1.081637 at t = 1000000001.61565** (the 1e9\n  window; computed 1.081644; point budget 9.16e-5). Window-best\n  margins decay monotonically 17200 (1.05e7) -> 1.0816 (1e9).\n  One wide-budget FLAG (1.3e8 window, budget 1.76e-4, margin\n  ~101 — flag, not a violation). Pre-registered reading\n  APPLIED: C-1 — the H1 band [10^6, 10^9] is RE-ISSUED at\n  certificate grade (machine-verified error-budget variant of\n  the H1 Fix): every grid point carries an explicit tracked\n  budget; the claim is true margin >= margin_cert. Docs updated:\n  KNOWN_LIMITATIONS H1 status block; PHASE1A-CEILING.md section\n  4 FINAL. Artifacts: scripts/rh/out_day034_h1cert_b.txt (975\n  point rows + per-window audit lines), tmp/day034b_chain.log.\n- **S3b anatomy landed 11:15 EDT** (solo run after phase 2;\n  taskset 27; rc=0). Full-band IBP decomposition S1 = B - Dc + R\n  with the pinned zero data; gates: 0.000e+00 (t = 3.9e7, 1e8),\n  5.96e-08 (t = 3e8); check lines 0 / 3e-8:\n  - t = 3.9e7+1/2: B = +0.213, Dc = -1.366 (near +0.520 /\n    far -1.886); S1 = -1.219687e+08\n  - t = 1e8+1/2:  B = +0.364, Dc = -5.353 (near -2.077 /\n    far -3.276); S1 = -1.833810e+08\n  - t = 3e8+1/2:  B = +0.482, Dc = -6.351 (near -1.440 /\n    far -4.911); S1 = -1.311423e+08\n  - walk stats (t-independent, full band (1e7, G_LAST]):\n    DN(G1) = -0.0807, DN(G2) = +0.7154, **max|DN| = 2.439** —\n    the raw Riemann-von Mangoldt count defect never exceeds\n    2.44 zeros across the entire 2.8e9-zero band (vs the\n    RH-level O(log t) ~ 21 at 1e9) — a PINNED datum.\n- **W2 MAP (pre-registered read applied).** The O(1) defect\n  W = (B - Dc) + (int N_asym p' - NasSum): the walk-weighted\n  piece (B - Dc = +1.58 / +5.72 / +6.83, growing gently with t)\n  and the smooth lattice-sum defect (the second bracket,\n  opposite sign, comparable magnitude) CANCEL to leave W = the\n  measured O(1)-O(4) Efull band. Dc_far dominates Dc_near: the\n  walk is ACCUMULATED, not local. So the W2 theorem is NOT a\n  local-spacing theorem; it is a CANCELLATION theorem with three\n  parts: (a) a uniform bound on the count walk (max|DN| ~ 2-3:\n  PINNED on the band, a counting theorem beyond it); (b) the\n  explicit p' kernel weights (known, elementary); (c) the\n  structural fact that the smooth lattice-sum defect tracks the\n  walk piece to O(1) — i.e. the lattice-averaged potential that\n  both sides telescope against is the \"disguised identity\" named\n  in END_GAME_PLAN section 3.5.\n- **Next probes (in order):** (1) evaluate the second bracket\n  DIRECTLY (quad of int N_asym p' with the v3 singularity split\n  at t) to pin the cancellation numerically at the three heights\n  (no big arrays; minutes); (2) the W3 decision-maker — the\n  3e10 zero chain (staged; verify shard completeness before\n  launch) extends the evidence edge into real-zero territory;\n  (3) the telescoping-form search for the lattice-averaged\n  potential (the W2 theorem body)."}, {"n": 27, "date": "2026-09-19", "time": "s11", "title": "(day035, ~14:30 EDT) — S3c: the W2", "body": "telescoping FOUND (queue item 1, verdict: P-1 + P-2 both YES)\n\nscripts/rh/day035_s3c_cancellation.py (solo run, taskset 27,\ngates: quad dps-30/60 spreads 1e-21 scale; W_direct vs W_byparts\nagreement 1.5e-6..2.4e-5 = the float64-input floor of the\n2.8e9-term data sums).  At t = 3.9e7/1e8/3e8 (+1/2):\n\n              NasSum          I_np            bracket     B - Dc    W\n  3.9e7+1/2   +61,567,494.40  +61,567,493.67  -0.731      +1.579    +0.8481\n  1e8+1/2     +57,821,321.53  +57,821,319.11  -2.416      +5.716    +3.3007\n  3e8+1/2     -279,308,661.71 -279,308,663.93 -2.223      +6.834    +4.6110\n\n- P-1 (the lattice Riemann sum for int N_asym p' is O(1)-\n  accurate, not generic O(1e4+)): CONFIRMED — |I_np - NasSum|\n  = 0.73 / 2.42 / 2.22 against magnitudes O(1e7)..O(2.8e8):\n  relative agreement ~1e-8 to 8e-9.\n- P-2 (|W| = O(1)-O(10) band-local): CONFIRMED — W = +0.85 /\n  +3.30 / +4.61.\n- THE TELESCOPIING (the actual result).  From the two IBP\n  identities (both gate-verified):\n    (i)  S1 = p(G2)N(G2) - p(G1)N(G1) - sum N(x_k) dp_k\n    (ii) I_pr = p(G2)Nas(G2) - p(G1)Nas(G1) - int Nas p'\n  and the data split sum N dp = Dc + NasSum,\n    (iii) int DN p' = int N p' - I_np = sum N dp - I_np,\n  so with W := S1 - I_pr:\n      W = B - Dc + (I_np - NasSum)\n        = B - Dc + (Dc - int DN p')\n      **W = p(G2)DN(G2) - p(G1)DN(G1) - int DN(x) p'(x) dx**,\n  where DN(x) = N(x) - N_asym(x) is the BOUNDED count walk\n  (pinned sup|DN| = 2.439 on the band).  All O(1e7)-O(1e8)\n  pieces are artifacts of the un-telescoped\n  representation; the band-local defect is ENTIRELY the\n  bounded walk against the log kernel plus boundary terms.\n  Numerical check: B - (Dc - bracket) vs W: 0.8482/3.3009/\n  4.6110 vs 0.8481/3.3007/4.6110 (3-decimal agreement at all\n  three heights).\n- CONSEQUENCES (the W2 theorem is now bounded work):\n  1. Bound on the band: |W| <= sup|DN| * (|p(G2)| + |p(G1)| +\n     PV-TV(p)), where the log-singular part of int DN p' is\n     taken in principal value (the 1/(g-t) piece: DN(t)*\n     log((G2-t)/(t-G1)) by the same subtraction trick) and\n     log(G2/G1) = 4.6 is FIXED across the band — so the bound\n     is an ABSOLUTE band constant (~O(20-40), no t-growth\n     inside the band):  2.439 * (4.6 + O(1)) ~ 20-40; the\n     pinned data says W = 0.85..4.61.\n  2. Beyond the band, sup|DN| = O(log t) at RH level gives\n     the classical O(log t * log-scale) ceiling; the DATA\n     shape (walk ~ O(1-2.5) at 2.8e9 zeros) is the refinement\n     to prove — a counting statement, not spacing.\n  3. Composition for margin >= 1: the band-local W feeds the\n     S1 wire via K_full = K_band * (pinned (14.13,1e7] section)\n     * (quad sections); the one-sided ingredient the\n     certificate needs is a LOWER bound W >= -C with C small\n     (plus the phase, which the per-point certificate already\n     carries).  The pieces of the full uniform statement are\n     now: this W bound (walk theorem), S3a (dev lower bound),\n     the pinned sections, and the wire algebra — all located,\n     all bounded work or pinned.\n- The owner's cube-identity instinct was the method: the wild\n  sums (S1, I_pr, O(1e8)) are controllable because the summand\n  structure is a discrete derivative of the counting function;\n  the telescoping to boundary + walk terms is the \"sum of\n  consecutive differences\" in the zeta-zero setting.  The\n  \"disguised identity\" is NAMED: IBP against the counting\n  function on both the N and N_asym decompositions."}, {"n": 28, "date": "2026-09-19", "time": "s12", "title": "(day035, ~14:45-15:10 EDT) — S3d: the walk pin", "body": "EXTENDS to 5.9e9 zeros (sup|DN| = 2.503), 3e9 stream launched,\nW3 wall quantified, W2 Lean spec written, online-first survey\ndone (Zeta23)\n\nS3d (scripts/rh/day035_s3d_2e9band.py, solo taskset 27):\n- SEAM AUDIT: G_LAST = hi[-1] exact f64 = 1006345999.8470054865\n  present in the 2e9 extension file bit-exactly; alignment\n  j0 + k0 = hi.size - 1 (exact integers); N(a[0]) = 2,852,998,639\n  via the seam (73,426,758 + 2,779,571,880 + 1).  300,000-sample\n  overlap values: max difference 1.00 ulp, only 2/300000 differ\n  (the two independent converters, convert_shards.py vs\n  convert_hi3e10.py, round a tiny fraction of the 104-bit zeros\n  to ADJACENT f64 values; impact on tracked quantities <= ~2e-7\n  in the log kernel, far below budgets — documented, no action).\n  NOTE for the log: G_LAST used in scripts as the decimal\n  literal 1006345999.847005 is 4 ulps off the exact f64; the\n  audit uses hi[-1] bit-exactly.\n- WALK PIN BAND 2: extension (G_LAST, 2001746000] has\n  3,053,546,936 new zeros, N(G2) = 5,919,172,358.\n  sup|DN| over the extension = **2.5030** (full zero census; the\n  new maximum sits in the extension).  Combined: sup|DN| <= 2.503\n  on (1e7, 2.0e9] (5.92e9 zeros).  Classical RH-scale walk\n  (|N - N_asym| ~ O((log t)^2) ~ 27 at 2e9); the pinned data is\n  a factor ~10 below it.  DN is continuous across the seam:\n  DN(G_LAST) = +0.715427 on both sides (bit-consistent with\n  S3b's band-1 value).\n- ANATOMY (G_LAST, G2] at t = 1.6e9+1/2 (min|g-t| = 0.0945):\n  GATE0 S1 vs L-form = 4.8e-7 (fsum floor for O(4e9) sums),\n  GATE1 S1 - (B - Dc + R) = -4.8e-7.  S1 = -4.080043e9,\n  B = -1.140225, Dc = -0.491170 (near +0.5348 / far -1.0260),\n  R = -4.080043e9.  The IBP identity holds on band 2 to data\n  precision — the telescope is band-independent.\n\nW3 WALL (the 3e10 chain as pre-registered is disk-blocked):\n(2e9, 3e10] = 95.7e9 zeros = 766GB f64 (1.24TB .dat); disk:\nsingle 1.9T NVMe, 132GB free.  TIME (revised from measurement,\nNOT the earlier day-scale guess): the hi1e9 stream ran 464\nshards in 33 min (~12s/shard); the 3e9 scope (476 shards) is a\n~1-hour job.  Even full 3e10 (~15,900 shards) would be ~2 days\nof LMFDB transfer — the wall is DISK, not time.  Live LMFDB\nindex crawl (2026-09-19): 29,160 shards public, i.e. zeta-zero\ndata out to ~6.1e10 — the full option is feasible only with an\nowner disk decision (~0.7TB free for 3e10; ~1.5TB for 6e10).\nDECISION (autonomous, within W3 scope): run the (2e9, 3e9]\nextension (476 shards, ~31.4GB f64, fits with 90GB margin) —\nit extends the zero-verified territory to 3e9 and the walk pin\nto N(3e9) = 9.83e9.\n\n3e9 STREAM (launched 15:02 EDT, taskset -c 28):\nscripts/rh/day035_3e9_stream.sh — the day024 mechanism\n(resumable curl + md5 gate vs the full 14,580-entry LMFDB list\n/tmp/zeta-dl/md5.txt + day024_platt_fast decode-append +\nCOUNT cross-shard Nt0 assert).  Preflight: live index serves\nshards 2001746000..2999246000; first shard md5 exact; and the\nSEAM META CHECK: zeros_2001746000.dat has Nt0 = 5,919,172,358\n= the S3d count at the hi3e10 band end, against LMFDB's own\nblock bookkeeping (double-verified).  OUT =\nscripts/rh/hi3e9/zeros_2002e6_to_3000e6.f64 (grows to ~31.4GB).\nETA ~1h.  When done: S3e walk statistics on (2e9, 3e9]\n(extends the pin to 9.83e9 zeros).\n\nONLINE-FIRST SURVEY (owner directive, third reinforcement):\nfor the one-sided W-bound Lean work, searched prior\nformalizations first.  FOUND: anthropics/zeta-23-lean —\n* Zeta23/RvM/Statement.lean: RiemannVonMangoldt record on an\n  abstract ZeroConfig; riemannVonMangoldt (hΓ : GammaFacts)\n  assembles rvM_main + local count for Mathlib's zeta.\n* Zeta23/RvM/LocalCount.lean: N(t, t+1] <= A_0 log(|t|+3) for\n  all real t (Titchmarsh Thm 9.2; Jensen-disc route via\n  ZeroConfig.N_le_two_mul_half / Halving.lean / ZerosBound).\n* Zeta23/ExplicitFormula.lean + Hypotheses.lean: Weil EF\n  (paper form, H-EF), the hypothesis records.\n  Zeta23 is a static research artifact (\"not maintained, not\n  accepting contributions\").  CITATION DECISION: CITE Zeta23 as\n  the source of the CITED counting class (|DN| = O(log t)\n  beyond the data band); take K := sup|DN| as an explicit\n  numeric input to our theorem (PINNED 2.503 on\n  (1e7, 2e9]; CITED class beyond).  No vendoring in this step\n  (static artifact, own toolchain pin; adoption is a separate\n  owner decision).  Other RH repos noted in the spec for the\n  provenance log (RDCbum/RH_demo, jrgochan/prime,\n  motanova84/Riemann-adelic, beanapologist/RH, alejandrozu/\n  RiemannHypothesis-Formalization, zach7036/\n  riemann-hypothesis-research, Alektronnik/M4TH).\n\nW2 LEAN SPEC: docs/W2-LEAN-PLAN.md written (the exact\nstatements: kernel algebra K1-K4, the finite-sum telescope\nT1-T4, the per-gap singular-free integral side (1.3), the\nbound theorem E1-E4 with explicit inputs K, L, GMAX; build\norder M1-M6).  Honest split preserved: the kernel/telescope\nalgebra and the bound are to be LEAN-PROVEN; K/L/GMAX are\nPINNED (data) or CITED (Zeta23-RvM/Backlund class beyond).\n\nDAY035 — W2Kernel M1 GREEN (kernel algebra LEAN-PROVEN).\n  formal/RhAttack/W2Kernel.lean builds under Lean 4.33.1 +\n  mathlib 4.33.1 (module check + full lake build, rc=0):\n    W2K.kerHasDerivAt (K1):  Ker'_g = 1/(g-t) + Sm(g,t)\n        for g != t, g + t > 0 (both sides of t, via the\n        neighborhood-equality transfer).\n    W2K.nasHasDerivAt (K3):  Nas'_x = Rho(x) EXACTLY, x > 0\n        (the +1/(2pi) from the product rule and the -1/(2pi)\n        slope of -x/(2pi) cancel).\n    W2K.rhoHasDerivAt:       Rho'_x = 1/((2pi)*x), x > 0.\n  Toolchain lessons (pinned 4.33.1; verified by grep + probe,\n  cross-checked against the current online mathlib4 tree):\n  - a `variable` inside a top-level namespace made the\n    defs' leading parameter IMPLICIT; explicit parameters only.\n  - hasDerivAt_id / hasDerivAt_const take EXPLICIT\n    (point, constant) arguments in this pin.\n  - pinned combinator conclusions use POINTWISE notation\n    (f + g) / (c * d); a lambda goal form is NOT judgmentally\n    equal to it.  Proofs carry the exact conclusion types and\n    bridge to the named-def goal form at ONE place per\n    theorem: HasDerivAt.congr_of_eventuallyEq against an\n    EventuallyEq proved by ext; dsimp; simp [div_eq_mul_inv].\n    Plain simp DOES reduce pointwise (f+g) x, (f*g) x and\n    (f^-1) x applications in this pin (probed directly).\n  - sq_pos_of_pos is in current online mathlib4\n    (Algebra/Order/GroupWithZero/Basic.lean) but NOT in the\n    pin; mul_pos + pow_two used instead.\n  - the neighborhood notation needs `open scoped Topology`.\n  Spec docs/W2-LEAN-PLAN.md: K3 corrected (Nas' = Rho exactly,\n  not Rho + 1/(2pi)).  Plan build order: M1 DONE (K1+K3);\n  M2 = finite-sum telescope T1-T4; M3 = per-gap singular-free\n  integral side (1.3); M4 = bound theorem E1-E4; M5 = numeric\n  instantiation; M6 = composition through the S1 wire.\n\nDAY035 — 3e9 band stream COMPLETE at 14:47 EDT (item 2 done);\nN(3e9) pinned EXACT; S3e walk pin extends to N = 9.06e9.\n  The 476-shard stream finished; hi3e9/zeros_2002e6_to_3000e6.f64\n  (25.1GB, 3,142,622,346 zeros, span (2001746000.236353,\n  2999245999.862950)).  All real finish gates PASS: monotone,\n  min gap 2.47e-4 > 0, seam gap 0.609 in (0,1), N at band end =\n  9,061,794,704 vs RVM diff +0.40 <= 3.  The one failed gate\n  (N at EXACTLY 3e9) was my bookkeeping over-strictness: the\n  file ends before 3e9, so searchsorted(size) made the check\n  uncomputable.  CORRECTION: the ~9.83e9 RVM estimate in the\n  stream header was wrong; the true N(3e9) ~= 9.06e9 (the band\n  END count 9,061,794,704 already sat 0.40 below true RVM at\n  the band end, proving it).\n  Exact N(3e9) pinned from one extra md5-gated shard\n  (zeros_2999246000, chain-exact Nt0):  N(3e9) = 9,064,192,826\n  (RVM(3e9) = 9,064,192,825.58, |diff| = 0.42 <= 3).\n  S3e (scripts/rh/day035_s3e_3e9band.py, the S3b machine on band\n  3 (B1, B2] = (2e9 band end, 2999245999.86)):  seam/monotonicity\n  GATE-1 PASS; anatomy at t = 2.5e9 + 1/2 (min |g-t| = 0.0869):\n  GATE0 |S1 - L-form| = 9.5e-7; GATE1 |S1 - (B - Dc + R)| = EXACTLY\n  0 to the bit; S1 = -5.998e9 with R = -5.998e9 (the big-term\n  cancellation) and B = -0.1464, Dc = -0.8984 (near -0.4645 /\n  far -0.4339) — the O(1) gap mechanism is the same at N = 9e9\n  as at 2.9e9.  WALK PIN (the quantity the W2 certificate\n  consumes):  sup|DN| = 2.4772 on (1e7, 2.9992e9]\n  (bands 1-2 were 2.503 up to B1) — both census conventions.\n  Honest split: PINNED (data; N(3e9) exact, N(B2) = 9,061,794,704,\n  sup|DN| = 2.4772 to 3e9).  The full 3e10 extension remains\n  disk-blocked (765GB needed, 132GB free on the single 1.9T\n  volume).\n\nDAY035 — W2-attack queue items 2-5 CLOSED;  S3a + M6 Lean ports GREEN;\nceiling report re-issued.\n  Item 2 (data):  3e9 done (N(3e9) = 9,064,192,826 exact, sup|DN| =\n  2.4772 to 3e9 by the S3e walk);  the 3e10 extension\n  disk-blocked (~765GB vs 132GB) and handed off to a cloud machine\n  per owner direction (stream script + shard conversion + runbook;\n  resumable from the 3e9 shards).  Decision on record:  3e10 is a\n  thoroughness upgrade, not a prerequisite for items 3-5.\n  Item 3 (W2 Lean M1-M5):  GREEN, zero sorry — W2Telescope (the exact\n  telescope identity), W2Bound (one-sided W >= -C with explicit C;\n  e4 assembly, e4_idnBound, e4_tailFloor), W2M5 (pinned K_pin = 2.503,\n  L_pin = Rho(2e9);  m5_floor, m5_idn).\n  Item 4 (S3a Lean):  GREEN, zero sorry (commit e8d4bfc) — exact\n  crossing g0 = 15 (norm_num-exact);  d-corner via the chord structure\n  D = (1-4x)D0 + PP x (x-1/4) (D0 >= 0 two-case, PP <= 0 quartic\n  certificate in v = g-15, no interval_cases in the d-core);\n  k-monotonicity (11 certified cubics in v = g-15, 1 <= k < 12);\n  decay Rcorner(g,12) <= 13/g for g >= 40 (quartic at 40+v);\n  composed s3a_dev:  Ralg g k d <= 13/g on the quantized straddle\n  grid (1 <= k <= 12, 0 <= d <= 1/2, g >= 40).\n  Item 5 (M6 composition, commit eed09b7):  GREEN, zero sorry —\n  m6_feed (1 - Ralg >= 1 - 13/g), m6_feed_dom (feed dominates the\n  wire's PROVEN floor family floStripMin <= 23/1000 <= 27/40 <=\n  1 - 13/g for g >= 40), w2noise + w2noise_bound/w2noise_tail\n  (restated m5_idn/m5_floor), m6_compose (the wire's squeezed-margin\n  form at dev := f := 1 - 13/g with the zero-side witness and the\n  noise total as named hypotheses;  output:  wire form + feed\n  dominance + STRICTLY POSITIVE dev-vs-noise margin).  The |zeta|\n  factor is carried by the named noise-side hypotheses only.  NO RH\n  claim.\n  Re-issued ceiling:  docs/CEILING-REPORT-DAY035.md;  plan update:\n  END_GAME_PLAN section 3.7.  Full project build green (17442 jobs).\n  Honest split:  LEAN-PROVEN (W2 one-sided + S3a + M6 composition;\n  infinite content on the grid/band), PINNED (3e9 data, K_pin,\n  L_pin), CITED (zero-free regions at the d = 1/2 edge), MEASURED\n  (the wire's zero-side/definition-side fills behind named\n  hypotheses).  Not established:  the S1 uniform theorem (P1.2)\n  remains the open research theorem;  the 3e10 read past 9.06e9 is\n  density-model until the cloud run lands."}, {"n": 29, "date": "2026-09-20", "time": "", "title": "— doc alignment day035 end game + the name (tpf)", "body": "Owner pass: reflect the final End Game plan across the repo docs +\nname the approach.\n\n- **The name (tpf — to be finalized):** the **Riemann–von Mangoldt\n  Gambit** — the approach, not any particular theorem.  The door:\n  the zero-counting formula N(t) = main(t) + S(t) (Rie
